  question: "Am 7. Juli 2020 wurde über dem Einzelunternehmer Max (Wohnsitz in Bülach) der Konkurs eröffnet.\
    \ Alle seine Gläubiger kamen zu Verlust, u.a. auch Anna, der ein definitiver Verlustschein über Fr.\
    \ 95'000.00 ausgestellt wurde. Am 2. August 2022 leitete Anna gestützt auf diesen Verlustschein Betreibung\
    \ gegen Max über Fr. 95'000.00 zuzüglich Zins ein. Sieben Tage nach Zustellung des Zahlungsbefehls\
    \ schrieb Max dem Betreibungsamt Bülach einen Brief, worin er einzig erklärte: «Ich erhebe Rechtsvorschlag.\
    \ Ich besitze kein Vermögen.» \nWas passiert als nächstes und weshalb und  \nwelche Behörde bzw. welches\
    \ Gericht ist für diesen nächsten \nVerfahrensabschnitt örtlich und sachlich zuständig? Bearbeitungshinweis:\
    \ Die Zuständigkeit des Betreibungsamtes Bülach ist gegeben. Es sind hierzu keine Ausführungen notwendig."
  reference: Es handelt sich hierbei um einen Rechtsvorschlag mangels neuen Vermögens gemäss Art. 265a
    SchKG. Wenn der Schuldner bestreitet, zu neuem Vermögen gekommen zu sein, muss er dies im (mündlichen
    oder schriftlichen) Rechtsvorschlag explizit angeben, ansonsten die Einrede verwirkt (Art. 75 Abs.
    2 SchKG). Max hat seinen Rechtsvorschlag schriftlich erhoben und dabei ausdrücklich erwähnt, dass
    er kein Vermögen habe, was als genügende Begründung fehlenden neuen Vermögens anzusehen ist. Max hat
    den Rechtsvorschlag sodann innert Frist gemäss Art. 74 Abs. 1 SchKG erhoben.  Das Betreibungsamt Bülach
    wird den Rechtsvorschlag nach dessen formeller Prüfung von Amtes wegen dem Gericht des Betreibungsortes
    weiterleiten, damit dieses über die Be willigung des Rechtsvorschlages entscheidet (Art. 265a Abs.
    1 SchKG). Gemäss Art. 265a Abs. 1 SchKG ist das Gericht des Betreibungsortes örtlich zuständig. Der
    Betreibungsort liegt i.c. in Bülach, weshalb örtlich das Gericht in Bülach zuständig ist. Über das
    Vorliegen neuen Vermögens entscheidet das Gericht im summarischen Verfah ren (Art. 251 lit. d ZPO).
    Das vorliegende Verfahren wird daher ohne vorgängiges Schlich tungsverfahren direkt beim Gericht eingeleitet
    (Art. 198 lit. a ZPO). Gemäss § 24 lit. c GOG ZH entscheidet das Einzelgericht erstinstanzlich über
    Angelegenheiten und Streitig keiten im summarischen Verfahren, die keiner anderen Instanz zugewiesen
    sind. Sachlich ist somit das Einzelgericht zuständig, mithin das Einzelgericht des Bezirksgerichts
    Bülach.
  rubric:
  - Es handelt sich hierbei um einen Rechtsvorschlag mangels neuen Vermögens gemäss Art. 265a SchKG. Wenn
    der Schuldner bestreitet, zu neuem Vermögen gekommen zu sein, muss er dies im (mündlichen oder schriftlichen)
    Rechtsvorschlag explizit angeben, ansonsten die Einrede verwirkt (Art. 75 Abs. 2 SchKG).
  - Max hat seinen Rechtsvorschlag schriftlich erhoben und dabei ausdrücklich erwähnt, dass er kein Vermögen
    habe, was als genügende Begründung fehlenden neuen Vermögens anzusehen ist. Max hat den Rechtsvorschlag
    sodann innert Frist gemäss Art. 74 Abs. 1 SchKG erhoben.
  - Das Betreibungsamt Bülach wird den Rechtsvorschlag nach dessen formeller Prüfung von Amtes wegen dem
    Gericht des Betreibungsortes weiterleiten, damit dieses über die Be willigung des Rechtsvorschlages
    entscheidet (Art. 265a Abs. 1 SchKG). Gemäss Art. 265a Abs. 1 SchKG ist das Gericht des Betreibungsortes
    örtlich zuständig.
  - Der Betreibungsort liegt i.c. in Bülach, weshalb örtlich das Gericht in Bülach zuständig ist. Über
    das Vorliegen neuen Vermögens entscheidet das Gericht im summarischen Verfah ren (Art. 251 lit. d
    ZPO). Das vorliegende Verfahren wird daher ohne vorgängiges Schlich tungsverfahren direkt beim Gericht
    eingeleitet (Art. 198 lit. a ZPO).
  - Gemäss § 24 lit. c GOG ZH entscheidet das Einzelgericht erstinstanzlich über Angelegenheiten und Streitig
    keiten im summarischen Verfahren, die keiner anderen Instanz zugewiesen sind. Sachlich ist somit das
    Einzelgericht zuständig, mithin das Einzelgericht des Bezirksgerichts Bülach.
