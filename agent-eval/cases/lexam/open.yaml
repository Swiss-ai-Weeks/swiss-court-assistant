  question: "A ist Kunde beim unabhängigen Vermögensverwalter B. A hat B gültig ein\nVermögensverwaltungsmandat\
    \ erteilt, wonach B sein Vermögen nach der vereinbarten\nAnlagestrategie anlegen soll und er ermächtigt\
    \ ist, die Stimmrechte der erworbenen\nBeteiligungen für A so auszuüben, dass die jeweiligen Unternehmungen\
    \ möglichst auf eine\nnachhaltige Geschäftstätigkeit ausgerichtet werden.\nA kommt mit verschiedenen\
    \ Fragen zu diesem Mandat in Ihre Kanzlei. Bitte helfen Sie ihm\nbei deren Beantwortung. \nNehmen\
    \ Sie an, B kauft für A im Rahmen des\nVermögensverwaltungsmandats Aktien der an der SIX Swiss Exchange\n\
    kotierten und in Zürich ansässigen Z AG im Umfang von 4% von deren\nStimmrechte. Bisher enthielt das\
    \ Portfolio von A keine Aktien der Z AG.\nMuss A die Z AG über diesen Erwerb informieren?"
  reference: 'Meldepflicht nach FinfraG 120 I: o Kotierung in Schweiz (+) o Sitz in Schweiz (+) o Meldepflichtige
    Titel: Meldepflicht erstreckt sich auf alle Aktienkategorien (+) o Meldepflichtiger Tatbestand: Erfasst
    ist sowohl direkter als auch indirekter Erwerb von Beteiligungspapieren. B erwirbt für A Aktien der
    Z AG. (+) o Erreichen/Überschreiten/Unterschreiten eines Grenzwertes von 3, 5, 10, 15, 20, 25, 33
    1/3, 50, 66 2/3% der Stimmrechte. Das Portfolio von A enthielt bisher keine Aktien der Z AG und neu
    4% der Stimmrechte. (+) Meldepflichtiges Subjekt: o Grds.: Wirtschaftlich Berechtigter (FinfraV-FINMA
    10 I) o FinfraV-FINMA 10 I: Wirtschaftlich Berechtigter ist, wer aus einer Beteiligung fliessende
    Stimmrechte kontrolliert und das wirtschaftliche Risiko trägt o Meldepflichtig deshalb wer zur Ausübung
    Stimmrechte nach freiem Ermessen ermächtigt (FinfraG 120 III, FinfraV-FINMA 10 II) o Ist Vermögensverwalter
    zur Ausübung der Stimmrechte nach freiem Ermessen ermächtigt, ist er anstatt des Kunden meldepflichtig
    Subsumption: o Ausübung der Stimmrecht durch B o Einschränkung seines Ermessens durch Weisung Stimmrechte
    so auszuüben, dass Unternehmen nachhaltige Geschäftstätigkeit ausüben (+/-) Fazit: o Pflicht zur Meldung
    der Beteiligung an Z AG (+/-)'
