  question: |-
    Können die Kantone einem interkantonalen Organ Rechtsetzungskompetenzen delegieren
    und wenn ja, in welchem Umfang?
  reference: 'Nach Art. 48 Abs. 4 BV können die Kantone interkantonale Or- gane durch interkantonalen
    Vertrag zum Erlass rechtssetzender Bestimmungen ermächtigen, die einen interkantonalen Vertrag umsetzen,
    sofern der Vertrag nach dem gleichen Verfahren, das für die Gesetzgebung gilt, genehmigt worden ist
    und die inhaltli- chen Grundzüge der Bestimmungen festlegt. Die inhaltlichen Grundzüge der durch das
    interkantonale Organ zu setzenden Bestimmungen müssen im interkantonalen Ver- trag selbst geregelt
    werden: Darin kommen die allgemeinen Anforderungen an die Gesetzesdelegation zum Ausdruck, wo- nach
    sich die Delegation auf eine bestimmte, genau umschrie- bene Materie zu beschränken hat und die Grundzüge
    der dele- gierten Materie im Vertrag selbst geregelt werden müssen. [Elemente einer Rechtssetzungslehre,
    Rz. 526]'
  rubric:
  - Nach Art. 48 Abs. 4 BV können die Kantone interkantonale Or- gane durch interkantonalen Vertrag zum
    Erlass rechtssetzender Bestimmungen ermächtigen, die einen interkantonalen Vertrag umsetzen, sofern
    der Vertrag nach dem gleichen Verfahren, das für die Gesetzgebung gilt, genehmigt worden ist und die
    inhaltli- chen Grundzüge der Bestimmungen festlegt.
  - 'Die inhaltlichen Grundzüge der durch das interkantonale Organ zu setzenden Bestimmungen müssen im
    interkantonalen Ver- trag selbst geregelt werden: Darin kommen die allgemeinen Anforderungen an die
    Gesetzesdelegation zum Ausdruck, wo- nach sich die Delegation auf eine bestimmte, genau umschrie-
    bene Materie zu beschränken hat und die Grundzüge der dele- gierten Materie im Vertrag selbst geregelt
    werden müssen. [Elemente einer Rechtssetzungslehre, Rz. 526]'
