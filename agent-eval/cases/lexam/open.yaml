  question: "Die Schwarz AG weist folgende Bilanz auf:\nBank/Wertschriften: 900'000\nHypothek: 500'000\
    \ \nLiegenschaft: 700'000\nAktienkapital: 300'000 \nKapitalreserven: 200'000 \nGewinnreserven: 600'000\
    \ \nBank/Wertschriften + Liegenschaft: 1'600'000\nHyphotek + Aktienkapital + Kapitalreserven + Gewinnreserven:\
    \ 1'600'000\nStille Reserven: Liegenschaft 300'000\nJochen Schwarz ist Alleinaktionär der Schwarz\
    \ AG. Diese ist im Bereich der Unter-\nnehmensberatung tätig, wobei Jochen Schwarz ihr einziger Angestellter\
    \ ist. Die Schwarz\nAG hat ihre Geschäftstätigkeit in den letzten Jahren zunehmend reduziert und nur\
    \ noch\nvereinzelt Aufträge ausgeführt. Im Mai 2016 kommt Jochen Schwarz altersbedingt zum\nSchluss,\
    \ dass er für die Schwarz AG keine Verwendung mehr hat, er möchte aber die\nLiegenschaft für eigene\
    \ private Zwecke nutzen. Er entschliesst sich deshalb zu folgen-\ndem Vorgehen: Zunächst lässt er\
    \ sich die Liegenschaft zum Buchwert von CHF 700'000\nund unter Übernahme der Hypothek als Naturaldividende\
    \ zulasten der Kapitalreserven\nausschütten. Daraufhin verkauft er sämtliche Aktien der Schwarz AG\
    \ für einen Kaufpreis\nvon CHF 780'000 an August Weiss. \nWelche Steuerfolgen löst die Ausschüttung\
    \ der Liegenschaft in Form einer Naturaldi-\nvidende für die Schwarz AG und Jochen Schwarz aus?"
  reference: 'Jochen Schwarz erhält im Umfang von CHF 200''000 eine offene Gewinnausschüttung zulasten
    der Kapitalreserven (Buchwert der Liegenschaft von CHF 700''000 abzgl. über- nommene Hypothek von
    CHF 500''000). Zu prüfen ist aber, ob im Umfang der auf der Liegenschaft ruhenden stillen Reserven
    in Höhe von CHF 300‘000 zusätzlich auch eine verdeckte Gewinnausschüttung vorliegt. Gemäss ständiger
    Praxis des Bundesgerichts liegt eine verdeckte Gewinnausschüttung unter folgenden Voraussetzungen
    vor: Die Gesellschaft erbringt eine Leistung, der keine oder keine genügende Gegenleistung gegenübersteht,
    an einen Beteiligten oder eine diesem nahe stehende Person, die die Gesellschaft einem Dritten nicht
    erbracht hätte, wobei das Missverhältnis zwischen Leistung und Gegenleistung für die Gesellschaft
    er- kennbar ist. Die Schwarz AG schüttet ihre Liegenschaft an Jochen Schwarz zum Buchwert von CHF
    700‘000 aus. In der Differenz zwischen dem Verkehrswert und dem Buchwert der Liegenschaft von CHF
    300‘000 erbringt Jochen Schwarz der Schwarz AG keine Gegen- leistung. Er erhält die stillen Reserven
    zusätzlich zu den offen ausgeschütteten Kapitalre- serven. Es kann davon ausgegangen werden, dass
    die Schwarz AG einem Dritten die gleiche Liegenschaft nur zum Verkehrswert von CHF 1''000''000 übertragen
    hätte. Ange- sichts der recht hohen Differenz kann zudem davon ausgegangen werden, dass dieses Missverhältnis
    zwischen Leistung und Gegenleistung für die Gesellschaft erkennbar war. Es liegt demnach eine verdeckte
    Gewinnausschüttung im Umfang der auf der Liegen- schaft ruhenden stillen Reserven vor: Steuerfolgen
    der verdeckten Gewinnausschüttung auf Stufe der Schwarz AG: Direkte Bundessteuer (Gewinnsteuer): Auf
    Stufe der Schwarz AG führt die verdeckte Gewinnausschüttung im Umfang der stillen Reserven zu einer
    Gewinnsteuerkorrektur. Der Betrag der verdeckten Gewinnausschüt- tung in Höhe von CHF 300‘000 muss
    nach Art. 58 Abs. 1 lit. c DBG dem steuerbaren Gewinn der Gesellschaft zugerechnet werden. Verrechnungssteuer:
    Die Schwarz AG erbringt eine offene Gewinnausschüttung von CHF 200''000 an Jochen Schwarz. Die offene
    Gewinnausschüttung erfolgt aber zulasten der Kapitalreserven, so dass darauf gemäss Art. 5 Abs. 1bis
    VStG keine Verrechnungssteuer geschuldet ist. Weiter erbringt die Schwarz AG eine verdeckte Gewinnausschüttung
    von CHF 300''000 an Jochen Schwarz. Die Schwarz AG hat gemäss Art. 4 Abs. 1 lit. b VStG i.V.m. Art.
    20 Abs. 1 VStV auf den CHF 300’000 die Verrechnungssteuer zu entrichten. Nach Art. 10 Abs. 1 VStG
    ist die Schwarz AG steuerpflichtig, wobei sie die Verrechnungssteuer zwin- gend auf Jochen Schwarz
    überwälzen muss (Art. 14 VStG). Jochen Schwarz kann je- doch einen Rückerstattungsanspruch geltend
    machen, aber nur sofern er den Ertrag ord- nungsgemäss deklariert (Art. 21, Art. 22 und Art. 23 VStG).
    Ist eine Überwälzung nicht möglich, erfolgt eine "Aufrechnung ins Hundert".  Steuerfolgen für Jochen
    Schwarz: Die offene Gewinnausschüttung von CHF 200''000 erfolgt aus den Kapitalreserven und ist für
    Jochen Schwarz steuerfrei (Art. 20 Abs. 3 DBG). Die verdeckte Gewinnausschüttung in Höhe von CHF 300''000
    stellt Ertrag aus be- weglichem Vermögen dar, der nach Art. 20 Abs. 1 lit. c DBG steuerbar ist. Da
    Jochen Schwarz Alleinaktionär der Schwarz AG und daher eine Beteiligung von mehr als 10% an der Schwarz
    AG hält, kann er die Teilbesteuerung nach Art. 20 Abs. 1bis DBG beanspru- chen, sofern sich die Aktien
    in seinem Privatvermögen befinden. Sollten sich die Aktien in dem Geschäftsvermögen von Jochen Schwarz
    befinden, dann kann er die Teilbesteue- rung nach Art. 18b DBG geltend machen.'
  rubric:
  - Jochen Schwarz erhält im Umfang von CHF 200'000 eine offene Gewinnausschüttung zulasten der Kapitalreserven
    (Buchwert der Liegenschaft von CHF 700'000 abzgl. über- nommene Hypothek von CHF 500'000). Zu prüfen
    ist aber, ob im Umfang der auf der Liegenschaft ruhenden stillen Reserven in Höhe von CHF 300‘000
    zusätzlich auch eine verdeckte Gewinnausschüttung vorliegt.
  - 'Gemäss ständiger Praxis des Bundesgerichts liegt eine verdeckte Gewinnausschüttung unter folgenden
    Voraussetzungen vor: Die Gesellschaft erbringt eine Leistung, der keine oder keine genügende Gegenleistung
