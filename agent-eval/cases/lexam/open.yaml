  question: Umschreiben Sie den Internationalen Standardansatz bei der Berechnung des Kre ditrisikos und
    grenzen Sie diesen gegenüber dem IRB-Ansatz ab. Bedarf die Anwen dung beider Ansätze einer Bewilligung
    durch die FINMA?
