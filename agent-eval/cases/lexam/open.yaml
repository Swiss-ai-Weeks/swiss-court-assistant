  question: "E arbeitet schon seit vielen Jahren im Einkauf der W-AG, einer grossen Warenhauskette. E\
    \ ist schon seit seiner KV-Lehre bei der W-AG beschäftigt, er hat sich im Unternehmen hochgearbeitet\
    \ und ist seit 5 Jahren als Leiter der Abteilung „Einkauf – Schnittblumen und Blumensträusse“ tätig.\
    \ E ist damit zuständig für die Bestellung von Schnittblumen und arrangierten Blumensträussen für\
    \ alle Filialen der W-AG in der ganzen Schweiz. In seiner Funktion als Leiter der Abteilung Einkauf\
    \ – Schnittblumen und Blumensträusse hat E die Entscheidungsgewalt, welche Produkte durch die W-AG\
    \ gekauft werden. E hat Budgetverantwortung und rapportiert direkt an den Leiter Einkauf, dieser ist\
    \ Mitglied der Geschäftsleitung der W-AG. Privat ist E ein Lebemann und sehr an Sport interessiert.\
    \ Er ist Vereinspräsident des Fussballklubs M und hat auch eine Saisonkarte für die Spiele des FC\
    \ Zürich. E tritt gegenüber seinen Freunden im Fussballklub gerne gönnerhaft auf und lädt oft alle\
    \ Anwesenden zum Essen und Trinken ein. Mit seinem Schulfreund S – der ebenfalls im Fussballklub M\
    \ im Vorstand ist – besucht er oft grössere Sportevents, die beiden Schulfreunde sind auch sehr an\
    \ Tennissport interessiert und Bewunderer von Roger Federer. Der Blumenhändler B ist Lieferant der\
    \ W-AG und liefert Schnittblumen und Blumensträusse. Die W AG bezieht jährlich etwa 50'000 Blumensträusse\
    \ von B. Seit 4 Jahren haben B und E eine Abmachung: bestellt E für die W-AG Blumensträusse bei B,\
    \ so offeriert der B die Blumensträusse per Brief für CHF 2 mehr pro Strauss als der marktübliche\
    \ Preis wäre. CHF 1 pro Strauss behält B für sich und CHF 1 pro Strauss überweist B auf ein Konto\
    \ des S, dem Schulfreund von E. Nach Zahlungseingang lässt sich S die Beträge von seiner Bank in Bar\
    \ auszahlen und übergibt das Bargeld dem E, das dieser auf sein eigenes Bankkonto einzahlt. E hätte\
    \ die Sträusse auch bei einem anderen Lieferanten zum marktüblichen Preis beziehen können. Mit dem\
    \ durch dieses Vorgehen erzielten „Zustupf“ finanziert E seinen ausschweifenden Lebensstil und lädt\
    \ den S jährlich an das ATP-Turnier „US-Open“ in New York ein. E und S übernachten jeweils in einem\
    \ Luxushotel und haben für das Finalspiel Plätze in der ersten Reihe. \nPrüfen Sie die Strafbarkeit\
    \ von B wegen Mittäterschaft/Gehilfenschaft zur ungetreuen Geschäftsbesorgung nach dem schweizerischen\
    \ StGB, allfällige Strafanträge sind gestellt."
  reference: 'Strafbarkeit des B wegen Mittäterschaft/Gehilfenschaft zur ungetreuen Geschäftsbesorgung,
    Art. 158 Ziff. 1 StGB /Veruntreuung, Art. 138 Ziff. 1 Abs. 2 StGB von E (+/-) 3a) Mittäterschaft zur
    ungetreuen Geschäftsbesorgung, Art. 158 Ziff. 1 StGB /Veruntreuung, Art. 138 Ziff. 1 Abs. 2 StGB von
    E (+/-) Strittig, ob nur Mittäter sein kann, wer Sondereigenschaft erfüllt. Mittäterschaft kann also
    nur prüfen, wer davon ausgeht, dass entgegen dem Wortlaut von Art. 26 StGB Mit täterschaft am Sonderdelikt
    auch für denjenigen möglich ist, der die Sondereigenschaften nicht erfüllt. • Gemeinsamer Tatentschluss
    (+) Beim gemeinsamen Tatentschluss bedarf es einer wechselseitigen Übereinstimmung, eine bestimmte
    Tat durch arbeitsteiliges Zusammenwirken zu begehen. Der Tatent schluss kann auch stillschweigend
    durch konkludentes Verhalten erfolgen. E und B haben sich darauf geeinigt, dass E jeweils CHF 2 pro
    Strauss zu viel bezahlt und sie sich den Gewinn teilen. • Gemeinsame Tatausführung (+/-) Auf der Grundlage
    des gemeinsamen Tatentschlusses muss ein objektiver Tatbeitrag erbracht worden sein. Nach dem BGer
    setzt Mittäterschaft bei der gem. Tatausführung voraus, dass eine Per son „bei der Entschliessung,
    Planung oder Ausführung eines Delikts vorsätzlich u. in mas sgebender Weise mit anderen Tätern zusammenwirkt,
    so dass er als Hauptbeteiligter dasteht“. Ferner ist notwendig, dass „der Tatbeitrag nach den Umständen
    des konkreten Falles u. dem Tatplan für die Ausführung eines Delikts so wesentlich ist, dass sie mit
    ihm steht od. fällt“. Fraglich, ob B durch Offertenstellung so wesentlich zur Veruntreuung/ungetreuen
    Ge schäftsbesorgung durch E beiträgt, dass sie mit ihr steht oder fällt. (+/-) IV. Rechtswidrigkeit:
    keine Rechtfertigungsgründe ersichtlich. V. Schuld: keine Schuldausschlussgründe ersichtlich. VI.
    Fazit: B hat sich/hat sich nicht der Veruntreuung/der ungetreuen Geschäftsbesor gung in Mittäterschaft
    mit E schuldig gemacht. 3b) Strafbarkeit des B wegen Gehilfenschaft zur ungetreuen Geschäftsbe sorgung,
    Art. 158 Ziff. 1 i.V.m. Art. 25 StGB /Veruntreuung, Art. 138 Ziff. 1 Abs. 2 i.V.m. Art. 25 StGB von
    E  I. Tatbestandsmässigkeit Obj. Tatbestand (+). • Tatbestandsmässige und rechtswidrige Haupttat (limitierte
    Akzessorietät) (+) - Vgl. oben Strafbarkeit des E wegen ungetreuer Geschäftsbesorgung gem. Art. 158
    Ziff. 1 StGB (oder Veruntreuung gem. Art. 138 Ziff. 1 Abs. 2 StGB). • Hilfeleistung (+) - Offertenstellung.
    II. Fazit B hat sich der Gehilfenschaft zu ungetreuer Geschäftsbesorgung, Art. 158 Ziff. 1 i.V.m.
    Art. 25 StGB (oder zur Veruntreuung gem. Art. 138 Ziff. 1 Abs. 2 i.V.m. Art. 25 StGB) strafbar gemacht.'
