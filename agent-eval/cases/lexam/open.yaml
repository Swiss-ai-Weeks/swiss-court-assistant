  question: "Student A. wurde im 2018 26 Jahre alt und ärgert sich über einen Brief seiner Krankenkasse,\n\
    gemäss dem seine Prämien in der Grundversicherung für das Jahr 2019 um CHF 30 auf\nCHF 400 pro Monat\
    \ gestiegen sind. Als Student A. dies seinem Kommilitonen B. erzählt,\nerfährt er, dass dieser um\
    \ zwei Jahre jüngere Kollege bei einer anderen Krankenkasse versi-\nchert ist und dort nur CHF 300\
    \ pro Monat für die Prämie der obligatorischen Grundversiche-\nrung bezahlt. Student A. wundert sich\
    \ über diesen grossen Unterschied von CHF 100/Monat.\nEr ist der Ansicht, dass hier etwas nicht stimmen\
    \ kann. \nStudent A. fragt Sie, ob die Prämien für die obligatorische Krankenversicherung nicht im\n\
    Gesetz betraglich festgeschrieben sind. Er möchte von Ihnen wissen, welche Faktoren sich auf\ndie\
    \ konkrete Prämienhöhe auswirken können. Was antworten Sie ihm?"
  reference: 'Die Höhe der Prämie ergibt sich nicht aus dem Gesetz. Art. 61 KVG legt fest, dass grund-
    sätzlich eine gleich hohe Einheitsprämie (Kopfprämie) geschuldet ist. (Siehe LOCHER/GÄCHTER, § 65
    Rz. 16 ff.; Skript Rz. 365–367)  Abweichungen von der Einheitsprämien sind zulässig und können sich
    ergeben durch:  Unterschiedliche Krankenkassen: Jede Kasse berechnet die Kopfprämien so, dass sie
    die laufenden Kosten im Umlageverfahren decken;  Unterschiedlicher Wohnort: Die Kassen dürfen die
    Prämien kantonal und regional nach ausgewiesenen Kostenunterschieden abstufen (Art. 61 Abs. 2 KVG);
     Unterschiedliches Alter: Für Kinder und junge Erwachsene dürfen tiefere Prämien verlangt werden
    (Art. 61 Abs. 3 KVG);  Eingeschränkte Wahl des Leistungserbringers (Art. 62 Abs. 1);  Höhere Kostenbeteiligung
    (nicht Selbstbehalt) (Art. 62 Abs. 1 lit. a KVG).'
  rubric:
