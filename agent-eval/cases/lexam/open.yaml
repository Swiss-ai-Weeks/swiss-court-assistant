  question: "Art. 130 Bundesgerichtsgesetz (BGG) lautet auszugsweise:\nInnert zwei Jahren nach Inkrafttreten\
    \ dieses Gesetzes\nerlassen die Kantone Ausführungsbestimmungen über\ndie Zuständigkeit, die Organisation\
    \ und das Verfahren\nder Vorinstanzen im Sinne der Artikel 86 Absätze 2 und\n3 und 88 Absatz 2, einschliesslich\
    \ der Bestimmungen,\ndie zur Gewährleistung der Rechtsweggarantie nach\nArtikel 29a der Bundesverfassung\
    \ erforderlich sind.\nBis zum Erlass der Ausführungsgesetzgebung können\ndie Kantone die Ausführungsbestimmungen\
    \ in die Form\nnicht referendumspflichtiger Erlasse kleiden, soweit dies zur Einhaltung der Fristen\
    \ nach den Absätzen 1-3\nnotwendig ist. \nWas verstehen Sie unter \"Ausführungsbestimmungen\" im Sinne\n\
    von Art. 130 Abs. 3 BGG"
  reference: 'Es handelt sich um Umsetzungsrecht der Kantone (nicht: untergeordnetes Verordnungsrecht
    o.ä.). Nicht geklärt durch das Bundesrecht ist, ob es sich dabei um kantonales Recht auf Gesetzesstufe
    u/o Verordnungsstufe han- delt-'
