  question: "Vor einigen Tagen sass der Genfer Künstler Xavier in seinem Atelier und las im Internet Nachrichten,\
    \ als er plötzlich in der Online-Werbung eines grossen Schweizer Uhrenkonzerns eine Reproduktion seiner\
    \ eigenen Skulptur, eines gigantischen silbernen Astronauten in einzigartiger Pose, erkannte. Dank\
    \ einer kurzen Recherche konnte er feststellen, dass seine Skulptur eins-zu-eins in der neuen Werbekampagne\
    \ des Uhrenkonzernes verschiedentlich benutzt wird. Einerseits posieren berühmte Schauspieler und\
    \ Schauspielerinnen neben einer originalgetreuen Reproduktion der Astronautenskulptur an den internationalen\
    \ Filmfestspielen von Venedig. Andererseits findet sich der Astronaut auf Plakaten der neuen Uhrenkollektion,\
    \ die in Städten überall auf der Welt aufgehängt wurden. Xavier ist sowohl wütend als auch entmutigt:\
    \ Gegenüber dem grossen Luxus-Konzern fühlt er sich machtlos. Nichtsdestotrotz entscheidet er sich\
    \ dazu, mit seinen Freunden und Freundinnen, die Jus studieren, über diesen Fall zu sprechen. \nAngenommen,\
    \ der Uhrenkonzern habe Xavier für die Verwendung der Skulptur grosszügig \nentschädigt, einige seiner\
    \ Kunstwerke für die Räumlichkeiten des Hauptsitzes des Konzerns \nin Genf gekauft, und angefangen,\
    \ sein Kunstschaffen dauernd mit einer Art Stipendium zu \nunterstützen. Um welche zwei Arten der\
    \ privaten Kunstfinanzierung könnte es in diesem Fall gehen? \nDefinieren Sie die beiden Arten von\
    \ Kunstfinanzierung und grenzen sie diese \nvoneinander ab."
  reference: '- Erste Möglichkeit: Kunstfinanzierung durch Sponsoring (2). - Sponsoring: marktwirtschaftliche
    Form privater Kunstfinanzierung, (1). - Form von Marketing (1): Fördernde Unternehmen versucht, sein
    öffentliches Ansehen zu verbessern (1). - Problem der Marketinglogik: es wird nur so lange finanziell
    unterstützt, solange es sich wirtschaftlich lohnt (1). - Zweite Möglichkeit: Mäzenatentum / stiller
    Förderung (1), wobei zwei verschiedene Sachen! (1). - Unterschied: Mäzen bleibt im Hintergrund, handelt
    uneigennützig (1). - Keine Gegenleistung, handelt auf der Basis eines Vertrauensverhältnisses (1).'
