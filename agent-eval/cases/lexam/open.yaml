  question: |-
    Please indicate whether the following statements regarding the media in Switzerland are correct:

    A) Empiric findings among the Swiss population show that people who
    primarily inform themselves via social media (YouTube, Facebook etc.)
    have less confidence in the media system than people who often inform
    themselves via public service broadcasting.
    B) The Swiss Constitution’s understanding of electronic mass media in
    Article 93 is democracy-functional. This understanding enables the
    cohesion across different languages, cultures and mentalities in the
    country.
    C) Admeira is a joint venture between the Swiss Broadcasting Corporation
    (SRG), telecom company Swisscom and the media company Ringier.
    Admeira’s purpose is to foster online advertising by using personalisation
    technologies. If the latter is also used for news and other type of online
    content, the SRG may infringe the legal requirement to contribute to the
    free shaping of opinion according to Article 93(2) of the Swiss
    Constitution.
    D) The democratic-functional understanding of electronic mass media in the
    Swiss Constitution does not consider economic differences between
    regional media markets.
    E) In Switzerland, the constitutional principles of accurate presentation of
    events and diversity of opinion are justiciable and enforceable against any
    radio and television broadcaster established in Switzerland.
  reference: 'correct:   A) Empiric findings among the Swiss population show that people who primarily
    inform themselves via social media (YouTube, Facebook etc.) have less confidence in the media system
    than people who often inform themselves via public service broadcasting. B) The Swiss Constitution’s
    understanding of electronic mass media in Article 93 is democracy-functional. This understanding enables
    the cohesion across different languages, cultures and mentalities in the country. C) Admeira is a
    joint venture between the Swiss Broadcasting Corporation (SRG), telecom company Swisscom and the media
    company Ringier. Admeira’s purpose is to foster online advertising by using personalisation technologies.
    If the latter is also used for news and other type of online content, the SRG may infringe the legal
    requirement to contribute to the free shaping of opinion according to Article 93(2) of the Swiss Constitution.
    E) In Switzerland, the constitutional principles of accurate presentation of events and diversity
    of opinion are justiciable and enforceable against any radio and television broadcaster established
    in Switzerland.'
  rubric:
  - 'correct:   A) Empiric findings among the Swiss population show that people who primarily inform themselves
    via social media (YouTube, Facebook etc.) have less confidence in the media system than people who
    often inform themselves via public service broadcasting.'
  - B) The Swiss Constitution’s understanding of electronic mass media in Article 93 is democracy-functional.
    This understanding enables the cohesion across different languages, cultures and mentalities in the
    country. C) Admeira is a joint venture between the Swiss Broadcasting Corporation (SRG), telecom company
    Swisscom and the media company Ringier.
  - Admeira’s purpose is to foster online advertising by using personalisation technologies. If the latter
    is also used for news and other type of online content, the SRG may infringe the legal requirement
    to contribute to the free shaping of opinion according to Article 93(2) of the Swiss Constitution.
  - E) In Switzerland, the constitutional principles of accurate presentation of events and diversity
    of opinion are justiciable and enforceable against any radio and television broadcaster established
    in Switzerland.
