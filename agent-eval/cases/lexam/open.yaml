  question: "Die Wasserkraft-AG (W-AG) stellt beim Kanton Y ein Gesuch um Erstellung und Betrieb\neines\
    \ Wasserkraftwerks mit einer Leistung von 0.6 MW zwecks Nutzbarmachung des Was-\nsers des Tobelbachs.\
    \ Beim Tobelbach handelt es sich um ein Fliessgewässer mit ständiger\nWasserführung und einer Abflussmenge\
    \ Q347 von 600 l/s. Das Projekt sieht eine Wasser-\nentnahme im Umfang von 280 l/s vor. Das entnommene\
    \ Wasser würde zur Stromproduk-\ntion durch eine Druckleitung geführt und 1 km unterhalb der Entnahmestelle\
    \ wieder in den\nTobelbach eingeleitet.\n\nIn der Folge erteilt das Amt für Wasser und Umwelt des\
    \ Kantons Y die Bewilligung für die\ngeplante Wasserentnahme. Gegen diese Bewilligung erhebt der Verein\
    \ \"Aqua Viva\", der in\nden 1960er-Jahren als \"Rheinaubund\" gegründet und 2012 mit im Wesentlichen\
    \ unverän-\nderten Statuten in \"Aqua Viva\" umbenannt wurde, Beschwerde an das Baudepartement des\n\
    Kantons Y. Er ist der Meinung, dass höchstens eine Wasserentnahme im Umfang von 230\nl/s bewilligt\
    \ werden dürfte, da der Bachabschnitt unterhalb der Entnahmestelle einen wich-\ntigen Lebensraum für\
    \ einige stark gefährdete Fischarten darstelle und die Ufervegetation\ndarüber hinaus mehreren seltenen\
    \ Vogelarten als Brutstätte diene, deren Erhalt bei Durch-\nführung der bewilligten Wasserentnahme\
    \ nicht gewährleistet werden könne.\n\nAus den Statuten von \"Aqua Viva\":\nArt. 2 Zweck\nAqua Viva\
    \ setzt sich landesweit für einen umfassenden Schutz und die Aufwertung von Gewäs-\nsern, Auen, Feuchtgebieten\
    \ und Gewässer- und Moorlandschaften ein. Wegleitend sind folgende\nGrundsätze:\na) Erhaltung der\
    \ Schönheit der Fluss-, Seen-, Ufer- und Moorlandschaften;\nb) Qualitativer und quantitativer Schutz\
    \ der Oberflächengewässer und des Grundwassers;\nc) Erhaltung bzw. Wiederherstellung der natürlichen\
    \ oder naturnahen Gewässercharakteristik;\nd) Schutz des Tier- und Pflanzenbestandes in den Gewässern\
    \ und deren Umgebung;\ne) Stärkung der Beziehung zwischen Mensch und Natur;\nf) Verzicht auf den Bau\
    \ neuer Wasserkraftwerke an bisher unberührten Gewässern und Gewässer-\nabschnitten;\ng) Verzicht\
    \ auf einen Ausbau der Gewässer für die kommerzielle Lastschifffahrt. \nWie schätzen Sie die Erfolgsaussichten\
    \ einer Beschwerde ein? (Gehen davon aus, dass der Verein zur Beschwerde\nlegitimiert ist.)"
  reference: 'Gemäss Art. 29 lit. a GSchG braucht eine Bewilligung, wer einem Fliessgewässer mit stän-
    diger Wasserführung über den Gemeingebrauch hinaus Wasser entnimmt. Laut Sachverhalt handelt es sich
    beim Tobelbach um ein Fliessgewässer mit ständiger Wasserführung. Eben- so geht die Wasserentnahme
    im Umfang von beinahe der Hälfte der Abflussmenge eindeu- tig über den Gemeingebrauch hinaus. Nach
    Art. 30 lit. a GSchG kann die Bewilligung erteilt werden, wenn die Anforderungen nach den Artikeln
    31–35 erfüllt sind. Als erstes ist die Mindestrestwassermenge nach Art. 31 GSchG zu bestimmen, die
    nach einer Wasserentnahme mindestens im Fliessgewässer verbleiben muss. Bei einem Fliessgewässer mit
    einer Abflussmenge Q347 von 600 l/s beträgt die Mindestrestwasser- menge gemäss Art. 31 Abs. 1 GSchG
    311 l/s (für 500 l/s Abflussmenge 280 l/s plus für je weitere 100 l/s Abflussmenge 31 l/s mehr). Mit
    der von der W-AG geplanten Wasserentnahme im Umfang von 280 l/s verbleibt im Tobelbach eine Restwassermenge
    von 320 l/s, so dass die Mindestrestwassermenge nach Abs. 1 – das "quantitative Existenzminimum" –
    knapp eingehalten wäre. Die nach Abs. 1 berechnete Restwassermenge muss zwingend erhöht werden, wenn
    die Anforderungen nach Art. 31 Abs. 2 lit. a–e GSchG – das "qualitative Existenzminimum" – nicht erfüllt
    sind und auch nicht durch andere Massnahmen erfüllt werden kön- nen. Hier ist lit. c einschlägig,
    wonach seltene Lebensräume und -gemeinschaften, die direkt oder indirekt von der Art und Grösse des
    Gewässers abhängen, erhalten oder nach Möglichkeit durch gleichwertige ersetzt werden müssen, wenn
    nicht zwingende Gründe entgegenstehen. Nach Ansicht von "Aqua Viva" handelt es sich beim Bachabschnitt
    und dessen Ufervegetation unterhalb der geplanten Wasserentnahme um einen wichtigen Lebensraum sowie
    eine Brutstätte für gefährdete Tierarten, welche von der Art und Grösse des Gewässers abhängen und
    deren Fortbestand mit der geplanten Wasserentnahme nicht gewährleistet wäre. Über die Möglichkeit,
    diesen Lebensraum durch einen gleichwertigen zu ersetzen, sagt der Sachverhalt nichts aus; sie ist
    aber wohl zu verneinen, da dies einen Bach mit sehr ähnlichen, wenn nicht identischen Eigenschaften
    voraussetzen würde, in welchen die gefährdeten Fisch- und Vogelarten ausweichen könnten. Ebenso sind
    kei- ne zwingenden Gründe bekannt, die einer Erhaltung des Lebensraums entgegenstehen. Die nach Abs.
    1 berechnete Restwassermenge müsste demnach – sollte sich die Sachdar- stellung von "Aqua Viva" als
    zutreffend erweisen – entsprechend erhöht werden. Ob die bei der Bewilligung vorgenommene geringfügige
    Erhöhung der Restwassermenge um 9 l/s (von 311 auf 320 l/s) den Anforderungen von Art. 31 Abs. 2 GSchG
    entspricht, ist fraglich. Eine Ausnahme nach Art. 32 GSchG, welche es den Kantonen erlauben würde,
    die Min- destrestwassermengen tiefer anzusetzen, liegt nicht vor. Des Weiteren ist die Behörde nach
    Art. 33 Abs. 1 GSchG verpflichtet, die Mindestrestwas- sermenge in dem Ausmass weiter zu erhöhen,
    als es sich aufgrund einer Abwägung der Interessen für und gegen die vorgesehene Wasserentnahme ergibt.
    Als Interessen für die Wasserentnahme kommen unter anderem öffentliche Interessen, denen die Wasserentnah-
    me dienen soll, aber auch die wirtschaftlichen Interessen desjenigen, der Wasser entnehmen will, in
    Frage (Abs. 2 lit. a und c). Gegen diese Interessen sind die Interessen abzuwä- gen, die gegen die
    Wasserentnahme sprechen, namentlich die Bedeutung des Gewässers als Lebensraum für die davon abhängige
    Tier- und Pflanzenwelt, samt deren Artenreichtum, namentlich auch für die Fischfauna, deren Ertragsreichtum
    und natürliche Fortpflanzung (Art. 33 Abs. 3 lit. b GSchG). Über die Tragweite der öffentlichen und
    privaten wirt- schaftlichen Interessen an der Wasserentnahme ist nichts bekannt. Es ist jedoch als
    unwahr- scheinlich einzuschätzen, dass in der durch die Behörde vorgenommenen geringfügigen Erhöhung
    der Restwassermenge um 9 l/s sowohl die Erhöhung nach Art. 31 Abs. 2 wie auch die obligatorische Erhöhung
    nach Art. 33 GSchG enthalten sind, weshalb eine weitere Erhöhung der Restwassermenge nach Art. 33
    GSchG geboten sein dürfte. Fazit: Die Erfolgsaussichten der Beschwerde des Vereins "Aqua Viva" – zumindest
    in Form einer teilweisen Gutheissung – sind als hoch einzuschätzen.'
  rubric:
  - Gemäss Art. 29 lit. a GSchG braucht eine Bewilligung, wer einem Fliessgewässer mit stän- diger Wasserführung
    über den Gemeingebrauch hinaus Wasser entnimmt. Laut Sachverhalt handelt es sich beim Tobelbach um
    ein Fliessgewässer mit ständiger Wasserführung. Eben- so geht die Wasserentnahme im Umfang von beinahe
    der Hälfte der Abflussmenge eindeu- tig über den Gemeingebrauch hinaus. Nach Art. 30 lit. a GSchG
