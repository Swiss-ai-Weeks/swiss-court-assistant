  question: "Der 19-jährige A. hat von X. in einer an das Berufsschul-Areal angrenzenden Seitengasse 10\
    \ g Haschisch gekauft. X. verkauft dort seit Monaten immer am Mittwoch-Vormittag 10 Gramm-Stücke Haschisch.\
    \ A. dreht mit einem Teil seines Kaufs einen Joint, den er in einer Pause auf dem Areal der Berufsschule\
    \ gemeinsam mit der 18-jährigen B. und dem 17-jährigen C. raucht. A. fordert weder B. noch C. auf,\
    \ mitzurauchen. Die drei sind in der Pause wie üblich in einem abgelegenen Winkel des Areals beisammen,\
    \ als A. den Joint anzündet und selbst verständlich im Kreis herumgehen lässt. Doch kaum haben alle\
    \ einmal am Joint gezogen, interveniert Polizistin P., die im Auftrag der Schulleitung auf der Lauer\
    \ war und die ganze Szene heimlich beobachtet hat. Sie durchsucht A. und stellt 8 g Haschisch sicher.\
    \ \nPrüfen Sie die Strafbarkeit und die Möglichkeit der Erledigung im Ordnungsbussenverfahren von\
    \ A."
  reference: (1) Bei Haschisch handelt es sich um Cannabisharz und damit um ein stark THC-haltiges Can
    nabisprodukt. Cannabis lässt sich bereits gestützt auf die allgemeine Definition von BetmG 2.a als
    Betäubungsmittel i.S. des BetmG identifizieren. Zudem ist Cannabis auch im Anhang zur BetmVV-EDI aufgeführt.
    (1) Der SV enthält in Bezug auf keine der Personen X, A, B und C einen Hinweis auf eine Befugnis zum
    Umgang mit Betäubungsmittel, z.B. als Medizinalperson oder Inhaber einer Be willigung. Deshalb ist
    in Bezug auf alle vier der Umgang mit Cannabis «unbefugt». (1) Zu prüfen ist, ob A wegen unbefugten
    Erlangens und Besitzens von Betäubungsmitteln gemäss BetmG 19 I.d und wegen Abgabe an Minderjährige
    gemäss BetmG 19bis und/oder welche Auswirkung die Konsumprivilege gemäss BetmG 19a-19c auf seine strafrechtliche
    Ver antworlichtkeit haben. (1) Ohne weiteres ist festzustellen, dass A den Tatbestand des unbefugten
    Erlangens und Besitzens gemäss BetmG 19 I.c erfüllt hat, indem er X 10 Gramm Haschisch abgekauft und
    anschliessend auf sich getragen hat. (1) Indem A den 17-jährigen C hat mitrauchen lassen, hat er Betäubungsmittel
    einer Person unter 18 Jahren zugänglich gemacht und damit den Tatbestand von BetmG 19bis erfüllt.
    (1) Indem A selbst von dem Cannabis geraucht hat, hat er den Tatbestand des unbefugten Konsums gemäss
    BetmG 19a I erfüllt. Damit fällt auch seine Beschaffung der Betäubungsmit tel gemäss BetmG 19 I.c
    unter das Konsumprivileg von BetmG 19a I. (1) Was den Erwerb und Besitz von 10 Gramm Haschisch zum
    eigenen Konsum – ggf. zu sammen mit weiteren Personen – betrifft, so ist dies gemäss BetmG 19b straflos.
    Daran ändert sich auch nichts, wenn A Leute über 18 Jahren mitkonsumieren lässt. Da aber A auch den
    17 jährigen C mitrauchen lässt, kommt für ihn das Konsumvorbereitungs-Privileg gemäss BetmG 19b nicht
    zum Tragen. (1) A hat anlässlich seiner Widerhandlung den minderjährigen C gefährdet, indem er ihn
    mit rauchen lassen hat. Deshalb kann die Straftat von A gemäss OBG 4.III.a nicht im Ordnungs bussenverfahren
    geahndet werden. (1) Der Betäubungsmittelkonsum von A gemäss BetmG 19a I, teilw. i.V.m. BetmG 19 I.d,
    und die von A begangene Jugendgefährdung BetmG 19bis treten in echte Konkurrenz, da es bei der einen
    Tat um Selbstgefährdung, bei der anderen um Fremdgefährdung und mithin um zwei verschiedene Schutzobjekte.
    Demnach treten die beiden Taten in echte Konkurrenz.
