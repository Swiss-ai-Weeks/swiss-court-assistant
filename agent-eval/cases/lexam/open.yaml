  question: "D ist begeisterte Drohnenpilotin und testet in ihrer Freizeit regelmässig die maximale Traglast\
    \ ihrer Drohnen. Eines Nachmittags übertreibt sie es und ihre Drohne samt den daran hängenden Gewichten\
    \ stürzt auf Cs Garage ab. Das Garagendach und das Tor werden hierbei schwer beschädigt. Ein herab\
    \ fallender Dachziegel trifft C und verletzt sie. C beauftragt den Handwerker H mit den Reparaturarbeiten.\
    \ H renoviert das Dach, ersetzt das Tor und installiert bei dieser Gelegenheit auf Wunsch von C auch\
    \ noch gleich ein neues Beleuchtungssystem. Nach Fertigstellung der Arbeiten stellt H der C eine detaillierte\
    \ Rechnung zu, in welcher aufgezeigt \nwird, dass der Aufwand und die Materialkosten für die Renovation\
    \ des Garagendachs CHF 7’000, für \ndas ersetzte Garagentor CHF 3'000 und für das neue Beleuchtungssystem\
    \ CHF 7'000 betragen. \nWegen ihrer Verletzung muss sich C einer ärztlichen Behandlung unterziehen,\
    \ für die Kosten in Höhe \nvon CHF 2'000 anfallen. Zudem muss sie einen geschäftlichen Auftrag absagen,\
    \ woraus ihr ein Erwerbs\nausfall von CHF 3'000 entsteht. \nC verlangt von D Schadenersatz in der\
    \ Höhe von CHF 10'000. Sie leitet ein Schlichtungsverfahren ein, \ndas ohne Einigung endet. Daraufhin\
    \ erhebt sie Klage beim zuständigen Gericht. Neben der Klagebewil\nligung reicht sie ein Schreiben\
    \ ein, das lautet: «Ich fordere die Zahlung von CHF 10'000, weil D mit ihrer \nDrohne meine Garage\
    \ beschädigt hat und ich dabei verletzt wurde. Nachforderungen bleiben vorbe\nhalten. Rechnungen liegen\
    \ bei.» C legt ihrer Klage die von H gestellte Rechnung, die Honorarrechnung \nihres Arztes und die\
    \ Korrespondenz mit der Kundschaft bei, deren Auftrag sie absagen musste. \nDas Gericht stellt die\
    \ von C eingereichten Unterlagen der D zur Stellungnahme zu. D ist sich keiner \nSchuld an dem Unfall\
    \ und den entstandenen Schäden bewusst. Innert der gesetzten Stellungnahme\nfrist sendet sie an das\
    \ Gericht ein Schreiben, welches lautet: «Sämtliche Ansprüche der Gegenseite \nsind ohne Fundament\
    \ und werden bestritten.»  \nDaraufhin lädt das Gericht die Parteien unter Hinweis auf Art. 147 und\
    \ Art. 234 ZPO (die in der Vorla\ndung auch im Wortlaut wiedergegeben werden) zur mündlichen Hauptverhandlung\
    \ vor. Zu dieser Ver\nhandlung erscheint nur D. Beide Parteien erscheinen zur Verhandlung. Nachdem\
    \ C sich geäussert hat, erteilt der Richter \nD das Wort. D sagt, sie habe schon geschrieben, dass\
    \ sie alles bestreite; weiter sei dazu nichts zu sagen. \nDer Richter sagt, weil D offensichtlich\
    \ nicht imstande sei, ihren Standpunkt sachgerecht zu vertreten, \nsolle sie sich einen Rechtsanwalt\
    \ nehmen. D lehnt ab und sagt, sie wisse schon selbst, was sie tue. Der \nRichter setzt D eine Frist\
    \ von zwei Wochen für die Bestellung eines Rechtsanwalts an und vertagt die \nVerhandlung. \nWie beurteilen\
    \ Sie das Vorgehen des Richters? Vorbemerkung: Behandeln Sie (gegebenenfalls hilfsgutachterlich) alle\
    \ prozessualen Aspekte, zu deren \nErörterung der Sachverhalt Anlass gibt. Verzichten Sie jedoch auf\
    \ abstrakte oder spekulative Ausfüh\nrungen ohne Bezug zu den im Sachverhalt aufgeworfenen Problemen.\
    \ Erwartet wird eine inhaltliche \nAuseinandersetzung mit den relevanten prozessualen Rechtsfragen.\
    \ Die Begründung eines Ergebnisses \nallein durch einen Hinweis auf Rechtsprechung oder Lehrmeinungen\
    \ ohne eigene Argumentation ge\nnügt nicht."
  reference: «Quasi-Beistandschaft» nach Art. 69 Abs. 1 ZPO • Bei Nichtbefolgung des Auftrags hat das
    Gericht der Partei von sich aus eine Vertretung zu be stellen. • Zielt auf Fälle ab, in denen die
    Partei zwar prozessfähig, aber nicht postulationsfähig ist. • Aus der Sicht des Gerichts unvernünftiges
    oder nicht zielführendes Prozessverhalten einer prozessfähigen Partei rechtfertigt keine «Quasi-Beistandschaft».
    • Der Richter hätte D stattdessen darauf hinweisen sollen (Art. 247 Abs. 1 ZPO), dass Passivität bei
    der Erstellung des Sachverhalts den Prozessverlust nach sich ziehen kann (gegebenenfalls auch darauf,
    dass die Bestellung eines Vertreters zweckmässig sein könnte). Im Übrigen liegt es aber grundsätzlich
    in der Eigenverantwortung der Partei, eine Prozessvertretung zu bestel len oder nicht (kein Anwaltszwang
    nach ZPO).
  rubric:
  - «Quasi-Beistandschaft» nach Art. 69 Abs. 1 ZPO
  - Bei Nichtbefolgung des Auftrags hat das Gericht der Partei von sich aus eine Vertretung zu be stellen.
  - Zielt auf Fälle ab, in denen die Partei zwar prozessfähig, aber nicht postulationsfähig ist.
  - Aus der Sicht des Gerichts unvernünftiges oder nicht zielführendes Prozessverhalten einer prozessfähigen
    Partei rechtfertigt keine «Quasi-Beistandschaft».
  - Der Richter hätte D stattdessen darauf hinweisen sollen (Art. 247 Abs. 1 ZPO), dass Passivität bei
    der Erstellung des Sachverhalts den Prozessverlust nach sich ziehen kann (gegebenenfalls auch darauf,
    dass die Bestellung eines Vertreters zweckmässig sein könnte). Im Übrigen liegt es aber grundsätzlich
    in der Eigenverantwortung der Partei, eine Prozessvertretung zu bestel len oder nicht (kein Anwaltszwang
    nach ZPO).
