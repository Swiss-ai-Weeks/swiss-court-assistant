    deutlich stärkere Beanspruchung der Erschliessung) hinzukommen, womit hier aber eher nicht zu rechnen
    ist. o Da die BZO in der fraglichen Zone mässig störende Betriebe zulässt, ist gemäss Art. 43 Abs.
    1 lit. c LSV die Lärmempfindlichkeitsstufe III massgebend, welche "immissionstoleranter" ist als die
    ES II, auch in Bezug auf Veränderungen der Immissionsbelastung. o Im Erdgeschoss erfolgt zwar eine
    Nutzungsänderung (Büronutzung statt Wohnnut- zung), aber nur in sehr geringfügigem Ausmass und nur
    zur Ermöglichung der neuen Form von Wohnnutzung (Betreuung der Bewohnerinnen und Bewohner).
  - 'Sie ist ge- samthaft von so untergeordneter Bedeutung, dass sie für die Frage der Bewilligungs- pflicht
    nicht in Betracht fällt. Ergebnis: Je nach eingenommener Betrachtungsweise ist die Bewilligungspflicht
    zu beja- hen oder (mit dem Bundesgericht) zu verneinen.'
