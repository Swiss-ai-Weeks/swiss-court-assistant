  question: "Die Chemikalienkontrollverordnung (SR 946.202.21) enthält den folgenden ersten Artikel: Art.\
    \ 1 Zweck und Geltungsbereich 1Diese Verordnung regelt den Vollzug des Chemiewaffenübereinkommens\
    \ vom 13. Januar 1993 (CWÜ). 2Sie gilt für die Chemikalien, die in den Listen im Anhang (Chemikalienlisten)\
    \ aufgeführt sind. 3Das Eidgenössische Departement für Wirtschaft, Bildung und Forschung (WBF) führt\
    \ die Chemikalienlisten nach, wenn internationale Verpflichtungen der Schweiz dies erfordern. \nWas\
    \ würden Sie als Gesetzesredaktorin oder Gesetzesredaktor an diesem Artikel beanstanden?"
  reference: Absatz 1 nennt nicht den Zweck der Verordnung, wie es die Sachüberschrift («Zweck») vermuten
    liesse, sondern den Gegenstand der Verordnung («regelt»). Punkte Absatz 3 gehört weder zum Zweck,
    Gegenstand oder Geltungsbereich, sondern er enthält eine (materielle) Delegationsnorm.
