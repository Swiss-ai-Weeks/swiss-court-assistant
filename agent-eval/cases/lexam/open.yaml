  question: "Tom provoziert Nico verbal in dessen Bar «zum Wolf», weshalb Nico ihn aus seinem Lokal verweist.\
    \ Tom ist hierüber erzürnt, wartet bis zum Feierabend bis Nico die Bar verlässt und zieht seine Pistole\
    \ aus der Jackentasche. Er gibt vor dem Lokal aus einer Distanz von ca. 10 Metern einen gezielten\
    \ Schuss ab, trifft Nico jedoch nicht. Kurz danach wird Tom von der Polizei festgenommen. Er wird\
    \ von der Polizei korrekt belehrt und danach zur Sache befragt. Er gibt zu, dass er in der Bar «zum\
    \ Wolf» etwas getrunken hat, bestreitet aber, irgendetwas mit dem Vorfall zu tun zu haben. Weiter\
    \ erklärt er, dass er ohne seinen Anwalt keine weiteren Aussagen machen wird. Nach der ersten staatsanwaltschaftlichen\
    \ Einvernahme wird für Tom ein Rechtsanwalt bestellt. Im Rahmen des Untersuchungsverfahrens findet\
    \ in der Folge eine Konfrontationseinvernahme zwischen Nico als Hauptbelastungszeuge und Tom statt.\
    \ Umstritten ist dabei vor allem die Zielrichtung des Schusses. Während Nico sagt, Tom habe direkt\
    \ auf ihn gezielt, sagt Tom, er habe gezielt danebengeschossen. Weitere Zeugen konnten nicht ausfindig\
    \ gemacht werden. \nDer Rechtsanwalt von Tom beantragt die Anwesenheit von Nico als Hauptbelastungszeuge\
    \ an der erstinstanzlichen Verhandlung. Das Bezirksgericht Zürich verzichtet auf die Vorladung von\
    \ Nico, weil «die unmittelbare Kenntnis des Beweismittels für die Urteilsfällung nicht notwendig erscheint».\
    \ Das Gericht stellt ausschliesslich auf die Aussagen von Nico ab; Tom wird verurteilt. Ist diese\
    \ Vorgehensweise korrekt?"
  reference: 'Beschränktes Unmittelbarkeitsprinzip nach Art. 343 Abs. 3 StPO Art. 343 Abs. 3 StPO verpflichtet
    das Gericht im Vorverfahren ordnungsgemäss erhobene Beweise nochmals zu erheben, sofern die unmittelbare
    Kenntnis des Beweismittels für die Urteilsfällung notwendig erscheint (sog. beschränktes Unmittelbarkeitsprinzip)
    (SCHMID/JOSITSCH, Praxiskommentar3, Art. 343 N 1; SCHMID/JOSITSCH, Handbuch3, N. 1329). (Korrekturhinweis:
    Volle Punktzahl nur bei Erwähnen auch des generell geltenden Unmittelbarkeitsprinzips)  Das Gericht
    verfügt jedoch bei der Frage, ob eine erneute Beweisabnahme bzw. die unmittelbare Kenntnis erforderlich
    ist, über einen Ermessensspielraum (BGer, Urteil 6B_970/2013 vom 24. Juni 2014 E. 2.1 m.H.).  Das
    Gericht ist gemäss Abs. 3 aber nur dann verpflichtet, wenn die unmittelbare Kenntnis des Beweismittels
    für die Urteilsfällung nicht nur wesentlich, sondern notwendig, also unerlässlich ist. Zweck der Bestimmung
    ist also, dass sich das Gericht von einer Person einen unmittelbaren Eindruck verschaffen kann, d.h.
    über deren Zuverlässigkeit oder Glaubwürdigkeit (BSK StPO2-HAURI/VENETZ, Art. 343 N 19).  Hier geht
    es hauptsächlich um Personalbeweise und dort um die Situation „Aussage gegen Aussage“ bzw. um sog.
    Vier-Augen-Delikte geht (Urteil 6B_139/2013 vom 20. Juni 2013 E. 1.3.2 m.H.; BGer, Urteil 1B_188/2012
    vom 19. April 2012 E. 3.6). Eine unmittelbare Abnahme eines Beweismittels ist notwendig im Sinne von
    Art. 343 Abs. 3 StPO, wenn sie den Ausgang des Verfahrens beeinflussen kann (BGE 140 IV 196 E. 4.4.2).  Insb.
    Verfahren, bei denen die Aussagen eines Zeugen oder Opfers fast den einzigen Beweis darstellt, hier
    ist der persönliche Eindruck zur Feststellung der Glaubwürdigkeit dieser Person entscheidend (BSK
    StPO2 STEPHENSON/ZALUNARDO-WALSER, Art. 331 N 8; so auch BSK StPO2 HAURI/VENETZ, Art. 343 N 21 m.w.H.).
    Bei Nico handelt es sich um den Hauptbelastungszeugen/Opfer. Mit Blick auf die zentrale und streitige
    Frage nach der Schussrichtung liegt eine „Aussage gegen-Aussage“-Situation vor, welche auch mangels
    weiterer Beweise, wie z.B. Zeugen, nicht geklärt werden kann. Die Aussagen von Nico als Hauptbelastungszeuge/Opfer
    können deshalb den Verfahrensausgang beeinflussen, weshalb (auch hinsichtlich der Schwere der Tatvorwürfe)
    eine unmittelbare Beweisabnahme durch das Gericht für die Urteilsfällung im Sinne von Art. 343 Abs.
    3 StPO als notwendig, also als unerlässlich erscheint. Die Voraussetzungen von Art. 343 Abs. 3 StPO
    sind daher erfüllt. Die Vorgehensweise des Bezirksgerichtes Zürich ist nicht korrekt, zumal das Gericht
    auch Nico hätte vorladen und einvernehmen müssen.'
  rubric:
  - Beschränktes Unmittelbarkeitsprinzip nach Art. 343 Abs. 3 StPO Art. 343 Abs. 3 StPO verpflichtet das
    Gericht im Vorverfahren ordnungsgemäss erhobene Beweise nochmals zu erheben, sofern die unmittelbare
    Kenntnis des Beweismittels für die Urteilsfällung notwendig erscheint (sog. beschränktes Unmittelbarkeitsprinzip)
    (SCHMID/JOSITSCH, Praxiskommentar3, Art. 343 N 1; SCHMID/JOSITSCH, Handbuch3, N. 1329).
  - '(Korrekturhinweis: Volle Punktzahl nur bei Erwähnen auch des generell geltenden Unmittelbarkeitsprinzips)  Das
    Gericht verfügt jedoch bei der Frage, ob eine erneute Beweisabnahme bzw. die unmittelbare Kenntnis
    erforderlich ist, über einen Ermessensspielraum (BGer, Urteil 6B_970/2013 vom 24. Juni 2014 E. 2.1
    m.H.). Das Gericht ist gemäss Abs. 3 aber nur dann verpflichtet, wenn die unmittelbare Kenntnis des
    Beweismittels für die Urteilsfällung nicht nur wesentlich, sondern notwendig, also unerlässlich ist.'
