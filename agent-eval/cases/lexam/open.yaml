  question: "Y ist in der Stadt St. Gallen als gelernte Coiffeuse bei der X-AG angestellt. In ihrem Arbeits-\n\
    vertrag ist ein Konkurrenzverbot enthalten, das Y nach Beendigung des Arbeitsverhältnisses\nwährend\
    \ fünf Jahren jede Konkurrenzierung der X-AG in der Stadt St. Gallen verbietet. Für\nden Fall der\
    \ Verletzung des Konkurrenzverbots sieht die Klausel vor, dass Y neben Scha-\ndenersatz eine Konventionalstrafe\
    \ von Fr. 10‘000.— schuldet. Nach anhaltenden internen\nSpannungen mit dem Chef kündigt Y das Arbeitsverhältnis\
    \ ordentlich auf den 31. Mai 2016.\nAn einem ihrer letzten Arbeitstage informiert Y zwei Kundinnen\
    \ darüber, dass sie am 1. Juni\n2016 gleich um die Ecke ihr eigenes Coiffeurgeschäft auftun werde.\
    \ Sie steckt den beiden\nKundinnen je eine Visitenkarte ihres eigenen Salons zu und ermuntert sie,\
    \ doch inskünftig\nbei ihr die Haare schneiden zu lassen. Durch einen Zufall erfährt die X-AG davon\
    \ und will\ngegen Y vorgehen. Diese eröffnet am 1. Juni 2016 tatsächlich ihr eigenes Coiffeurgeschäft\n\
    (Bemerkung: Gehen Sie davon aus, dass kein Gesamtarbeitsvertrag zur Anwendung\nkommt). \nDie X-AG\
    \ überlegt sich, neben der Konventionalstrafe auch ein gerichtliches Verbot\neinzuklagen, mit dem\
    \ Y die Tätigkeit in ihrem Geschäft verboten werden soll. Mit Aus-\nsicht auf Erfolg?"
  reference: Nein, da Beseitigungsanspruch in Konkurrenzklausel nicht vorgesehen; Art. 340b Abs. 3 OR
  rubric:
  - Nein, da Beseitigungsanspruch in Konkurrenzklausel nicht vorgesehen; Art. 340b Abs. 3 OR
