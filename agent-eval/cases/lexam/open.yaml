  question: "Die 20-jährige Anna macht ein Selfie und stellt es auf Instagram. Das Selfie zeigt ihren\
    \ Kopf in der Abenddämmerung, wobei sie den perfekten Moment und Winkel gewählt hat, sodass das Rot\
    \ der Abenddämmerung sehr schön mit dem Rot ihrer Lippen harmoniert. Annas gleichaltriger Ex-Freund\
    \ Peter kopiert dieses Selfie und macht daraus mit Photoshop ein neues Bild. Nämlich unterlegt er\
    \ dem Kopf von Anna relativ plump ein im Internet gefundenes Foto, welches – mit Fokus auf die Geschlechtsteile\
    \ – einen nackten Frauenkörper zeigt. Das von ihm so geschaffene Bild stellt Peter in den «Whats app»-Chat\
    \ seines Fussballvereins, in dem auch viele unter 16-Jährige teilnehmen. Dazu schreibt er: «Das hat\
    \ Anna davon, dass sie mich verlassen hat.» Gegen Peter wird ein Verfahren wegen Zugänglichmachens\
    \ von Pornografie an unter \n16-Jährige eröffnet. In diesem Verfahren macht Peter geltend, bei seinem\
    \ Bild handle es \nsich um Kunst und nicht um Pornografie. Zudem bringt er vor, dass das Verfahren\
    \ \ngegen ihn der europäischen Menschenrechtskonvention (EMRK) zuwiderlaufe. Anna geht gegen Peter\
    \ zivilrechtlich vor und verklagt ihn wegen \nPersönlichkeitsverletzung. Auch in diesem Verfahren\
    \ beruft sich Peter auf die \nKunstfreiheit. Er habe mit dem Bild seine Trennung zu Anna künstlerisch\
    \ verarbeitet. Weil Peter Annas Selfie verwendete, geht sie gegen ihn auch wegen Verletzung des \n\
    Urheberrechtsgesetzes vor. In diesem Verfahren bringt Peter vor, bei Annas Selfie \nhandle es sich\
    \ nicht um ein Werk im Sinne des Urheberrechtsgesetzes. Beurteilen Sie \ndieses Argument von Peter\
    \ anhand der in der Vorlesung besprochenen \nBundesgerichtsurteile zur Werkqualität von Fotografien.\
    \ \nMachen Sie zudem eine kurze Einschätzung, wie hoch die Bedeutung dieser Bundesgerichtsurteile\
    \ in Zukunft sein wird."
  reference: In den Entscheiden „Bob Marley“ und „Christoph Meili“ stellte das Bundesgericht fest, dass
    sich die Werkqualität bzw. Individualität einer Fotografie aus deren Gestaltung ergeben müsse und
    nicht schon bei der Wahl eines einmaligen Motivs, etwa einem historischen Ereignis, gegeben sei. (1)
    Dabei könne sich die Werkqualität etwa aus dem Aufnahmewinkel, der Beleuchtung oder auch dem Zeitpunkt
    des Auslösens der Bildaufnahme zeigen. (1) Vorliegend hat Anna für ihr Selfie den perfekten Moment
    und Winkel gewählt, sodass das Rot der Abenddämmerung sehr schön mit dem Rot ihrer Lippen harmoniert.
    (1) Somit dürfte es sich dabei gemäss der oben zitierten Rechtsprechung um ein Werk im Sinne des Urheberrechtsgesetzes
    handeln. (1) Im Rahmen der laufenden Urheberrechtsrevision hat das Parlament beschlossen, dass bei
    Fotografien in Zukunft auf das Erfordernis des individuellen Charakters verzichtet werden soll. (1)
    Damit sind in Zukunft auch Schnappschüsse ohne Weiteres urheberrechtlich geschützt. Die bundesgerichtliche
    Rechtsprechung zur Werkqualität von Fotografien dürfte demzufolge in Zukunft keine Bedeutung mehr
    haben. (1)
  rubric:
  - In den Entscheiden „Bob Marley“ und „Christoph Meili“ stellte das Bundesgericht fest, dass sich die
    Werkqualität bzw. Individualität einer Fotografie aus deren Gestaltung ergeben müsse und nicht schon
    bei der Wahl eines einmaligen Motivs, etwa einem historischen Ereignis, gegeben sei.
  - (1) Dabei könne sich die Werkqualität etwa aus dem Aufnahmewinkel, der Beleuchtung oder auch dem Zeitpunkt
    des Auslösens der Bildaufnahme zeigen. (1) Vorliegend hat Anna für ihr Selfie den perfekten Moment
    und Winkel gewählt, sodass das Rot der Abenddämmerung sehr schön mit dem Rot ihrer Lippen harmoniert.
  - (1) Somit dürfte es sich dabei gemäss der oben zitierten Rechtsprechung um ein Werk im Sinne des Urheberrechtsgesetzes
    handeln. (1) Im Rahmen der laufenden Urheberrechtsrevision hat das Parlament beschlossen, dass bei
    Fotografien in Zukunft auf das Erfordernis des individuellen Charakters verzichtet werden soll.
  - (1) Damit sind in Zukunft auch Schnappschüsse ohne Weiteres urheberrechtlich geschützt. Die bundesgerichtliche
    Rechtsprechung zur Werkqualität von Fotografien dürfte demzufolge in Zukunft keine Bedeutung mehr
    haben. (1)
