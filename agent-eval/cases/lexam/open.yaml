  question: Nennen Sie zwei Arten, auf welche sich eine Bank refinanzieren kann?
  reference: Eine Bank refinanziert sich namentlich durch Kundeneinlagen oder über den Kapitalmarkt, z.B.
    durch die Ausgabe von Anleihen oder Bonds, oder durch Eigenkapital.
  rubric:
