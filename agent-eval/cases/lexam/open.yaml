  question: "Das Hauptbuchblatt von Grundstück Nr. 200, das im Eigentum von Emil (E) steht, weist u.a.\
    \ folgenden Inhalt auf: - - - Reglement der Stockwerkeigentümergemeinschaft, dat. 10.3.2021 CHF 400'000.00\
    \ Registerschuldbrief z.G. Zürcher Kantonalbank, dat. 23.6.1999, MZ 8%, I. Pfandstelle Last: Nutzniessungsrecht\
    \ z.G. Berta Müller, geb. 1956, dat. 1.12.2018 Nun möchte Emil, um den Umbau des Gebäudes auf seinem\
    \ Grundstück zu finanzieren, den Schuldbrief von CHF 400'000.00 auf CHF 500'000.00 erhöhen. Die Zürcher\
    \ Kantonalbank (ZKB) ist grundsätzlich einverstanden, formuliert aber einen Vorbehalt bezüglich der\
    \ Rang verhältnisse. \nWorin besteht der Vorbehalt der Zürcher Kantonalbank?"
  reference: 'Der Rang eines beschränkten dinglichen Rechts wird grundsätzlich nach dem Prinzip der Alterspriorität
    bestimmt.54 Nach diesem Prinzip geht das im Grund buch früher eingetragene Recht dem später eingetragenen
    Recht vor («prior tem pore, potior iure»).55 Gemäss Art. 972 Abs. 1 ZGB entstehen und erhalten ding
    liche Rechte ihren Rang und ihr Datum durch die Eintragung in das Hauptbuch. Das Datum wird aber durch
    die Einschreibung im Tagebuch festgelegt (Art. 972 Abs. 2 ZGB).56 Das Prinzip der Alterspriorität
    erfasst auch die Vormerkungen, nicht aber die Anmerkungen.57 Nach dem System der festen Pfandstelle
    gemäss Art. 813 ff. ZGB stehen Grund pfandrechte immer auf einer besonderen Pfandstelle bzw. einem
    besonderen Rang. Ihr Rang untereinander bestimmt sich also nicht nach dem Prinzip der Al terspriorität.58
    Das System der festen Pfandstelle ist vorliegend nicht einschlägig, da auf dem Hauptbuchblatt nicht
    verschiedene Pfandrechte, sondern verschiedene beschränkte dingliche Rechte eingetragen sind. Das
    Rangverhältnis zwischen einem Grundpfandrecht und einer Dienstbarkeit richtet sich nach dem Prinzip
    der Alterspriorität. Die chronologische Reihenfolge präsentiert sich wie folgt: • CHF 400’000.00 Registerschuldbrief
    z.G. Zürcher Kantonalbank, dat. 23.6.1999, MZ 8%, I. Pfandstelle • Last: Nutzniessungsrecht z.G. Berta
    Müller, geb. 1956, dat. 1.12.2018 • Reglement der Stockwerkeigentümergemeinschaft, dat. 10.3.2021
    Vorliegend wurde das Reglement der Stockwerkeigentümergemeinschaft ange merkt (Art. 712g Abs. 3 ZGB,
    Art. 649a Abs. 2 ZGB).59 Aufgrund der (lediglich) deklaratorischen Wirkung der vorliegenden Anmerkung
    nimmt diese nicht am Rangverhältnis teil. Bei Erhöhung des Schuldbriefs würde dieser im Umfang von
    CHF 400’000.– dem Nutzniessungsrecht von Berta Müller vorgehen, der zusätzliche Betrag von CHF 100’0000.–
    würde dem Nutzniessungsrecht aber nachgehen. Diesbezüglich würde also ein gebrochener Rang entstehen,
    welcher im Grundbuch nicht einge tragen werden kann.60'
  rubric:
  - 'Der Rang eines beschränkten dinglichen Rechts wird grundsätzlich nach dem Prinzip der Alterspriorität
    bestimmt.54 Nach diesem Prinzip geht das im Grund buch früher eingetragene Recht dem später eingetragenen
