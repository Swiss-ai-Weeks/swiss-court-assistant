  question: "Herr X ist zu 60 % bei der Y GmbH angestellt. Nach einem anstrengenden Arbeitstag möchte\
    \ er zuhause etwas entspannen. Er trinkt zunächst einige Gläser Wein und später eine grosse Menge\
    \ Gin Tonic. Da er sich nach dem Alkoholkonsum noch nicht genügend entspannt fühlt, steigt er in die\
    \ Badewanne und will sich ein Bad einlaufen lassen. Beim Verschliessen des Ab flusses mit dem Badewannenstöpsel\
    \ verliert er das Gleichgewicht und rutscht in der Badewanne aus, wobei er den Wasserhahn streift\
    \ und ungewollt auf die heisseste Stufe reisst. Er stösst sich den Kopf am Wannenrand und bleibt benommen\
    \ – aber nicht bewusstlos – in der Badewanne liegen, während das heisse Wasser in die Wanne läuft.\
    \ Erst ungefähr zwei Stunden nach dem Vorfall findet ihn sein Sohn in der Wanne und kann ihm heraushelfen.\
    \ Herr X hat sich beim beschriebenen Vorfall starke Verbrühungen an einem Viertel seines Kör pers\
    \ zugezogen. Im Spital wurde zudem festgestellt, dass Herr X beim Eintritt in die Notfallab teilung\
    \ eine Blutalkoholkonzentration von 2.8 Promille aufgewiesen hatte. Der Sohn von Herrn X benachrichtigte\
    \ die Unfallversicherung seines Vaters und erklärte den Vorfall. Die Unfallversicherung verneint ihre\
    \ Leistungspflicht mit einer Verfügung. Nach ihrer Ansicht liegt kein Unfall im Rechtssinn vor. \n\
    Zu welchem Schluss kommen Sie, wenn Sie das Vorliegen eines Unfalls umfassend prüfen?"
  reference: 'Prüfung Unfall Nach Art. 4 ATSG ist ein Unfall «die plötzliche, nicht beabsichtigte schädigende
    Einwirkung eines ungewöhnlichen äusseren Faktors auf den menschlichen Körper, die eine Beeinträch
    tigung der körperlichen, geistigen oder psychischen Gesundheit oder den Tod zur Folge hat». Sämtliche
    Tatbestandselemente müssen kumulativ erfüllt sein. Plötzliche Einwirkung Das Kriterium der Plötzlichkeit
    grenzt den Zeitrahmen der schädigenden Einwirkung ein. Letztere muss nicht auf einen blossen Augenblick
    beschränkt sein, jedoch innerhalb eines relativ kurzen und abgrenzbaren Zeitraums erfolgen. Eine zeitliche
    Maximaldauer wurde durch die Rechtsprechung bisher nicht festgelegt. Die Einwirkung muss aber plötzlich
    ein gesetzt haben und einmalig sein. Herr X lag rund zwei Stunden im heissen Wasser. Allerdings führt
    heisses Wasser innert sehr kurzer Zeit bereits zu Verbrühungen. Das heisse Wasser kann zudem als einzelner
    Faktor qualifiziert werden. Dass Herr X alkoholisiert war, und deshalb nicht aus dem Wasser steigen
    konnte, schliesst die Plötzlichkeit nicht aus. Die lange Aufenthaltsdauer im Wasser kann für den Grad
    der Verbrühungen von Bedeutung sein, beeinflusst aber nicht die Plötzlichkeit.  Das Element der Plötzlichkeit
    ist zu bejahen. Keine Absicht Wer sich absichtlich (mit Wissen und Willen) einen Gesundheitsschaden
    zufügt, erleidet keinen Unfall im Rechtssinn. Die Absicht bezieht sich auf den durch die Handlung
    bezweck ten Gesundheitsschaden selbst und nicht auf die zur schädigenden Einwirkung führende Handlung.  Herr
    X wollte sich nicht verletzen. Deshalb ist auch dieses Element zu bejahen. Äusserer Faktor Ein Ereignis
    ausserhalb des Körpers muss auf diesen einwirken. Eine rein Körperinnere Ur sache des Gesundheitsschadens
    stellt keinen äusseren Faktor dar. Der äussere Faktor ist also das Gegenstück zur inneren Ursache,
    welche den Krankheitsbegriff definiert. Die Ursache der Verbrühungen von Herrn X. war sehr heisses
    Wasser. Das Wasser kommt aus dem Wasserhahn und ist damit zweifellos eine äussere Ursache. Das Element
    des äusseren Faktors ist zu bejahen. Ungewöhnlichkeit des äusseren Faktors Die Ungewöhnlichkeit bezieht
    sich nicht auf die Wirkung des äusseren Faktors, sondern nur auf diesen selber. Der äussere Faktor
    ist ungewöhnlich, wenn er – nach einem objektiven Massstab – nicht mehr im Rahmen dessen liegt, was
    für den jeweiligen Lebensbereich all täglich und üblich ist.  Die normale Einwirkung von Wasser auf
    den menschlichen Körper stellt grundsätzlich kei nen ungewöhnlichen äusseren Faktor dar. Heisses Wasser
    kann aber, je nach Temperatur, Einwirkungszeit und Umstände der Einwirkung einen ungewöhnlichen äusseren
    Faktor bil den. Herr X ist in die Badewanne gestürzt und hat den Wasserhahn auf die heisseste Stufe
    gerissen. Das Wasser war so heiss, dass es geeignet war, bei Herrn X starke Verbrühungen zu verursachen.
    Die ungewöhnlich hohe Temperatur des Wassers macht den alltäglichen Vorgang zu einem einmaligen Vorfall.
    Die Unfähigkeit des alkoholisierten Herrn X, sich aus seiner Lage zu befreien, schliesst die Ungewöhnlichkeit
    nicht aus.  Der Faktor der Ungewöhnlichkeit ist zu bejahen. Gesundheitsschaden/Tod Das Unfallereignis
    muss den Gesundheitsschaden oder den Tod bewirken, also für die Folge natürlich und adäquat kausal
    sein.  (Natürliche Kausalität: Ursachen im Sinne des natürlichen Kausalzusammenhangs sind alle Umstände,
    ohne deren Vorhandensein der eingetretene Erfolg nicht als eingetreten oder nicht als in der gleichen
    Weise bzw. nicht zur gleichen Zeit eingetreten gedacht werden kann (conditio sine qua non). Adäquate
    Kausalität: Ein Ereignis hat dann als adäquate Ursache eines Erfolges zu gelten, wenn es nach dem
    gewöhnlichen Lauf der Dinge und nach der allgemeinen Lebenserfah rung an sich geeignet ist, einen
    Erfolg von der Art des eingetretenen herbeizuführen, der Eintritt dieses Erfolges also durch das Ereignis
    allgemein als begünstigt erscheint.)  Herr X erleidet starke Verbrühungen an einem Viertel seines
    Körpers. Die Verbrühungen sind auf das Einlaufen des Wassers zurückzuführen. Die natürliche Kausalität
    ist daher ge geben. Die Rechtsprechung anerkennt als adäquat kausal auch aussergewöhnliche Kausal
    verläufe, die objektiv nicht voraussehbar und grundsätzlich inadäquat sind, sofern ein Er eignis an
    sich geeignet ist, einen Erfolg von der Art des eingetretenen herbeizuführen. Die adäquate Kausalität
    kann hier bejaht werden, da Herr X’s Sturz in Kombination mit dem Einlaufen des heissen Wassers in
    die Wanne an sich geeignet ist, Verbrühungen herbeizu führen. Die umfassende Prüfung des Vorfalls
    ergibt, dass ein Unfall im Rechtssinn zu bejahen ist.'
