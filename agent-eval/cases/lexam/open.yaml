  question: "E. plant, die Ausbildung zur Polizistin anzutreten und informiert sich über die Modalitäten.\
    \ Im \nPolizeigesetz des Kantons Y. findet sie folgende Bestimmung: \nArt. 35 Personalrecht \n(…)\
    \ \n2 Für Angehörige der Kantonspolizei besteht eine kantonale Wohnsitzpflicht; Angehörige der \n\
    Kantonspolizei haben zwingend im Kanton Y. zu wohnen. \n(…) \nWas ist Sinn und Zweck einer solchen\
    \ Bestimmung? Welche Konflikte ergeben sich aus grundrechtlicher Sicht?"
  reference: 'o Der (kantonalen) Wohnsitzpflicht für Polizistinnen und Polizisten liegen zum einen einsatztaktische
    Motive zugrunde. Es kann unter Umstän den – etwa bei Grossereignissen –, angezeigt sein, dass die
    Polizeiangehörigen in der Nähe des Geschehens grundsätzlich verfügbar sind und somit eine schnelle
    Einsatzbereitschaft gewährleistet ist. Weiter kommt durch die Wohnsitzpflicht für Polizeiangehörige
    in dem Kanton, in dem sie arbeiten, auch eine Bürgernähe und gewisse Verbundenheit mit dem Gemeinwesen
    zum Ausdruck. (5) o Grundrechtliches Konfliktpotenzial ergibt sich primär hinsichtlich der in Art.
    24 BV statuierten Niederlassungsfreiheit: Eine Wohnsitzpflicht greift in diese ein. Polizeiangehörigen
    ist es mit der Regelung faktisch untersagt, ausserkantonalen Wohnsitz zu nehmen. Personen ohne Wohnsitz
    im betreffenden Kanton werden nicht zur Polizeiausbildung zugelassen. (3) o Die Nennung der Wirtschaftsfreiheit
    (Art. 27 BV) und des Rechts auf Achtung des Familienlebens (Art. 13 Abs. 1 BV) resp. des Rechts auf
    Schutz der Privatsphäre als mögliche Konfliktfelder wurden ebenfalls bepunktet. (je 1)'
  rubric:
  - o Der (kantonalen) Wohnsitzpflicht für Polizistinnen und Polizisten liegen zum einen einsatztaktische
    Motive zugrunde. Es kann unter Umstän den – etwa bei Grossereignissen –, angezeigt sein, dass die
    Polizeiangehörigen in der Nähe des Geschehens grundsätzlich verfügbar sind und somit eine schnelle
    Einsatzbereitschaft gewährleistet ist.
  - 'Weiter kommt durch die Wohnsitzpflicht für Polizeiangehörige in dem Kanton, in dem sie arbeiten,
    auch eine Bürgernähe und gewisse Verbundenheit mit dem Gemeinwesen zum Ausdruck. (5) o Grundrechtliches
    Konfliktpotenzial ergibt sich primär hinsichtlich der in Art. 24 BV statuierten Niederlassungsfreiheit:
    Eine Wohnsitzpflicht greift in diese ein.'
  - Polizeiangehörigen ist es mit der Regelung faktisch untersagt, ausserkantonalen Wohnsitz zu nehmen.
    Personen ohne Wohnsitz im betreffenden Kanton werden nicht zur Polizeiausbildung zugelassen.
  - (3) o Die Nennung der Wirtschaftsfreiheit (Art. 27 BV) und des Rechts auf Achtung des Familienlebens
    (Art. 13 Abs. 1 BV) resp. des Rechts auf Schutz der Privatsphäre als mögliche Konfliktfelder wurden
    ebenfalls bepunktet. (je 1)
