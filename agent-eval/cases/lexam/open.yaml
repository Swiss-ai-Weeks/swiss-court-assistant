  question: "Arthur (A) ist als Eigentümer von Grundstück Nr. 100 im Grundbuch eingetragen, auf dem ein\
    \ kleineres Einfamilienhaus steht; er selbst wohnt, weil er schon älter ist und Unterstützung braucht,\
    \ bei seiner Tochter. Er überträgt das Eigentum am Grundstück Nr. 100 auf Beat (B), indem er mit diesem\
    \ gestützt auf eine unabhängige Verkehrswertschätzung zu einem angemes senen Kaufpreis einen öffentlich\
    \ beurkundeten Kaufvertrag abschliesst und die Grundbuchan meldung unterzeichnet. Gestützt auf den\
    \ Kaufvertrag und die Grundbuchanmeldung vom 3. Ja nuar 2023 wird Beat unter demselben Datum entsprechend\
    \ der eingereichten Anmeldung samt Belegen korrekt als Eigentümer von Grundstück Nr. 100 im Grundbuch\
    \ eingetragen. Arthur, der ausgesprochen rüstig ist und im zwischenmenschlichen Umgang keine Auffälligkeiten\
    \ zeigt, hat gegenüber dem Notar und gegenüber Beat verschwiegen, dass im November 2022 ihm gegenüber\
    \ eine erwachsenenschutzrechtliche Massnahme ergangen ist, welche am 15. De zember 2022 in Rechtskraft\
    \ erwachsen ist: Seine Handlungsfähigkeit ist durch eine Vertre tungsbeistandschaft eingeschränkt,\
    \ und die Verfügung über das Grundstück Nr. 100 wurde ihm vollständig untersagt (Art. 394 f., insbesondere\
    \ Art. 395 Abs. 4 ZGB). Beat schliesst am 9. Januar 2023 mit seiner neuen Nachbarin Martha (M) einen\
    \ öffentlich be urkundeten Vertrag, in dem er ihr als Personaldienstbarkeit gemäss Art. 781 ZGB für\
    \ 20 Jahre ein Parkplatzbenützungsrecht auf Grundstück Nr. 100 einräumt, das Martha mit jährlichen\
    \ Zah lungen von CHF 2'400 entschädigt. Die Personaldienstbarkeit wird noch am 9. Januar 2023 dem\
    \ Grundbuchamt zur Eintragung auf Grundstück Nr. 100 angemeldet und unter demselben Datum entsprechend\
    \ der eingereichten Anmeldung samt Belegen korrekt im Hauptbuch einge tragen. Am 15. Januar 2023 wird\
    \ dem Grundbuchamt für Grundstück Nr. 100 eine Vertretungs beistandschaft für Arthur angemeldet. \n\
    Besteht seitens von Arthur bzw. der KESB eine Möglichkeit, die Eintragung der beiden Rechtsgeschäfte\
    \ (Eigentumsübertragung an Beat und Einräumung des Parkplatzbenüt zungsrechts an Martha) im Grundbuch\
    \ zu korrigieren? Wenn ja, mit welchem Instru ment? Wird das gelingen? (Die Frage ist ausschliesslich\
    \ aus der Perspektive des Grund buchrechts zu beantworten; erwachsenenschutzrechtliche und zivilprozessuale\
    \ Aspekte sind nicht darzustellen.)"
  reference: 'I. Eigentumsübertragung an B: Grundbuchberichtigungsklage Als Rechtsbehelf ist hier die
    Grundbuchberichtigungsklage gemäss Art. 975 ZGB zu prüfen. Die Grundbuchberichtigungsklage ist wie
    folgt geregelt (Abs. 1): Ist der Eintrag eines dinglichen Rechtes ungerechtfertigt oder ein richtiger
    Eintrag in ungerechtfertigter Weise gelöscht oder verändert worden, so kann jedermann, der dadurch
    in seinen dinglichen Rechten verletzt ist, auf Löschung oder Abänderung des Eintrages klagen. 1. Klagegrund
    Der Klagegrund ist gegeben, wenn die materiell-rechtliche Rechtslage und die Rechtslage, wie sie sich
    aus dem Grundbuch ergibt, nicht übereinstimmen.7 Ungerechtfertigt i.S.v. (Art. 975 i.V.m.) Art. 974
    Abs. 2 ZGB ist ein Grundbuch eintrag dann, wenn der Eintrag ohne Rechtsgrund oder aus einem unverbindlichen
    Rechtsgeschäft erfolgt ist.8 Dies ist Ausdruck des Kausalitätsprinzips,9 wonach die Gültigkeit des
    sachenrechtlichen Verfügungsgeschäfts von der Gültigkeit des zugrunde liegenden Verpflichtungsgeschäfts,
    also des Rechtsgrunds, abhängig ist.10 Ungerechtfertigt ist ein Grundbucheintrag auch dann, wenn diesem
    – im Geltungsbereich des absoluten Eintragungsprinzips – eine ungültige Verfügung zugrunde liegt.11
    Eine ungültige Verfügung liegt etwa bei fehlender Handlungs fähigkeit der anmeldenden Person vor.12
    Der fehlerhafte Grundbucheintrag muss (grundsätzlich) von Anfang an unge rechtfertigt gewesen sein;13
    allerdings kommt die Grundbuchberichtigungsklage in wenigen Ausnahmefällen auch in Betracht, wenn
    der Eintrag erst nachträglich unrichtig wird.14 Vorliegend wurde die Handlungsfähigkeit von A im November
    2022 durch die Errichtung einer Vertretungsbeistandschaft eingeschränkt, wobei ihm die Verfü gung
    über das Grundstück Nr. 100 untersagt wurde. Der Kaufvertrag vom 3. Ja nuar 2023 konnte mangels diesbezüglicher
    Handlungsfähigkeit seitens A nicht gültig zustande kommen (Art. 18 ZGB). Mangels Handlungsfähigkeit
    konnte A zudem keine gültige Verfügung vorneh men, weshalb sich neben dem Rechtsgrund auch die Anmeldung,
    also das Verfü gungsgeschäft, als ungültig erweist. B hat folglich kein Eigentum an Grundstück Nr.
    100 erworben. Der Grundbucheintrag der Eigentümerstellung von B war von Anfang an unge rechtfertigt.
    Die Diskrepanz zwischen der materiell-rechtlichen Rechtslage und dem Rechtsschein gemäss Grundbucheintrag
    ist – unter Vorbehalt noch zu prü fender Einwendungen von B (vgl. Ziff. 6) – zu bejahen. 2. Aktivlegitimation
    Zur Erhebung der Grundbuchberichtigungsklage ist aktivlegitimiert, wer wegen der durch das Grundbuch
    ausgewiesenen Rechtslage in seinen dinglichen (oder vorgemerkten) Rechten beeinträchtigt bzw. verletzt
    ist.15 Vorliegend ist A gemäss materiell-rechtlicher Rechtslage immer noch Eigentü mer von Grundstück
    Nr. 100; der Grundbucheintrag weist ihn indes nicht als Eigentümer aus. Also kann A bzw. seine gesetzliche
    Vertretung trotz der Eigen tümerstellung von A nicht über das Grundstück Nr. 100 verfügen. A ist somit
    durch die Eintragung der Eigentumsübertragung an B in seinem dinglichen Recht, dem Eigentum, verletzt.
    Die Aktivlegitimation von A bzw. seiner gesetzlichen Vertretung ist zu bejahen. 3. Passivlegitimation
    Passivlegitimiert ist, wer aus dem Grundbucheintrag als dinglich berechtigt er scheint bzw. durch
    den ungerechtfertigten Eintrag direkt oder indirekt profitiert.16 Durch den ungerechtfertigten Eintrag
    der Eigentumsübertragung erlangt B einen Vorteil, indem der Grundbucheintrag ihn als Eigentümer von
    Grundstück Nr. 100 ausweist. B ist daher passivlegitimiert. 4. Begehren Die Grundbuchberichtigungsklage
    ist als Feststellungsklage konzipiert. Die kla gende Partei beantragt sowohl die Feststellung des
    geltend gemachten dinglichen Rechts als auch die Berichtigung des Grundbucheintrags.17 A bzw. seine
    gesetzliche Vertretung hat gerichtlich feststellen zu lassen, dass A Eigentümer von Grundstück Nr.
    100 ist, und zu verlangen, dass A wieder als Eigentümer einzutragen sei. 5. Klagefrist Die Grundbuchberichtigungsklage
    unterliegt als dingliche Klage keiner Verjäh rung.18 6. Einwendungen von B 6.1 Öffentlicher Glaube
    des Grundbuchs Weiter muss das Rechtsgeschäft darauf gerichtet sein, dass eine Drittperson Eigentum
    bzw. ein beschränktes dingliches Recht erwerben soll.21 Bei B handelt es sich nicht um eine Drittperson,
    weil er als Käufer des Grund stücks Nr. 100 direkt an der ungerechtfertigt eingetragenen Eigentumsübertra
    gung beteiligt gewesen ist. Entsprechend ist Art. 973 Abs. 1 ZGB vorliegend nicht einschlägig. 6.2
    Ersitzung Die Grundbuchberichtigungsklage hat keinen Erfolg, sofern die zu Unrecht ein getragene Person
    das Grundstück ersessen hat.22 Nach Art. 661 ZGB kann das Eigentum desjenigen, der ungerechtfertigt
    im Grundbuch als Eigentümer einge tragen ist, nicht mehr angefochten werden, wenn er das Grundstück
    in gutem Glauben zehn Jahre lang ununterbrochen und unangefochten besessen hat. Vorliegend sind seit
    der Grundbucheintragung noch keine zehn Jahre vergangen, weshalb sich B nicht auf die ordentliche
    Ersitzung berufen kann. 7. Ergebnis Im vorliegenden Fall sind alle Klagevoraussetzungen erfüllt; A
    bzw. die KESB wird mit der Grundbuchberichtigungsklage durchdringen. A wird folglich wieder als Eigentümer
    von Grundstück Nr. 100 im Grundbuch eingetragen. 8. Abgrenzung 8.1 Abgrenzung zur Grundbuchbeschwerde
    (Art. 956a ZGB) Gemäss Art. 956a Abs. 3 ZGB kann gegen eine im Hauptbuch vollzogene Eintra gung, Änderung
    oder Löschung von dinglichen Rechten oder Vormerkungen keine Beschwerde mehr geführt werden. Vorliegend
    kommt eine Grundbuchbeschwerde nicht infrage, weil die Eigen tumsübertragung bereits im Grundbuch
    eingetragen ist. 8.2 Abgrenzung zur Berichtigung (Art. 977 ZGB) Ein Eintrag kann gemäss Art. 977 ZGB
    dann berichtigt werden, wenn eine Dis krepanz zwischen der mängelfreien Anmeldung bzw. den zugehörigen
    Belegen und dem vollzogenen Grundbucheintrag besteht.23 Vorliegend erfolgte die Eintragung der Eigentumsübertragung
    entsprechend der Anmeldung samt Belegen korrekt, weshalb die Berichtigung nicht einschlägig ist.II.
    Einräumung des Parkplatzbenützungsrechts an M: Grundbuchberich tigungsklage Hier ist wiederum zu prüfen,
    ob A bzw. die KESB mit der Grundbuchberichti gungsklage gemäss Art. 975 ZGB durchzudringen vermag.
    1. Klagegrund Vgl. zu den theoretischen Ausführungen betreffend den Klagegrund oben I.1. Wer nicht
    Eigentümer des zu belastenden Grundstücks ist, kann dennoch rechts gültig ein Verpflichtungsgeschäft
    abschliessen.24 Vorliegend konnte B den Dienstbarkeitsvertrag mit M also gültig abschliessen. Nachdem
    B aber nicht Eigentümer des Grundstücks Nr. 100 geworden ist, konnte er über dieses nicht verfügen.
    Das Verfügungsgeschäft – also die Anmeldung der Personaldienstbarkeit beim Grundbuchamt – erweist
    sich somit als ungültig. Die Personaldienstbarkeit ist im Ergebnis mangels Verfügungsberechtigung
    von B nicht gültig entstanden. Der Grundbucheintrag der Personaldienstbarkeit war von Anfang an ungerechtfertigt.
    Entsprechend ist eine Diskrepanz zwischen der materiell-rechtlichen Rechtslage und dem Rechtsschein
    des Grundbucheintrags – unter Vorbehalt noch zu prüfender Einwendungen von M (vgl. Ziff. 6) – zu beja
    hen. 2. Aktivlegitimation Zur Erhebung der Grundbuchberichtigungsklage ist aktivlegitimiert, wer wegen
    der durch das Grundbuch ausgewiesenen Rechtslage in seinen dinglichen (oder vorgemerkten) Rechten
    beeinträchtigt bzw. verletzt ist.25 A, welcher immer noch Eigentümer des Grundstücks Nr. 100 ist,
    wird durch die Eintragung der Personaldienstbarkeit in seinem dinglichen Recht, dem Eigentum, eingeschränkt
    und somit verletzt. A bzw. die KESB ist aktivlegitimiert. 3. Passivlegitimation Passivlegitimiert
    ist, wer aus dem Grundbucheintrag als dinglich berechtigt er scheint bzw. durch den ungerechtfertigten
    Eintrag direkt oder indirekt profitiert.26 Durch den ungerechtfertigten Eintrag der Personaldienstbarkeit
    erlangt M einen Vorteil, indem der Grundbucheintrag sie als Dienstbarkeitsberechtigte ausweist. M
    ist daher passivlegitimiert. 4. Begehren Die Grundbuchberichtigungsklage ist als Feststellungsklage
    konzipiert. Die kla gende Partei beantragt sowohl die Feststellung des geltend gemachten dinglichen
    Rechts als auch die Berichtigung des Grundbucheintrags.27 A bzw. die KESB hat gerichtlich feststellen
    zu lassen, dass die Personaldienstbar keit zugunsten von M und zulasten von Grundstück Nr. 100 nicht
    bestehe, und zu verlangen, dass die Personaldienstbarkeit auf dem Hauptbuchblatt des Grund stücks
    Nr. 100 zu löschen sei. 5. Klagefrist Die Grundbuchberichtigungsklage unterliegt als dingliche Klage
    keiner Verjäh rung.28 6. Einwendungen von M 6.1 Öffentlicher Glaube des Grundbuchs Gegen den Klagegrund
    kann M einwenden, dass sie die Personaldienstbarkeit aufgrund des öffentlichen Glaubens (bzw. der
    positiven Rechtskraft) gemäss Art. 973 Abs. 1 ZGB gültig erworben hat.29 Hierfür muss zunächst ein
    ungerechtfertigter Eintrag im Grundbuch bestehen.30 Vorliegend wurde B ungerechtfertigt als Eigentümer
    von Grundstück Nr. 100 ein getragen. Weiter muss das Rechtsgeschäft darauf gerichtet sein, dass eine
    Drittperson Eigentum bzw. ein beschränktes dingliches Recht erwerben soll.31 M war im vorliegenden
    Fall nicht in die ungerechtfertigt erfolgte Eigentumsüber tragung von Grundstück Nr. 100 involviert
    und ist somit als Drittperson zu qua lifizieren. Der zwischen B und M abgeschlossene Dienstbarkeitsvertrag
    soll M ein beschränktes dingliches Recht – konkret eine Personaldienstbarkeit – zulasten von Grundstück
    Nr. 100 einräumen. Schliesslich muss die Drittperson gutgläubig sein.32 Gutgläubig ist, wer im Zeit
    punkt des Erwerbs die Unrichtigkeit des Grundbuchs nicht kannte und bei Einsatz der gebotenen Aufmerksamkeit
    nicht kennen musste.33 Guter Glaube wird nach Art. 3 ZGB vermutet. Dem Sachverhalt lassen sich keine
    Anhaltspunkte entnehmen, welche gegen den guten Glauben von M sprechen würden. M hat die Personaldienstbarkeit
    also gut gläubig erworben. 6.2 Ersitzung Die Grundbuchberichtigungsklage hat keinen Erfolg, sofern
    die zu Unrecht ein getragene Person die Dienstbarkeit ersessen hat.34 Nach Art. 731 Abs. 2 und 3 ZGB
    sowie Art. 661 ZGB kann die Dienstbarkeit nicht mehr angefochten werden, wenn jemand ungerechtfertigt
    als berechtigte Person eingetragen war und die Dienstbarkeit in gutem Glauben zehn Jahre lang ununterbrochen
    und unangefoch ten ausgeübt hat. Vorliegend sind seit der Eintragung der Personaldienstbarkeit im
    Grundbuch nicht zehn Jahre vergangen, weshalb sich M nicht auf die ordentliche Ersitzung berufen kann.
    7. Ergebnis M kann sich erfolgreich auf Art. 973 ZGB berufen, weshalb A bzw. die KESB mit der Grundbuchberichtigungsklage
    nicht durchdringen wird. Das zulasten des Grundstücks Nr. 100 eingetragene Parkplatzbenützungsrecht
    zugunsten von M bleibt bestehen. 8. Abgrenzung 8.1 Abgrenzung zur Grundbuchbeschwerde (Art. 956a ZGB)
    Gemäss Art. 956a Abs. 3 ZGB kann gegen eine im Hauptbuch vollzogene Eintra gung, Änderung oder Löschung
    von dinglichen Rechten oder Vormerkungen keine Beschwerde mehr geführt werden. Vorliegend kommt eine
    Grundbuchbeschwerde nicht infrage, weil das Parkplatz benützungsrecht bereits im Grundbuch eingetragen
    ist. 8.2 Abgrenzung zur Berichtigung (Art. 977 ZGB) Ein Eintrag kann gemäss Art. 977 ZGB dann berichtigt
    werden, wenn eine Dis krepanz zwischen der mängelfreien Anmeldung bzw. den zugehörigen Belegen und
    dem vollzogenen Grundbucheintrag besteht.35 Vorliegend erfolgte die Eintragung des Parkplatzbenützungsrechts
    entsprechend der Anmeldung samt Belegen korrekt, weshalb die Berichtigung nicht einschlägig ist.'
