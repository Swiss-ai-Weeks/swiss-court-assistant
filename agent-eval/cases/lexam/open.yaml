  question: "Der Technologiekonzern G hat eine Methode zur effizienteren und zeitsparenden Produktion\n\
    des Stoffes X zur Korrosionsbehandlung gefunden und patentieren lassen. Selbst verfügt G\naber nicht\
    \ über die notwendigen Anlagen für die Industrieproduktion und Vermarktung von\nX. G räumt dem Unternehmen\
    \ N deshalb eine ausschliessliche Lizenz ein. In der Folge wird\nbekannt, dass Z die patentierte Methode\
    \ ebenfalls gewerbsmässig nutzt. Z erhebt im Rahmen\ndes von G eingeleiteten Prozesses in Bezug auf\
    \ die Schutzrechtsverletzung Widerklage auf\nNichtigkeit des Patents. Das zuständige Gericht heisst\
    \ die – aus prozessökonomischen Grün-\nden zuerst behandelte – Widerklage gut und stellt die Nichtigkeit\
    \ des Patents fest. \nBestehen Anspruchsgrundlagen von N gegen G? Wo sehen Sie Probleme?"
  reference: 'Der LV ist nicht nichtig, Aufrechterhaltung des Vertrags entspricht schützenswertenI- Interessen
    des LN. Fall von Rechtsmängelhaftung Grundlage Art. 97 OR: Problem, dass Verschulden vorausgesetzt
    Grundlage Art. 192 ff. OR: Problem Abgrenzung unmittelbarer/mittelbarer Schaden 196 OR einschlägig,
    weil Know-how verbleibt? Allenfalls Abs. 2? Lösung aus Richterrecht drängt sich auf (Art. 1 Abs. 2
    ZGB)'
  rubric:
  - 'Der LV ist nicht nichtig, Aufrechterhaltung des Vertrags entspricht schützenswertenI- Interessen
    des LN. Fall von Rechtsmängelhaftung Grundlage Art. 97 OR: Problem, dass Verschulden vorausgesetzt
    Grundlage Art. 192 ff. OR: Problem Abgrenzung unmittelbarer/mittelbarer Schaden 196 OR einschlägig,
    weil Know-how verbleibt? Allenfalls Abs. 2?'
  - Lösung aus Richterrecht drängt sich auf (Art. 1 Abs. 2 ZGB)
