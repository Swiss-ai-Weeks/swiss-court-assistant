  question: "Die Kunstfreiheit wird in der Schweiz in Art. 21 BV geschützt. \nWas genau schützt die Kunstfreiheit\
    \ gemäss Gerichtspraxis? Wer kann sich auf die\nKunstfreiheit berufen?"
  reference: Schutz sowohl für den Werk- als auch den Wirkbereich. Der Werkbereich schützt die künstlerische
    Betätigung an sich. Der Wirkbereich schützt die Darbietung und Verbreitung des Kunstwerks. Es kann
    sich also sowohl der Künstler als auch der Konsument (o. Publikum) von Kunst auf die Kunstfreiheit
    berufen.
  rubric:
