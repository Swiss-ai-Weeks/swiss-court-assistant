  question: "M istals Präsidentranghöchstes vorstandsmitglied eines internationalcn Sport verbands (Verein\
    \ nach Schweizer Recht). Um den K, den Präsidenten eines kontinentalen Ver bands, als potenziellen\
    \ Konkurrenten um den Präsijentenposten vorübergehend ruhig zu stel len, schliesst er mit diesem einen\
    \ Beratervertrag, der mit zio.oo0 cHF jäülich dotiert ist. Nen nenswerte Leistungen werden während\
    \ der Vertragszeit nicht erbrachi. N\"rrt 0\", a;;;i;;; M stösst seine Nachfolgerin B auf den Vertrag\
    \ und kisst die Justiziarin kursorisch eine mögliche shafbarkeit des M nach stGB prüfen. \nZu welchem\
    \ Ergebnis kommt sie?"
  reference: 'Strafbarkeit des M nach Art. 322octies StGB (5 Punkte) Der Straftatbestand der Bestechung
    Privater dient insbesondere dem Schutz der Interessen des Prinzipals vor korrupten Pflichtverletzungen
    von Organen und Mitarbeitern. In der vorliegenden Konstellation ist M als extraneus und K als intraneus
    auszumachen. Prinzipal wäre der Kontinentalverband. Fraglich ist aber, ob die Zuwendung des M einen
    Bezug auf das Innenverhältnis zwischen K und dem Verband aufweist. Im Vordergrund steht hier die Eigenschaft
    von K als potenzieller Mitbewerber um ein Amt in einem anderen Verband. Es ist nicht ersichtlich,
    inwiefern die persönlichen Interessen des K, sich um Ämter zu bewerben, das Treueverhältnis zum Prinzipal
    (Kontinentalverband) berühren könnten. Nach dem Sachverhalt dient der Vertrag nicht dazu, den K zu
    motivieren, seine Aufgaben für seinen Verband nicht mehr ordnungsgemäss wahrzunehmen. Die Privatbestechung
    ist daher nicht einschlägig. Strafbarkeit des M nach Art. 138 Abs. 1 StGB (4 Punkte) Für eine Strafbarkeit
    nach Art. 138 Abs. 1StGB müssten die 250.000 CHF dem M anvertraut sein. Eine Sache gilt als anvertraut,
    wenn sie jemand mit der Verpflichtung empfängt, sie in bestimmter Weise im Interesse eines anderen
    zu verwenden, insb. sie zu verwahren, zu verwalten oder abzuliefern. Das Gesellschaftsvermögen von
    juristischen Personen ist ihren Organen jedoch nicht anvertraut, da sie nicht als «Dritte», sondern
    als ausführende Glieder der juristischen Person handeln. Insofern war das Geld dem M nicht anvertraut.
    Strafbarkeit des M nach Art. 158 Abs. 1 StGB I. - TBM a. OTB (18 Punkte) i. M als tauglicher Täter?
    Schutzgarant für fremdes Vermögen? Präsident eines intl. Sportverbandes. Präsident = Vergleichbarer
    Geschäftsführer? Täter muss selbständig über grosse Vermögensbestandteile des Treugebers verfügen
    dürfen. - Als Indizien der geforderten Selbständigkeit erkennt das BGer die Befugnis zur Vornahme
    von Rechtsgeschäften, aber auch interne Verantwortung für Vermögensinteressen an; ggf. auch die lediglich
    tatsächliche Verantwortung für diese. Auch die Vertretungsbefugnis nach aussen kann als Indiz herangezogen
    werden. Nach Art. 69 ZGB hat der Vorstand das Recht und die Pflicht, nach den Befugnissen, die die
    Statuten ihm einräumen, die Angelegenheiten des Vereins zu besorgen und den Verein zu vertreten. -
    - - - - - - Allein die aus dem SV abzuleitende Ermächtigung, für den Verein Verträge abschliessen
    zu können, deutet auf eine entsprechende Schutzgarantenstellung hin. ii. Treuepflicht? Begründung
    durch Gesetz, behördlichen Auftrag oder Rechtsgeschäft? Dem Vorstand eines Vereins kommt eine umfassende
    Pflichtenstellung für den Verein zu. Insbesondere vertritt er den Verein bei Geschäften mit Dritten.
    Daraus resultiert eine besondere Betreuungspflicht des Vereinsvorstands für das Vermögen des Vereins,
    vgl. Art. 60 ff. ZGB. Durch Vereinsbeschluss (und somit durch Rechtsgeschäft) ist dem M eine entsprechende
    Treuepflicht auferlegt worden. iii. Pflichtverletzung? Gegen jene Betreuungspflicht kann der Vorstand
    verstossen, wenn er pflichtwidrig Geschäfte abschliesst, die den Verein wirtschaftlich beeinträchtigen.
    Vorliegend schliesst M mit K einen mit 250.000 CHF dotierten Beratervertrag ab, ohne dass nennenswerte
    Gegenleistungen erbracht wurden Wirtschaftliche Beeinträchtigung? - - - Grds. handelt M im Rahmen
    seiner Vertretungsbefugnis. Auch unwirtschaftliches Handeln bedeutet nicht unbedingt eine Pflichtverletzung.
    Vorliegend dient der Vertrag jedoch als (nicht fremdnütziges) Scheingeschäft (Leistung und Gegenleistung
    decken sich wirtschaftlich nicht), damit K nicht für den Präsidentenposten kandidiert. Bei marktüblichen
    Konditionen wäre für 250.000 CHF p.a. mit erheblichen und zeitaufwändigen Beraterleistungen zu rechnen
    gewesen. Hinweis: Die Geldleistungen des M stammen nicht aus seiner eigenen Tasche, sondern aus dem
    Budget des Vereins. Dies geht aus einer lebensnahen Auslegung des Sachverhaltes hervor (Vertrag ist
    mit 250.000 CHF «dotiert»; Nachfolgerin des M wird stutzig). iv. Vermögensschaden - Der Vermögensschaden
    folgt daraus, dass den vertraglichen Leistungen des Vereins iHv 250.000 CHF keine Kompensation durch
    etwaige Beraterleistungen gegenübersteht (s.o.). b. STB (3 Punkte) Vorsatz (+) c. Qualifikation: Bereicherungsabsicht?
    (+), aber nicht stoffgleich, da Vermögensabfluss des Verbundes nicht deckungsgleich mit dem Zuwachs
    aufseiten des M. II. III. IV. Rechtswidrigkeit (+) Schuld (+) Ergebnis M hat sich nach Art. 158 Abs.
    1 StGB strafbar gemacht.'
  rubric:
  - Strafbarkeit des M nach Art. 322octies StGB (5 Punkte)
