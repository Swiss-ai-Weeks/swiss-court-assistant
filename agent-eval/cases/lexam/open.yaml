  question: "Annabelle Meier (hiernach: A) betrieb Céline Keller (hiernach: C) am 11. Februar 2022 beim\
    \ zuständi gen Betreibungsamt Bülach über eine Forderung in Höhe von CHF 12'500 aus einem Verlustschein\
    \ in folge Pfändung. Der Zahlungsbefehl wurde der C am 18. Februar 2022 rechtsgültig zugestellt. C\
    \ erhob fristgerecht Rechtsvorschlag. Am 9. Mai 2022 stellte A ein Gesuch um provisorische Rechtsöffnung\
    \ gegen C beim zuständigen Einzelgericht des Bezirksgerichts Bülach. Sie stützte ihr Gesuch auf einen\
    \ Verlustschein infolge Pfändung vom 4. April 2018, welcher einen ungedeckten Betrag von CHF 12'500\
    \ ausweist. Auf dem Verlustschein ist Berta Suter (hiernach: B) als Gläubigerin aufgeführt. Gleichzeitig\
    \ mit dem Rechtsöffnungsgesuch reichte A eine von B unterzeichnete Abtretungserklärung vom 1. Mai\
    \ 2022 mit folgendem Wortlaut ein: «B tritt die Forderung gegen C in Höhe von CHF 12'500, die dem\
    \ Verlustschein vom 4. April 2018 zugrunde liegt, per 1. Mai 2022 an A ab.» An der Rechtsöffnungsverhandlung\
    \ vom 1. Juni 2022 nahm C nicht teil. \nWie soll das Gericht entscheiden? Begründen Sie Ihre Auffassung!"
  reference: 'Entscheid über die provisorische Rechtsöffnung: • Prüfung der Titelqualität und der Aktivlegitimation
    erfolgt von Amtes wegen, d.h. die fehlende Bestreitung durch C aufgrund Säumnis ist unbeachtlich;
    kein def. RÖ-Titel nach Art. 80 SchKG. • Vorliegen eines provisorischen Rechtsöffnungstitels: Verlustschein
    infolge Pfändung gilt grund sätzlich als Schuldanerkennung i.S.v. Art. 82 Abs. 1 SchKG (s. Art. 149
    Abs. 2 SchKG); der Rechts öffnungstitel kann sich dabei grundsätzlich auch aus mehreren Urkunden zusammensetzen.
    • Problem: A ist im Zeitpunkt der Betreibung bzw. der Zustellung des Zahlungsbefehls (18. Feb ruar
    2022) nicht Inhaberin der Forderung aus dem Verlustschein infolge Pfändung. o Grundsätzlich ist ein
    Gläubigerwechsel vor Einleitung der Betreibung unproblema tisch, sofern die Zessionskette urkundlich
    nachgewiesen werden kann. Gleiches gilt für einen Gläubigerwechsel während des Betreibungsverfahrens,
    wenn der die Betrei bung einleitende Gläubiger die ihm zustehende Forderung an einen neuen Gläubiger
    abtritt (s. Art. 77 Abs. 1 SchKG). I.c. ist aber fraglich, ob der ursprüngliche Mangel der Aktivlegitimation
    bei Einleitung der Betreibung im provisorischen Rechtsöffnungsver fahren mit der Abtretung der Forderung
    vom 1. Mai 2022 noch geheilt werden kann. o Diskussion: dagegen spricht, dass die Schuldnerin mit
    der Gnadenfrist (Art. 69 Abs. 2 Ziff. 2 SchKG) aufgefordert wird, an die Betreibende zu zahlen. Solange
    diese aber nicht Inhaberin der Forderung ist, kann die Schuldnerin an sie auch nicht mit befrei ender
    Wirkung leisten (Schuldnerschutz) sowie dass der Rechtsvorschlag ursprünglich gerechtfertigt war;
    dafür sprechen eine Analogie zum Erkenntnisverfahren, wo die Aktivlegitimation erst im Urteilszeitpunkt
    gegeben sein muss, sowie prozessökonomi sche Überlegungen. Dabei könnten die unnötigen Kosten für
    das Rechtsöffnungsver fahren aufgrund des ursprünglich gerechtfertigten Rechtsvorschlags dem Gläubiger
    auferlegt werden (s. Art. 107 Abs. 1 lit. f oder Art. 108 ZPO). • Fazit: Je nach Ausgang der Diskussion
    erteilt oder verweigert das Gericht die provisorische Rechtsöffnung.'
  rubric:
  - 'Entscheid über die provisorische Rechtsöffnung:'
  - Prüfung der Titelqualität und der Aktivlegitimation erfolgt von Amtes wegen, d.h. die fehlende Bestreitung
    durch C aufgrund Säumnis ist unbeachtlich; kein def. RÖ-Titel nach Art. 80 SchKG.
  - 'Vorliegen eines provisorischen Rechtsöffnungstitels: Verlustschein infolge Pfändung gilt grund sätzlich
    als Schuldanerkennung i.S.v. Art. 82 Abs. 1 SchKG (s. Art. 149 Abs. 2 SchKG); der Rechts öffnungstitel
    kann sich dabei grundsätzlich auch aus mehreren Urkunden zusammensetzen.'
  - 'Problem: A ist im Zeitpunkt der Betreibung bzw. der Zustellung des Zahlungsbefehls (18. Feb ruar
    2022) nicht Inhaberin der Forderung aus dem Verlustschein infolge Pfändung. o Grundsätzlich ist ein
    Gläubigerwechsel vor Einleitung der Betreibung unproblema tisch, sofern die Zessionskette urkundlich
    nachgewiesen werden kann. Gleiches gilt für einen Gläubigerwechsel während des Betreibungsverfahrens,
    wenn der die Betrei bung einleitende Gläubiger die ihm zustehende Forderung an einen neuen Gläubiger
    abtritt (s. Art. 77 Abs. 1 SchKG). I.c. ist aber fraglich, ob der ursprüngliche Mangel der Aktivlegitimation
    bei Einleitung der Betreibung im provisorischen Rechtsöffnungsver fahren mit der Abtretung der Forderung
    vom 1. Mai 2022 noch geheilt werden kann. o Diskussion: dagegen spricht, dass die Schuldnerin mit
    der Gnadenfrist (Art. 69 Abs. 2 Ziff. 2 SchKG) aufgefordert wird, an die Betreibende zu zahlen. Solange
    diese aber nicht Inhaberin der Forderung ist, kann die Schuldnerin an sie auch nicht mit befrei ender
    Wirkung leisten (Schuldnerschutz) sowie dass der Rechtsvorschlag ursprünglich gerechtfertigt war;
    dafür sprechen eine Analogie zum Erkenntnisverfahren, wo die Aktivlegitimation erst im Urteilszeitpunkt
    gegeben sein muss, sowie prozessökonomi sche Überlegungen. Dabei könnten die unnötigen Kosten für
    das Rechtsöffnungsver fahren aufgrund des ursprünglich gerechtfertigten Rechtsvorschlags dem Gläubiger
    auferlegt werden (s. Art. 107 Abs. 1 lit. f oder Art. 108 ZPO).'
  - 'Fazit: Je nach Ausgang der Diskussion erteilt oder verweigert das Gericht die provisorische Rechtsöffnung.'
