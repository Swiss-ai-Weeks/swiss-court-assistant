  question: "Die Gemeinde Y im Kanton Zürich möchte das \"Sägereiareal\" (Parzellen-Nrn. 3000–3005), welches\
    \ in der Gewerbezone liegt, umnutzen. Weil das Areal schon länger nicht mehr ge nutzt wird, soll es\
    \ in eine Wohnzone, in welcher nur nichtstörende Betriebe gestattet sind, umgezont werden. Die entsprechende\
    \ Nutzungsplanänderung wird vom Gemeindevorstand zurzeit ausgearbeitet. Um die Planung zu sichern,\
    \ soll nun für die Parzellen des \"Sägerei areals\" eine auf zwei Jahre befristete Planungszone erlassen\
    \ werden. Nehmen Sie an, die Planungszone sei rechtskräftig festgesetzt worden. A ist Eigentümer \n\
    der Parzelle-Nr. 3001. Bis ins Jahr 2010 betrieb er auf seinem Grundstück eine Schreinerei; \nseither\
    \ steht das Gebäude leer. Nun plant er, sich beruflich neu zu orientieren und das ehe\nmalige Schreinereigelände\
    \ für eine Hundetagesstätte zu nutzen. Bis zu 20 Hunde sollen dort \nzwischen 06.00 und 21.00 Uhr\
    \ während sieben Tagen in der Woche betreut werden. Die \nHunde würden sich überwiegend draussen aufhalten;\
    \ der ehemals für die Holzlagerung ge\nnutzte Platz vor dem Gebäude böte dazu genügend Auslauf. Weiter\
    \ verfügt das Grundstück \nvon A auch über genügend Parkplätze. A rechnet damit, dass Hundebesitzer\
    \ aus der ganzen \nRegion sein Angebot nutzen und für das Bringen und Abholen ihrer Tiere das Auto\
    \ benüt\nzen werden. \nNehmen Sie an, die Pla nungszone sei zulässig und das Vorhaben von A bedürfe\
    \ einer Baubewilligung. Ist die se zu erteilen?"
  reference: 'Gemäss Art. 22 Abs. 2 lit. a RPG ist Voraussetzung einer Baubewilligung, dass die Bauten
    und Anlagen dem Zweck der Nutzungszone entsprechen (1). Die Gewerbezone ist in erster Linie für gewerbliche
    Betriebe bestimmt (§ 56 Abs. 1 PBG) (1). A übt mit dem Betrieb einer Hundetagesstätte eine gewerbliche
    Tätigkeit aus und verfolgt wirtschaftliche Zwecke; damit handelt es sich um einen gewerblichen Betrieb
    (vgl. Urteil des VGer ZH, VB. 2015.00019 vom 9. Juli 2015, E. 6.1) (1). In der Gewerbezone wäre die
    Nutzungsänderung der Schreinerei demnach zulässig (1). Zu prüfen ist aber, ob das Vorhaben von A die
    Nut zungsplanänderung der Gemeinde X negativ präjudiziert. (4) Nach § 346 Abs. 1 PBG dürfen innerhalb
    von Planungszonen keine baulichen Veränderun gen oder sonstige Vorkehren getroffen werden, die der
    im Gang befindlichen Planung wi dersprechen (1). Eine Planungszone führt demnach nicht zu einem absoluten
    Bauverbot (0.5). Vielmehr ist zu prüfen, ob die Umnutzung der Schreinerei der geplanten Nutzungs planänderung,
    welche die Umzonung der Fläche "Sägereiareal" in die Wohnzone ohne mässig störende Betriebe vorsieht,
    widerspricht (0.5). (2) Eine Baute bzw. Anlage muss sowohl hinsichtlich der von ihr ausgehenden Lärmemissio
    nen (0.5) als auch bezüglich der raumplanerischen Zweckbestimmung in die fragliche Zone passen (funktionale
    Zonenverträglichkeit) (0.5). Eine Hundetagesstätte für bis zu 20 Hunde, welche die ganze Woche während
    15 Stunden am Tag geöffnet ist und wo sich die Hunde grösstenteils im Freien aufhalten, verursacht
    Lärm (1). Mittels einer Gesamtbeurteilung muss eingeschätzt werden, ob die Schwelle des in der Wohnzone
    massgebenden Belas tungsgrenzwerts (Planungswert, ZP) überschritten sein wird. Davon ist auszugehen:
    Da nur nichtstörende Betriebe zulässig sein sollen, wird das Grundstück inskünftig der strengeren
    Lärmempfindlichkeitsstufe II zugewiesen sein (ZP). Die Hundetagesstätte würde auch Ge ruchsimmissionen
    verursachen, welche sich in einer Wohnzone unangenehm und störend auswirken könnten (1). Gesamthaft
    betrachtet muss auch die funktionale Zonenkonformität des Vorhabens von A verneint werden (1). Somit
    ist die Hundetagesstätte ein mässig, wenn nicht gar stark störender Betrieb und in der vorgesehenen
    Wohnzone nicht zonenkonform (1). Dementsprechend würde das Vorhaben von A der im Gange befindlichen
    Nutzungs planung zuwiderlaufen, weshalb es nicht bewilligt werden kann (1).'
