  question: "The Kiss ein Schnappschuss von Alfred\nEisenstaedt ( ⃰ 6. Dez.1898 - †24. Aug. 1995):\nDas\
    \ Bild entstand am V-J Day, 14. August\n1945, am Tag, als Japan bedingungslos\nkapitulierte. Es zeigt\
    \ einen jungen Matrosen,\nder, seiner Euphorie über das Kriegsende\nverfallend, eine junge „Krankenschwester“\n\
    packt und spontan küsst. Durch Zufall wird der\nMoment von Eisenstaedt für die Ewigkeit\nfestgehalten.\
    \ Das Bild ist weltberühmt.\n\nCouple kissing in Times Square on V-J Day\nMural von Eduardo Kobra\
    \ ( ⃰ 1. Jan. 1976):\nDas Wandgemälde ist eine Hommage an „The\nKiss“ von Alfred Eisenstaedt. Es zierte\
    \ ab\n2012 eine Hauswand gegenüber dem\nberühmten Highline Park in New York.\n\nStellen Sie sich folgenden\
    \ fiktiven Fall vor. Die Tochter von Eisenstaedt staunt nicht schlecht,\nals sie an einer Hauswand\
    \ eine Reproduktion des Schnappschusses ihres Vaters sieht. Sie ist\nirritiert, denn sie hat nie ein\
    \ Einverständnis dazu erteilt.\nAngenommen Sie sind ein/e Anwält/in, spezialisiert auf dem Gebiet\
    \ des Urheberrechts, und\nFrau Eisenstaedt ersucht Sie in diesem Fall um Rat. Beraten Sie Frau Eisenstaedt\
    \ in den\nfolgenden Fragen, unter Anwendung des Schweizerischen Urheberrechts. \nAngenommen der Schnappschuss\
    \ sei ein urheberrechtlich geschütztes Werk: Dürfte\ndie Tochter die Nutzung des Bildes verbieten?\n\
    Prüfen Sie alle nach URG zur Verfügung stehenden Lösungsmöglichkeiten.\nNehmen Sie in Ihren Ausführungen\
    \ sowohl Bezug auf die Lehre als auch die Rechtsprechung\ndes Schweizer Bundesgerichts."
  reference: 'Reproduktion als Kopie. Herstellung eines Werkexemplars (1) i.S.v. Art. 10 Abs. 2 lit. a.
    URG. Als Tochter und Erbin kann sie die Rechte ihres Grossvaters geltend machen. Nutzung ohne Zustimmung
    erlaubt? I) Zeitablauf: 70 Jahre nach dem Tod des Urhebers i.S.v. Art. 29 Abs. 2 lit. b URG. Subsumption
    : der Urheberrechtliche Schutz ist noch nicht erloschen (läuft noch bis 2065). II) Zitatrecht i.S.v.
    Art. 25 URG. Voraussetzungen: 1. Zitat dient der Erläuterung, 2. Umfang des Zitats ist durch Zitatzweck
    gerechtfertigt, 3. Zitat wird kenntlich gemacht unter Angabe der Quelle. Es ist umstritten, ob Bildzitate
    zulässig sind. Die herrschende Lehre verneint die Zulässigkeit. Bilder werden in der Regel integral/als
    Ganzes zitiert und dienen daher nicht als Hinweis oder Erläuterung. Subsumption: Vorliegend wird gerade
    das ganze Bild übernommen, weshalb nach h.L. nicht von einem Zitat ausgegangen werden kann. Alternativ:
    Kein absolutes Verbot. Bei einer verfassungsmässigen Auslegung des URG zulässig. Rechtsprechung des
    Bundesverfassungsgerichts im Falle Germania 3. Subsumption: bei entsprechender Argumentation. Mögliches
    Argument: Verweis auch auf De Werra, Problematisch wäre allerdings die Angabe der Quelle. III) Neuschöpfung.
    - Abstandslehre. - Züge des vorbestehenden Werks im Zweitwerk nicht mehr erkennbar. Subsumption: Die
    Strassenfluchten werden gerade durch Farbstrahlen verdeutlicht. Daher keine Neuschöpfung. A.A. möglich.
    Eine Bearbeitung i.S.v. Art. 3 URG liegt vor, sofern das Werk zweiter Hand ebenfalls als geistige
    Schöpfung mit individuellem Charakter i.S.v. Art. 2 Abs. 1 URG qualifiziert werden muss. Dies ist
    vorliegend zu bejahen. Mögliches Argument: Nicht bloss hinzufügen von Farbe, aber Verstärkung der
    Merkmale. A.a. möglich. Zustimmung für die Verwendung i.S.v. Art. 11 Abs. 1 lit. b URG hätte eingeholt
    werden müssen. In diesem Sinne muss das Urheberrecht als verletzt angesehen werden. Die Tochter kann
    die Nutzung daher verbieten a.A. möglich.'
