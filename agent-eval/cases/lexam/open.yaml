  question: |-
    Die Gesetzgebung ist in der Schweiz vergleichsweise langsam. Nennen Sie dafür zwei
    Gründe.
  reference: Die Bundesversammlung ist als vollkommenes Zweikammersys- tem ausgestaltet, d.h. beide Kammern
    (Räte) sind einan- der gleichgestellt und haben die gleiche Sachkompetenz. Diese Gleichstellung kann
    den Gesetzgebungsprozess verlangsamen. Mit dem Vernehmlassungsverfahren sollen ausserhalb der Ver-
    waltung stehende Personen und andere Organisationen in den Prozess der Meinungsbildung und Entscheidfindung
    des Bun- des einbezogen werden. Dieser Prozess verzögert die Gesetz- gebung. [Elemente einer Rechtssetzungslehre,
    Rz. 151 ff.] Verfassungen und Gesetze unterstehen in Bund, Kantonen und Gemeinden in der Regel dem
    obligatorischen oder fakultativen Referendum. Im Gesetzgebungsprozess wird es von politischen Parteien,
    Verbänden und anderen Interessenorganisationen, manchmal auch von Fraktionen oder Mitgliedern des
    Parla- ments als Drohmittel eingesetzt, um eine bestimmte Ausgestal- tung einer Vorlage zu erreichen.
    Dieses Instrument verzögert bzw. beendet – je Ausgang der Abstimmung – die Gesetzge- bung. [Elemente
    einer Rechtssetzungslehre, Rz. 427 ff.]
  rubric:
  - Die Bundesversammlung ist als vollkommenes Zweikammersys- tem ausgestaltet, d.h. beide Kammern (Räte)
    sind einan- der gleichgestellt und haben die gleiche Sachkompetenz. Diese Gleichstellung kann den
    Gesetzgebungsprozess verlangsamen.
  - Mit dem Vernehmlassungsverfahren sollen ausserhalb der Ver- waltung stehende Personen und andere Organisationen
    in den Prozess der Meinungsbildung und Entscheidfindung des Bun- des einbezogen werden.
  - Dieser Prozess verzögert die Gesetz- gebung. [Elemente einer Rechtssetzungslehre, Rz. 151 ff.] Verfassungen
    und Gesetze unterstehen in Bund, Kantonen und Gemeinden in der Regel dem obligatorischen oder fakultativen
    Referendum.
  - Im Gesetzgebungsprozess wird es von politischen Parteien, Verbänden und anderen Interessenorganisationen,
    manchmal auch von Fraktionen oder Mitgliedern des Parla- ments als Drohmittel eingesetzt, um eine
    bestimmte Ausgestal- tung einer Vorlage zu erreichen.
  - Dieses Instrument verzögert bzw. beendet – je Ausgang der Abstimmung – die Gesetzge- bung. [Elemente
    einer Rechtssetzungslehre, Rz. 427 ff.]
