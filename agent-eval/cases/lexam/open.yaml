  question: "Iain Hannay was a corporate banker at JB Morton bank in London. He was working on a\npossible\
    \ merger between a Swiss and a UK company whose shares traded on the Swiss and\nLondon/UK stock exchanges,\
    \ respectively. While the merger was being negotiated and not\ndisclosed to the public, Hannay sent\
    \ an email message to his old friend, Bertie, a fund\nmanager. In his message, Hannay said: ‘Bertie,\
    \ you might be interested in this deal. A\nfavour for a friend.’ However, the merger deal that Hannay\
    \ was working on was cancelled at\nthe last minute and was never disclosed to the market. Also, Bertie\
    \ decided not to buy or sell\nshares in either of the companies. \nYou are a regulatory lawyer investigating\
    \ the transaction. Was there a violation of EU or\nSwiss law?"
  reference: 'The discussion should address whether:  Which country’s insider dealing/market abuse laws
    should apply  Was Hannay informing Bertie about the merger negotiations a form of insider dealing
    or market abuse? EU law and Swiss law can be discussed.  Was Hannay’s message ‘inside information’
    – that is, was it specific or precise and likely to have a significant effect on price of securities.
    - Definition of insider dealing (ID)= trading in organized securities markets on the basis of material,
    privileged or non-public information in order to make a profit or avoid a loss. - Insider dealing
    law necessary in order to promote the efficient pricing of securities and to enhance the integrity
    of the capital markets. Insider dealing is a form of market abuse. Market abuse also can consist of
    creating false or misleading impressions and distorting markets (demand or supply distortion). This
    means that any deliberate release of inside information that is not already in public domain (not
    previously disclosed to market) is market abuse and a form of insider dealing. - EU/ID law also includes
    encouraging or requiring another to commit market abuse/ID Rationale of market abuse/ID. Relationship
    based Rationale: ID= breach of the fiduciary relationship of trust and confidence, where one can be
    established between typically the insider and the company concerned. Misappropriation theory. Insider
    information is property which when disclosed illegally is stolen information (or property) EU Market
    Abuse Regulation (MAR) 2014. Administrative liability and criminal sanctions MAR creates maximum administrative
    fine of not less than euros 5 million or 10% of annual turnover of legal person. Art 7. MAR defines
    inside information as ‘a precise nature’, ‘not been made public’, relates to one or more issuers of
    financial instruments’, and if information made public it would have a significant effect on the prices
    of those financial instruments’ MAR Art 8 (1) – insider dealing arises when a person possesses inside
    information, uses that information by acquiring or disposing of it for its own account or account
    of third party involving financial instruments to which the information relates. Use of inside information
    includes by cancelling or amending an order concerning a financial instrument to which information
    relates and order was placed before the person concerned possessed the inside information EU MAR 12
    (1) – Market manipulation – any other behavior which gives or likely to give false or misleading signals
    as to supply or demand or price of financial instrument or related spot commodity contracts or auctioned
    product based on emission allowances. Market distortion – MAR 12 (2) (a-e) securing dominant position
    over supply or demand, fixing or creating unfair trading conditions UK Criminal Justice Act, part
    V, section 57 (1) & (2). Also section 118B Financial Services and Markets Act 2000 – defining insider
    as any person who has inside information. UK market abuse law section 118 creates liability for individuals
    or entities (‘person’) and therefore should the Hannay’s employee JB Morton bank be liable UK inside
    information defined as specific and/or precise, not been made public, and if made public would have
    a significant effect on price of any securities. ‘Ýou might be interested in this deal. A favour for
    a friend.’ Was the information ‘specific’ or ‘precise’ ? or likely to have an impact on price of securities
    Hannay’s leak to Bertie is a form of insider dealing/market abuse, even though Bertie never acted
    on the information. The act of leaking is unlawful under EU law - Swiss law position (extra credit).
    Art 143 (a ) FinfraG – unlawful to disseminate information which individual should know gives false
    or misleading signals regarding the supply, demand for price of securities trading on a trading venue
    in Switzerand Introduction - Discuss what the role of limited liability in enhancing corporate law
    and historical development of limited liability in European law. What is the understanding of a company
    in corporate law. Shareholders separate legal persons from the company. Shareholders subscribe to
    the company to purchase shares. History of companies across Europe. Companies had different purposes
    set by legislation. But the objective of legislation was to attract shareholder investment. But there
    was no limited liability in 16th/17th/18th centuries until UK legislation in 1844 (for joint stock
    banks) and 1857 creating limited liability for shareholders for all types of companies.  Late 18th/early
    19th centuries - Unincorporated joint stock companies  Incorporation by registration (1844 UK Companies
    Act)  Limited liability enabling & incentive to invest. Facilitate efficient management of business
    (1855 UK Limited Liability Act)  Number of promotions grew substantially after 1855 in England 
    US state restricted limited liability for corporations: eg., double or triple liability of value of
    shares  US National Banking Act 1863 – par value of share + value of investment Salomon case. Discussion
    of facts. Salomon a single shareholder of Salomon Ltd. Salomon Ltd borrows from bank. Salomon Ltd
    defaults. Bank sues Salomon individually and argues that Salomon was agent of company and/or had a
    fiduciary duty to company to ensure it paid its debts to creditors. Court rejects this view holding
    separation of personality between shareholder and company and without more shareholder only liable
    for investment contract to subscribe for shares in the company and not liable beyond that for debts
    of the company. Shareholder not ow property of company, only entitled to residual profits. Theoretical
    justification of Salomon. Encourage more investors to subscribe for company shares during a time of
    market expansion. Downside: costs to creditors if company not able to pay. Costs to third parties
    who are injured and suffer losses from company’s action, even though they may not have wanted to engage
    with the company prior to the injury (accident law). Corporate group liability and piercing corp veil,
    holding company liable for subsidiaries contracts. Adams Cape Industries (1992) South African subsidiary
    of UK holding company.  strict application of the Salomon principle even though the group had been
    restructured so as to avoid liability  Germany: “Konzernrecht” = law of groups  Switzerland - Principle:
    Parent company and subsidiary are separate legal entities – creditors of the subsidiary cannot get
    the parent company’s assets Exception: Possible to pierce the corporate veil if the parent company
    misuses the group structure in order to escape from liability – creditors can get the parent company’s
    assets when the subsidiary is insolvent  Principally the parent company as a mere share holder of
    the subsidiary has no duties going beyond the obligation to pay in full for its shares and is not
    liable for the debts of its subsidiary (Art. 620 II and Art. 680 I OR).  However the parent company
    might be liable if she is found to be a «de facto corporate organ» of the subsidiary. The same applies
    for her employees or members of her corporate bodies who are «de facto» corporate organs of the subsidiary
    (UBS Case BGer 4A_306/2009 from 8. February 2010).  CH limited liability CO and liability of holding
    company for actions of subsidiary 754 CO liability for directors – piercing the veil. o Liability
    for a Swiss corporate parent that has acted as a de facto corporate organ in case of violation of
    a duty (Art. 754 OR) o Liabilities arising from other legal grounds:  Liability arising from trust
    in the group (Swissair Decision, BGE 120 II 331)  Liability arising from Swiss tort law in the event
    that a corporate organ of the parent company harms a subsidiary through an unlawful act in terms of
    Art. 41 et seq OR Liability arising from the impossibility to tell apart the parent company and the
    subsidiary (eg. the entities have similar names of their firms, same headquarters, same buildings,
    same persons with authorisation powers, same telephone lines etc., see the Givaudan-Case, BGE 137
    III 550) Theoretical basis of limited liability discussion - Property Model (Anglo-American Tradition).
    Limited liability based on property model of company law o Shrds = owners of the company o Separation
    of ownership and control o Right to company’s residual income =) legitimates the shareholders’ right
    to have company run exclusively in their own interest (private property right)  public company vs
    private company. Model does not match to public companies  ownership of company vs. ownership of
    ordinary property  the way companies are operated has wide implications for other groups + success
    of the economy as a whole Nexus of contracts model (UK / USA) o Criticizes the property model – separation
    of ownership and control is a conceptual error; shrds are not seen as owners of the company, but as
    capital suppliers o Corporations are nothing but a collection of contracts between different parties
    o No authority relationship between managers and employees o All disputes about the obligations should
    be settled by resort to the methods used to interpret contracts =) no fiduciary duties, no additional
    duties owed by companies as institutions  Conclusion – take a view summarises beneficial and disadvantages
    of limited liability'
