  question: "A mit Sitz in Frankreich erteilt B mit Sitz in der Schweiz die Lizenz an einem Patent zur\
    \ Härtung von Schrauben. Diese Schrauben (die «Vertragsprodukte») sollen in der Schweiz verkauft werden.\
    \ Der Vertrag enthält unter anderem folgende Bestimmung: Artikel 6  \nVerkaufspreis \nB verkauft die\
    \ Vertragsprodukte zu einem Preis von mindestens CHF 0.02/Stück, \nungeachtet der Tatsache, ob an\
    \ Händler oder Endverbraucher verkauft wird.  \nPrüfen sie als Rechtsberater*in von B diese Vertragsklausel\
    \ (möglichst knapp) sowohl nach Schweizer Recht als auch nach EU-Recht unter Angabe der einschlägigen\
    \ Bestimmungen, geben sie eine Empfehlung ab, wie damit umzugehen ist und begründen Sie kurz."
  reference: 'Prüfung: Mindestpreisabsprache i.S.v. Art. 5 Abs. 3 lit. a KG und Art. 4 Abs. 1 Bst. a TT-GVO,
    im Rahmen von Art. 101 AEUV. Empfehlung: Klausel streichen oder ersetzen. Begründung: CH: Beseitigung
    des wirksamen Wettbewerbs vermutet; vermutlich unzulässig und mindestens teilnichtig (Art. 20 Abs.
    2 OR). Sanktionsfolge (Art. 49a KG) EU: Nichtfreistellung der gesamten Vereinbarung. Vereinbarung
    mit hoher Wahrscheinlichkeit nichtig. Sanktionsfolge'
  rubric:
  - 'Prüfung: Mindestpreisabsprache i.S.v. Art. 5 Abs. 3 lit. a KG und Art. 4 Abs. 1 Bst. a TT-GVO, im
