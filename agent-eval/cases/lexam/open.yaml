    kogewichte für Kredite an Staaten, Banken und Unternehmen fest. [1/2 Punkt] Der IRB-Ansatz basiert
    auf einem internen Rating der Bank, d.h. die Bank schätzt ihre Kre ditrisiken selbst ein. [1/2 Punkt]
    Nur die Verwendung des IRB-Ansatzes bedarf einer Bewilligung durch die FINMA. [1 Punkt]
