  - (3) Das Vertrauen muss enttäuscht werden (BGE 120 II 331, E. 5.a und 5.c; BGE 130 III 345, E. 2.1;
    BGer 4A_306/2009 vom 8. Februar 2010, E. 5.1). Dafür bedarf es einer Verletzung der durch das Erwecken
    berechtigten Vertrauens be gründeten Pflichten.
  - (4) Der Geschädigte muss aufgrund des Vertrauens sich als nachteilig erweisende Dispositionen vorgenommen
    haben (BGE 120 II 331, E. 5.b; BGE 130 III 345, E. 2.1; BGer 4A_306/2009 vom 8. Februar 2010, E. 5.2).
  - (5) Es muss ein Schaden entstanden sein (BGE 105 II 75, E. 3; BGE 120 II 331, E. 5.a; BGE 130 III
    345, E. 2.2 und 2.5; BGer 4A_306/2009 vom 8. Februar 2010, E. 5.1). (6) Der Schädiger hat nur für
    den Schaden einzustehen, den er in adäquat kausaler Weise verursacht (BGE 120 II 331, E. 5.a, ferner
    auch E. 6; BGE 130 III 345, E. 2.1).
  - (7) Schliesslich wird Verschulden verlangt (BGE 130 III 345, E. 2.2).
