  - '5. Im Gegensatz zu positiven Leistungs- und Gestaltungsklagen, ist bei Feststellungsklagen das Rechtsschutzinteresse
    (Feststellungsinteresse) immer zu prüfen (ZPO 59 II lit. a). a. Ungewissheit über die Rechtslage:
    Weil Benno von der Verbindlichkeit des Getränkeliefervertrags ausgeht und Gina diese verneint, ist
    die Rechtslage ungewiss.'
  - 'b. Fortdauer der Ungewissheit für den Kläger unzumutbar: Ist eine Leistungspflicht umstritten, ist
    es dem Schuldner nach BGer in der Regel zumutbar, die Klage des Gläubigers als natürlichem Kläger
