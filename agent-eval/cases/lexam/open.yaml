  question: |-
    Was ist unter quantitativer und qualitativer Teilung von Immaterialgüterrechten zu
    verstehen? Sehen Sie Probleme bei der qualitativen Teilrechtsübertragung?
  reference: 'Quantitative Teilung: gemeinschaftliches «Eigentum» Mehrerer (Miteigentum, Gesamteigen-
    tum); Befugnisse (inhaltlich) identisch Qualitative Teilung: Mehrere Berechtigte mit unterschiedlichen
    Teilbefugnissen (z.B. A: Vervielfältigungsrecht, B: Verbreitungsrecht) Probleme, die bezüglich der
    qualitativen Teilung z.T. vorgebracht werden, sind: Die Einheit des Rechts werde nicht gewahrt, es
    ergebe sich eine unzulässige Vervielfältigung des Rechts, Interessen der Allgemeinheit seien verletzt.
    Allerdings sind die „Probleme“ bei näherer Be- trachtung zu relativieren. Die Vertragsfreiheit muss
    im Zweifel vorgehen.'
