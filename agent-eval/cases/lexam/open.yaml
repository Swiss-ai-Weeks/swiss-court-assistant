  question: "Herr X. war Mathematiklehrer am Gymnasium R. im Kanton Zürich. Per 31. Juli 2016 wurde\n\
    er im Alter von 65 Jahren ordentlich pensioniert. Seit 1. August 2016 bezieht Herr X. eine\nordentliche\
    \ Rente der AHV und eine Rente seiner Pensionskasse.\nDie Lern-GmbH mit Sitz in Zürich bietet spezialisierte\
    \ Vorbereitungskurse für die Aufnahme-\nprüfung an das Gymnasium («Gymiprüfung») an. Als ehemaliger\
    \ Mathematiklehrer wäre\nHerr X. als Kursleiter sehr geeignet, weshalb die Lern-GmbH mit Herrn X.\
    \ vereinbart, dass er\nab Februar 2017 einen Mathematik-Vorbereitungskurs im Umfang von 8h/Woche (20%-\n\
    Pensum) übernehmen wird. Herr X. erhält dafür eine Basisentschädigung von CHF 20‘000.-\nim Jahr. Als\
    \ zusätzlicher Anreiz wird ihm eine Bonuszahlung von CHF 1‘500.- in Aussicht\ngestellt, falls die\
    \ Durchfallquote der Kursteilnehmer im Fach Mathematik unter 30% liegt.\nGemäss der Vereinbarung ist\
    \ es Herrn X. erlaubt, auch bei anderen Firmen als Kursleiter tätig\nzu sein. Herr X. seinerseits\
    \ freut sich ungemein, dass sein Fachwissen «weiterhin gebraucht\nwird». Er übernimmt die Kursleitung\
    \ nicht des Geldes wegen an, sondern um eine neue Le-\nbensaufgabe zu haben. Er hätte den Kurs auch\
    \ kostenlos angeboten, was er der Lern-GmbH\naber nicht mitteilt.\nDie Anmeldungsformalitäten, die\
    \ Zuteilung und das Inkasso der Kursgebühren übernimmt die\nLern-GmbH. Die Vorbereitungskurse finden\
    \ in den Räumlichkeiten und gemäss dem Zeitplan\nder Lern-GmbH statt. Für den Unterrichtsinhalt und\
    \ die dafür verwendeten Hilfsmittel (Foli-\nen, Aufgabenblätter, Probeprüfungen) ist Herr X. selber\
    \ verantwortlich. Die Lern-GmbH\nhofft, dass Herr X. seine alten Unterlagen als Gymnasiallehrer weiterverwenden\
    \ wird. Herr X.\nmuss der Lern-GmbH wöchentlich die Anwesenheiten/Absenzen der Teilnehmer melden.\
    \ Er\nkann bei Bedarf auch Gespräche mit den Teilnehmern und den Eltern führen, z.B. wenn das\nNiveau\
    \ eines Teilnehmers nicht ausreichend erscheint. In diesen Fällen wünscht die Lern-\nGmbH, über die\
    \ Gesprächsergebnisse informiert zu werden. \nDie Lern-GmbH möchte von Ihnen wissen, wie die sozialversicherungsrechtliche\
    \ Stellung des\nHerrn X. beurteilt wird und welche Faktoren dafür ausschlaggebend sind."
  reference: 'Erwerbstätigkeit: Problemstellung: zuerst ist zu prüfen, ob Herr X. erwerbstätig ist. Die
    Praxis hat im massgeblichen AHV-Recht folgende Begriffselemente definiert:  Natürlich Person;  Handlung:
    Einsatz der Arbeitskraft oder Kapital;  Erwerbsabsicht: systematisch und planmässig auf die Erhöhung
    der wirtschaftlichen Leistungsfähigkeit gerichtet;  Auf die subjektive Erwerbsabsicht kommt es dagegen
    nicht an. (Siehe LOCHER/GÄCHTER, § 21 Rz. 5–8; Skript, Rz. 242–246)  Subsumtion:  X. ist eine natürliche
    Person.  Die Leitung des Mathematik Vorbereitungskurses stellt einen persönlichen Einsatz sei- ner
    geistigen Arbeitskraft dar.  Die Tätigkeit ist systematisch und planmässig darauf ausgerichtet, dass
    Herr X. CHF 20‘000–25‘000.- pro Jahr verdient, wodurch seine wirtschaftliche Leistungsfähigkeit er-
    höht wird.  Subjektiv geht es Herrn X. nicht primär darum, Geld zu verdienen. Ihm geht es v.a. um
    die neue Beschäftigung nach seiner Pensionierung. Es wird jedoch auf eine objektive Betrachtung abgestellt.
    Die konkreten wirtschaftlichen Tatsachen zeigen klar auf, dass Herr X. mit seiner Tätigkeit einen
    Zufluss wirtschaftlicher Güter erzielt. Zwischenfazit: Die Tätigkeit als Kursleiter stellt eine Erwerbstätigkeit
    im sozialversiche- rungsrechtlichen Sinn dar. Selbstständige vs. unselbstständige Erwerbstätigkeit:
    Problemstellung: es ist zu prüfen, ob es sich eine selbstständige oder eine unselbstständi- ge Erwerbstätigkeit
    des X. handelt. Arbeitnehmerbegriff gemäss Art. 10 ATSG Folgende Merkmale sind für die Abgrenzung
    relevant:  abstellen auf wirtschaftliche Verhältnisse;  untergeordnete Stellung: weisungsgebunden,
    rechenschaftspflichtig, Eingliederung in fremde Arbeitsorganisation;  ohne ein wirtschaftliches Risiko
    zu tragen: keine Investitionen, kein Verlustrisiko etc. (vgl. LOCHER/GÄCHTER, § 22 Rz. 17–22; Skript,
    Rz. 249–253) Subsumtion  Weisungsgebundenheit: (+) Herr X. muss sich an den Zeitplan und den Durchführungsort
    der Lern-GmbH halten (-) Herr X. hat keine Vorgaben bzgl. der Inhaltsvermittlung und den Hilfsmittel
    (-) Herr X. kann selber Gespräche mit den Eltern führen  Eingliederung in fremde Arbeitsorganisation:
    (+) Herr X. benützt die Räumlichkeiten der Lern-GmbH (+) Die ganze Administration (Anmeldung, Zuteilung,
    Inkasso, Zeitplan) wird von der Lern-GmbH übernommen (+) Herr X. ist Teil der Lern-GmbH und tritt
    als deren Kursleiter auf. Er selber hat keine eigene Firma, mit der er solche Kursleistungen anbietet
    (+) Die Lern-GmbH gibt die Entschädigungshöhe vor (-) Herr X. hat kein Konkurrenzverbot  Rechenschaftspflicht:
    (+) Herr X. muss die Anwesenheits- und Absenzkontrollen führen (+) Herr X. muss die Lern-GmbH über
    Gespräche mit Eltern informieren  Wirtschaftliches Risiko: (-) Herr X. muss keine Investition in
    Infrastruktur, Mitarbeiter, Waren etc. tätigen (-) Herr X. trägt kein Inkasso-Risiko, er bekommt die
    Basisentschädigung sowieso (+) Unklar, ob Herr X. eine Spesenentschädigung erhält, für die von ihm
    eingebrachten Unterrichtsmaterialien (Kopien, Folien = Tragung von Unkosten) (+) Der Bonus von CHF
    5‘000.- ist vom Erfolg von Herrn X. abhängig. Damit trägt er ein Stück weit das Verlust-Risiko für
    diesen Bestandteil. Allerdings sind erfolgsabhängi- ge Provisionen oder Boni nicht zwingend atypisch
    für eine unselbständige Erwerbs- tätigkeit. Es liegen sowohl Merkmale für als auch gegen eine unselbstständige
    Erwerbstätigkeit vor. In diesem Fall muss entschieden werden, welche Merkmale überwiegen (LOCHER/GÄCHTER,
    § 22 Rz. 22) I.c. überwiegen klarerweise die Merkmale einer unselbstständigen Erwerbstätigkeit. Herr
    X. ist vollständig in die Arbeitsorganisation der Lern-GmbH eingebunden. Diese gibt Ort, Zeit und
    Entschädigungshöhe vor. Herr X. rapportiert an die Lern-GmbH und hat selber keinen Einfluss auf die
    Anzahl und Zusammensetzung der Teilnehmer. Zudem trägt Herr X. kein Risiko. Er hat kaum Investitionen
    und trägt kein Inkassorisiko. Die Bonuskomponente vermag seine Stellung innerhalb der Lern-GmbH nicht
    zu ändern. Fazit: Herr X. übt eine unselbstständige Erwerbstätigkeit aus.'
