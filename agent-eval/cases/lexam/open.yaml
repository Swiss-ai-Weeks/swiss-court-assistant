  question: Unter welchen aufsichtsrechtlichen Tatbestand bzw. Straftatbestand können echte und unechte
    Transaktionen am Markt mit manipulatorischem Charakter fallen?
  reference: Echte Transaktionen mit manipulatorischem Charakter können den aufsichtsrechtlichen Tat bestand
    der Marktmanipulation gemäss Art. 143 FinfraG fallen. Unechte Transaktionen mit manipulatorischem
    Charakter (sog. Scheinkäufe) können unter den strafrechtlichen Tatbestand der Kursmanipulation gemäss
    Art. 155 FinfraG fallen.
  rubric:
  - Echte Transaktionen mit manipulatorischem Charakter können den aufsichtsrechtlichen Tat bestand der
    Marktmanipulation gemäss Art. 143 FinfraG fallen. Unechte Transaktionen mit manipulatorischem Charakter
    (sog. Scheinkäufe) können unter den strafrechtlichen Tatbestand der Kursmanipulation gemäss Art. 155
    FinfraG fallen.
