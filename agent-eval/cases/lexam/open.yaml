  question: "Die drei Geschwister A, C und Z sind gleichberechtigte Teilhaber der Kollektivgesellschaft\
    \ Montale & Co. Die Gesellschaft ist im Besitz von drei Liegenschaften, die einen Buchwert von CHF\
    \ 1 Mio. haben und einen Verkehrswert von CHF 3 Mio. Im Namen der Montale & Co. wird beim Grundbuchamt\
    \ die Übertragung der drei Liegenschaften, welche Geschäftsvermögen bilden, je auf A, C und Z angemeldet,\
    \ so dass sie im Alleineigentum je einer der Liegenschaften sind. Die Montale & Co. bucht diesen Vorgang\
    \ zulasten ihrer Kapitalkonti zum Buchwert aus der Bilanz aus. \nWie ist dieser Sachverhalt handelsrechtlich\
    \ zu beurteilen?"
  reference: Es liegt eine Privatentnahme vor. Da bei einer solchen die Betriebsinhaber auf dem Umsatz
    mit sich selbst keinen Gewinn erzielen, ist als Erlös dementsprechend der OR-Geschäftswert und nicht
    der Ver kehrswert zu verbuchen (siehe Richner/Frei/Kaufmann/Rohner, Kommentar zum Zürcher Steuergesetz,
    4. Aufl., Bern 2021, § 18 Rz. 72 FN 18). Das von A, B und Z gewählte Vorgehen ist daher handelsrecht
    lich korrekt.
  rubric:
  - Es liegt eine Privatentnahme vor. Da bei einer solchen die Betriebsinhaber auf dem Umsatz mit sich
    selbst keinen Gewinn erzielen, ist als Erlös dementsprechend der OR-Geschäftswert und nicht der Ver
    kehrswert zu verbuchen (siehe Richner/Frei/Kaufmann/Rohner, Kommentar zum Zürcher Steuergesetz, 4.
    Aufl., Bern 2021, § 18 Rz. 72 FN 18).
  - Das von A, B und Z gewählte Vorgehen ist daher handelsrecht lich korrekt.
