    (Art. 33 Abs. 3 lit. b GSchG). Über die Tragweite der öffentlichen und privaten wirt- schaftlichen
    Interessen an der Wasserentnahme ist nichts bekannt.
  - 'Es ist jedoch als unwahr- scheinlich einzuschätzen, dass in der durch die Behörde vorgenommenen geringfügigen
    Erhöhung der Restwassermenge um 9 l/s sowohl die Erhöhung nach Art. 31 Abs. 2 wie auch die obligatorische
