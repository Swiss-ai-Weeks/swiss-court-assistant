  question: "Ihre auf Börsenrecht spezialisierte Anwaltskanzlei vertritt seit Jahren die als Wertpapierhaus\
    \ zugelassene Investmentgesellschaft X, die im Zuge der Aktienzuteilung nicht berücksichtigt wurde.\
    \ \nDeren Rechtsabteilung wendet sich nun an Sie mit der Bitte zu untersuchen, ob bei der Zuteilung\
    \ gegen Aufsichtsrecht oder gegen die als Mindeststandard anerkannten Zuteilungs richtlinien der Schweizerischen\
    \ Bankiervereinigung verstossen worden sei. Wenn ja, könnte die FINMA aufsichtsrechtlich etwas unternehmen?"
  reference: '1. Es könnte ein Verstoss gegen die aufsichtsrechtliche Gleichbehandlungspflicht nach Art.
    17 Abs. 1 FIDLEG vorliegen. Vorliegend handelt es sich bei der Investmentge sellschaft X um einen
    institutionellen Kunden i.S.v. Art. 4 Abs. 4 und Abs. 3 lit. a FID LEG i.V.m. Art. 2 Abs. 1 lit. e
    und Art. 41 FINIG handelt. Deshalb sind die Verhaltens pflichten nach Art. 7 ff. FIDLEG nicht anwendbar
    (Art. 20 Abs. 1 FIDLEG).  2. Die G muss bei der Zuteilung der Aktien hingegen das einschlägige Standesrecht,
    nämlich die Zuteilungsrichtlinien für den Emissionsmarkt von Swissbanking, zu be achten. Die Zuteilungsrichtlinien
    als Mindeststandard gelten für in der Schweiz domi zilierte Banken, welche an öffentlichen Platzierungen
    von Aktien u.a. Finanzinstru menten in der Schweiz mitwirken (Ziff. 4 f. Zuteilungsrichtlinien). Die
    G ist in der Schweiz domiziliert und wirkt bei der öffentlichen Platzierung von Aktien an der SIX
    Swiss Exchange mit. Die Zuteilungsrichtlinien sind somit vorliegend anwendbar.  3. Nach den Zuteilungsrichtlinien
    besteht kein Anspruch auf Zuteilung (Ziff. 6.4 Zutei lungsrichtlinien) von Aktien und es darf zwischen
    unterschiedlichen Kunden ( Gruppen) differenziert werden (Ziff. 6.3 Zuteilungsrichtlinien). Die Zuteilungen
    müssen aber auf sachlichen Kriterien beruhen (Ziff. 6.1 Zuteilungsrichtlinien). Die Zuteilung gemäss
    dem «Treueprogramm» und die Zuteilung an die der DGI nahestehenden in stitutionellen Anleger könnten
    problematisch sein:  a. 0.8 % der Aktien der DGI werden im Rahmen der Zuteilung unter dem Treuepro
    gramm an Personen aus dem Umfeld von D verteilt. Es ist somit zu prüfen, ob diese Zuteilung im Einklang
    mit den Zuteilungsrichtlinien erfolgt ist. Zuteilungen auf Wunsch des Emittenten sind zulässig, wenn
    der Emissionsprospekt über die Tatsache der separaten Zuteilung sowie über die maximale Höhe der Zuteilungs
    berechtigten Aufschluss gibt (Ziff. 9 Zuteilungsrichtlinien). Im Emissionsprospekt wird ausdrücklich
    deklariert, dass maximal 1 % der zu platzierenden Aktien an Personen aus dem Umfeld von D vergeben
    werden können. Die Zuteilung wurde somit korrekt angekündigt und die vorgesehene Obergrenze von 1
    % eingehal ten.  b. Die Zuteilung von 2 % der Aktien an die der DGI nahestehenden institutionellen
    Anleger ist als separate Zuteilung mit besonderer Beziehung zum Emittenten nach Ziff. 9 zu qualifizieren.
    Eine solche Zuteilung auf Wunsch des Emittenten ist zulässig, müsste indessen auch im Prospekt angegeben
    werden, was vorliegend nicht erfolgt ist.  4. Vorliegend verstösst die Bank gegen Ziff. 9 der Zuteilungsrichtlinien.
    Da die Richtli nien als Mindeststandard anerkannt waren, kann die FINMA sie nach Art. 7 Abs. 3 FINMAG
    durchsetzen. Vorliegend kommt eine Feststellungsverfügung nach Art. 32 Abs. 1 FINMAG in Betracht.'
  rubric:
  - 1. Es könnte ein Verstoss gegen die aufsichtsrechtliche Gleichbehandlungspflicht nach Art. 17 Abs.
    1 FIDLEG vorliegen. Vorliegend handelt es sich bei der Investmentge sellschaft X um einen institutionellen
