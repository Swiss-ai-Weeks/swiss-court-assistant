  question: "Am 20. Februar 2019 schliessen Gastronomin Gina aus Meilen und Brauer Benno aus Bern miteinander\
    \ einen Getränkeliefervertrag ab. Sie vereinbaren, dass Gina in den nächsten drei Jahren das in ihrem\
    \ Restaurant ausgeschenkte Bier exklusiv von Benno bezieht und dafür vergünstigte Konditionen erhält.\
    \ Benno soll zweimal jährlich, am 1. März und am 1. September, Bier im Wert von jeweils Fr. 30‘000.–\
    \ liefern. Gina soll die Lieferungen jeweils Zug um Zug nach Eingang bezahlen. Als Benno am 1. März\
    \ 2019 mit seinem Lieferwagen vor Ginas Restaurant in Meilen steht und die Harassen mit Bier ausladen\
    \ will, verweigert Gina jedoch die Annahme des Biers mit der Begründung, der Getränkeliefervertrag\
    \ sei unverbindlich. Benno habe sie über die Zusammensetzung des Biers getäuscht. Mit Klage vom 15.\
    \ April 2019 an das Bezirksgericht Meilen fordert Benno, der nicht der Meinung ist, sich unkorrekt\
    \ verhalten zu haben, von Gina Fr. 30‘000.– für das gelieferte Bier sowie Fr. 500.– für durch die\
    \ Nichtannahme des Biers verursachten Hinterlegungskosten. In ihrer Klageantwort vom 6. Mai 2019 beantragt\
    \ Gina, die Klage sei abzuweisen. Ausserdem sei festzustellen, dass der Getränkeliefervertrag vom\
    \ 20. Februar 2019 unverbindlich sei. \nWird das Bezirksgericht Meilen auf das Feststellungsbegehren\
    \ von Gina (Streitwert Fr. 180‘000.–) eintreten? Beschränken Sie sich bei der Analyse auf Aspekte,\
    \ die aufgrund des Sachverhalts überhaupt problematisch sein könnten und verzichten Sie auf Ausführungen\
    \ zur Zuständigkeit und zur Rechtshängigkeit!"
  reference: '1. Erkennung des Problems: Stellt das Feststellungsbegehren eine zulässige Widerklage dar?
    2. ZPO 224 I: Die beklagte Partei kann in der Klageantwort Widerklage erheben, wenn der geltend gemachte
    Anspruch nach der gleichen Verfahrensart wie die Hauptklage zu beurteilen ist. a. Verfahrensart Hauptklage:
    – ZPO 243 I i.V.m. 219: Übersteigt der Streitwert in einer vermögensrechtlichen Streitigkeit Fr. 30‘000.–,
    kommt das ordentliche Verfahren zur Anwendung. – Streitwert der Hauptklage: Benno vereint in der Hauptklage
    einen Anspruch auf Zahlung des Kaufpreises und einen Anspruch auf Ersatz angefallener Kosten. Es werden
    mehrere Ansprüche vereint, denn Benno macht zwei verschiedene Lebenssachverhalte (Zahlung Kaufpreis
    & Schadenersatz) geltend (zum Streitgegenstandsbegriff s. Frage 2), es liegt also objektive Klagenhäufung
    vor. Art. 90 ZPO setzt für eine objektive Klagenhäufung voraus, dass für die geltend gemachten Ansprüche
    das gleiche Gericht sachlich zuständig ist (lit. a) und die gleiche Verfahrensart (lit. b) anwendbar
    ist. Gemäss bundesgerichtlicher Rechtsprechung hat jedoch zuerst eine Zusammenrechnung des Streitwertes
    gemäss Art. 93 ZPO und erst anschliessend eine Prüfung der gleichen sachlichen Zuständigkeit und der
    gleichen Verfahrensart zu erfolgen (BGE 142 III 788). Die Voraussetzungen zur obj. Klagenhäufung brauchen
    also für die Frage der Zulässigkeit der Widerklage nicht geprüft zu werden. – Gemäss Art. 93 ZPO werden
    die Streitwerte zur Bestimmung der Verfahrensart zusammengezählt, zumindest wenn Ansprüche in engem
    sachlichen Zusammenhang stehen (BGE 142 III 788). Beide Forderungen von Benno betreffen die Bierlieferung
    vom 1. März 2019 gemäss Kaufvertrag. Ein enger sachlicher Zusammenhang ist damit gegeben. Dementsprechend
    beträgt der Streitwert von Bennos Klage Fr. 30‘500.–. – Die Hauptklage wird im ordentlichen Verfahren
    beurteilt. b. Verfahrensart Widerklage: – Der Streitwert des Begehrens von Gina beträgt nach Sachverhalt
    Fr. 180‘000.–.  Die Widerklage wird im ordentlichen Verfahren beurteilt. Die gleiche Verfahrensart
    der Haupt- und der Widerklage ist gegeben. 3. Die Widerklage ist eine selbständige Klage. Für sie
    müssen die Prozessvoraussetzungen deshalb separat geprüft werden. 4. Der SV nennt keinen Schlichtungsversuch.
    Problematisch ist daher allenfalls das Fehlen eines Schlichtungsversuchs (Art. 197 ZPO). Ein solcher
    ist allerdings für die Widerklage nach Art. 198 lit. g ZPO nicht erforderlich. 5. Im Gegensatz zu
    positiven Leistungs- und Gestaltungsklagen, ist bei Feststellungsklagen das Rechtsschutzinteresse
    (Feststellungsinteresse) immer zu prüfen (ZPO 59 II lit. a). a. Ungewissheit über die Rechtslage:
    Weil Benno von der Verbindlichkeit des Getränkeliefervertrags ausgeht und Gina diese verneint, ist
    die Rechtslage ungewiss. b. Fortdauer der Ungewissheit für den Kläger unzumutbar: Ist eine Leistungspflicht
    umstritten, ist es dem Schuldner nach BGer in der Regel zumutbar, die Klage des Gläubigers als natürlichem
    Kläger abzuwarten. Nicht zumutbar ist das hingegen etwa, wenn die Ungewissheit den negativen Feststellungskläger
    in seiner wirtschaftlichen Bewegungsfreiheit behindert. I.c. weiss Gina nicht, ob sie weitere drei
    Jahre an den Getränkeliefervertrag gebunden ist oder nicht. Je nachdem würde Benno in Zukunft mit
    im jetzigen Zeitpunkt noch nicht fälligen Forderungen an sie gelangen. Solange sie keine Klarheit
    hat, muss sie für allfällige Forderungen Mittel zurückstellen. Dementsprechend sind ihre Möglichkeiten,
    bei einem anderen Lieferanten das von ihr bevorzugte Bier zu bestellen, eingeschränkt. Sie ist durch
    die Ungewissheit in ihrer unternehmerischen Freiheit bzw. wirtschaftlichen Bewegungsfreiheit eingeschränkt,
    weshalb die Fortdauer für sie unzumutbar ist. c. Unmöglichkeit, die Ungewissheit anders zu beseitigen:
    Ist nicht ersichtlich. Insbesondere kann Gina eine autoritative Feststellung über die Gültigkeit des
    Kaufvertrages nicht durch ein Leistungs- oder Gestaltungsklage erwirken. Dementsprechend ist die Unmöglichkeit
    gegeben.  Das Feststellungsinteresse kann bejaht werden.'
  rubric:
  - '1. Erkennung des Problems: Stellt das Feststellungsbegehren eine zulässige Widerklage dar? 2. ZPO
