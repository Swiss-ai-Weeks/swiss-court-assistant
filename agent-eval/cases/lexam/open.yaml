    liegt nicht vor. Des Weiteren ist die Behörde nach Art. 33 Abs. 1 GSchG verpflichtet, die Mindestrestwas-
    sermenge in dem Ausmass weiter zu erhöhen, als es sich aufgrund einer Abwägung der Interessen für
    und gegen die vorgesehene Wasserentnahme ergibt. Als Interessen für die Wasserentnahme kommen unter
    anderem öffentliche Interessen, denen die Wasserentnah- me dienen soll, aber auch die wirtschaftlichen
