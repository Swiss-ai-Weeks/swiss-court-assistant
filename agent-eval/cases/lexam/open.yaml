  question: Welche Prinzipien und Rechtsgrundlagen (Bestimmungen nennen) gelten für die Erhebung der Notariatsgebühren
    im Kanton Zürich?
  reference: Die Notariate des Kantons Zürich erheben für ihre Amtshandlungen Gebühren, die in die Staatskasse
    fallen (§ 24 NotG/ZH). Das Kostendeckungs- und das Äqui valenzprinzip dienen als Massstab bei der
    Gebührenerhebung (vgl. Folien Lektion 3, S. 23 ff.). Das Kostendeckungsprinzip bedeutet, dass der
    Gesamtertrag der Ge bühren die gesamten Kosten des betreffenden Verwaltungszweiges nicht überstei
    gen darf (vgl. HÄFELIN ULRICH/MÜLLER GEORG/UHLMANN FELIX, Allgemeines Verwaltungsrecht, 7. Aufl.,
    Zürich/St. Gallen 2016, N 2778 m.w.Verw., zitiert auf Folien Lektion 3, S. 23). Nach dem Äquivalenzprinzip
    muss die Gebühr im Ein zelfall in einem vernünftigen Verhältnis zum Wert stehen, den die staatliche
    Leis tung für die Abgabepflicht hat (vgl. HÄFELIN ULRICH/MÜLLER GEORG/UHLMANN FELIX, Allgemeines Verwaltungsrecht,
    7. Aufl., Zürich/St. Gallen 2016, N 2786 m.w.Verw., zitiert auf Folien Lektion 3, S. 23). In den §§
    25–27 NotG/ZH werden Gebührenansätze für Handänderungen und Pfandrechte, Gründungen und Kapitalerhöhungen
    im Gesellschaftsrecht und für die übrigen Amtshandlungen festgelegt. Der Kantonsrat erlässt eine Notariatsge
    bührenverordnung, die das Verfahren der Gebührenerhebung (§ 28 NotG/ZH) und die ausführenden Bestimmungen
    über die Notariats- und Grundbuchgebühren (§ 36 Abs. 1 NotG/ZH) regelt. Gebührenschuldnerin ist grundsätzlich
    die die Amtshandlung begehrende Person (bei mehreren Personen haften diese solida risch), bei Eigentumsänderungen
    schulden beide Parteien zu gleichen Teilen die Gebühren (vgl. § 29 NotG/ZH). Gegen die Gebührenrechnung
    kann Rekurs bei der Finanzdirektion des Kantons Zürich erhoben werden (§ 31 NotG/ZH).
  rubric:
