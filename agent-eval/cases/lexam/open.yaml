  question: "Eine der wichtigsten Reformen, die das geplante Finanzinstitutsgesetz (FINIG) vorsieht,\n\
    betrifft die aufsichtsrechtliche Stellung der unabhängigen Vermögensverwalter (UVV). \nErläutern Sie,\
    \ in welchen zwei zentralen Punkten sich die aufsichtsrechtlichen\nRahmenbedingungen für UVV ändern\
    \ werden. Stellen Sie dazu die geltende und die\nkünftige Rechtslage gegenüber und nehmen Sie in Ihrer\
    \ Antwort konkret Bezug auf die\neinschlägigen Normen des E-FINIG (Entwurf des Bundesrates vom 4.\
    \ November 2015)."
  reference: '• Bewilligungspflicht o De lege lata: Keine Bewilligungspflicht für UVV o De lege ferenda:
    UVV sollen neu eine Bewilligung der zuständigen Aufsichtsbehörde benötigen (E-FINIG 4 I i.V.m. 2 I
    lit. a) • Aufsicht o De lege lata: Keine prudenzielle Aufsicht über UVV, aber punktuelle Ausnahmen
    o De lege ferenda: UVV sollen neu von einer Aufsichtsorganisation beaufsichtigt werden (E-FINIG 57
    I)'
  rubric:
  - 'Bewilligungspflicht o De lege lata: Keine Bewilligungspflicht für UVV o De lege ferenda: UVV sollen
    neu eine Bewilligung der zuständigen Aufsichtsbehörde benötigen (E-FINIG 4 I i.V.m. 2 I lit. a)'
  - 'Aufsicht o De lege lata: Keine prudenzielle Aufsicht über UVV, aber punktuelle Ausnahmen o De lege
    ferenda: UVV sollen neu von einer Aufsichtsorganisation beaufsichtigt werden (E-FINIG 57 I)'
