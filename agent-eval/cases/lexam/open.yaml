  question: "Beantworten Sie jeweils in wenigen Sätzen die folgende Kurzfrage. \nDer Kanton X möchte künftig\
    \ alle Polizeiangehörigen mit einem Destabilisierungsgerät (Distanz Elektroimpulsgerät, «Taser») ausstatten.\
    \ Welche Vorteile bringt dies für die Polizeiarbeit und welche Punkte gilt es aus grund- und menschenrechtlicher\
    \ Sicht dabei zu beachten?"
  reference: 'o Destabilisierungsgeräte (DSG) bieten den Vorteil, dass sie die Zielperson sofort bewegungsunfähig
    machen, es sich bei DSG jedoch grund sätzlich nicht um tödliche Waffen handelt. Ausserdem verursachen
    sie i.d.R. keine langfristigen gesundheitlichen Folgen. (1.5) o Aus grund- und menschenrechtlicher
    Sicht gilt es, die folgenden Punkte zu beachten: − Der Einsatz der DSG muss den allgemeinen Grundsätzen
    für die Anwendung polizeilichen Zwangs genügen (vgl. § 13 ff. PolG-ZH). (0.5) − Die Einsatzkräfte
    sind für den Einsatz von DSG zu schulen (vgl. § 13 Abs. 1 PolZ-ZH) (0.5) − Anlässlich von Demonstrationen
    ist auf den Einsatz von DSG zu verzichten (vgl. Empfehlung MRA) (0.5) − Der flächendeckende Einsatz
    von DSG bedarf einer Grundlage in einem formellen Gesetz. (0.5)'
