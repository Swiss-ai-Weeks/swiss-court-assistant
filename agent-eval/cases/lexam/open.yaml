  question: "Die Greifensee-Bahn AG plant den Bau einer Gondelbahn (Umlaufbahn) über den Greifen see.\
    \ Sie möchte deshalb die entsprechenden verfahrensrechtlichen Schritte einleiten. Sie kommt mit dem\
    \ Seilbahngesetz (SebG, SR 743.01) in der Hand zu Ihnen und möchte mit Ihnen die ersten Schritte klären.\
    \ \nUmschreiben Sie kurz in wenigen Sätzen die Besonderheit des Verfahrens welches sie einleiten muss."
  reference: Das Bundesamt für Verkehr (BAV) ist als Leitbehörde (vgl. Art. 62a RVOG) zustän dig, nach
    Prüfung aller rechtlichen Voraussetzungen sämtliche notwendigen Bewil ligungen zu erteilen (Art. 3
    Abs. 1 i.V.m. Art. 9 Abs. 1 SebG), soweit es die materi elle Koordination erfordert. Kantonale Bewilligungen
    sind nicht einzuholen, wie auch keine anderweitigen Bewilligungen des Bundes. Die Mitwirkung der kantona
    len Behörden erfolgt gemäss Art. 12 SebG, jene der Bundesämter gestützt auf Art. 62a ff. RVOG i.V.m.
    Art. 14 SebG. Es ist ein Einspracheverfahren vorgesehen, welches das rechtliche Gehör gewährleistet
    (Art. 13 SebG).
