  question: "Die Liegenschaft GB 200 ist in 4 Stockwerkeigentumsanteile zu je 25/100 aufgeteilt, die alle\
    \ Wohnzwecken dienen. Einen Verwalter haben die Stockwerkeigentümer nicht eingesetzt. Die Eigentümer\
    \ von Stockwerkeinheiten Nr. 3 und 4, Alfons (A) und Bruno (B), stören sich daran, dass es auf dem\
    \ Grundstück keinen Velounterstand gibt. Sie bestellen daher ohne Rück sprache mit den anderen Stockwerkeigentümern\
    \ beim Händler Huber (H) einen schönen Velo unterstand, der dank fester Verbindung mit dem Boden sehr\
    \ stabil ist, und lassen ihn durch Huber neben dem Eingang zum Gebäude aufstellen. Sie bringen darauf\
    \ ein Schild an mit dem Hinweis: «Zur Benützung durch alle Stockwerkeigentümer». Anschliessend leiten\
    \ sie die Rech nung von Huber an die anderen beiden Stockwerkeigentümer weiter mit der Bitte, je einen\
    \ Viertel der Kosten beizutragen; der Velounterstand stehe ja allen zur Verfügung. Da bricht eine\
    \ grosse Diskussion aus. Die Stockwerkeigentümerinnen Carla (C) und Dora (D), Eigentümerin nen der\
    \ Stockwerkeinheiten Nr. 1 und 2, stellen sich auf den Standpunkt, das Aufstellen des Velounterstandes\
    \ sei unzulässig. Nach einigen Diskussionen erklären sie sich bereit, den Velo unterstand zu dulden,\
    \ machen aber klar, dass sie ihn in keiner Weise nutzen wollen. Sie beste hen auf einer sauberen rechtlichen\
    \ Regelung der neuen Situation, wonach ausschliesslich Al fons und Bruno nutzungsberechtigt und allein\
    \ kosten- und unterhaltspflichtig sind. \nWelche Möglichkeiten mit welchem Inhalt sehen Sie, diese\
    \ neue Situation rechtlich zu gestalten?"
  reference: 'I. Nutzungsberechtigung Der Velounterstand wurde neben dem Eingang zum Gebäude fest mit
    dem Boden verbunden, weshalb er einen zwingend gemeinschaftlichen Teil der Liegenschaft betrifft.
    An zwingend gemeinschaftlichen Teilen können keine Sonderrechte begründet werden (Art. 712b Abs. 2
    Ziff. 1 ZGB). Für eine ausschliessliche Nutzung kom men folgende Möglichkeiten in Betracht: • Die
    Stockwerkeigentümer können ein ausschliessliches Nutzungsrecht nach Art. 712g Abs. 4 ZGB vorsehen.
    Dabei handelt es sich um ein obli gatorisches Recht bestimmter Stockwerkeigentümer, bestimmte gemein
    schaftliche Teile ausschliesslich – also unter Ausschluss der übrigen Stockwerkeigentümer – zu nutzen.48
    Die Stockwerkeigentümer können das ausschliessliche Nutzungsrecht entweder im Stockwerkeigentumsreg
    lement (Art. 712g Abs. 2 ZGB) vorsehen oder hierzu einen Beschluss fas sen.49 Nach Art. 712m Abs.
    2 i.V.m. Art. 649a Abs. 1 ZGB sind das Stockwerkeigentumsreglement und die gefassten Beschlüsse auch
    für Rechtsnachfolger eines Stockwerkeigentümers und für Erwerber von dinglichen Rechten an einem Stockwerkeigentumsanteil
    verbindlich. Das Stockwerkeigentumsreglement kann im Grundbuch angemerkt werden (Art. 712g Abs. 3
    ZGB; Art. 649a Abs. 2 ZGB). Hierfür bedarf es gemäss Art. 80 Abs. 1 GBV der Schriftform. Subsumtion:
    Durch Begründung eines ausschliesslichen Nutzungsrechts zugunsten von Alfons und Bruno könnten diese
    den Velounterstand unter Ausschluss der übrigen Stockwerkeigentümer nutzen. Die Einräumung eines ausschliesslichen
    Nutzungsrechts zugunsten von Alfons und Bruno in einem Beschluss oder im Stockwerkeigentümerreglement
    kommt vor liegend in Betracht. Ein solches ausschliessliches Nutzungsrecht gilt auch gegenüber Rechtsnachfolgern.
    Sofern die Einräumung des ausschliessli chen Nutzungsrechts in einem schriftlichen Stockwerkeigentümerregle
    ment erfolgt, kann dies im Grundbuch angemerkt werden. • Ein Grundstück kann zum Vorteil eines anderen
    Grundstücks in der Weise belastet werden, dass sein Eigentümer sich bestimmte Eingriffe des Eigentümers
    dieses anderen Grundstücks gefallen lassen muss (Art. 730 Abs. 1 ZGB; Grunddienstbarkeit). Grundsätzlich
    können die Parteien den Inhalt einer Grunddienstbarkeit frei festlegen.50 Die Ausübung kann auf einen
    Teil des Grundstücks beschränkt werden (Art. 732 Abs. 2 ZGB). Subsumtion: Vorliegend kommt die Errichtung
    einer Grunddienstbarkeit zulasten des Stammgrundstücks und zugunsten der Stockwerkeinheiten Nr. 3
    und 4 von Alfons und Bruno in Betracht. • Personaldienstbarkeiten: o Zunächst kommt die Begründung
    einer Nutzniessung nach Art. 745 ff. ZGB in Frage. Die Ausübung kann auf einen Teil des Grundstücks
    beschränkt werden (Art. 745 Abs. 3 ZGB). Subsumtion: Vorliegend kommt eine Nutzniessung zugunsten
    von Alfons und Bruno – beschränkt auf den Boden unter dem Velounter stand – in Betracht, wäre aber
    wenig praktikabel, weil die Nutznies sung (auch bei einem Verkauf der Stockwerkeigentumseinheiten)
    nicht übertragbar ist. o Weiter kommt die Begründung eines Baurechts nach Art. 779 Abs. 1 ZGB in Frage.
    Subsumtion: Hier könnte am Velounterstand ein Baurecht zugunsten von Alfons und Bruno begründet werden;
    dieses Vorgehen würde sich aber als unverhältnismässig aufwändig erweisen. o Personaldienstbarkeiten
    nach Art. 781 ZGB («Dienstbarkeiten ande ren Inhalts») können zugunsten einer beliebigen Person an
    Grundstü cken bestellt werden, so oft diese in bestimmter Hinsicht jemandem zum Gebrauch dienen können
    (Art. 781 Abs. 1 ZGB). Als Inhalt kommt jedes Duldenmüssen der anderen Stockwerkeigentümer in Be tracht.51
    Die Ausübung kann auf einen Teil des Grundstücks be schränkt werden (Art. 781 Abs. 3 i.V.m. Art. 732
    Abs. 2 ZGB). Subsumtion: Eine Personaldienstbarkeit gemäss Art. 781 ZGB kommt vorliegend zulasten
    des Stammgrundstücks und zugunsten von Alfons und Bruno in Betracht. • Die Sachnutzung kann auch durch
    prekaristische Gestattung eingeräumt werden, was bedeutet, dass die Nutzung «auf Zusehen hin und mit
    dem Vorbehalt des jederzeitigen Widerrufs» erlaubt wird.52 Weiter kann eine Sachnutzung durch obligatorisches
    Rechtsverhältnis vereinbart werden.53 Das Nutzungsrecht richtet sich dann lediglich gegen den Vertragspartner.
    In Betracht kommt beispielsweise die Miete. Subsumtion: Die Stockwerkeigentümergemeinschaft könnte
    Alfons und Bruno die Nutzung des Velounterstands mittels prekaristischer Gestattung oder durch Abschluss
    eines obligatorischen Vertrags erlauben. Allfällige Rechtsnachfolger wären allerdings nicht an eine
    (obligatorische) Verein barung gebunden. II. Kosten- und Unterhaltspflicht • Gemäss Art. 712h Abs.
    1 ZGB haben die Stockwerkeigentümer an die Lasten des gemeinschaftlichen Eigentums und an die Kosten
    der gemein schaftlichen Verwaltung Beiträge nach Massgabe ihrer Wertquoten zu leisten. Diese Verteilung
    nach Wertquoten ist eine dispositive Regelung.54 Nach Art. 712h Abs. 3 ZGB ist bei der Verteilung
    der Kosten aber zu be rücksichtigen, dass bestimmte gemeinschaftliche Bauteile, Anlagen oder Einrichtungen
    einzelnen Stockwerkeinheiten nicht oder nur in ganz gerin gem Masse dienen. Diese Regelung ist zwingend.55
    Sie kommt insbeson dere zur Anwendung, wenn bestimmten Stockwerkeigentümern beson dere Nutzungsrechte
    zustehen.56 Subsumtion: Sofern die Stockwerkeigentümer ein ausschliessliches Nut zungsrecht zugunsten
    von Alfons und Bruno begründen, könnten sie im Reglement bzw. im Beschluss zusätzlich vereinbaren,
    dass die Kosten- und Unterhaltspflicht für den Velounterstand ausschliesslich bei Alfons und Bruno
    liegt. • Art. 741 Abs. 1 ZGB bestimmt, dass der Unterhalt von Vorrichtungen, die zur Ausübung der
    Dienstbarkeit gehören, zulasten des Berechtigten ge hen. Dient die Vorrichtung auch den Interessen
    des Belasteten, so tragen nach Art. 741 Abs. 2 ZGB beide die Last des Unterhalts im Verhältnis ihrer
    Interessen. Art. 741 ZGB ist dispositiver Natur, d.h. die Parteien können auch eine vom Gesetz abweichende
    Vereinbarung treffen.57 Gemäss Art. 765 Abs. 1 ZGB trägt der Nutzniesser die Auslagen für den gewöhnlichen
    Unterhalt. Subsumtion: Sofern die Stockwerkeigentümer eine Grunddienstbarkeit oder eine Personaldienstbarkeit
    nach Art. 779 oder Art. 781 ZGB vereibaren, haben die Dienstbarkeitsberechtigten Alfons und Bruno
    den Velo unterstand zu unterhalten, weil dieser lediglich ihren Interessen und nicht auch den Interessen
    von Carla und Dora dient. Eine von der dispositiven Regelung (Art. 741 Abs. 1 ZGB) abweichende Vereinbarung
    ist also nicht notwendig. Auch im Falle der Begründung einer Nutzniessung führt die gesetzliche Regelung
    dazu, dass Alfons und Bruno für den gewöhnlichen Unterhalt aufkommen müssten. • Im Rahmen einer prekaristischen
    Gestattung könnten Carla und Dora die ausschliessliche Nutzung des Velounterstands seitens Alfons
    und Bruno so lange erlauben, wie diese auch die Kosten und den Unterhalt des Ve lounterstands übernehmen.
    Sofern ein obligatorisches Rechtsverhältnis besteht, können die Parteien (obligatorisch) vereinbaren,
    dass Alfons und Bruno kosten- und unterhaltspflichtig sind.'
