  question: "Im Rahmen eines Strafverfahrens gegen X. wegen Betäubungsmitteldelikten hatte die Kantonspolizei\n\
    Zürich den Auftrag, dessen Wohnung zu durchsuchen. Sie traf die ebenfalls dort wohnhafte 65-jährige\n\
    Mutter des X., Frau M., an. Frau M. wehrte sich gegen den Zutritt der Polizei. Sie gab aus einem\n\
    Fenster ihrer Wohnung – die mitten in einem Wohnquartier liegt – mehrere Schüsse ab. Anschliessend\n\
    verschanzte sie sich während 17 Stunden in der Wohnung. Auf Befehl des Polizeikommandanten\nstürmte\
    \ die Polizei schliesslich die Wohnung, obwohl ein anwesender Polizeipsychologe davon\nabgeraten hatte.\
    \ Die Polizei fand Frau M. leblos im Badezimmer vor. Die Frau hatte sich mit einer\nSchusswaffe das\
    \ Leben genommen. Bei der anschliessenden Begehung der Wohnung fand die Polizei,\nwie sie es vermutet\
    \ hatte, eine Hanfplantage vor. \nSie arbeiten als Juristin/als Jurist in der Sicherheitsdirektion\
    \ des Kantons Zürich, welche die\nAufsicht über die Kantonspolizei ausübt. Der zuständige Regierungsrat\
    \ will den Fall „rigoros und\nkorrekt“ aufklären. Was sagen Sie ihm?"
  reference: '– Aufgrund des Rechts auf Leben i.S.v. Art. 10 Abs. 1 BV (Art. 2 EMRK) besteht die unter
    c. erwähnte justiziable Verpflichtung zur nachträgli- chen Untersuchung des Vorfalls. – Diese Untersuchung
    muss von Amtes wegen erfolgen. Sie muss unabhängig, unparteiisch und effektiv sein. Sie muss öffentlich
    sein und die Parteirechte der Verletzten wahren. Es gilt das Beschleunigungsgebot. Ziel ist die Durchsetzung
    der gesetzlichen Vorgaben zum Schutz des Lebens und des Erhaltens des Vertrauens der Öffentlichkeit
    in die Institutionen. – Umsetzung im Zürcher Recht ist insb. auch durch § 4 Abs. 2 PolZ/ZH erfolgt.
    – Rigorose Aufklärung wird am besten durch Einsetzung eines ausserordentlichen Staatsanwalts in Gestalt
    eines ausserkantonalen Staatsan- walts erreicht. Alternative: Einsetzung eines Staatsanwalts aus einer
    Abteilung, welche nicht so eng mit der Polizei zusammenarbeitet (etwa aus dem Bereich Wirtschaftsdelikte).'
  rubric:
  - – Aufgrund des Rechts auf Leben i.S.v. Art. 10 Abs. 1 BV (Art. 2 EMRK) besteht die unter c. erwähnte
    justiziable Verpflichtung zur nachträgli- chen Untersuchung des Vorfalls. – Diese Untersuchung muss
    von Amtes wegen erfolgen. Sie muss unabhängig, unparteiisch und effektiv sein. Sie muss öffentlich
    sein und die Parteirechte der Verletzten wahren.
  - Es gilt das Beschleunigungsgebot.
  - Ziel ist die Durchsetzung der gesetzlichen Vorgaben zum Schutz des Lebens und des Erhaltens des Vertrauens
    der Öffentlichkeit in die Institutionen. – Umsetzung im Zürcher Recht ist insb. auch durch § 4 Abs.
    2 PolZ/ZH erfolgt. – Rigorose Aufklärung wird am besten durch Einsetzung eines ausserordentlichen
    Staatsanwalts in Gestalt eines ausserkantonalen Staatsan- walts erreicht.
  - 'Alternative: Einsetzung eines Staatsanwalts aus einer Abteilung, welche nicht so eng mit der Polizei
    zusammenarbeitet (etwa aus dem Bereich Wirtschaftsdelikte).'
