  question: "Die A AG hat ein revolutionäres Smartphone-Display entwickelt, welches bei wesentlich ge-\n\
    ringerem Stromverbrauch weitaus bessere Bilder liefert und zudem in der Herstellung günsti-\nger ist\
    \ als alle vorbekannten Displays. Die A AG räumt der B AG eine ausschliessliche Li-\nzenz zur Produktion\
    \ und Vermarktung ein. Der Lizenzvertrag wird schriftlich abgeschlossen.\nDie B AG hat in der Folge\
    \ erhebliche Investitionen getätigt, um ihre Anlagen auf die Produk-\ntion von X auszurichten. Ein\
    \ halbes Jahr nach Abschluss des Lizenzvertrags überträgt die A\nAG ihr Patent an die C AG. \nBestehen\
    \ Ansprüche von B gegen A?"
  reference: 'LV bleibt bestehen, kann aber nicht mehr erfüllt werden. Ermächtigung zur Nutzung geht unter,
    weil der neue Inhaber der Rechte, die C AG, diese nicht gegen sich gelten lassen muss. Verletzung
    der Genusserhaltungspflicht seitens LG Anspruchsgrundlagen: OR 97, Verschulden erforderlich (zu bejahen)
    OR 107 i.V.m. OR 109 Vertragsrücktritt (Wirkung ex nunc), Schadenersatz / Investitionsersatz ZGB 2
    Kündigung aus wichtigem Grund, Schadenersatz / Investitionsersatz'
  rubric:
  - LV bleibt bestehen, kann aber nicht mehr erfüllt werden. Ermächtigung zur Nutzung geht unter, weil
    der neue Inhaber der Rechte, die C AG, diese nicht gegen sich gelten lassen muss.
  - 'Verletzung der Genusserhaltungspflicht seitens LG Anspruchsgrundlagen: OR 97, Verschulden erforderlich
