  question: In welchen drei wesentlichen Punkten wird die bestehende Einlagensicherung gemäss Art. 37h-k
    BankG mit Inkrafttreten per 1. Januar 2023 revidiert?
  reference: Die Banken müssen die Hälfte ihrer Beitragsverpflichtungen gegenüber der Einlagensiche rung
    künftig durch eine Hinterlegung von Wertschriften oder in bar bei einer Verwahrungs stelle absichern.
    [1 Punkt] Die Frist zur Auszahlung der Gelder aus der Einlagensicherung an den Konkursliquidator wird
    von zwanzig auf sieben Tage gekürzt. [1/2 Punkt] Der Maximalbetrag für die Einlagensicherung wird
    auf 1.6% des Totals der versicherten Ein lagen begrenzt. [1/2 Punkt]
  rubric:
  - Die Banken müssen die Hälfte ihrer Beitragsverpflichtungen gegenüber der Einlagensiche rung künftig
    durch eine Hinterlegung von Wertschriften oder in bar bei einer Verwahrungs stelle absichern. [1 Punkt]
    Die Frist zur Auszahlung der Gelder aus der Einlagensicherung an den Konkursliquidator wird von zwanzig
    auf sieben Tage gekürzt. [1/2 Punkt] Der Maximalbetrag für die Einlagensicherung wird auf 1.6% des
    Totals der versicherten Ein lagen begrenzt. [1/2 Punkt]
