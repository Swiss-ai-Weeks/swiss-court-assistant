  question: |-
    Welche Eigentumsform wird durch
    die Gütergemeinschaft an ins Gesamtgut fallenden Vermögenwerten begründet? In wel-
    chem Zeitpunkt erwirbt der Ehegatte des bisherigen Alleineigentümers Eigentum an einem
    ins Gesamtgut fallenden Grundstück?
  reference: 'Eigentumsform 1. Gemeinschaftliche Eigentumsformen Das ZGB sieht zwei Erscheinungsformen
    des gemeinschaftlichen Eigentums vor: das Miteigentum (Art. 646 ff. ZGB) und das Gesamteigentum (Art.
    652 ff. ZGB). Haben mehrere Personen eine Sache nach Bruchteilen und ohne äusserliche Abtei- lung
    in ihrem Eigentum, so sind sie nach Art. 646 Abs. 1 ZGB Miteigentümer. Gesamteigentum setzt nach Art.
    652 ZGB voraus, dass mehrere Personen durch Gesetzesvorschrift oder Vertrag zu einer Gemeinschaft
    verbunden sind (persönli- ches Gemeinschaftsverhältnis) und die Sache kraft dieser Gemeinschaft zu
    ge- meinschaftlichem Eigentum haben. Anders als beim Gesamteigentum ist beim Miteigentum keine vorbestehende
    Rechtsgemeinschaft erforderlich. 2. Entstehung des Gesamthandverhältnisses durch die Begründung der
    Güter- gemeinschaft Durch die Begründung des Güterstands der allgemeinen Gütergemeinschaft ent- steht
    eine gesamthänderische Gemeinschaft (rechtsgeschäftliche Entstehung durch Abschluss des Ehevertrags),
    welche durch die Art. 652–654a ZGB geregelt ist, soweit das Eherecht keine Sondervorschriften aufstellt
    (Art. 653 Abs. 1 ZGB). Nach Art. 221 ZGB umfasst der Güterstand der Gütergemeinschaft das Gesamtgut
    und das Eigengut jedes Ehegatten. Das Gesamtgut gehört den Ehegatten nach Art. 222 Abs. 2 ZGB ungeteilt.
    Die Ehegatten sind folglich Gesamteigentümer nach Art. 652–654a ZGB an den ins Gesamtgut fallenden
    Vermögenswerten. Erwerb von Grundeigentum durch den Ehegatten 1. Regeln über den Erwerb von Grundeigentum
    Für den rechtsgeschäftlichen Erwerb von Grundeigentum bedarf es nach Art. 656 Abs. 1 ZGB der Eintragung
    in das Grundbuch (absolutes Eintragungsprinzip, kon- stitutive Wirkung des Grundbucheintrags). Art.
    656 Abs. 2 ZGB bestimmt aller- dings, dass Grundeigentum in anderen Fällen auch ohne Eintragung im
    Grundbuch übergehen kann (relatives Eintragungsprinzip, deklaratorische Wirkung des Grundbucheintrags).
    Die Gesamteigentümer können erst dann grundbuchlich über das Grundstück verfügen, wenn die Eintragung
    ins Grundbuch erfolgt ist (Art. 656 Abs. 2 ZGB in fine). 2. Zeitpunkt der Entstehung des Gesamteigentums
    Die Aufzählung in Art. 656 Abs. 2 ZGB (Aneignung, Erbgang, Enteignung, Zwangsvollstreckung oder gerichtliches
    Urteil) ist nicht abschliessend. So entsteht auch bei ehevertraglicher Begründung der allgemeinen
    Gütergemeinschaft nach Art. 221 ff. ZGB im Zeitpunkt der Entstehung bzw. des Wechsels des Güterstandes
    (Abschluss des öffentlich beurkundeten Ehevertrags) ausserbuchlich (und von Ge- setzes wegen [Art.
    665 Abs. 3 ZGB]) gemeinschaftliches Eigentum. Der Ehegatte des bisherigen Alleineigentümers erwirbt
    mit dem Abschluss des öffent- lich beurkundeten Ehevertrags und somit im Zeitpunkt der Entstehung
    (oder dem Wechsel) des Güterstands ausserbuchlich Gesamteigentum am Grundstück.'
