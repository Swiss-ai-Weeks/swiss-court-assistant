  question: "Ein Willensvollstrecker verteilt das vorhandene Bankvermögen unter die 5 Erben. Für die\n\
    noch verbleibende Verteilung des wertvollen Schmuckes macht er eine Aufstellung, welcher\n4 Erben\
    \ schriftlich zustimmen. Der fünfte Erbe ist mit der Aufteilung nicht einverstanden. Weil\nder Willensvollstrecker\
    \ keine andere Lösung finden kann, entschliesst er sich, den Schmuck\ngemäss den 4 zustimmenden Erben\
    \ zu verteilen und dem fünften Erben eingeschrieben zu-\nzusenden. Der widersprechende Erbe forderte\
    \ den Willensvollstrecker weiter auf, eine ein-\nvernehmliche Erbteilung herbeizuführen. Darauf entgegnet\
    \ ihm der Willensvollstrecker, dass\ner seinen Ausweis der Aufsichtsbehörde zurückgesandt und ihr\
    \ mitgeteilt habe, die Willens-\n\nvolistreckung sei beendet.\n \nWenn ein Erbe behauptet, die Erbteilung\
    \ sei noch nicht vollständig vollzogen, muss\ndann der Willensvollstrecker beweisen, dass die Erbteilung\
    \ vollzogen wurde?"
  reference: Nein, derjenige, welche eine Behauptung aufstellt, muss diese beweisen, vgl. Art. 8 ZGB
  rubric:
  - Nein, derjenige, welche eine Behauptung aufstellt, muss diese beweisen, vgl. Art. 8 ZGB
