  question: "In der Gemeinde Y befindet sich die Talstation einer – seit 1972 mit einer Personenbeförde-\n\
    rungskonzession des Bundes betriebenen – Kabinenseilbahn. Die Talstation der im Eigen-\ntum der P-AG\
    \ stehende Luftseilbahn befindet sich am Rand der Wohn- und Gewerbezone\nW4. Daran grenzt die Wohnzone\
    \ W3, in der nur nicht störende Betriebe zulässig sind. In\ndieser Wohnzone steht das Mehrfamilienhaus\
    \ des A, welches im Jahr 1984 erstellt wurde\nund seither tagsüber durch den Betrieb der Kabinenseilbahn\
    \ von Lärmimmissionen von 64\ndB(A) betroffen ist. Die Immissionen beim Gebäude von A werden insbesondere\
    \ durch die\nÜberfahrt der Kabinen über einen nahegelegenen Mast erzeugt.\nDie etwas in die Jahre\
    \ gekommene Seilbahnanlage wurde im Herbst 2018 totalerneuert\n(Kabinen, Stützen, Masten, Seile).\
    \ Die Tal- und die Bergstation wurden abgerissen und\nleicht vergrössert wiederaufgebaut. Dadurch\
    \ konnte eine Verdoppelung der Fahrgeschwin-\ndigkeit und der Förderleistung erreicht werden. Die\
    \ bei der Überfahrt über die Masten er-\nzeugten Geräusche konnten durch modernstes Material vermindert\
    \ werden, blieben wegen\nder Verdoppelung der Förderleistung insgesamt aber gleich laut. Beim Gebäude\
    \ von A be-\nträgt die Belastung deshalb weiterhin 64 dB(A). Die zuständige Behörde verpflichtete\
    \ die\nP-AG, die Kosten für den Einbau von Schallschutzfenstern in das Mehrfamilienhaus des A\nzu\
    \ tragen. \nWie beurteilen Sie die Rechtmässigkeit dieser Verpflichtung? (Beachten Sie, dass für Luft-\n\
    seilbahnen die Grenzwerte für Industrie- und Gewerbelärm massgebend sind.)"
  reference: 'Das Mehrfamilienhaus von A befindet sich in der Wohnzone W3, in der nicht störende Be- triebe
    zulässig sind, und damit in einer Zone mit Empfindlichkeitsstufe II (Art. 43 Abs. 1 lit. b LSV). Da
    der Lärm von einer Luftseilbahn erzeugt wird, sind gemäss Anh. 6 Ziff. 1 Abs. 2 LSV die Belastungsgrenzwerte
    für Industrie- und Gewerbelärm einschlägig. Mit 64 dB(A) überschreiten die Lärmimmissionen der Luftseilbahn
    beim Mehrfamilienhaus des A tagsüber den nach Anh. 6 Ziff. 2 LSV für die Empfindlichkeitsstufe II
    gelten- den Immissionsgrenzwert von 60 dB(A) deutlich. Da dieser Wert bereits im Jahr 1984 und damit
    vor Inkrafttreten des USG (am 1. Januar 1985) überschritten war, handelte es sich bei der seit 1972
    betriebenen Kabinenseilbahn ursprünglich um eine sanierungsbedürftige ortsfeste Altanlage. Zu prüfen
    ist, ob die Totalerneuerung der Anlage eine neubauähnliche Änderung und damit einen Anwendungsfall
    von Art. 25 USG darstellt. Darunter fallen gemäss Rechtspre- chung bestehende Anlagen, die in konstruktiver
    oder funktionaler Beziehung soweit verän- dert werden, dass das, was von der bisherigen Anlage weiterbesteht,
    von geringerer Bedeu- tung erscheint als der erneuerte Teil. Gemäss Sachverhalt wurden Kabinen, Stützen,
    Masten, Seile totalerneuert und die Tal- und die Bergstation wurden abgerissen und leicht vergrössert
    wiederaufgebaut, was insgesamt eine bedeutende Veränderung in konstruktiver Hinsicht darstellt. Mit
    der Erneuerung gingen zudem Verdoppelungen von Geschwin- digkeit und Kapazität einher, was zusätzlich
    für eine Veränderung in funktionaler Hinsicht sprechen könnte. Der erneuerte Teil erscheint angesichts
    dessen insbesondere in kon- struktiver Beziehung von grösserer Bedeutung als der bisherige, womit
    eine neubauähn- liche Änderung und damit ein Anwendungsfall von Art. 25 USG vorliegt. Nach Art. 25
    Abs. 3 USG müssen auf Kosten des Eigentümers (präziser: des Inhabers [Art. 11 Abs. 1 LSV]) der Anlage
    die vom Lärm betroffenen Gebäude durch Schallschutz- fenster oder ähnliche bauliche Massnahmen geschützt
    werden, wenn: − es sich um eine öffentliche oder konzessionierte ortsfeste Anlage handelt; − die Immissionsgrenzwerte
    durch Massnahmen an der Quelle nicht eingehalten wer- den können. Als konzessioniert im Sinne von
    Art. 25 Abs. 3 USG gilt jede Anlage, deren Inhaber Träger einer Sondernutzungs- oder Monopolkonzession
    ist. Gemäss Sachverhalt wird die Seilbahn der P-AG aufgrund einer Personenbeförderungskonzession –
    und damit einer Monopolkon- zession – betrieben. Der Immissionsgrenzwert von 60 dB(A) ist beim Mehrfamilienhaus
    von A mit 64 dB(A) weiterhin deutlich überschritten. Da die Lärmquelle durch die Verwendung von moderns-
    tem Material bereits optimiert worden ist, dürften bei einer Seilbahn weitere Massnah- men an der
    Quelle – beispielsweise die Erstellung einer Lärmschutzwand – ausser Betracht fallen. Es ist daher
    davon auszugehen, dass die Immissionsgrenzwerte mit Massnahmen an der Quelle nicht eingehalten werden
    können. Die P-AG ist damit als Inhaberin der Personenbeförderungskonzession nach Art. 25 Abs. 3 USG
    kostentragungspflichtig. Fazit: Die Verpflichtung ist rechtmässig. Würde es sich bei der Luftseilbahn
    auch nach der Änderung im Jahr 2018 noch um eine Altanlage handeln, käme eine Kostentragungspflicht
    für den Einbau von Schallschutzfens- tern nur unter den Voraussetzungen von Art. 20 USG in Betracht.
    Sie würde daran schei- tern, dass Art. 20 Abs. 1 USG eine Überschreitung der Alarmwerte und nicht
    nur der Im- missionsgrenzwerte verlangt. Im Übrigen würde der P-AG die Entlastung nach Art. 20 Abs.
    2 lit. a USG gelingen, da zum Zeitpunkt der Baueingabe des betroffenen Gebäudes die Immissionsgrenzwerte
    schon überschritten wurden.'
