  question: |-
    Unter welchen Voraussetzungen darf eine Bank in der Schweiz ihrer ebenfalls beauf-
    sichtigten ausländischen Muttergesellschaft nicht öffentlich zugängliche Angaben
    übermitteln?
  reference: Gemäss Art. 4quinquies Abs. 1 BankG darf die Bank in der Schweiz ihrer ebenfalls beaufsichtig-
    ten ausländischen Muttergesellschaft nicht öffentlich zugängliche Angaben, die für die Kon- zernüberwachung
    nötig sind, übermitteln, sofern die Muttergesellschaft und die ausländische Aufsichtsbehörde an das
    Amts- oder Berufsgeheimnis gebunden sind (Vertraulichkeitsprin- zip), und die Informationen nur für
    die interne Kontrolle und direkte Aufsicht verwendet wer- den (Spezialitätsprinzip).
  rubric:
  - Gemäss Art. 4quinquies Abs. 1 BankG darf die Bank in der Schweiz ihrer ebenfalls beaufsichtig- ten
    ausländischen Muttergesellschaft nicht öffentlich zugängliche Angaben, die für die Kon- zernüberwachung
    nötig sind, übermitteln, sofern die Muttergesellschaft und die ausländische Aufsichtsbehörde an das
    Amts- oder Berufsgeheimnis gebunden sind (Vertraulichkeitsprin- zip), und die Informationen nur für
    die interne Kontrolle und direkte Aufsicht verwendet wer- den (Spezialitätsprinzip).
