  question: "Seit ca. Mitte des 19. Jh. betreibt der Staat Kulturpolitik, fördert die Kunst aber in\n\
    unterschiedlich grossem Ausmass. \nWie könnte der Staat diesen Gefahren entgegenwirken? Erläutern\
    \ Sie im Rahmen\nIhrer Antwort die institutionelle Interpretation der verfassungsrechtlich garantierten\n\
    Kunstfreiheit."
