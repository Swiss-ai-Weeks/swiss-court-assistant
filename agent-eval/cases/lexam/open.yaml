  question: Welche Voraussetzungen eines Anspruchs aus Vertrauenshaftung er geben sich aus den in dieser
    Veranstaltung besprochenen Urteilen zur Vertrauenshaftung (BGE 105 II 75 ff., BGE 120 II 331 ff.,
    BGE 130 III 345 ff. und BGer 4A_306/2009 vom 8. Februar 2010)?
  reference: 'Das Bundesgericht leitet die Vertrauenshaftung aus Art. 2 Abs. 1 ZGB ab. Sie unterliegt
    folgenden Voraussetzungen: (1) Es bedarf eines Verhaltens, welches bestimmte, konkrete Erwartungen
    begründet (Vertrauenstatbestand) (BGE 105 II 75, E. 2.b; BGE 120 II 331, E. 5.a; BGE 130 III 345,
    E. 2.1; BGer 4A_306/2009 vom 8. Februar 2010, E. 5.1). Der Ver trauenstatbestand muss gegenüber dem
    zu Verpflichtenden zurechenbar sein (sie he BGE 120 II 331, E. 5.c.bb). Weiter muss der Vertrauenstatbestand
    auf den Ver trauenden ausgerichtet sein (BGE 120 II 331, E. 5.a und 5.b; BGE 130 III 345, E. 2.2).
    Schliesslich gilt das Erfordernis einer rechtlichen Sonderverbindung zwischen den Beteiligten (BGE
    120 II 331 E. 5a; BGE 130 III 345, E. 2.2 und 3.1 f.; BGer 4A_306/2009 vom 8. Februar 2010, E. 5.1).
    (2) Der Geschädigte muss berechtigterweise vertraut haben. Wer bloss Opfer seiner eigenen Unvorsichtigkeit
    oder Vertrauensseligkeit ist, oder wenn der Schaden aus der Verwirklichung allgemeiner Geschäftsrisiken
    resultiert, verdient keinen Schutz (BGE 120 II 331, E. 5.a; BGer 4A_306/2009 vom 8. Februar 2010,
    E. 5.1). (3) Das Vertrauen muss enttäuscht werden (BGE 120 II 331, E. 5.a und 5.c; BGE 130 III 345,
    E. 2.1; BGer 4A_306/2009 vom 8. Februar 2010, E. 5.1). Dafür bedarf es einer Verletzung der durch
    das Erwecken berechtigten Vertrauens be gründeten Pflichten. (4) Der Geschädigte muss aufgrund des
    Vertrauens sich als nachteilig erweisende Dispositionen vorgenommen haben (BGE 120 II 331, E. 5.b;
    BGE 130 III 345, E. 2.1; BGer 4A_306/2009 vom 8. Februar 2010, E. 5.2). (5) Es muss ein Schaden entstanden
    sein (BGE 105 II 75, E. 3; BGE 120 II 331, E. 5.a; BGE 130 III 345, E. 2.2 und 2.5; BGer 4A_306/2009
    vom 8. Februar 2010, E. 5.1). (6) Der Schädiger hat nur für den Schaden einzustehen, den er in adäquat
    kausaler Weise verursacht (BGE 120 II 331, E. 5.a, ferner auch E. 6; BGE 130 III 345, E. 2.1). (7)
    Schliesslich wird Verschulden verlangt (BGE 130 III 345, E. 2.2).'
  rubric:
  - 'Das Bundesgericht leitet die Vertrauenshaftung aus Art. 2 Abs. 1 ZGB ab. Sie unterliegt folgenden
    Voraussetzungen: (1) Es bedarf eines Verhaltens, welches bestimmte, konkrete Erwartungen begründet
    (Vertrauenstatbestand) (BGE 105 II 75, E. 2.b; BGE 120 II 331, E. 5.a; BGE 130 III 345, E. 2.1; BGer
    4A_306/2009 vom 8. Februar 2010, E. 5.1).'
  - Der Ver trauenstatbestand muss gegenüber dem zu Verpflichtenden zurechenbar sein (sie he BGE 120 II
    331, E. 5.c.bb). Weiter muss der Vertrauenstatbestand auf den Ver trauenden ausgerichtet sein (BGE
    120 II 331, E. 5.a und 5.b; BGE 130 III 345, E. 2.2).
  - Schliesslich gilt das Erfordernis einer rechtlichen Sonderverbindung zwischen den Beteiligten (BGE
    120 II 331 E. 5a; BGE 130 III 345, E. 2.2 und 3.1 f.; BGer 4A_306/2009 vom 8. Februar 2010, E. 5.1).
    (2) Der Geschädigte muss berechtigterweise vertraut haben.
  - Wer bloss Opfer seiner eigenen Unvorsichtigkeit oder Vertrauensseligkeit ist, oder wenn der Schaden
    aus der Verwirklichung allgemeiner Geschäftsrisiken resultiert, verdient keinen Schutz (BGE 120 II
