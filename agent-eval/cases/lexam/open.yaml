  question: "E ist Eritreer und reist illegal aus Eritrea aus. Weil er befürchtet, eine Rückkehr nach\
    \ Eritrea sei wegen dieser Ausreise nun zu gefährlich, beantragt er in der Schweiz Asyl. Er geht da\
    \ von aus, dass im Falle einer Rückkehr eine Gefahr einer flüchtlingsrechtlich relevanten Be strafung\
    \ bestehe. \nWelcher Problemkomplex ist bei Es Verhalten angesprochen?"
  reference: '- E macht sinngemäss Furcht vor ernsthaften Nachteilen im Sinne von Art. 3 AsylG gel tend;
    die (mögliche) Gefährdungssituation ist durch die Ausreise beziehungsweise deren Folgen entstanden.
    - Wer sich auf eine Gefährdungssituation beruft, die durch eigenes Verhalten nach der Ausreise aus
    dem Heimat- oder Herkunftsstaat (etwa durch ein illegales Verlassen des Landes wie i.c.) geschaffen
    worden ist, macht subjektive Nachfluchtgründe im Sinne von Art. 54 AsylG geltend.'
  rubric:
  - E macht sinngemäss Furcht vor ernsthaften Nachteilen im Sinne von Art. 3 AsylG gel tend; die (mögliche)
    Gefährdungssituation ist durch die Ausreise beziehungsweise deren Folgen entstanden.
  - Wer sich auf eine Gefährdungssituation beruft, die durch eigenes Verhalten nach der Ausreise aus dem
    Heimat- oder Herkunftsstaat (etwa durch ein illegales Verlassen des Landes wie i.c.) geschaffen worden
    ist, macht subjektive Nachfluchtgründe im Sinne von Art. 54 AsylG geltend.
