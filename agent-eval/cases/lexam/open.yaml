  question: "Die Sicherheitsdirektion des Kantons Zürich beabsichtigt, in einem bestehenden Mehrfami-\n\
    lienhaus in der Gemeinde X bis zu 90 Asylsuchende unterzubringen. Hierzu schloss sie mit\nder Eigentümerschaft\
    \ des Mehrfamilienhauses einen entsprechenden Mietvertrag ab.\nDas Gebäude besteht aus vierzehn Wohnungen,\
    \ nämlich aus zwölf 3½-Zimmerwohnungen\nund zwei 5½-Zimmerwohnungen. Es befindet sich in der Wohn-\
    \ und Gewerbezone der\nGemeinde X, in welcher gemäss kommunaler Bau- und Zonenordnung (BZO) Wohnen\n\
    sowie mässig störende Gewerbe- und Dienstleistungsbetriebe zulässig sind; ausdrücklich\nverboten sind\
    \ einzig Betriebe des Sexgewerbes wie Massagesalons, Erotikmärkte und der-\ngleichen (Art 8 BZO).\n\
    Bei den maximal 90 Asylsuchenden, die im Gebäude untergebracht werden sollen, handelt\nes sich vor\
    \ allem um Familien oder Frauen mit Kindern. Sie sollen dort bis zum definitiven\nAbschluss des Asylverfahrens\
    \ leben, also je nachdem während einiger Wochen, Monate\noder Jahre. Die Asylsuchenden würden auf\
    \ die Wohnungen aufgeteilt, im Familienverbund\nkochen (keine Gemeinschaftsküche) und dort schlafen.\
    \ Tagsüber könnten sie an Beschäfti-\ngungsprogrammen teilnehmen und Deutschkurse absolvieren; schulpflichtige\
    \ Kinder wür-\nden die Schule besuchen. Zur Betreuung der Asylsuchenden soll im Erdgeschoss – ohne\n\
    bauliche Änderungen – ein kleines Büro eingerichtet werden, in dem tagsüber ein bis zwei\nPersonen\
    \ tätig sein sollen.\nNachdem der Gemeinderat X (Gemeindeexekutive) von der Absicht der kantonalen\
    \ Sicher-\nheitsdirektion erfahren hatte, verfügte er, dass die Sicherheitsdirektion für die Nutzungsän-\n\
    derung (Eröffnung einer Unterkunft für Asylsuchende) ein Baugesuch einzureichen habe\nund dass die\
    \ Wohnungen bis zum rechtskräftigen Abschluss des Baubewilligungsverfah-\nrens nicht durch Asylbewerber\
    \ bezogen werden dürfen. \nIst das Vorhaben der Sicherheitsdirektion baubewilligungspflichtig?"
  reference: 'Vgl. BGer, Urteil 1C_395/2015 vom 7. Dezember 2015 Gemäss Art. 22 Abs. 1 RPG dürfen Bauten
    und Anlagen nur mit behördlicher Bewilligung errichtet "oder geändert" werden. Als bewilligungspflichtige
    Änderungen von Bauten bzw. Anlagen fallen nicht nur eigentliche bauliche Veränderungen, sondern auch
    blosse Nutzungsänderungen in Betracht, wenn diese relevante Auswirkungen auf Raum oder Umwelt haben.
    Im Kanton Zürich ist dies in § 309 Abs. 1 lit. b PBG explizit festgehalten. Im vorliegenden Fall soll
    das Mehrfamilienhaus nicht mehr als normales Wohngebäude, sondern als Unterkunft für Asylsuchende
    genutzt werden. Es stellt sich deshalb die Frage, ob dies eine baurechtlich relevante Nutzungsänderung
    darstellt. Diese Frage lässt sich nicht eindeutig beantworten; sie kann sowohl bejaht als auch verneint
    werden (beide Lösungswege werden als gleichwertig beurteilt): ‒ Argumente für eine relevante Nutzungsänderung:
    o Die Nutzungsintensität wird stark erhöht. Unter der (vagen) Annahme, dass in einer 3½-Zimmerwohnung
    im Durchschnitt zwei und in einer 5½-Zimmerwohnung im Durchschnitt 3,5 Personen leben, käme man in
    einem normalen Mehrfamilienhaus auf 31 Bewohnerinnen und Bewohner. Stattdessen sollen nun 90 Personen
    – also rund dreimal soviel – im Gebäude einquartiert werden. Dadurch ist auch zwangsläu- fig mit stärkeren
    Lärmimmissionen in der Umgebung und mit einer höheren Ver- kehrsbelastung zu rechnen. o Die Änderung
    im Erdgeschoss stellt eine Änderung von einer Wohnnutzung (bisher) in eine Büronutzung (neu) dar.
    Auch wenn damit keine baulichen Veränderungen verbunden sind und die Ausmasse der Bürofläche (für
    ein bis zwei Personen) eher ge- ring sein dürften, handelt es sich um eine Änderung der Nutzungsart
    und damit um eine baurechtlich relevante Nutzungsänderung. o Im Zweifelsfall ist die Bewilligungspflicht
    eher zu bejahen, damit im Rahmen eines Baubewilligungsverfahrens geprüft werden kann, ob das Vorhaben
    materiell rechts- konform ist. ‒ Argumente gegen eine relevante Nutzungsänderung: o Die Nutzungsart
    an sich – Wohnnutzung – wird insgesamt nicht verändert. Zudem handelt es sich um eine Art von Wohnnutzung,
    die einer "normalen" sehr ähnlich ist: Im Gebäude sollen vor allem Familien und Frauen mit Kindern
    untergebracht wer- den, und dies nicht nur kurzfristig, sondern mittel- bis langfristig. Zudem soll
    das Wohnen in familienähnlichen Strukturen stattfinden. o Zwar wird die Nutzung intensiviert, doch
    stellt dies auch ansonsten innerhalb der gleichen Nutzungsart keinen baurechtlich relevanten Bewilligungstatbestand
    dar, so- fern nicht weitere Gesichtspunkte (z.B. deutlich stärkere Lärmbelastung, deutlich stärkere
    Beanspruchung der Erschliessung) hinzukommen, womit hier aber eher nicht zu rechnen ist. o Da die
    BZO in der fraglichen Zone mässig störende Betriebe zulässt, ist gemäss Art. 43 Abs. 1 lit. c LSV
    die Lärmempfindlichkeitsstufe III massgebend, welche "immissionstoleranter" ist als die ES II, auch
    in Bezug auf Veränderungen der Immissionsbelastung. o Im Erdgeschoss erfolgt zwar eine Nutzungsänderung
    (Büronutzung statt Wohnnut- zung), aber nur in sehr geringfügigem Ausmass und nur zur Ermöglichung
    der neuen Form von Wohnnutzung (Betreuung der Bewohnerinnen und Bewohner). Sie ist ge- samthaft von
    so untergeordneter Bedeutung, dass sie für die Frage der Bewilligungs- pflicht nicht in Betracht fällt.
    Ergebnis: Je nach eingenommener Betrachtungsweise ist die Bewilligungspflicht zu beja- hen oder (mit
    dem Bundesgericht) zu verneinen.'
  rubric:
  - Vgl. BGer, Urteil 1C_395/2015 vom 7. Dezember 2015 Gemäss Art. 22 Abs. 1 RPG dürfen Bauten und Anlagen
    nur mit behördlicher Bewilligung errichtet "oder geändert" werden. Als bewilligungspflichtige Änderungen
    von Bauten bzw. Anlagen fallen nicht nur eigentliche bauliche Veränderungen, sondern auch blosse Nutzungsänderungen
    in Betracht, wenn diese relevante Auswirkungen auf Raum oder Umwelt haben. Im Kanton Zürich ist dies
    in § 309 Abs. 1 lit. b PBG explizit festgehalten.
  - 'Im vorliegenden Fall soll das Mehrfamilienhaus nicht mehr als normales Wohngebäude, sondern als Unterkunft
    für Asylsuchende genutzt werden. Es stellt sich deshalb die Frage, ob dies eine baurechtlich relevante
    Nutzungsänderung darstellt. Diese Frage lässt sich nicht eindeutig beantworten; sie kann sowohl bejaht
    als auch verneint werden (beide Lösungswege werden als gleichwertig beurteilt): ‒ Argumente für eine
    relevante Nutzungsänderung: o Die Nutzungsintensität wird stark erhöht.'
  - Unter der (vagen) Annahme, dass in einer 3½-Zimmerwohnung im Durchschnitt zwei und in einer 5½-Zimmerwohnung
    im Durchschnitt 3,5 Personen leben, käme man in einem normalen Mehrfamilienhaus auf 31 Bewohnerinnen
    und Bewohner. Stattdessen sollen nun 90 Personen – also rund dreimal soviel – im Gebäude einquartiert
    werden.
  - Dadurch ist auch zwangsläu- fig mit stärkeren Lärmimmissionen in der Umgebung und mit einer höheren
    Ver- kehrsbelastung zu rechnen. o Die Änderung im Erdgeschoss stellt eine Änderung von einer Wohnnutzung
    (bisher) in eine Büronutzung (neu) dar.
  - 'Auch wenn damit keine baulichen Veränderungen verbunden sind und die Ausmasse der Bürofläche (für
    ein bis zwei Personen) eher ge- ring sein dürften, handelt es sich um eine Änderung der Nutzungsart
    und damit um eine baurechtlich relevante Nutzungsänderung. o Im Zweifelsfall ist die Bewilligungspflicht
    eher zu bejahen, damit im Rahmen eines Baubewilligungsverfahrens geprüft werden kann, ob das Vorhaben
    materiell rechts- konform ist. ‒ Argumente gegen eine relevante Nutzungsänderung: o Die Nutzungsart
    an sich – Wohnnutzung – wird insgesamt nicht verändert.'
