    als relatives Wagnis darstellt. Das ist eine Wertungsfrage unter Einschluss aller äusseren Umstände.
    Als problematische Punkte gemäss Sachverhalt erscheinen:  ▪ Der Bergstrom führte sehr viel Wasser.
    Es war somit von Anfang an erkennbar, dass vom Fluss eine gewisse Gefahr ausgeht. Will man diese Gefahr
