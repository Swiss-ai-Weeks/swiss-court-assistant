  - 7. Ergebnis M kann sich erfolgreich auf Art. 973 ZGB berufen, weshalb A bzw. die KESB mit der Grundbuchberichtigungsklage
    nicht durchdringen wird. Das zulasten des Grundstücks Nr. 100 eingetragene Parkplatzbenützungsrecht
    zugunsten von M bleibt bestehen. 8. Abgrenzung 8.1 Abgrenzung zur Grundbuchbeschwerde (Art. 956a ZGB)
    Gemäss Art. 956a Abs. 3 ZGB kann gegen eine im Hauptbuch vollzogene Eintra gung, Änderung oder Löschung
    von dinglichen Rechten oder Vormerkungen keine Beschwerde mehr geführt werden. Vorliegend kommt eine
    Grundbuchbeschwerde nicht infrage, weil das Parkplatz benützungsrecht bereits im Grundbuch eingetragen
    ist. 8.2 Abgrenzung zur Berichtigung (Art. 977 ZGB) Ein Eintrag kann gemäss Art. 977 ZGB dann berichtigt
    werden, wenn eine Dis krepanz zwischen der mängelfreien Anmeldung bzw. den zugehörigen Belegen und
    dem vollzogenen Grundbucheintrag besteht.35 Vorliegend erfolgte die Eintragung des Parkplatzbenützungsrechts
    entsprechend der Anmeldung samt Belegen korrekt, weshalb die Berichtigung nicht einschlägig ist.
