  question: "Eine deutsche Freundin von Ihnen ist Künstlerin. Sie verkaufte Ihnen vor einigen Jahren ein\n\
    Gemälde, welches sie extra für Ihr Wohnzimmer angefertigt hat. Mittlerweile hat die\nKünstlerin internationale\
    \ Bekanntheit erlangt und ihre Werke erzielen auf dem Kunstmarkt\nhohe Preise. \nSie würden das Bild\
    \ gerne verkaufen, Ihre Freundin wehrt sich jedoch\ndagegen, da ihr das Gemälde nicht mehr gefällt\
    \ und sie nicht will, dass es auf dem\nKunstmarkt als eines ihrer Bilder identifiziert wird. Kann\
    \ sich die Künstlerin auf das\nURG berufen?"
