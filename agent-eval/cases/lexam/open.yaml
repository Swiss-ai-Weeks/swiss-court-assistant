  question: |-
    Was ist unter dem Aspekt des «moral hazard» in Zusammenhang mit der Systemrele-
    vanz von Banken zu verstehen und weshalb ist dieser Effekt problematisch?
  reference: Systemrelevante Finanzinstitute können davon ausgehen, dass sie im Falle einer finanziellen
    Schieflage durch staatliche Interventionen gestützt werden, weil sie für den Finanz- und Werk- platz
    von wesentlicher Bedeutung sind. Diese Unterstützung durch den Staat ist ordnungspolitisch problematisch,
    weil sie Anreize für ein übermässig riskantes Geschäftsgebahren der betreffenden Institute schafft,
    den Wettbe- werb verzerrt und den Staatshaushalt belastet, indem durch die faktische Staatsgarantie
    ge- wisse Risiken unentgeltlich auch die Volkswirtschaft bzw. den Steuerzahler übertragen wer- den.
  rubric:
