  - Als erstes ist die Mindestrestwassermenge nach Art. 31 GSchG zu bestimmen, die nach einer Wasserentnahme
    mindestens im Fliessgewässer verbleiben muss. Bei einem Fliessgewässer mit einer Abflussmenge Q347
