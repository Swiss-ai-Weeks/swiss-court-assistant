- id: lexam-open-615bcaed
  suite: lexam_open
  area: Public
  language: de
  level: exam
  question: "Herr M. und Frau F. sind am 20. April 2020 mit zwei alten, mit Luft gefüllten Traktorreifen\
    \ an einer zugänglichen Stelle in den Fluss «Bergstrom» eingestiegen und haben sich den Fluss heruntertreiben\
    \ lassen. Da der Fluss aufgrund der Schneeschmelze sehr viel Wasser geführt hatte, versprachen sich\
    \ M. und F. eine rasante und actiongeladene Fahrt auf dem Bergstrom. Die aufgepumpten Traktorreifen\
    \ liessen sich im reissenden Gewässer nicht wie ursprünglich gedacht steuern. M. und F. trieben folglich\
    \ völlig unkontrolliert den Bergstrom hinunter. Bei einer grösseren Stromschnelle kam es zum tragischen\
    \ Zwischenfall: M. und F. konnten sich nicht mehr in ihren Reifen halten und wurden in den eiskalten\
    \ Bergstrom geschleudert. Zum Glück wurde der Zwischenfall von einem Wanderer auf einer Brücke beobachtet,\
    \ der umgehend die Rettungskräfte alamierte. M. hatte Glück im Unglück. Er konnte von den Rettern\
    \ völlig unterkühlt aus dem Bergstrom herausgezogen und ins Spital gebracht werden. Dort musste er\
    \ aufgrund seiner Unterkühlung zwei Tage zur Kontrolle bleiben. Andere Verletzungen wies M. nicht\
    \ auf. Danach konnte er seine Arbeit als Angestellter einer Landmaschinenfirma wieder normal aufnehmen.\
    \ F. hingegen traf es schlimmer. Sie schlug beim Kentern ihres Reifens mit dem Kopf an einem hervorstehenden\
    \ Gesteinsbrocken und trieb minutenlang bewusstlos im Wasser. Als die Retter sie aus dem Fluss bergen\
    \ konnten, konnte sie zwar reanimiert werden, jedoch wurden im Spital bleibende Hirnverletzungen festgestellt.\
    \ F. wird für immer zu 100% arbeitsunfähig bleiben und nicht mehr in ihre Tätigkeit als angestellte\
    \ Verkaufsleiterin einer Supermarktkette zurückkehren. Die zuständigen Sozialversicherungsträger stellen\
    \ sich auf den Standpunkt, dass sie keinerlei \nLeistungspflicht treffe, weil sich M. und F. freiwillig\
    \ einer ernsthaften Gefahr ausgesetzt hätten \nund es gröbster Unsinn sei, mit Reifen einen Fluss\
    \ zu befahren. In diesen Fällen sei es rechtlich \nzulässig, jegliche Leistungspflicht zu verneinen.\
    \  \nM. und F. fragen Sie, ob es stimmt, dass die zuständigen Sozialversicherer in ihren Fällen jegliche\
    \ Leistungen verneinen dürfen? Benennen Sie die vorliegend in Frage kommenden Leistungen und äussern\
    \ Sie sich zu allfällig zulässigen Reduktions- oder Verweigerungsgründen seitens des Sozialversicherungsträgers."
  reference: 'In Frage kommende Leistungen  M. und F. mussten aufgrund des Unfallereignisses (vgl. Frage
    1) in einem Spital behandelt werden. Folglich geht es einmal um die Kosten der Heilbehandlung (Art.
    10 Abs. 1 lit. c UVG).  Der Taggeldanspruch entsteht erst am dritten Tag nach dem Unfalltag (Art.
    16 Abs. 2 UVG). Da M. am dritten Tag nach dem Unfall bereits wieder arbeiten ging, besteht kein Taggeld
    anspruch. F. wird gemäss Sachverhalt zu 100% arbeitsunfähig bleiben. Folglich wird ihr (während einer
    gewissen Zeit) ein Taggeld der Unfallversicherung ausgerichtet.  F. wird mit ihren Hirnverletzungen
    nicht mehr als Verkaufsleiterin arbeiten können. Ob sie einer anderen Tätigkeit je wieder (zumindest
    teilweise) arbeitsfähig sein wird, ist offen. Bei einer dauerhaften Einschränkung der Erwerbsfähigkeit,
    dürfte auch eine Invalidenrente der Unfallversicherung zur Diskussion stehen.  (Wird auch noch die
    Integritätsentschädigung gemäss Art. 24 UVG erwähnt)  Verweigerung und Kürzung der Leistungen  Die
    Verweigerung und Kürzung der Leistungen in der Unfallversicherung werden in Art. 37 39 UVG und Art.
    48–50 UVV umschrieben.  Nach Art. 39 UVG kann der Bundesrat aussergewöhnliche Gefahren und Wagnisse
    bezeich nen, die in der Versicherung der Nichtberufsunfälle zur Verweigerung sämtlicher Leistungen
    oder zur Kürzung der Geldleistungen führen.  Nach Art. 50 Abs. 1 UVV werden bei Nichtberufsunfällen,
    die auf ein Wagnis zurückgehen, die Geldleistungen um die Hälfte gekürzt und in besonders schweren
    Fällen verweigert.  Nach Art. 50 Abs. 2 UVV sind Wagnisse Handlungen, mit denen sich der Versicherte
    einer besonders grossen Gefahr aussetzt, ohne die Vorkehren zu treffen oder treffen zu können, die
    das Risiko auf ein vernünftiges Mass beschränken.  Subsumtion:  Gekürzt werden können jedenfalls nur
    Leistungen bei Nichtberufsunfällen und in Form von Geldleistungen. I.c. liegen Nichtberufsunfälle
    vor, da sie in der Freizeit von M. und F. passiert sind. Bei M. bestehen allerdings nur Heilbehandlungskosten,
    die als Sachleistungen nicht gekürzt werden dürfen.  Bei F. bestehen Geldleistungen in Form der Taggelder
    und evtl. der Invalidenrente. Diese können gekürzt werden, wenn es sich beim Unfallhergang um ein
    Wagnis gehandelt hat.  Grundsätzlich unterscheidet man zwischen absoluten und relativen Wagnissen,
    wobei bei den absoluten Wagnissen das Risiko und die Gefahren unabhängig von den konkreten Ver hältnissen
    nicht auf ein vernünftiges Mass herabgesetzt werden können (vgl. Wortlaut Art. 50 Abs. 2 UVV). Bei
    relativen Wagnissen können die Gefahren durch die handelnde Per son auf ein vernünftiges Mass reduziert
    werden. Es ist zu prüfen, ob nach den persönlichen Fähigkeiten und der Art der Durchführung eine Gefahrenherabsetzung
    möglich gewesen wäre und diese unterlassen wurde. Diskutiert werden muss, ob das Befahren eines eiskalten
    Flusses mit einem luftgefüllten Reifen zumindest als relatives Wagnis darstellt. Das ist eine Wertungsfrage
    unter Einschluss aller äusseren Umstände. Als problematische Punkte gemäss Sachverhalt erscheinen:  ▪
    Der Bergstrom führte sehr viel Wasser. Es war somit von Anfang an erkennbar, dass vom Fluss eine gewisse
    Gefahr ausgeht. Will man diese Gefahr minimieren, müsste man sich Gedanken machen, wie man vorgeht,
    wenn man im Fluss landet, z.B. Schwimmweste, Sicherungsseil, spezielles Training, etc.;  ▪ Der Bergstrom
    war eiskalt. Das war im April, bei eingesetzter Schneeschmelze, offen sichtlich und konnte einfach
    überprüft werden (Hand ins Wasser halten). Es darf als bekannt vorausgesetzt werden, dass bei eiskaltem
    Wasser ein Verweilen im Wasser innert weniger Minuten lebensgefährlich wird. Um das Risiko zu minimieren,
    hätte man entweder auf das Vorhaben verzichten oder sich entsprechend ausrüsten müs sen, z.B. Neoprenanzug,
    spezielles Training, etc.;  ▪ Ein mit Luft gefüllter Traktorreifen ist offensichtlich kein Wasser(sport)gerät.
    Er ist nicht gedacht, um sich auf dem Wasser fortzubewegen und verfügt über keinerlei Steuerungsmöglichkeiten.
    Das Risiko, dass man zu schnell wird oder in eine falsche Richtung treibt, liegt auf der Hand. Wenn
    man nicht steuern und bremsen kann, hätte man vorgängig Massnahmen ergreifen müssen, wie z.B. Erkundung
    der Strecke, Stre ckensicherung, Hilfspersonen auf dem Wasser oder am Ufer, etc.  Fazit: Sämtliche
    möglichen Gefahren wurden durch M. und F. nicht berücksichtigt. Unabhängig davon, ob man von einem
    absoluten oder relativen Wagnis ausgeht, wurde somit nichts unternommen, um mögliche Risiken und Gefahren
    zu minimieren, obwohl sie offensichtlich waren. Der Wagnisbegriff ist damit erfüllt. Die Unfallversicherung
    darf folglich die Leistun gen kürzen und in besonders schweren Fällen sogar verneinen.'
  rubric:
  - In Frage kommende Leistungen  M. und F. mussten aufgrund des Unfallereignisses (vgl. Frage 1) in einem
    Spital behandelt werden. Folglich geht es einmal um die Kosten der Heilbehandlung (Art. 10 Abs. 1
    lit. c UVG). Der Taggeldanspruch entsteht erst am dritten Tag nach dem Unfalltag (Art. 16 Abs. 2 UVG).
    Da M. am dritten Tag nach dem Unfall bereits wieder arbeiten ging, besteht kein Taggeld anspruch.
    F. wird gemäss Sachverhalt zu 100% arbeitsunfähig bleiben. Folglich wird ihr (während einer gewissen
    Zeit) ein Taggeld der Unfallversicherung ausgerichtet. F. wird mit ihren Hirnverletzungen nicht mehr
    als Verkaufsleiterin arbeiten können.
  - Ob sie einer anderen Tätigkeit je wieder (zumindest teilweise) arbeitsfähig sein wird, ist offen.
    Bei einer dauerhaften Einschränkung der Erwerbsfähigkeit, dürfte auch eine Invalidenrente der Unfallversicherung
    zur Diskussion stehen. (Wird auch noch die Integritätsentschädigung gemäss Art. 24 UVG erwähnt)  Verweigerung
    und Kürzung der Leistungen  Die Verweigerung und Kürzung der Leistungen in der Unfallversicherung
    werden in Art. 37 39 UVG und Art. 48–50 UVV umschrieben.
  - Nach Art. 39 UVG kann der Bundesrat aussergewöhnliche Gefahren und Wagnisse bezeich nen, die in der
    Versicherung der Nichtberufsunfälle zur Verweigerung sämtlicher Leistungen oder zur Kürzung der Geldleistungen
    führen. Nach Art. 50 Abs. 1 UVV werden bei Nichtberufsunfällen, die auf ein Wagnis zurückgehen, die
    Geldleistungen um die Hälfte gekürzt und in besonders schweren Fällen verweigert.
  - 'Nach Art. 50 Abs. 2 UVV sind Wagnisse Handlungen, mit denen sich der Versicherte einer besonders
    grossen Gefahr aussetzt, ohne die Vorkehren zu treffen oder treffen zu können, die das Risiko auf
    ein vernünftiges Mass beschränken. Subsumtion:  Gekürzt werden können jedenfalls nur Leistungen bei
    Nichtberufsunfällen und in Form von Geldleistungen. I.c. liegen Nichtberufsunfälle vor, da sie in
    der Freizeit von M. und F. passiert sind. Bei M. bestehen allerdings nur Heilbehandlungskosten, die
    als Sachleistungen nicht gekürzt werden dürfen. Bei F. bestehen Geldleistungen in Form der Taggelder
    und evtl. der Invalidenrente. Diese können gekürzt werden, wenn es sich beim Unfallhergang um ein
    Wagnis gehandelt hat.'
  - Grundsätzlich unterscheidet man zwischen absoluten und relativen Wagnissen, wobei bei den absoluten
    Wagnissen das Risiko und die Gefahren unabhängig von den konkreten Ver hältnissen nicht auf ein vernünftiges
    Mass herabgesetzt werden können (vgl. Wortlaut Art. 50 Abs. 2 UVV). Bei relativen Wagnissen können
    die Gefahren durch die handelnde Per son auf ein vernünftiges Mass reduziert werden. Es ist zu prüfen,
    ob nach den persönlichen Fähigkeiten und der Art der Durchführung eine Gefahrenherabsetzung möglich
    gewesen wäre und diese unterlassen wurde.
