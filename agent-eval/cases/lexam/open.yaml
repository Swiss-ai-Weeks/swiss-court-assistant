    handelt. Deshalb sind die Verhaltens pflichten nach Art. 7 ff. FIDLEG nicht anwendbar (Art. 20 Abs.
    1 FIDLEG).
  - 2. Die G muss bei der Zuteilung der Aktien hingegen das einschlägige Standesrecht, nämlich die Zuteilungsrichtlinien
    für den Emissionsmarkt von Swissbanking, zu be achten. Die Zuteilungsrichtlinien als Mindeststandard
    gelten für in der Schweiz domi zilierte Banken, welche an öffentlichen Platzierungen von Aktien u.a.
    Finanzinstru menten in der Schweiz mitwirken (Ziff. 4
  - f. Zuteilungsrichtlinien). Die G ist in der Schweiz domiziliert und wirkt bei der öffentlichen Platzierung
    von Aktien an der SIX Swiss Exchange mit. Die Zuteilungsrichtlinien sind somit vorliegend anwendbar.
  - '3. Nach den Zuteilungsrichtlinien besteht kein Anspruch auf Zuteilung (Ziff. 6.4 Zutei lungsrichtlinien)
    von Aktien und es darf zwischen unterschiedlichen Kunden ( Gruppen) differenziert werden (Ziff. 6.3
