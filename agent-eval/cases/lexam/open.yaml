  question: "Digital Assets Ltd is a company based in the United Kingdom. Eden Sharehan owns 21% of\n\
    its shares. Achille Taloon is the sole member of its board of directors.\nAchille Taloon willfully\
    \ produced financial accounts for the tax year ending on December 31,\n2016 that overestimated the\
    \ value of Digital Assets Ltd. The financial statements were audited\nby P&L Audit Ltd and published\
    \ on March 30, 2017. Achille Taloon was reelected at the\ngeneral meeting that took place on June\
    \ 15, 2017. A couple of months later, negative\ninformation was disclosed to the markets, which made\
    \ clear that the financial accounts were\ninaccurate and that the company was not as profitable as\
    \ it seemed. The price of its shares dropped significantly. Eden Sharehan would surely not have reelected\
    \ Achille Taloon if the\naudited accounts had portrayed a true and fair view of the company. \nEden\
    \ Sharehan is planning on filing a lawsuit against P&L Audit Ltd. Please discuss\nwhether P&L Audit\
    \ Ltd owes a duty of care to Eden Sharehan."
  reference: 'Duty of care Applicable law: UK law Issue = civil liability of auditors Tort liability =
    if no contractual relationship between plaintiff and defendant i.c. no contractual relationship between
    Eden Sharehan and P&L Audit Ltd Therefore, the question arises as to whom does P&L Audit Ltd owe a
    duty of care  UK law: Auditors owe a duty of care to the company in the interests of its shareholders
    Case law: Caparo Industries PLC v. Dickman Under the Caparo test, three elements give rise to a duty
    of care: (i) foreseeability of damage, (ii) proximity and (iii) fair, just and reasonable to impose
    liability  Issue = with respect to the proximity element Is the relationship between the auditors
    and the shareholder proximate enough? Duty of care owed to shareholders as a class = in order for
    them to be able to exercise their class rights Duty of care owed to shareholders „for the purpose
    of enabling them to scrutinise the conduct of the company’s affairs and to exercise their collective
    powers to regard or control or remove those to whom that conduct has been confided“ (Caparo case)
    But duty of care not owed to individual investors (in their individual capacity) i.c. Eden Sharehan
    = shareholder of Digital Assets Ltd Shareholders reelected the member of the board of directors Achille
    Taloon at the general meeting in reliance on audited reports that were published about 2 months before
    the general meeting. The shareholder Eden Sharehan would not have reelected Achille Taloon if the
    audited accounts were accurate. As a shareholder of Digital Assets Ltd, Eden Sharehan was owed a duty
    of care in order to be able to take an informed decision as to how to exercise class rights, i.e.
    to decide whether to reelect Achille Taloon or not. Therefore, P&L Audit Ltd owed a duty of care to
    Eden Sharehan in order to exercise his class rights (and not to him in his individual capacity).'
  rubric:
  - 'Duty of care Applicable law: UK law Issue = civil liability of auditors Tort liability = if no contractual
    relationship between plaintiff and defendant i.c. no contractual relationship between Eden Sharehan
    and P&L Audit Ltd Therefore, the question arises as to whom does P&L Audit Ltd owe a duty of care  UK
    law: Auditors owe a duty of care to the company in the interests of its shareholders Case law: Caparo
    Industries PLC v.'
  - 'Dickman Under the Caparo test, three elements give rise to a duty of care: (i) foreseeability of
    damage, (ii) proximity and (iii) fair, just and reasonable to impose liability  Issue = with respect
    to the proximity element Is the relationship between the auditors and the shareholder proximate enough?'
  - Duty of care owed to shareholders as a class = in order for them to be able to exercise their class
    rights Duty of care owed to shareholders „for the purpose of enabling them to scrutinise the conduct
    of the company’s affairs and to exercise their collective powers to regard or control or remove those
    to whom that conduct has been confided“ (Caparo case) But duty of care not owed to individual investors
    (in their individual capacity) i.c.
  - Eden Sharehan = shareholder of Digital Assets Ltd Shareholders reelected the member of the board of
    directors Achille Taloon at the general meeting in reliance on audited reports that were published
    about 2 months before the general meeting. The shareholder Eden Sharehan would not have reelected
    Achille Taloon if the audited accounts were accurate.
  - As a shareholder of Digital Assets Ltd, Eden Sharehan was owed a duty of care in order to be able
    to take an informed decision as to how to exercise class rights, i.e. to decide whether to reelect
    Achille Taloon or not.
  - Therefore, P&L Audit Ltd owed a duty of care to Eden Sharehan in order to exercise his class rights
    (and not to him in his individual capacity).
