  question: Was ist unter einem «Marktversagen» zu verstehen? Was kann die Regulierung in der Situation
    eines Marktversagens bewirken?
  reference: 'Ein Marktversagen beschreibt die Situation, in der es einem sich selbst überlassenen Markt
    nicht – oder nicht innert nützlicher Frist gelingt, die Ressourcen effizient zu allozieren und somit
    das erwünschte Marktgleichgewicht nicht entsteht. [1 Punkt] Die Regulierung kann bei einem Marktversagen
    als Korrekturmechanismus eingreifen: sie setzt den Ordnungsrahmen, der es den Marktteilnehmern ermöglicht,
    einigermassen gesicherte Er wartungen in ihr Verhalten untereinander zu entwickeln. Die Regulierung
    verschafft somit eine Orientierung und sorgt für Rechtssicherheit im Sinne des Vertrauens in die Geltung
    und Durch setzung der anwendbaren Regeln. [1 Punkt]'
  rubric:
  - Ein Marktversagen beschreibt die Situation, in der es einem sich selbst überlassenen Markt nicht –
    oder nicht innert nützlicher Frist gelingt, die Ressourcen effizient zu allozieren und somit das erwünschte
    Marktgleichgewicht nicht entsteht. [1 Punkt]
  - 'Die Regulierung kann bei einem Marktversagen als Korrekturmechanismus eingreifen: sie setzt den Ordnungsrahmen,
    der es den Marktteilnehmern ermöglicht, einigermassen gesicherte Er wartungen in ihr Verhalten untereinander
    zu entwickeln. Die Regulierung verschafft somit eine Orientierung und sorgt für Rechtssicherheit im
    Sinne des Vertrauens in die Geltung und Durch setzung der anwendbaren Regeln. [1 Punkt]'
