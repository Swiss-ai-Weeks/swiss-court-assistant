  question: "Kurt führt seit dem Jahr 1989 drei erfolgreiche Metzgereien in der Stadt Zürich und in\n\
    Winterthur in der Rechtsform eines Einzelunternehmens. Er beschäftigt in den drei Metz-\ngereien insgesamt\
    \ 8 Personen und erzielte in den letzten Jahren damit einen durch-\nschnittlichen Jahresumsatz von\
    \ insgesamt CHF 1'800'000. Im Jahr 2001 gründete er zu-\nsammen mit Paul die Wurst AG, die ein industrielles\
    \ Zentrum für die Herstellung von\nWurstwaren betreibt und ihre Wurstwaren an verschiedene Supermärkte\
    \ im Raum Zürich\n/ Winterthur wie auch an die drei Metzgereien von Kurt liefert. Die Wurst AG beschäftigt\n\
    insgesamt 25 Personen und erzielte in den letzten Jahren einen durchschnittlichen Jah-\nresumsatz\
    \ von CHF 20 Mio.\nIm Jahr 2016 verkauft Kurt altershalber sowohl sein Einzelunternehmen mit den drei\n\
    Metzgereien wie auch die 50%-Beteiligung an der Wurst AG an einen Dritten. Das kanto-\nnale Steueramt\
    \ Zürich macht in seinem Taxationsvorschlag dabei geltend, dass der mit\ndem Verkauf der 50%-Beteiligung\
    \ an der Wurst AG von Kurt erzielte Kapitalgewinn der\ndirekten Bundessteuer wie auch den Staats-\
    \ und Gemeindesteuern des Kantons Zürich\nunterliege. Kurt hat die 50%-Beteiligung an der Wurst AG\
    \ nie in der handelsrechtlichen\nJahresrechnung seines Einzelunternehmens bilanziert. \nKurt gelangt\
    \ an Sie mit der Frage, wie er auf den Taxationsvorschlag reagieren soll.\nLegen Sie ihm die rechtliche\
    \ Ausgangslage dar."
  reference: 'Es stellt sich das Problem der Abgrenzung zwischen Privat- und Geschäftsvermögen. Der Begriff
    des Geschäftsvermögens wird in Art. 18 Abs. 2 Satz 3 und 4 DBG be- schrieben. Danach gelten als Geschäftsvermögen
    alle Vermögenswerte, die ganz oder vorwiegend der selbstständigen Erwerbstätigkeit dienen. Zudem können
    Beteiligungen von mindestens 20% am Grund- oder Stammkapital einer Kapitalgesellschaft oder Ge- nossenschaft
    zu Geschäftsvermögen erklärt werden. Aus dem Sachverhalt ergeben sich allerdings keine Hinweise, dass
    Kurt eine solche Erklärung abgegeben hat, es steht vor- liegend somit das ordentliche Geschäftsvermögen
    zur Debatte. Geschäftsvermögen charakterisiert sich durch zwei Merkmale: Erstens muss eine selb- ständige
    Erwerbstätigkeit vorliegen. Kurt ist als Inhaber eines Einzelunternehmens selb- ständig erwerbstätig.
    Zweitens muss der Vermögenswert der selbstständigen Erwerbstä- tigkeit tatsächlich dienen. Das tatsächliche
    Dienen ist aufgrund der aktuellen Nutzung des Vermögenswerts für die geschäftlichen Zwecke und seiner
    technisch-wirtschaftlichen Funktion im Betrieb zu ermitteln. Hierbei ist zwischen unmittelbarer und
    mittelbarer Nut- zung zu unterscheiden. Bei einer unmittelbaren Nutzung ist der Vermögenswert in den
    betrieblichen Leistungserstellungsprozess integriert, er wird unmittelbar gebraucht oder verbraucht
    und die geschäftliche Nutzung ist i.d.R. äusserlich erkennbar und feststellbar. Bei einer mittelbaren
    Nutzung ist der Vermögenswert für die betriebliche Leistungserstel- lung nicht unmittelbar notwendig
    und dient dem Unternehmen nur mittelbar.'
  rubric:
  - Es stellt sich das Problem der Abgrenzung zwischen Privat- und Geschäftsvermögen. Der Begriff des
    Geschäftsvermögens wird in Art. 18 Abs. 2 Satz 3 und 4 DBG be- schrieben. Danach gelten als Geschäftsvermögen
    alle Vermögenswerte, die ganz oder vorwiegend der selbstständigen Erwerbstätigkeit dienen.
  - Zudem können Beteiligungen von mindestens 20% am Grund- oder Stammkapital einer Kapitalgesellschaft
    oder Ge- nossenschaft zu Geschäftsvermögen erklärt werden. Aus dem Sachverhalt ergeben sich allerdings
    keine Hinweise, dass Kurt eine solche Erklärung abgegeben hat, es steht vor- liegend somit das ordentliche
    Geschäftsvermögen zur Debatte.
  - 'Geschäftsvermögen charakterisiert sich durch zwei Merkmale: Erstens muss eine selb- ständige Erwerbstätigkeit
    vorliegen. Kurt ist als Inhaber eines Einzelunternehmens selb- ständig erwerbstätig. Zweitens muss
    der Vermögenswert der selbstständigen Erwerbstä- tigkeit tatsächlich dienen.'
  - Das tatsächliche Dienen ist aufgrund der aktuellen Nutzung des Vermögenswerts für die geschäftlichen
    Zwecke und seiner technisch-wirtschaftlichen Funktion im Betrieb zu ermitteln. Hierbei ist zwischen
    unmittelbarer und mittelbarer Nut- zung zu unterscheiden.
  - Bei einer unmittelbaren Nutzung ist der Vermögenswert in den betrieblichen Leistungserstellungsprozess
    integriert, er wird unmittelbar gebraucht oder verbraucht und die geschäftliche Nutzung ist i.d.R.
    äusserlich erkennbar und feststellbar.
  - Bei einer mittelbaren Nutzung ist der Vermögenswert für die betriebliche Leistungserstel- lung nicht
    unmittelbar notwendig und dient dem Unternehmen nur mittelbar.
