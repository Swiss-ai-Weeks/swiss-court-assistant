  question: Eine Kollegin fragt sie, was ein Technologiemarkt sei. Es handle sich offensichtlich um einen
    terminus technicus des Kartellrechts. Versuchen Sie, ihr in einem Satz zu erklären, was dieses Konzept
    erfassen will,
  reference: Vorgelagerte Stufen des Wertschöpfungsprozesses sollen kartellrechtlich erfasst werden. /
    Technologiewettbewerb soll geschützt werden / Marktmacht eines Technologieinhabers über nachgelagerte
    Produktmärke soll kontrolliert werden können.
