  question: Welche möglichen Regelverstösse begeht ein Bankangestellter, der bei der Entgegen nahme von
    Publikumseinlagen im Hinblick auf ein Effektenhandelsgeschäft nicht die erforderliche Sorgfalt bei
    der Feststellung des wirtschaftlich Berechtigten walten lässt? Welche rechtlichen Folgen drohen bei
    diesen Regelverstössen?
  reference: 'Verletzung von Art. 4 GwG (Feststellung des wirtschaftlich Berechtigten; zudem evtl. Verlet
    zung des Gewährserfordernisses); es droht eine aufsichtsrechtliche Sanktion der FINMA. Verstoss gegen
    die Vereinbarung über die Standesregeln zur Sorgfaltspflicht der Banken (VSB20): Es droht der Bank
    eine Konventionalstrafe der Schweizerischen Banki ervereinigung. Erfüllung des Straftatbestands der
    mangelnden Sorgfalt bei Finanzgeschäften (Art. 305ter StGB): Es droht eine Freiheitsstrafe bis zu
    einem Jahr oder eine Geldstrafe.'
  rubric:
  - Verletzung von Art. 4 GwG (Feststellung des wirtschaftlich Berechtigten; zudem evtl. Verlet zung des
    Gewährserfordernisses); es droht eine aufsichtsrechtliche Sanktion der FINMA.
  - 'Verstoss gegen die Vereinbarung über die Standesregeln zur Sorgfaltspflicht der Banken (VSB20): Es
    droht der Bank eine Konventionalstrafe der Schweizerischen Banki ervereinigung. Erfüllung des Straftatbestands
    der mangelnden Sorgfalt bei Finanzgeschäften (Art. 305ter StGB): Es droht eine Freiheitsstrafe bis
    zu einem Jahr oder eine Geldstrafe.'
