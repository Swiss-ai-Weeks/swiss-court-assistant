- id: lexam-open-106ec8a2
  suite: lexam_open
  area: Private
  language: de
  level: exam
  question: "Art. 13b Abs. 1 URG\nWer als Betreiber eines sozialen Netzwerks, eines Informations- oder\
    \ Unterhaltungsdienstes oder einer\nanderen Kommunikationsplattform im Internet journalistische Inhalte\
    \ oder Fotografien so zugänglich\nmacht, dass Personen von Orten und zu Zeiten ihrer Wahl Zugang dazu\
    \ haben, schuldet den Urhebern\nund Urheberinnen hierfür eine Vergütung. \nNehmen Sie zu folgenden\
    \ Aussagen aus Sicht des Schweizer Rechts Stellung und begründen Sie\nIhre Stellungnahme:\nIm Rahmen\
    \ der laufenden Revisionen des URG wurde in der Kommission für Rechtsfragen\ndes Nationalrats eine\
    \ Änderung beantragt (siehe Box). Nationalrätin Zbinden ist der Ansicht,\ndiese Regelung bringe den\
    \ Medien nichts."
  reference: 'Die Massennutzung von urheberrechtlich geschützten Werken im Internet ist heute faktisch
    unkontrollierbar. Das gilt auch (und besonders) für die Nutzung in sozialen Netzwerken und auf Kommunikationsplattformen,
    aber kaum für professionelle Informations-­‐ und Unterhaltungsdienste, die ihren Nutzern selbst Inhalte
    zur Verfügung stellen. Die Urheber haben gestützt auf ihre Recht der Zugänglichmachung (Art. 10 Abs.
    2 lit. c URG) zwar einen Verbotsanspruch; da im Internet aber sehr viele Nutzer ihre Rechte verletzen
    und die Plattformen von Haftungsprivilegien bzw. der unklaren Haftungssituation profitieren, bringt
    dieser Anspruch den Urhebern in der Praxis jedoch nicht viel. Nicht zuletzt, wollen viele Urheber
    die Nutzung ihrer Werke gar nicht verbieten, wohl aber am dadurch erzielten Nutzen (bspw. Werbeeinnahmen
    der Plattformen) finanziell partizipieren. Hier knüpft der Vorschlag für einen Art. 13b Abs. 1 URG
    an, der sicherstellen soll, dass die Urheber für die Nutzung ihrer Werke eine Vergütung erhalten.
    Die Bestimmung ist allerdings in verschiedener Hinsicht unklar: (i) unklar sind die Begriffe „soziale
    Netzwerke“, „Informations-­‐ oder Unterhaltungsdienste“ und „andere Kommuni-­‐ kationsplattformen
    im Internet“; mit diesen Begriffen würde die Praxis aber wohl umgehen können; (ii) problematischer
    ist, dass der Begriff „journalistischen Inhalte“ ein Fremdkörper im URG ist und näher definiert werden
    müsste, bspw. in der Botschaft oder in der Rechtsprechung; namentlich ist unklar, ob damit auch Inhalte
    gemeint sind, die keinen Werkcharakter haben; Letzteres gilt auch für den Begriff der Fotografien;
    (iii) unklar ist auch, ob der Vergütungs-­‐ anspruch an die Stelle des Verbotsanspruchs oder zu diesem
    hinzu tritt; für die erste Ansicht könnte der systematische Kontext sprechen, weil das Vermietrecht
    von Art. 13 URG kein Verbotsrecht, sondern ein blosser Vergütungsanspruch ist; dagegen spricht, dass
    es denkbar ist, neben dem Verbotsrecht (das von den Journalisten in aller Regel auf die Medien übertragen
    wird) ein neuer Vergütungsanspruch geschaffen werden soll, der allein den Urhebern zusteht. Wird die
    Bestimmung so ausgelegt, trifft die Aussage von Nationalrätin Zbinden zu, dass die Bestimmungen den
    Medien nichts bringt. Profitieren würden nur die Journalisten, die als Urheber der „journalistischen
    Inhalte“ und Fotografien eine zusätzliche Entschädigung für die Nutzung ihrer Inhalte im Web erhalten
    würden. (iv) unklar bleibt allerdings, wer den Vergütungsanspruch geltend machen soll; mit Blick auf
    das Problem der unkontrollierbaren Massennutzung müssten wohl die Verwertungsgesellschaften diese
    Aufgabe übernehmen; auch dies wird durch die systematische Nähe zu Art. 13 URG nahegelegt; denkbar
    wäre, dass in Abs. 2 von Art. 13b URG eine Verwertungsgesellschaftspflicht vorgesehen ist, wie dies
    in Art. 13 Abs. 3 URG der Fall ist.'
  rubric:
  - Die Massennutzung von urheberrechtlich geschützten Werken im Internet ist heute faktisch unkontrollierbar.
    Das gilt auch (und besonders) für die Nutzung in sozialen Netzwerken und auf Kommunikationsplattformen,
    aber kaum für professionelle Informations-­‐ und Unterhaltungsdienste, die ihren Nutzern selbst Inhalte
    zur Verfügung stellen.
  - Die Urheber haben gestützt auf ihre Recht der Zugänglichmachung (Art. 10 Abs. 2 lit. c URG) zwar einen
    Verbotsanspruch; da im Internet aber sehr viele Nutzer ihre Rechte verletzen und die Plattformen von
    Haftungsprivilegien bzw. der unklaren Haftungssituation profitieren, bringt dieser Anspruch den Urhebern
    in der Praxis jedoch nicht viel.
  - Nicht zuletzt, wollen viele Urheber die Nutzung ihrer Werke gar nicht verbieten, wohl aber am dadurch
    erzielten Nutzen (bspw. Werbeeinnahmen der Plattformen) finanziell partizipieren. Hier knüpft der
    Vorschlag für einen Art. 13b Abs. 1 URG an, der sicherstellen soll, dass die Urheber für die Nutzung
    ihrer Werke eine Vergütung erhalten.
  - 'Die Bestimmung ist allerdings in verschiedener Hinsicht unklar: (i) unklar sind die Begriffe „soziale
    Netzwerke“, „Informations-­‐ oder Unterhaltungsdienste“ und „andere Kommuni-­‐ kationsplattformen
    im Internet“; mit diesen Begriffen würde die Praxis aber wohl umgehen können; (ii) problematischer
    ist, dass der Begriff „journalistischen Inhalte“ ein Fremdkörper im URG ist und näher definiert werden
    müsste, bspw. in der Botschaft oder in der Rechtsprechung; namentlich ist unklar, ob damit auch Inhalte
    gemeint sind, die keinen Werkcharakter haben; Letzteres gilt auch für den Begriff der Fotografien;
    (iii) unklar ist auch, ob der Vergütungs-­‐ anspruch an die Stelle des Verbotsanspruchs oder zu diesem
    hinzu tritt; für die erste Ansicht könnte der systematische Kontext sprechen, weil das Vermietrecht
    von Art. 13 URG kein Verbotsrecht, sondern ein blosser Vergütungsanspruch ist; dagegen spricht, dass
    es denkbar ist, neben dem Verbotsrecht (das von den Journalisten in aller Regel auf die Medien übertragen
    wird) ein neuer Vergütungsanspruch geschaffen werden soll, der allein den Urhebern zusteht.'
  - Wird die Bestimmung so ausgelegt, trifft die Aussage von Nationalrätin Zbinden zu, dass die Bestimmungen
    den Medien nichts bringt. Profitieren würden nur die Journalisten, die als Urheber der „journalistischen
    Inhalte“ und Fotografien eine zusätzliche Entschädigung für die Nutzung ihrer Inhalte im Web erhalten
    würden.
  - (iv) unklar bleibt allerdings, wer den Vergütungsanspruch geltend machen soll; mit Blick auf das Problem
    der unkontrollierbaren Massennutzung müssten wohl die Verwertungsgesellschaften diese Aufgabe übernehmen;
    auch dies wird durch die systematische Nähe zu Art. 13 URG nahegelegt; denkbar wäre, dass in Abs.
    2 von Art. 13b URG eine Verwertungsgesellschaftspflicht vorgesehen ist, wie dies in Art. 13 Abs. 3
    URG der Fall ist.
