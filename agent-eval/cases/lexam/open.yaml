  question: "S wird um 2 Uhr morgens von den Polizisten L und M in der Nähe eines brennenden Gebäudes\
    \ mit\nVerdacht auf Brandstiftung festgenommen und auf den Polizeiposten gebracht. Beim stark nach\
    \ Rauch\nriechenden S findet sich neben einer Schachtel Zündhölzer auch ein halbleerer Flachmann.\
    \ M nimmt\ndie Gegenstände an sich und verstaut sie in einem dafür vorgesehenen Schrank.\nBei L kommt\
    \ währenddessen, aufgrund einer etwas ungenauen Zeugenbeschreibung im\nZusammenhang mit einem einige\
    \ Tage zurückliegenden Feuer, der Verdacht auf, dass S auch diesen\nBrand gelegt haben könnte. Dabei\
    \ wurden am Tatort Blutspuren gefunden, weshalb er beim S die\nErstellung eines DNA-Profils anordnet.\
    \ \nSind M und L zur jeweiligen Handlung berechtigt? (die Festnahme muss nicht geprüft\nwerden)"
  reference: Diskussion ob bereits StPO oder noch PolG. Die Sicherstellung von Spuren und Beweisen gehört
    gemäss StPO 306 II a zu den Aufgaben der Polizei.Ist Gefahr in Verzug (z.B. Verlust des Gegenstandes
    bei unterbleiben des Zugriffs) darf sie Gegenstände gemäss StPO 263 III vorläufig sicherstellen. Umschreibung
    der Wendung «Gefahr in Verzug» oder Beispiel.  Sicherstellung ≠ Beschlagnahme, weil noch keine formelle
    Anordnung durch die zuständige Strafbehörde vorliegt (StPO 263 II). Da vorliegend die Gefahr besteht,
    dass S die Beweise vernichten könnte, hat M korrekt gehandelt.  Gemäss StPO 255 I a kann zur Aufklärung
    eines Vergehens oder eines Verbrechens ein DNA-Profil der beschuldigten Person erstellt werden. Die
    Anordnung des Profils obliegt der Staatsanwaltschaft. Der Polizei ist nach StPO 255 II a eine nicht
    invasive DNA -Probenahme erlaubt. (nicht invasiv = z.B. Wangenschleimhautabstrich/invasiv = Blutentnahme)  Der
    L ordnet i.c. die Erstellung eines DNA-Profils an, wozu er gemäss StPO 255 nicht berechtigt ist.
  rubric:
  - Diskussion ob bereits StPO oder noch PolG. Die Sicherstellung von Spuren und Beweisen gehört gemäss
    StPO 306 II a zu den Aufgaben der Polizei.Ist Gefahr in Verzug (z.B. Verlust des Gegenstandes bei
    unterbleiben des Zugriffs) darf sie Gegenstände gemäss StPO 263 III vorläufig sicherstellen. Umschreibung
    der Wendung «Gefahr in Verzug» oder Beispiel.
  - Sicherstellung ≠ Beschlagnahme, weil noch keine formelle Anordnung durch die zuständige Strafbehörde
    vorliegt (StPO 263 II). Da vorliegend die Gefahr besteht, dass S die Beweise vernichten könnte, hat
    M korrekt gehandelt.
  - Gemäss StPO 255 I a kann zur Aufklärung eines Vergehens oder eines Verbrechens ein DNA-Profil der
    beschuldigten Person erstellt werden. Die Anordnung des Profils obliegt der Staatsanwaltschaft. Der
    Polizei ist nach StPO 255 II a eine nicht invasive DNA -Probenahme erlaubt.
  - (nicht invasiv = z.B. Wangenschleimhautabstrich/invasiv = Blutentnahme)  Der L ordnet i.c. die Erstellung
    eines DNA-Profils an, wozu er gemäss StPO 255 nicht berechtigt ist.
