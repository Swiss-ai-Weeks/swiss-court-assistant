  question: "Die Journalistin Jessica Jedermann (JJ) hat diverse Skandale des Lokalpolitikers Peter Polteri\
    \ (PP)\naufgedeckt. PPs Medienberaterin Patrizia Rachsüchtig (PR) ist der Ansicht, dass JJ diskreditiert\n\
    werden müsse. Ohne mit PP Rücksprache zu nehmen, erstellt PR mithilfe einer neuen Technologie,\ndie\
    \ es erlaubt Gesichter und Stimmen in Videos zu manipulieren, ein sog. „Fake“-Video, in dem JJ\nprimitive\
    \ Aussagen von sich gibt. Das Video lädt PR auf die beliebte Plattform „myvideo.ch“. Dass das\nVideo\
    \ manipuliert ist, ist nicht erkennbar. Es wurde 2 Mio. mal angesehen. Vor jedem Abspielen zeigt\n\
    „myvideo.ch“ Werbung und erhält hierfür 25 Rappen von ihren Werbekunden. Als JJ hiervon erfährt,\n\
    ist sie ziemlich genervt. Sie kommt zu Ihnen und bittet um Hilfe. \nKann JJ finanzielle Ansprüche\
    \ gegen „myvideo.ch“ geltend machen?"
