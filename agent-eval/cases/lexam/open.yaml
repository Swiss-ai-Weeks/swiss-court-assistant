  question: Was ist der telos des gesetzlichen Pfandrechts des geschädigten Dritten und wo findet sich
    die Grundlage für dieses Recht?
  reference: Das gesetzliche Pfandrecht ist in Art. 60 VVG geregelt. Es verwehrt dem Versicherer, ohne
    Zustimmung des Geschädigten an den Versicherungsnehmer zu leisten. Damit wird sichergestellt, dass
    die Leistung des Versicherers weder durch Unterschlagung des Versicherungsnehmers noch durch dessen
    Konkurs dem Geschädigten vorenthalten werden kann.
