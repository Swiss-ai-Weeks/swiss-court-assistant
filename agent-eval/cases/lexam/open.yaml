  question: "Bei einem Besuch von Frau Kempf bei ihrer Bekannten, Frau Bleuler, in deren Eigenheim stürzte\n\
    Frau Kempf auf der Treppe und zog sich gravierende Verletzungen zu. Der Schaden ist vollum-\nfänglich\
    \ von Versicherungen gedeckt, hingegen verlangt Frau Kempf von Frau Bleuler persönlich\neine Genugtuung\
    \ von Fr. 12'000.–.\nWeil Frau Bleuler die Zahlung verweigert, leitet Frau Kempf eine Betreibung ein,\
    \ wogegen Frau\nBleuler Rechtsvorschlag erhebt. Das erstaunt Frau Kempf umso mehr, als ihr Frau Bleuler\
    \ kurz\nnach dem Unfall per E-Mail zugesichert hat, für alles wegen des Unfalls erlittene Ungemach\
    \ in der\nHöhe der geltend gemachten Genugtuung von Fr. 12'000.– aufzukommen.\nIn Sorge um ihre Forderung\
    \ lässt sich Frau Kempf einen Betreibungsregisterauszug (Art. 8a\nSchKG) geben. Daraus geht hervor,\
    \ dass Frau Bleuler diverse laufende Betreibungen hat und dass\ndem Gläubiger X vor einiger Zeit sogar\
    \ ein Verlustschein ausgestellt worden ist.\n\nDa Frau Kempf mittellos ist, stellt ihre Anwältin gleichzeitig\
    \ mit der das betreffende Gerichts-\nverfahren einleitenden Rechtsschrift ein Gesuch um unentgeltliche\
    \ Rechtspflege (einschliesslich\nunentgeltlichem Rechtsbeistand). \nWelche Rechtsmittel stehen Frau\
    \ Kempf zur Verfügung, wenn die unentgeltliche\nRechtspflege vorab verweigert wird (ganzer Instanzenzug)?"
  reference: 'Beschwerde nach Art. 121 i.V.m. Art. 319 ff. ZPO an die obere kantonale Instanz: • Anfechtungsobjekt:
    selbständig anfechtbarer prozessleitender Entscheid (Art. 319 lit. b Ziff. 1 ZPO) • Frist: 10 Tage,
    da es sich um einen prozessleitenden Entscheid im summarischen Verfahren handelt (Art. 119 Abs. 3
    i.V.m. Art. 321 Abs. 2 ZPO) • Beschwerdegründe gem. Art. 320 ZPO Beschwerde in Zivilsachen an das
    Bundesgericht? • Anfechtungsobjekt: Anderer Vor- und Zwischenentscheid i.S.v. Art. 93 Abs. 1 lit.
    a BGG; nicht wieder gutzumachender Nachteil • Für den Streitwert (Art. 74 Abs. 1 lit. b BGG) ist der
    Wert des Hauptsachebegehrens massgeblich. I.c. CHF 12‘000.–, weshalb das Streitwerterfordernis nicht
