    ange merkt (Art. 712g Abs. 3 ZGB, Art. 649a Abs. 2 ZGB).59 Aufgrund der (lediglich) deklaratorischen
    Wirkung der vorliegenden Anmerkung nimmt diese nicht am Rangverhältnis teil. Bei Erhöhung des Schuldbriefs
    würde dieser im Umfang von CHF 400’000.– dem Nutzniessungsrecht von Berta Müller vorgehen, der zusätzliche
    Betrag von CHF 100’0000.– würde dem Nutzniessungsrecht aber nachgehen. Diesbezüglich würde also ein
    gebrochener Rang entstehen, welcher im Grundbuch nicht einge tragen werden kann.60
