  question: "Die W. AG hat vor über zwei Jahren ihre Geschäftstätigkeit (Vertrieb von Sportartikeln) voll\
    \ ständig eingestellt. Sie besitzt als Aktivum einzig zwei Bankkonten, die ein Guthaben von to tal\
    \ CHF 1'000'000 aufweisen. Ihre Bilanz gestaltet sich per 31. Dezember 2022 wie folgt: Bankkonten\
    \ 1'000'000 300'000 100'000 600'000 Aktienkapital Kapitalreserven Gewinnreserven 1'000'000 1'000’000\
    \ Waltraut ist Alleinaktionärin der W. AG. Im Februar 2023 verkauft sie sämtliche Aktien der W. AG\
    \ an Elfriede. Diese beabsichtigt die W. AG für ihre Vermögensverwaltungstätigkeit zu verwenden. Die\
    \ W. AG wird dafür einer Statutenänderung unterzogen, in E. AG umfirmiert und mit einem neuen Zweck\
    \ versehen. Die Steuerbehörden qualifizieren den Verkauf sämtlicher Aktien der W. AG von Waltraut\
    \ an Elfriede als Steuerumgehung. \nWie würden Sie konkret den Fall entscheiden? Liegt eine Steuerumgehung\
    \ vor oder nicht?"
  reference: 'Es ist zu prüfen, ob die drei Voraussetzungen der Steuerumgehung vorliegend erfüllt sind:
    - - - Das Vorliegen des objektiven Merkmals, d.h. ein absonderliches Vorgehen, kann aus fol genden
    Gründen bejaht werden:  Die W AG hat im Zeitpunkt des Verkaufs ihrer Aktien ihre Geschäftstätigkeit
    bereits seit zwei Jahren vollständig aufgegeben; sie übt keine Geschäftstätigkeit mehr aus. Auf der
    Aktivseite ihrer Bilanz weist sie nur noch Bankkonten, d.h. flüssige Mittel auf. Sie befindet sich
    in einem liquidierten Zustand. Es liegt ein Aktienmantel vor.  Elfriede, die die Aktien erwirbt,
    verwendet die W. AG nach dem Kauf für einen ande ren Zweck, ändert deren Statuten, die Firma etc.
    Sie ist nicht an der W. AG als solches und an deren Weiterführung interessiert, sondern will nur die
    Hülle, den Aktienmantel erwerben. Faktisch führt sie eine neue andere AG.  Nach normalem Geschäftsgebaren
    hätte Waltraut die in liquiden Zustand gebrachte W. AG liquidiert und Elfriede eine neue eigene AG
    gegründet. Das subjektive Merkmal kann auch als erfüllt betrachtet werden: Das gewählte Vorgehen führt
    für Waltraut zu einer erheblichen Steuerersparnis. Sie erzielt mit dem Verkauf der Aktien einen privaten
    steuerfreien Kapitalgewinn (Art. 16 Abs. 3 DBG), wohingegen die Liquidation der W. AG zu steuerbarem
    Beteiligungsertrag (Art. 20 Abs. 1 lit. c DBG) führte. Letztlich ist davon auszugehen, dass diese
    Steuerersparnis für Waltraut auch effektiv ein träte, würde das Vorgehen akzeptiert, so dass das effektive
    Merkmal ebenfalls bejaht werden kann.'
