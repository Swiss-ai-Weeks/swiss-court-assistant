  question: "G. ist Geschäftsführer eines Transportunternehmens. Er weiss, dass ein LKW-Chauffeur mit\
    \ den LKW dieses Betriebs unter Einhaltung der Gewichts-, Geschwindigkeits- und Ruhevor schriften\
    \ in einem Tag maximal 20t Ware über eine Distanz von 1000 km befördern kann. Um die Leistung und\
    \ den Gewinn des Unternehmens zu steigern, setzt G. einen Bonusanreiz für Chauffeure, die im Durchschnitt\
    \ 20t Ware pro Tag über eine Distanz von 1200 km befördern. Chauffeur A. erreicht diese Leistung.\
    \ Der Fahrtenschreiber zeigt, dass A. er konstant 10% über der erlaubten Höchstgeschwindigkeit fährt\
    \ und zudem täglich eine Stunde länger als erlaubt unterwegs ist. G. prüft das nicht und will es gar\
    \ nicht wissen. \nPrüfen Sie einschliesslich möglicher Verteidigungsargumente die Strafbarkeit von\
    \ A."
  reference: '(1) Obersatz: Es ist zu prüfen, ob A sich der Verkehrsregelverletzung gemäss SVG 90 I straf
    bar gemacht hat, indem er die Ruhezeiten und Geschwindigkeitsbegrenzungen regelmässig überschritten
    hat. (1) Geschwindigkeitsüberschreitung Nachweis: Gemäss VSKV-ASTRA 7 können Geschwin digkeitsüberschreitungen
    gestützt auf den Fahrtschreiber [so der in der SKV u. VSKV-ASTRA verwendete Begriff, im SV versehentlich
    «Fahrtenschreiber»] festgestellt werden. [Aufholpunkte gibt es für folgende Überlegungen: Im SV steht
    nicht, ob die konstant 10% Ge schwindigkeitsüberschreitung vor oder nach dem Sicherheitsabzug gemäss
    VSKV-ASTRA 8 II besteht und ob es ein analoger oder digitaler Fahrtschreiber gemäss Bst. a bzw. b
    dieses Absatzes ist. Grundsätzlich ist es richtig, bei der vorliegenden Fragestellung davon auszuge
    hen, dass es sich bei den 10% um die für die Beurteilung massgeblichen Wert nach dem Sicherheitsabzug
    handelt. Gleichwohl sind auch Überlegungen zu honorieren, wie sich der Sicherheitsabzug auf diese
    10% auswirken könnte.] (1) Geschwindigkeitsüberschreitung Beurteilung: Eine Geschwindigkeitsüberschreitung
    von 10% liegt in jedem Falle im Übertretungsbereich, d.h. bei jeder möglichen zulässigen Höchst geschwindigkeit.
    Demnach hat A eine mehrfache Übertretung gemäss SVG 90 I i.V.m. SVG 27 I für signalisierte Höchstgeschwindigkeit
    bzw. i.V.m. SVG 32 II und VRV 4a. (1) Unterschreitung von Ruhezeiten: Der Bundesrat hat gemäss SVG
    56 die Kompetenz, Ar beits- und Ruhezeit der berufsmässigen Motorfahrzeugführer in Verordnungen zu
    regeln. Er hat von dieser Kompetenz Gebrauch gemacht. Da SVG 56 zum Titel «Verkehrsregeln» gehört,
    handelt es sich bei den Vorschriften über Ruhezeiten grundsätzlich um «Vorziehungsvorschrif ten» des
    Bundesrates gemäss SVG 90 I*. Gemäss SV ist A täglich eine Stunde länger als erlaubt unterwegs, was
    einer mehrfachen Überschreitung der zulässigen Lenkzeit entspricht und mithin als Übertretung strafbar
    ist. [*Aufholpunkte: Jedoch gehen die Spezialbestimmung von ARV1 21 bzw. ARV2 28 vor (s. unten). Grundsätzlich
    ist es – in Analogie zu SVG 93 II – denkbar, grobe Fälle der Überschrei tung der Lenkzeit nach SVG
    92 II zu beurteilen. Der SV enthält jedoch keine Angaben, welche die Ruhezeitverletzung im konkreten
    Fall als grobe Verkehrsregelverletzung gemäss SVG 90 II erscheinen lassen. Dies gilt namentlich für
    die quantitative Angabe von einer Stunde täglich. Der Bundesrat hat gestützt auf SVG 56 die Arbeits-
    und Ruhezeit der berufsmässigen Motor fahrzeugführer und -führerinnen in der Chauffeurverordnung (ARV1;
    SR 822.221) und nicht der ARV1 unterstellte Führer von Motorfahrzeugen zum Personentransport in der
    ARV2 (SR 822.222) geregelt. Die Lenkzeit beträgt gemäss ARV1 5 täglich 9 Stunden und darf zweimal
    pro Woche auf 10 Stunden ausgedehnt werden. Wie die Geschwindigkeitsüberschreitung ist damit im SV
    auch die Lenkzeitüberschreitung in der Grössenordnung von 10%. Für die Kon trolle von Arbeits-, Lenk-
    und Ruhezeiten werden gemäss ARV 13a Fahrtschreiberkarten aus gestellt. ARV1 21 enthält eine eigene
    Übertretungs-Strafbestimmung für die Verletzung der Bestimmungen über die Arbeitszeit, Lenkzeit, Bereitschaftszeit,
    Pausen und Ruhezeiten.] (1) Da – wie aus b hiernach hervorgeht – der G als der Vorgesetzte von A eine
    Mitverantwor tung für die Tat gemäss SVG 100.2 I trägt und für die von A begangenen Taten nur Busse
    angedroht ist, kann A gemäss SVG 100.2 II milder bestraft oder von Strafe befreit werden. Ob und in
    welchem Ausmass es im konkreten Fall angebracht ist, von dieser Kann-Bestimmung Gebrauch zu machen
    ist, lässt sich aufgrund des SV nicht eindeutig feststellen. Dass es ge mäss SV für A um einen Bonusanreiz
    geht und nicht etwa darum, seine Arbeitsstelle zu be wahren, spricht gegen eine Strafbefreiung.'
