  question: "Art. 1 Perimetergesetz GR Anwendungsbereich 1 Dieses Gesetz ist anwendbar auf Perimeterverfahren,\
    \ bei welchen der Kanton oder ein Gemeindeverband Träger des öffentlichen Werkes ist. 2 Die politischen\
    \ Gemeinden können unter Beachtung der Artikel 2 und 3 sowie 5 bis 10 dieses Gesetzes eigene materielle\
    \ Bestimmungen und Verfahrensvorschriften erlassen. Fehlen solche Bestimmungen, so ist dieses Gesetz\
    \ anwendbar. 3 Bei unvollständigen Bestimmungen der Gemeinden sind die vorliegenden Verfahrensvorschriften\
    \ hilfsweise anwendbar. 4 Für die Finanzierung von Erschliessungen, die von den Gemeinden oder den\
    \ von ihnen beauftragten Körperschaften auf Grund des kantonalen Raumplanungsrechts durchgeführt werden,\
    \ gelten ausschliesslich die Bestimmungen der Raumplanungsgesetzgebung \nErläutern Sie die Funktion\
    \ von Abs. 3."
  reference: Art. 1 Abs. 2 Perimetergesetz gibt den Gemeinden die Kompetenz, eigene materielle Bestimmungen
    und Verfahrensvorschriften zu erlassen. Verzichtet die Gemeinde auf eigene Regelungen, so gelten die
    Vorschriften des Perimetergesetzes. Abs. 3 dieser Bestimmung regelt den Fall, dass Gemeinden zwar
    eigene Bestimmungen erlassen, diese jedoch unvollständig sind. Diesfalls soll das kantonale Recht
    subsidiär zur Anwendung gelangen. Das Ziel ist die Verhinderung von Regelungslücken.
  rubric:
  - Art. 1 Abs. 2 Perimetergesetz gibt den Gemeinden die Kompetenz, eigene materielle Bestimmungen und
    Verfahrensvorschriften zu erlassen. Verzichtet die Gemeinde auf eigene Regelungen, so gelten die Vorschriften
    des Perimetergesetzes.
  - Abs. 3 dieser Bestimmung regelt den Fall, dass Gemeinden zwar eigene Bestimmungen erlassen, diese
    jedoch unvollständig sind. Diesfalls soll das kantonale Recht subsidiär zur Anwendung gelangen. Das
    Ziel ist die Verhinderung von Regelungslücken.
  rubric_source: sentences
