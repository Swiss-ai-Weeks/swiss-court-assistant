  question: "A ist Italienerin und lebt und arbeitet in der Schweiz. Frisch vermählt, möchte sie gerne\
    \ ihren georgischen Ehemann V in die Schweiz nachziehen, um mit ihm künftig zusammenzuleben. \nWürde\
    \ sich an der Rechtslage etwas ändern, wenn A Schweizerin wäre und V immer noch in Georgien leben\
    \ würde? Was sagt die Rechtsprechung dazu?"
  reference: 'Anwendung des AIG - Beim Familiennachzug von Schweizer Staatsbürgern besteht kein grenzüberschreiten
    der Sachverhalt im Sinne des FZA, da der Schweizer nicht von seinem Recht auf Frei zügigkeit Gebrauch
    macht. Erfordernis des Zusammenwohnens - Gemäss Art. 42 Abs. 1 AIG muss der Nachzuziehende mit dem
    Ehegatten zusammen wohnen (vgl. BGE 130 II 113); die Regelung im AIG ist damit strenger als jene im
    FZA. - Ausnahme Art. 49 AIG Erfordernis des rechtmässigen Voraufenthalts der Angehörigen in einem
    FZA-Vertragsstaat - Gemäss Wortlaut von Art. 42 Abs. 2 AIG haben ausländische Familienangehörige (wie
    Ehegatten) von Schweizerinnen und Schweizern Anspruch auf Erteilung und Verlänge rung der Aufenthaltsbewilligung,
    wenn sie im Besitz einer dauerhaften Aufenthaltsbewil ligung eines Staates sind, mit dem ein Freizügigkeitsabkommen
    abgeschlossen wurde. Bei Familiennachzug von Personen, die sich zuvor nicht auf Unionsgebiet aufgehalten
    haben, besteht allerdings das Problem der Inländerdiskriminierung: Das BGer hat 2009 zwar die Metock-Praxis
    des EuGH übernommen, wonach beim Nachzug kein rechtmäs siger Aufenthalt des Nachzuziehenden in einem
    anderen Unionsstaat vorausgesetzt werden darf (BGE 136 II 5), allerdings nur im Anwendungsbereich
    des FZA: d.h. nur dann, wenn EU-Angehörige ihre Angehörigen gestützt auf das FZA nachziehen wollen.
    Wenn jedoch Schweizer gestützt auf Art. 42 Abs. 2 AIG Angehörige nachziehen wollen, gilt das in dieser
    Bestimmung vorgesehene Erfordernis rechtmässigen Voraufenthalts der Angehörigen in einem FZA-Vertragsstaat.
    Schweizer in binationalen Verhältnissen sind somit im Nachzugsbereich im Vergleich zu EU-Staatsangehörigen,
    die sich in der Schweiz befinden und auf das FZA berufen kön nen, schlechter gestellt. In BGE 136
    II 120 hat das BGer die Frage erörtert, ob die für EU-Bürger massgebliche Metock-Rechtsprechung zu
    einer berichtigenden Auslegung von Art. 42 AIG führen soll te; das BGer erkannte zwar keine sachlichen
    Gründe, die eine schlechtere Behandlung von Schweizern im Vergleich zu EU-Bürgern rechtfertigten (potenzielle
    Kollision mit Art. 14 EMRK), es sei jedoch Sache des Gesetzgebers, Art. 42 AIG anzupassen. Fazit:
    V hätte keinen Anspruch auf eine Aufenthaltsbewilligung, da er sich zuvor nicht in ei nem FZA-Vertragsstaat
    aufgehalten hat und nicht mit A zusammenwohnt'
  rubric:
  - Anwendung des AIG Beim Familiennachzug von Schweizer Staatsbürgern besteht kein grenzüberschreiten
    der Sachverhalt im Sinne des FZA, da der Schweizer nicht von seinem Recht auf Frei zügigkeit Gebrauch
    macht. Erfordernis des Zusammenwohnens
  - Gemäss Art. 42 Abs. 1 AIG muss der Nachzuziehende mit dem Ehegatten zusammen wohnen (vgl. BGE 130
    II 113); die Regelung im AIG ist damit strenger als jene im FZA.
  - Ausnahme Art. 49 AIG Erfordernis des rechtmässigen Voraufenthalts der Angehörigen in einem FZA-Vertragsstaat
