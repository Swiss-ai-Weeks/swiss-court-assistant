  question: Welches Aufsichtsinstrument kann die FINMA ergreifen, wenn sie den Verdacht hegt, dass eine
    Bank gegen ein Finanzmarktgesetz verstossen hat?
  reference: Die FINMA kann gemäss Art. 36 FINMAG auf Kosten der Bank eine unabhängige und fachkundige
    Person als Untersuchungsbeauftragten einsetzen und damit beauftragen, den Sachverhalt abzuklären.
    In der Einsetzungsverfügung kann die FINMA festlegen, dass die Untersuchungsbeauftragte anstelle der
    Bankorgane handeln darf.
  rubric:
  - Die FINMA kann gemäss Art. 36 FINMAG auf Kosten der Bank eine unabhängige und fachkundige Person als
    Untersuchungsbeauftragten einsetzen und damit beauftragen, den Sachverhalt abzuklären. In der Einsetzungsverfügung
    kann die FINMA festlegen, dass die Untersuchungsbeauftragte anstelle der Bankorgane handeln darf.
