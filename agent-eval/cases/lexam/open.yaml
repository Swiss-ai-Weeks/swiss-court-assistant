  - CHF 400’000.00 Registerschuldbrief z.G. Zürcher Kantonalbank, dat. 23.6.1999, MZ 8%, I. Pfandstelle
  - 'Last: Nutzniessungsrecht z.G. Berta Müller, geb. 1956, dat. 1.12.2018'
