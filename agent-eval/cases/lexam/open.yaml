  question: "Herr A. ist im Herbst 2016 aus Syrien in die Schweiz geflohen und als Flüchtling anerkannt\n\
    worden. In seinem Heimatland wurde A. Zeuge schrecklicher Kriegstaten, weshalb er an einer\nposttraumatischen\
    \ Belastungsstörung leidet. Herr A. begibt sich deshalb in der Schweiz bei\neinem Psychiater in medizinische\
    \ Behandlung. Da Herr A. nur arabisch spricht, zieht der be-\nhandelnde Psychiater für die wöchentlichen\
    \ Sitzungen einen externen Dolmetscher eines\nFlüchtlingshilfswerks bei. Nach dem ersten Monat erhält\
    \ Herr A. eine Rechnung über Dol-\nmetscherkosten von CHF 400 (vier Sitzungen à CHF 100). Herr A.\
    \ reicht diese Rechnung,\nzusammen mit der Rechnung seines Psychiaters, bei seiner Krankenkasse ein.\
    \ Diese bezahlt\nzwar die Rechnung des Psychiaters, lehnt aber die Kostenübernahme des Dolmetschers\
    \ ab. \nIst die Ablehnung der Kostenübernahme für die angefallenen Dolmetscherkosten in Höhe von\n\
    CHF 400 durch die obligatorische Krankenversicherung rechtmässig erfolgt?"
  reference: 'Leistungen nach KVG dürfen nur durch einen in Art. 25 Abs. 2 lit. a Ziff. 1–3 KVG aufge-
    führten und entsprechend qualifizierten Leistungserbringer erbracht werden (Siehe Skript Rz. 632)  Da
    es sich beim Dolmetscher offensichtlich weder um einen Arzt noch um einen Chiro- praktiker handelt,
    wäre er nur unter Art. 25 Abs. 2 lit. a Ziff. 3 KVG, d.h. als Person, die auf Anordnung eines Arztes
    Leistungen erbringt, subsumierbar.  Für Personen, die auf Anordnung eines Arztes Leistungen erbringen
    dürften, gilt das Lis- tenprinzip: In Art. 46 Abs. 1 KVV sind die Berufe abschliessend aufgezählt.  Dolmetscher
    sind nicht aufgeführt, weshalb ihre Leistungen somit von der Krankenkasse (im ambulanten Bereich)
    nicht übernommen werden müssen.'
