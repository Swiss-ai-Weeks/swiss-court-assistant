  question: |-
    Definieren Sie die interne Revision einer Bank. Wem ist die interne Revision unter-
    stellt bzw. von wem nimmt die interne Revision Instruktionen entgegen?
  reference: Die interne Revision ist eine vom Management der Bank unabhängige Instanz, welche Prü- fungen
    und Beurteilungen bezüglich der Angemessenheit und Wirksamkeit der Unterneh- mensorganisation und
    Geschäftsprozesse sowie insbesondere bezüglich des IKS und des Risikomanagements der Bank wahrnimmt.
    Die interne Revision ist dem Oberleitungsorgan der Bank (i.d.R. Verwaltungs- oder Bankrat) oder dem
    Prüfungsausschuss unterstellt und nimmt von diesem Instruktionen entgegen (Ziff. 87 und 95 FINMA RS
    2017/1).
  rubric:
  - Die interne Revision ist eine vom Management der Bank unabhängige Instanz, welche Prü- fungen und
    Beurteilungen bezüglich der Angemessenheit und Wirksamkeit der Unterneh- mensorganisation und Geschäftsprozesse
    sowie insbesondere bezüglich des IKS und des Risikomanagements der Bank wahrnimmt.
  - Die interne Revision ist dem Oberleitungsorgan der Bank (i.d.R. Verwaltungs- oder Bankrat) oder dem
    Prüfungsausschuss unterstellt und nimmt von diesem Instruktionen entgegen (Ziff. 87 und 95 FINMA RS
    2017/1).
