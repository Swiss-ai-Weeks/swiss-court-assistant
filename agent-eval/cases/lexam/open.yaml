  question: "Die alpine Gemeinde D ist auf den Wintertourismus ausgerichtet. Auf dem in der Landwirt-\n\
    schaftszone gelegenen X-Areal befinden sich die Talstation eines Skilifts, verschiedene\nÜbungspisten\
    \ für Skifahrer und Snowboarder sowie eine Ski- und Snowboardschule.\nIm Januar 2014 erhielt die Bergbahn\
    \ AG (B AG) die erforderliche kantonale und kommu-\nnale Bewilligung, um ein auf dem X-Areal gelegenes,\
    \ ehemals landwirtschaftlich genutztes\nWohngebäude in einen Restaurationsbetrieb mit 50 Innen- und\
    \ 100 Terrassensitzplätzen\numzubauen. Die Umgestaltung umfasste auch eine Vergrösserung der bestehenden\
    \ Terrasse\num 100 m2 . Das Gebäude, welches ca. 150 m von der nächsten Bauzone entfernt ist, war\n\
    1999 zonenkonform errichtet worden; 2009 war seine landwirtschaftliche Nutzung aufge-\ngeben worden.\
    \ In der Folge ging es ins Eigentum der B AG über.\n\nInfolge der Klimaerwärmung schrumpft der Wintersportmarkt\
    \ in D stetig. Der Gemeinde-\nvorstand und die B AG beschliessen deshalb am 24. Mai 2017, die Wintersportaktivitäten\n\
    auf dem X-Areal einzustellen. Bis eine einträgliche Nutzungsalternative gefunden ist,\nmöchte die\
    \ B AG die Räumlichkeiten des Restaurationsbetriebs nun – ohne bauliche Mass-\nnahmen vorzunehmen\
    \ – an den örtlichen Verein Vogelfreunde vermieten. Dieser beabsich-\ntigt, sie zum Zweck von \"Weiterbildung\
    \ und internem Austausch\" als Clublokal zu nutzen. \nIst das Vorhaben bewilligungsfähig?\n(Gehen\
    \ Sie hier davon aus, dass das Vorhaben bewilligungspflichtig ist.)"
  reference: 'Gemäss Art 24a RPG ist die Bewilligung für eine Zweckänderung einer Baute oder Anlage ausserhalb
    der Bauzonen zu erteilen, wenn diese keine bewilligungspflichtigen baulichen Massnahmen im Sinne von
    Art. 22 Abs. 1 RPG erfordert (Abs. 1 Ingress), "keine neuen Auswirkungen auf Raum, Erschliessung und
    Umwelt entstehen" (lit. a) und "sie nach kei- nem anderen Bundeserlass unzulässig ist" (lit. b). Standortgebundenheit
    oder eine umfas- sende Interessenabwägung sind nicht erforderlich. – Keine bewilligungspflichtigen
    baulichen Massnahmen: Gemäss Sachverhalt erfordert die Umnutzung keine baulichen Massnahmen. – Keine
    neuen Auswirkungen auf Raum, Erschliessung und Umwelt: Nach der allgemeinen Lebenserfahrung kann davon
    ausgegangen werden, dass die Aktivitäten eines Vereins von Vogelfreunden (selbst eines aussergewöhnlich
    mitgliederstarken) zwecks "Weiter- bildung und internem Austausch" wesentlich geringere Auswirkungen
    auf Raum, Er- schliessung und Umwelt haben als ein Restaurationsbetrieb mit 50 Innen- und 100 Aus-
    sensitzplätzen. Zu berücksichtigen ist insbesondere, dass es sich neu um ein Mitglieder- lokal handelt,
    während der Restaurationsbetrieb einen offenen Benutzerkreis hatte (Win- tersportler/-innen und Laufkundschaft).
    Andersartige Auswirkungen als bisher sind ebenfalls nicht zu erwarten. – Unzulässigkeit gemäss anderem
    Bundeserlass: Es ist keine Regelung eines Bundeserlas- ses ersichtlich, der gegen die Zweckänderung
    spräche. Fazit: Das Vorhaben ist als Zweckänderung nach Art. 24a RPG bewilligungsfähig.'
  rubric:
