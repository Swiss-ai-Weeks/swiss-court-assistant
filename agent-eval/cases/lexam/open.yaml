  question: "C arbeitet als Sportartikelverkäuferin bei der D AG, einem auf den Bereich Wassersport spe\
    \ zialisierten Sportgeschäft in Winterthur. Nachdem im Lager immer wieder Sportartikel ver schwunden\
    \ sind, teilt der Inhaber der D AG allen Angestellten mit, ab nächster Woche wür den die Lagerräume\
    \ flächendeckend mit Videokameras überwacht. C ist damit nicht einver standen und beschwert sich beim\
    \ Firmeninhaber, dass sie diese ständige Überwachung als Eingriff in ihre Privatsphäre empfinde. Ebenso\
    \ bemängelt sie, dass sie vor allem während der Hochsaison im Frühling und im Sommer ihre gesetzlichen\
    \ Pausen nicht beziehen könne. \nNachdem keine Besserung eintritt, meldet C die Situation dem kantonalen\
    \ Arbeitsin spektorat. Ist das Arbeitsinspektorat verpflichtet, nach einer solchen Anzeige aktiv zu\
    \ werden? Gehen Sie bei Ihrer Antwort davon aus, dass die Anzeige begründet ist."
  reference: Ja; Art. 54 Abs. 1 ArG;
  rubric:
  - Ja; Art. 54 Abs. 1 ArG;
  rubric_source: sentences
  expect:
    abstain: false
    cites: true
