  question: |-
    Was ist unter einer sogenannten «informellen Sanierung» zu verstehen und weshalb
    wird diese so bezeichnet?
  reference: Gemäss Art. 26 BankG kann die FINMA bei einer finanziellen Schieflage einer Bank Schutzmassnahmen
    anordnen. Da diese Schutzmassnahmen oft eine Vorstufe zu einem formellen Sanierungsverfahren bilden,
    werden sie auch als «informelle Sanierung» bezeichnet.
