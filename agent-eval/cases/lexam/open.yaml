  question: "Gesetz über den Personentransport mit Taxis und Limousinen (PTLG) (vom 25. März 2019) Der\
    \ Kantonsrat, nach Einsichtnahme in die Anträge des Regierungsrates vom 17. Feb ruar 2016 und der\
    \ Kommission für Wirtschaft und Abgaben vom 28. Au gust 2018, beschliesst: I. Es wird folgendes Gesetz\
    \ erlassen: A. Geltungsbereich §1. 1Dieses Gesetz regelt den entgeltlichen Personentransport mit Taxis\
    \ oder Limousinen. 2 Es gilt nicht für: a. Behinderten-, Schüler-, Arbeiter- und Ambulanztransporte,\
    \ b. Personentransporte mit Fahrzeugen mit einer Höchstgeschwindig keit von 30 km/h, c. Personentransporte,\
    \ bei denen der Fahrpreis in anderen Leistungen eingerechnet ist und wenn die Fahrstrecke nicht mehr\
    \ als 50 km beträgt, d. Mitfahrgelegenheiten, bei denen mitfahrende Personen höchstens den auf sie\
    \ entfallenden Anteil an den Fahrzeugkosten decken. B. Taxis § 2. Taxis sind Personenwagen für den\
    \ berufsmässigen Personen transport, die über eine kantonale Bewilligung verfügen und mit einer Taxilampe\
    \ gekennzeichnet sind. Begriff 2 Kantonale Bewilligungen a. Taxiausweis b. Taxifahrzeug bewilligung\
    \ Standplatz bewilligung Einbau und Kontrolle der Taxameter Taxilampe Betriebs vorschriften a. Informations\
    \ pflicht §3. 1Die für das Taxiwesen zuständige Direktion (Direktion) er teilt die Bewilligung für\
    \ das Führen eines Taxis (Taxiausweis) Gesuch stellerinnen oder Gesuchstellern, die a. im Besitz des\
    \ Führerausweises zum berufsmässigen Personentrans port sind, b. über Kenntnisse der deutschen Sprache\
    \ verfügen, die mindestens dem Niveau B1 des Gemeinsamen Europäischen Referenzrahmens für Sprachen\
    \ des Europarates entsprechen, c. in den letzten fünf Jahren vor der Einreichung des Gesuchs nicht\
    \ wiederholt wegen Verfehlungen im Zusammenhang mit der Be rufsausübung im Taxigewerbe verzeigt oder\
    \ verurteilt worden sind, d. nicht im Strafregister verzeichnet sind. 2 Der Taxiausweis ist fünf Jahre\
    \ gültig und wird auf Gesuch hin er neuert. §4. 1Die Direktion erteilt die Bewilligung für Taxis (Taxifahrzeug\
    \ bewillligung), wenn das Fahrzeug a. den bundesrechtlichen Vorschriften für den berufsmässigen Perso\
    \ nentransport entspricht, b. mit einem gut lesbaren und den bundesrechtlichen Vorschriften ent sprechenden\
    \ Taxameter ausgestattet ist. 2 Andere Technologien werden zugelassen, wenn sie einem Taxa meter mindestens\
    \ gleichwertig sind. Die Bestimmungen zum Taxameter gelten sinngemäss. §5. 1Die Gemeinden können eine\
    \ Bewilligungspflicht für Taxi standplätze auf öffentlichem Grund vorsehen (Standplatzbewilligung).\
    \ 2 Die Standplatzbewilligungen sind von den Gemeinden diskriminie rungsfrei und transparent mittels\
    \ Ausschreibung zuzuteilen und dürfen insbesondere nicht von einer Ortskundeprüfung abhängig gemacht\
    \ wer den. Sie sind zu befristen. §6. 1Zum Einbau von Taxametern sind ausschliesslich Stellen berechtigt,\
    \ die von der Eidgenössischen Zollverwaltung als Montage stellen für Fahrtschreiber zugelassen sind.\
    \ 2 Die Taxameter müssen alle zwei Jahre bei der Montagestelle über prüfen werden. Der Prüfbericht\
    \ ist im Taxi mitzuführen. § 7. Die Direktion regelt die Vorgaben an die Taxilampe. §8. 1Die Tarife\
    \ sind am und im Taxi gut sicht- und lesbar anzu bringen. 2 Der Taxiausweis mit Personalien und einem\
    \ Foto der Taxifahrerin oder des Taxifahrers ist im Taxi gut sicht- und lesbar anzubringen. 3 §9.\
    \ 1Eine Taxifahrt darf nur dann verweigert werden, wenn a. sie aus einem in der Person des Fahrgasts\
    \ liegenden Grund unzu mutbar ist oder b. das Taxi nicht für den vom Fahrgast gewünschten Transport\
    \ ausge rüstet ist. 2 Das Fahrtziel ist ohne ausdrücklich anderslautende Anweisung auf dem für den\
    \ Fahrgast günstigsten Weg anzufahren. § 10. Der Fahrgast ist in der Wahl des Taxis frei. § 11. Der\
    \ Regierungsrat kann Höchsttarife zur Verhinderung von Missbräuchen festlegen. § 12. 1Taxifahrerinnen\
    \ und Taxifahrer mit einer ausserkantona len Bewilligung dürfen im Kanton Zürich folgende Dienstleistungen\
    \ ausführen: a. Fahrgäste absetzen und auf der direkten Rückfahrt neue Fahrgäste mit Zielort ausserhalb\
    \ des Kantons aufnehmen, b. auf Bestellung hin Fahrten zu einem beliebigen Zielort durchfüh ren. 2\
    \ Auf Verlangen der Vollzugsbehörde ist die Erfüllung dieser Vor gaben mit einer Quittungskopie mit\
    \ Zeitangabe nachzuweisen. C. Limousinen § 13. Limousinen sind Personenwagen für den Personentransport\
    \ gegen Bezahlung, die der Direktion gemeldet und mit einer Plakette gekennzeichnet sind. §14. 1Die\
    \ Direktion regelt die Vorgaben an die Plakette. Diese wird für einen bestimmten Personenwagen ausgestellt\
    \ und lautet auf die Halterin oder den Halter. 2 Wer über eine Taxifahrzeugbewilligung verfügt, erhält\
    \ die Plakette für das gleiche Fahrzeug auf Verlangen gebührenfrei. § 15. Wer Limousinendienste ausführt\
    \ oder anbietet, meldet der Direktion a. die Personen, die diese Fahrten ausführen, b. die Limousinen,\
    \ mit denen diese Fahrten ausgeführt werden, und deren Halterinnen oder Halter. b. Transport pflicht\
    \ c. freie Taxiwahl d. Tarife Ausserkanto nale Taxis Begriff Plakette Meldepflicht 4 D. Gemeinsame\
    \ Bestimmungen Vermittlung von Fahraufträgen mit Taxis oder Limousinen Mitführen der Bewilligungen\
    \ Fahrtenbuch Taxis a. Verwaltungs massnahmen b. Strafen § 16. Die Vermittlung von Fahraufträgen mit\
    \ Taxis oder Limou sinen ist nur erlaubt, wenn die Fahrerinnen oder Fahrer zum berufs mässigen Personentransport\
    \ befugt sind. § 17. Die zur Berufsausübung notwendigen Bewilligungen sind mitzuführen und den Kontrollorganen\
    \ auf Verlangen vorzuweisen. § 18. 1Fahrerinnen und Fahrer, die vom Bundesrecht nicht zum Einbau eines\
    \ Fahrtschreibers verpflichtet sind, führen ein Fahrtenbuch. 2 Sie erfassen im Fahrtenbuch für jeden\
    \ Personentransport: a. Datum, b. Anfangs- und Endzeit, c. Abfahrts- und Zielort, d. Fahrpreis. 3\
    \ Gestützt auf das Fahrtenbuch müssen die Personentransporte über einen Zeitraum von einem Jahr überprüft\
    \ werden können. Das Fahr tenbuch ist jederzeit aktuell zu halten und im Fahrzeug mitzuführen. 4 Die\
    \ Fahrerinnen und Fahrer legen das Fahrtenbuch den zuständi gen Behörden auf Verlangen vor. 5 Daten\
    \ betreffend die Fahrgäste dürfen nicht bekannt gegeben wer den. E. Verwaltungsmassnahmen und Strafen\
    \ § 19. 1Der Taxiausweis kann vorübergehend oder dauerhaft ent zogen werden, wenn a. die Voraussetzungen\
    \ gemäss § 3 Abs. 1 lit. c oder d nicht mehr er füllt sind oder b. wiederholt oder in schwerwiegender\
    \ Weise gegen dieses Gesetz oder dessen Ausführungsbestimmungen verstossen wurde. 2 In leichten Fällen\
    \ kann eine Verwarnung ausgesprochen werden. 3 Verwaltungsmassnahmen können unabhängig von einer Bestra\
    \ fung angeordnet werden. § 20. 1Wer ein Taxi ohne Taxiausweis oder Taxifahrzeugbewilli gung führt,\
    \ wird mit Busse bestraft. 2 Andere Verstösse gegen dieses Gesetz oder dessen Ausführungs bestimmungen\
    \ werden mit Ordnungsbussen geahndet. 5 § 21. 1Bei wiederholten Verstössen der Halterinnen oder Halter\
    \ gegen dieses Gesetz oder dessen Ausführungsbestimmungen kann die Plakette vorübergehend oder dauerhaft\
    \ entzogen werden. In leichten Fällen kann eine Verwarnung ausgesprochen werden. Der Entzug kann unabhängig\
    \ von einer Bestrafung angeordnet werden. 2 Verstösse gegen dieses Gesetz oder dessen Ausführungsbestim\
    \ mungen werden mit Ordnungsbussen geahndet. F. Weitere Bestimmungen § 22. 1Die Vollzugsbehörde erhebt\
    \ Gebühren für: a. die Ausstellung und Erneuerung des Taxiausweises gemäss § 3, b. die Erteilung der\
    \ Taxifahrzeugbewilligung gemäss § 4, c. die Ausstellung der Plakette gemäss § 14, d. die Aufnahme\
    \ in das Register gemäss § 24 Abs. 1 lit. c und d. 2 Der Regierungsrat regelt die Höhe der Gebühren\
    \ in einer Verord nung. § 23. 1Die Direktion vollzieht dieses Gesetz, soweit nicht ausdrück lich eine\
    \ andere Zuständigkeit vorgesehen ist. 2 Die Kontrolle auf der Strasse erfolgt durch die Polizei.\
    \ §24. 1Die Direktion führt ein Register über: a. die Taxiausweise, b. die Taxifahrzeugbewilligungen,\
    \ c. die gemeldeten Limousinen, d. die Personen und Unternehmen, die Taxi- oder Limousinendienste\
    \ anbieten, e. die Verwaltungsmassnahmen und Bussen, die gestützt auf dieses Gesetz oder dessen Ausführungsbestimmungen\
    \ ergangen sind. 2 Die Vollzugsbehörden melden Strafen und Massnahmen der Direk tion und können im\
    \ Rahmen von laufenden Verfahren gemäss §§ 19 21 Einsicht in das Register nehmen. § 25. Die Gemeinden\
    \ können die Benützung von Tram- und Bus spuren und das Befahren von Fahrverbotszonen vorsehen. Limousinen\
    \ Gebühren erhebung Zuständigkeiten Register Kommunale Kompetenzen 6 G. Schlussbestimmungen Übergangs\
    \ bestimmung Geltungsdauer § 26. ________________________________________________ § 27. 1 Die Geltung\
    \ dieses Gesetzes ist auf 15 Jahre ab Inkrafttre ten befristet. 2 Der Kantonsrat beschliesst auf Antrag\
    \ des Regierungsrates spätes tens drei Jahre vor Ablauf der Frist über eine Verlängerung der Gel tungsdauer.\
    \ II. Dieses Gesetz untersteht dem fakultativen Referendum. Im Namen des Kantonsrates Die Präsidentin:\
    \ Yvonne Bürgin Datum der Veröffentlichung: Freitag, 5. April 2019 Ablauf der Referendumsfrist: Dienstag,\
    \ 4. Juni 2019 \nWelche Regelungstechnik wird in § 2 angewendet und was ist hier allenfalls problematisch\
    \ (oder mindestens ungewöhnlich) unter dem Blickwinkel der Rechtsetzungslehre?"
  reference: Bei § 2 handelt es sich um eine Legaldefinition. Legaldefinitionen sind eine besondere Regelungstechnik,
    die den Sprachgebrauch für einen bestimmten Erlass regeln. Sie haben keinen normativen Gehalt, sondern
    dienen der Verdeutlichung und Präzisierung (Müller/Uhlmann, Rz. 355 ff.). Vorliegend sind Taxis Personenwagen,
    die mit einer Taxilampe gekennzeichnet sind und über eine Bewilligung verfügen. Die Legaldefinition
    ist somit mit Pflichten verbunden.
  rubric:
  - Bei § 2 handelt es sich um eine Legaldefinition. Legaldefinitionen sind eine besondere Regelungstechnik,
    die den Sprachgebrauch für einen bestimmten Erlass regeln. Sie haben keinen normativen Gehalt, sondern
    dienen der Verdeutlichung und Präzisierung (Müller/Uhlmann, Rz. 355 ff.).
  - Vorliegend sind Taxis Personenwagen, die mit einer Taxilampe gekennzeichnet sind und über eine Bewilligung
    verfügen. Die Legaldefinition ist somit mit Pflichten verbunden.
