  question: "Lenker L. ist erlaubterweise mit dem Personenwagen von Halterin, Frau H., unterwegs. L. stellt\
    \ das Fahrzeug um 08:00 Uhr in der Blauen Zone ab. Da er weiss, dass die Parkerlaubnis von einer Stunde\
    \ nicht reicht, stellt er Ankunftszeit auf der Parkscheibe auf 09.00 Uhr. Um 11:30 Uhr stellt der\
    \ Parkwächter die Überschreitung der erlaubten Parkzeit um 90 Minuten fest. Wäh rend er das Bussenformular\
    \ ausfüllt, kommt Anwohnerin A. daher und sagt, das Fahrzeug stehe seit 08:00 Uhr hier. Sie belegt\
    \ das mit einem Foto. \nPrüfen Sie  ob und wenn ja, wie sich H. von dieser Busse befreien kann."
  reference: (0.5) H kann gemäss OBG 7 IV innerhalb der Zahlungsfrist von 30 Tagen den Namen und die Adresse
    von L nennen, damit das Verfahren zu ihrer Entlastung gegen L durchgeführt wird.
