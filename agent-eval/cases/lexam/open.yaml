  question: "Am 2. April 2010 meldet sich Frau K., Angehörige der Minderheit der Roma, bei der Polizei.\
    \ Ihr\nEhemann habe sie attackiert und mit einem Stromkabel geschlagen. Sie äussert auch, dass sie\
    \ schon\nwiederholt Opfer ihres gewalttätigen Ehemanns gewesen sei; dies alles sei aktenkundig. Bei\
    \ einer\nspäteren Einvernahme, bei welcher sie in Begleitung ihres Ehemanns erscheint, will sie ihre\
    \ Aussage\nzurückziehen. Frau K. ändert ihre Aussage schliesslich so ab, dass es sich bloss noch um\
    \ ein\nAntragsdelikt handelt. Am 30. Mai 2010 erschiesst ihr Ehemann die beiden gemeinsamen Kinder\n\
    (Jahrgang 2004 und 2007) und sich selbst. Die beiden Polizeibeamten, welche den Vorfall\nuntersuchen,\
    \ äussern gegenüber Frau K., „Leute wie sie“ hätten „nichts Besseres verdient“. Die\nErmittlungen\
    \ der Polizei sind bis heute nicht zu einem Abschluss gekommen. \nWelche Grundrechte der BV und der\
    \ EMRK sind berührt?"
  reference: – Recht auf Leben (Art. 10 Abs. 1 BV, Art. 2 EMRK) der Kinder, aber auch des Ehemanns. –
    Recht auf körperliche Unversehrtheit (Art. 10 Abs. 2 BV, Art. 8 EMRK) der Ehefrau. – Diskriminierungsverbot
    (Art. 8 Abs. 2 BV, Art. 14 i.V.m Art. 2 EMRK) durch die Aussage gegenüber Frau K. – Beschleunigungsgebot
    (Art. 29 Abs. 1 BV, Art 2 EMRK prozeduraler Gehalt), weil die Ermittlungen bis heute nicht zu einem
    Abschluss ge- kommen sind. – Bis zu 2 ZP für Erwähnung, dass auch Art. 13 EMRK, Recht auf eine wirksame
    Beschwerde dadurch berührt sein könnte, dass bis heute kein Entscheid irgendeiner Art vorliegt, gegen
    den Frau K. vorgehen könnte
  rubric:
  - – Recht auf Leben (Art. 10 Abs. 1 BV, Art. 2 EMRK) der Kinder, aber auch des Ehemanns. – Recht auf
    körperliche Unversehrtheit (Art. 10 Abs. 2 BV, Art. 8 EMRK) der Ehefrau. – Diskriminierungsverbot
    (Art. 8 Abs. 2 BV, Art. 14 i.V.m Art. 2 EMRK) durch die Aussage gegenüber Frau K. – Beschleunigungsgebot
    (Art. 29 Abs. 1 BV, Art 2 EMRK prozeduraler Gehalt), weil die Ermittlungen bis heute nicht zu einem
