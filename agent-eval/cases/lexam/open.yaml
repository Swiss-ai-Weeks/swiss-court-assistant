  question: "Hinweis: Beantworten Sie folgende Frage in Form eines Essays. Was halten Sie von dem Vorschlag,\
    \ ein eigenes Schweizer Trustrecht \neinzuführen?"
  reference: • Verhinderung von Wettbewerbsnachteilen gegenüber Rechtsordnungen, die ein Trustrecht haben
    resp. Stärkung des Finanzplatzes Schweiz durch ein vielseitigeres Angebot an Vermögensverwaltungsinstrumenten
    (+)  • Grössere Rechtssicherheit, wenn nicht mehr auf ausländische Trusts zurückgegriffen werden muss;
    IPR-Problematik fällt weg (+)  • Bei einem „massgeschneiderten“ Schweizer Trustrecht hätte der Schweizer
    Gesetzgeber die Möglichkeit, der Governance-Problematik ausländischer Trustrechte entgegenzutreten
    (+)  • Personen, welche einen Trust errichten möchten, haben mit etablierten, ausländischen Trustrechten
    bereits genügend Auswahl, so dass kein Bedarf für zusätzliches Instrument besteht; Aufwand zur Schaffung
    eines Schweizer Trusts ist angesichts des geringen Bedarfs zu gross (-)  • Regulatorisches Umfeld
    (automatischer Informationsaustausch in Steuersachen, Geldwäschereigesetzgebung, Aufsicht über Finanzinstitute)
    führt dazu, dass ein Schweizer Trust derart stark reguliert wäre, dass das Instrument von Beginn an
    wenig attraktiv wäre (-)  • Spaltung des Eigentums, wie dies beim Trust des Common Law typisch ist,
    ist mit der Schweizer Rechtsordnung kaum zu vereinbaren; Gefahr von Mischgebilden (-)  • Bei Einführung
    eines Trusts nach angelsächsischem Vorbild müssten Schweizer Richter u.U. auf (schwer kodifizierbares)
    angelsächsisches Case Law zurückgreifen, was nicht praktikabel ist (-)  • Ein Trust würde zu erheblichen
    Wertungswidersprüchen innerhalb der Schweizer Rechtsordnung führen, solange Art. 335 ZGB in der aktuellen
    Form bestehen bleibt; Modernisierung der Schweizer Familienstiftung könnte dem Bedürfnis des Finanzplatzes
    Schweiz nach einem zusätzlichen Instrument zur Nachlassplanung und Vermögensverwaltung besser gerecht
    werden (-)
  rubric:
  - Verhinderung von Wettbewerbsnachteilen gegenüber Rechtsordnungen, die ein Trustrecht haben resp. Stärkung
    des Finanzplatzes Schweiz durch ein vielseitigeres Angebot an Vermögensverwaltungsinstrumenten (+)
  - Grössere Rechtssicherheit, wenn nicht mehr auf ausländische Trusts zurückgegriffen werden muss; IPR-Problematik
    fällt weg (+)
  - Bei einem „massgeschneiderten“ Schweizer Trustrecht hätte der Schweizer Gesetzgeber die Möglichkeit,
    der Governance-Problematik ausländischer Trustrechte entgegenzutreten (+)
  - Personen, welche einen Trust errichten möchten, haben mit etablierten, ausländischen Trustrechten
    bereits genügend Auswahl, so dass kein Bedarf für zusätzliches Instrument besteht; Aufwand zur Schaffung
    eines Schweizer Trusts ist angesichts des geringen Bedarfs zu gross (-)
  - Regulatorisches Umfeld (automatischer Informationsaustausch in Steuersachen, Geldwäschereigesetzgebung,
    Aufsicht über Finanzinstitute) führt dazu, dass ein Schweizer Trust derart stark reguliert wäre, dass
    das Instrument von Beginn an wenig attraktiv wäre (-)
  - Spaltung des Eigentums, wie dies beim Trust des Common Law typisch ist, ist mit der Schweizer Rechtsordnung
    kaum zu vereinbaren; Gefahr von Mischgebilden (-)
  - Bei Einführung eines Trusts nach angelsächsischem Vorbild müssten Schweizer Richter u.U. auf (schwer
    kodifizierbares) angelsächsisches Case Law zurückgreifen, was nicht praktikabel ist (-)
  - Ein Trust würde zu erheblichen Wertungswidersprüchen innerhalb der Schweizer Rechtsordnung führen,
    solange Art. 335 ZGB in der aktuellen Form bestehen bleibt; Modernisierung der Schweizer Familienstiftung
    könnte dem Bedürfnis des Finanzplatzes Schweiz nach einem zusätzlichen Instrument zur Nachlassplanung
    und Vermögensverwaltung besser gerecht werden (-)
