  question: "Der 30-jährige X studiert seit 3 Jahren an einer Universität im Kanton A und geht nebenbei\
    \ einer Tätigkeit als Gesellschafter einer Kollektivgesellschaft nach, welche er mit einer Kommilitonin\
    \ zusammen gründete. Deren Sitz befindet sich im Kanton B, wo sich auch die Büroräumlichkeiten befinden,\
    \ in welchen X und seine Kommilitonin jeweils ca. einen Tag in der Woche arbeiten. Nahe der Universität\
    \ hat X seit Beginn des Studiums eine Wohnung gemietet. Um unnötigen Stress durch Umzüge zu vermeiden,\
    \ hat er sich gleich für eine 4 Zimmer-Wohnung entschieden, so dass später auch seine Freundin dort\
    \ einziehen kann. Seine Eltern wohnen im Kanton C. An seinen schul- und arbeitsfreien Tagen, insbesondere\
    \ jedes Wochenende, verweilt auch X jeweils dort. Auch seinen alten Freundeskreis am Wohnort seiner\
    \ Eltern hat X beibehalten. \nAnnahme: Der Kanton B verzichtet auf die Erhebung jeglicher Steuern\
    \ bei X mit der Begründung, dass eine Arbeitstätigkeit von einem Tag pro Woche nicht ausreichend sei,\
    \ um eine Steuerpflicht in diesem Kanton zu begründen. Vielmehr sei dies Sache des Kantons A. Genauso\
    \ sieht das auch der Kanton A, welcher X unter anderem für seine Einkünfte aus selbständiger Erwerbstätigkeit\
    \ besteuert. Wie beurteilen sie das Vorgehen dieser Kantone?"
  reference: Gemäss der soeben erwähnten Kollisionsregel des Bundesgerichts werden Einkünfte aufgrund
    einer selbständigen Erwerbstätigkeit an dem Ort besteuert, an dem der Geschäftsbetrieb liegt. Im vorliegenden
    Fall verzichtet der Kanton, in welchem der Geschäftsbetrieb liegt auf die Besteuerung. Hingegen besteuert
    der Kanton A dieses Einkommen. Es ist zu prüfen, ob eine Doppelbesteuerung vorliegt. Da X nicht tatsächlich
    zweimal besteuert wird, sondern der Kanton A eine Kollisionsregel des Bundesgerichts verletzt, ist
    eine virtuelle Doppelbesteuerung zu prüfen. Eine gegen Art. 127 Abs. 3 BV verstossende virtuelle Doppelbesteuerung
    liegt vor, wenn ein Kanton die geltenden Kollisionsnormen verletzt, dadurch seine Steuerhoheit überschreitet
    und eine Steuer erhebt, die einem anderen Kanton zusteht. Ob der Kanton, welcher zur Erhebung der
    Steuer berechtigt wäre, diese tatsächlich erhebt, ist für das Vorliegen einer virtuellen Doppelbesteuerung
    nicht von Bedeutung. Vorliegend hat der Kanton A seine Steuerhoheit überschritten, indem er Einkommen
    aus einer selbständigen Erwerbstätigkeit besteuert hat, dessen Besteuerung nach einer Kollisionsregel
    des Bundesgerichts eigentlich dem Kanton B zugestanden hätte. Dass dieser auf die Besteuerung verzichtete,
    ist dabei nicht von Bedeutung. Es liegt somit eine virtuelle Doppelbesteuerung vor, welche gemäss
    Art. 127 Abs. 3 BV in Verbindung mit der vom Bundesgericht entwickelten Rechtsprechung nicht erlaubt
    ist. Das Vorgehen des Kantons A war widerrechtlich.
  rubric:
