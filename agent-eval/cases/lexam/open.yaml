  question: "Die beide auf dem gleichen Markt für Gummidichtungen tätigen Unternehmen A und Unternehmen\
    \ B schliessen einen Lizenzvertrag. Auf dem Markt für Gummidichtungen haben beide einen Marktanteil\
    \ von weniger als 5%. A hat seinen Sitz in Deutschland, B in der Schweiz. A erteilt B die Lizenz an\
    \ einem Patent zur besonders rohstoffarmen Herstellung von Gummidichtungen (die «Vertragsprodukte»)\
    \ zum Verkauf in der Schweiz. Der Vertrag enthält unter anderem folgende Bestimmung: § 2 Verkaufspreis\
    \ B verkauft die Vertragsprodukte zu einem Preis von mindestens CHF 0.10/Stück, ungeachtet der Tatsache,\
    \ ob an Händler oder Endverbraucher verkauft wird. Der General Counsel von A schlägt vor, die Klausel\
    \ zu ersetzen und statt der ursprünglichen Formulierung folgenden Text aufzunehmen: § 2 Menge der\
    \ hergestellten Vertragsprodukte B verpflichtet sich, pro Monat nicht mehr als 20'000 Stück der Vertragsprodukte\
    \ herzustellen, ungeachtet der Tatsache, ob diese zum Verkauf an Händler oder Endverbraucher bestimmt\
    \ sind. Für die Nutzung des Patents durch A gilt keine solche Einschränkung. \nÄndert sich an Ihrer\
    \ vorstehenden Einschätzung etwas, wenn die Unternehmen gemeinsam über alle praktisch relevanten Patente\
    \ zur Herstellung von Dichtungsringen verfügen und dadurch auf Technologiemarkt einen gemeinsamen\
    \ Marktanteil von ca. 90% haben? Weshalb?"
  reference: Nach EU Recht kommt es nicht zu einer Freistellung, Art. 1 Abs. 2 Bst. k bzw. m i.V.m. Art.
    3 Abs. 1; Eine Einzelfreistellung bleibt möglich.
  rubric:
  - Nach EU Recht kommt es nicht zu einer Freistellung, Art. 1 Abs. 2 Bst. k bzw. m i.V.m. Art. 3 Abs.
    1; Eine Einzelfreistellung bleibt möglich.
