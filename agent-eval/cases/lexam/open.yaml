  question: "Man ist immer wieder mit Strassenverkehrsunfällen konfrontiert, bei denen Eltern vom Tod\n\
    ihrer Kinder per SMS oder über das Telefon erfahren. Nicht selten erleiden Eltern dabei einen\nSchockschaden.\
    \  \n Wie wird ein solcher im Rahmen des SVG beurteilt durch die Beschwerde führende Versicherung\
    \ in einem vor ein paar Jahren vor Bun-\ndesgericht durchgeführten Verfahren?"
  reference: In dem erwähnten BGE wurde die Auffassung der Beschwerde führenden Versiche- rung zurückgewiesen.
    Diese hatte argumentiert, Art. 58 SVG statuiere nur dann eine Haftung des Halters, „wenn und soweit
    der Schaden ‚durch den Betrieb‘ eines Motorfahrzeugs verursacht werde, was eine direkte Beziehung
    im Dreieck Betrieb – Opfer – Schaden vorausset- ze“ (a.a.O., Erwäg. 3.2 a.A.); der Betrieb des Fahrzeugs
    sei aber nicht ursächlich für den Schockschaden.
