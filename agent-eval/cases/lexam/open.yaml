  - Über die Möglichkeit, diesen Lebensraum durch einen gleichwertigen zu ersetzen, sagt der Sachverhalt
    nichts aus; sie ist aber wohl zu verneinen, da dies einen Bach mit sehr ähnlichen, wenn nicht identischen
