  question: "Gesamtarbeitsverträge (GAV) sehen zur gemeinsamen Durchführung häufig die Schaffung eines\
    \ besonderen Organs vor. C ist als Programmierer im Softwareunternehmen D. AG tätig. Weder C noch\
    \ die D. AG sind \nMitglied eines Arbeitnehmenden- bzw. Arbeitgebendenverbandes. Im Arbeitsvertrag\
    \ von C \nfindet sich aber eine Klausel, wonach der nicht allgemeinverbindliche Branchen-GAV auf das\
    \ \nArbeitsverhältnis Anwendung finde.  \nWorin liegen die wesentlichen Unterschiede zur GAV-Wirkung\
    \ bzw. -Verbindlichkeit gestützt auf eine Verbandsmitgliedschaft?"
  reference: '- Keine normative bzw. unmittelbare Wirkung (auch richtig: vertragliche Übernahme ist erforderlich)
    - Keine Unabdingbarkeit (auch richtig: Günstigkeitsprinzip gilt nicht, Vertragsänderungen bzw. Änderungskündigungen
    bleiben möglich) - Keine Unverzichtbarkeit - Nennung von Art. 357 OR'
  rubric:
  - 'Keine normative bzw. unmittelbare Wirkung (auch richtig: vertragliche Übernahme ist erforderlich)'
  - 'Keine Unabdingbarkeit (auch richtig: Günstigkeitsprinzip gilt nicht, Vertragsänderungen bzw. Änderungskündigungen
    bleiben möglich)'
  - Keine Unverzichtbarkeit
  - Nennung von Art. 357 OR
