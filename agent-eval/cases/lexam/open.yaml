  - Gegen diese Interessen sind die Interessen abzuwä- gen, die gegen die Wasserentnahme sprechen, namentlich
    die Bedeutung des Gewässers als Lebensraum für die davon abhängige Tier- und Pflanzenwelt, samt deren
