  question: Was ist unter der «Gewähr» im Sinne des Gewährserfordernisses gemäss Art. 3 Abs. 2 lit. c
    BankG zu verstehen? Wer ist Gewährsträger?
  reference: Das Bundesgericht umschreibt die Gewähr als fachliche Kompetenz und korrektes Ver halten
    im Geschäftsverkehr. Das korrekte Verhalten im Geschäftsverkehr ist grundsätzlich erfüllt, wenn die
    Rechtsordnung i.w.S. eingehalten ist. Gewährsträger sind insbesondere die Bankorgane, wie Verwaltungsräte
    und Mitglieder der Geschäftsleitung. Ausserdem sind qualifiziert Beteiligte Gewährsträger.
  rubric:
  - Das Bundesgericht umschreibt die Gewähr als fachliche Kompetenz und korrektes Ver halten im Geschäftsverkehr.
    Das korrekte Verhalten im Geschäftsverkehr ist grundsätzlich erfüllt, wenn die Rechtsordnung i.w.S.
    eingehalten ist. Gewährsträger sind insbesondere die Bankorgane, wie Verwaltungsräte und Mitglieder
    der Geschäftsleitung.
  - Ausserdem sind qualifiziert Beteiligte Gewährsträger.
