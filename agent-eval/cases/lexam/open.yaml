    Ebenso sind kei- ne zwingenden Gründe bekannt, die einer Erhaltung des Lebensraums entgegenstehen.
    Die nach Abs. 1 berechnete Restwassermenge müsste demnach – sollte sich die Sachdar- stellung von
    "Aqua Viva" als zutreffend erweisen – entsprechend erhöht werden.
  - Ob die bei der Bewilligung vorgenommene geringfügige Erhöhung der Restwassermenge um 9 l/s (von 311
