  question: "Sachverhalt \nDer Ruderclub „Rowing Champions“ (R) ist ein Verein im Sinne von Art. 60 ff.\
    \ ZGB mit\nSitz in Zürich, aber nicht im Handelsregister eingetragen. Auf Grundstück X, das im Eigen-\n\
    tum von Eugen Eigenmann (E) steht und unmittelbar am Zürichsee liegt, ist ein Wegrecht\nzugunsten\
    \ des Vereins eingetragen, damit dieser für die Trainings leichten Zugang zum Was-\nser hat. Für den\
    \ Grundbuchkreis, in welchem das Grundstück X liegt, ist das elektronische\nGrundbuch vollständig\
    \ eingeführt.\nNun ergibt sich für den Ruderclub „Rowing Champions“ aber eine noch bessere Möglichkeit:\n\
    Der Verein kann ein Bootshaus auf einem anderen Grundstück mieten und benützt daher den\nWasserzugang\
    \ über Grundstück X nicht mehr. Eugen Eigenmann, der davon Kenntnis be-\nkommt, bittet den Ruderclub\
    \ „Rowing Champions“, das Wegrecht im Grundbuch zu löschen;\ner ist bereit, dem Verein dafür den einmaligen\
    \ Betrag von CHF 5’000.00 zu bezahlen, will\naber mit dem erforderlichen Grundbuchverfahren nichts\
    \ zu tun haben.\nDie Vereinsstatuten sehen vor, dass der Verein seinen Willen bezüglich aller Angelegenheiten\n\
    durch Mehrheitsbeschluss der anwesenden Vereinsmitglieder in der Vereinsversammlung\nbildet und der\
    \ dreiköpfige Vorstand den Verein nach aussen hin vertritt; weitere Bestimmun-\ngen zur Vertretung\
    \ enthalten die Statuten nicht. Vereinspräsident Paul Probst (P) legt das\nAnliegen von Eugen Eigenmann\
    \ in jeder Hinsicht korrekt der Vereinsversammlung vor, und\ndiese beschliesst einstimmig, das Wegrecht\
    \ auf Grundstück X gegen die von Eugen Eigen-\nmann angebotene Entschädigung im Grundbuch löschen\
    \ zu lassen. Paul Probst informiert\nEugen Eigenmann über den Vereinsbeschluss und die beiden einigen\
    \ sich, dass Paul Probst\ndas Grundbuchverfahren einleitet. Paul Probst kommt nun zu Ihnen und fragt\
    \ Sie, wie er dafür\nvorzugehen hat.\n\nDas Grundbuchamt schliesst das Löschungsverfahren ab; es unterlässt\
    \ aber versehentlich die\nAnzeige der Löschung an den Grundeigentümer Eugen Eigenmann. Paul Probst\
    \ will nun bei\nEugen Eigenmann die für die Löschung versprochenen CHF 5’000.00 einfordern, doch Eugen\n\
    Eigenmann weiss von nichts: Er hat keinerlei Kenntnis von der inzwischen erfolgten Lö-\nschung und\
    \ weigert sich, die Zahlung vorzunehmen, bis er einen schriftlichen Nachweis des\nGrundbuchamtes über\
    \ die Löschung vor sich hat. Paul Probst muss, um das Problem zu lösen,\neinen Rechtsanwalt um Rat\
    \ fragen, was dem Verein einen Kostenaufwand von CHF 500.00\nverursacht. Peter Probst möchte sich\
    \ diese Kosten erstatten lassen. \nKann sich der Verein die Beratungskosten zurückerstatten lassen?\
    \ Wenn ja: von wem und\nunter welchen Voraussetzungen?\nEs sind nur die grundbuchrechtlichen Aspekte\
    \ detailliert darzustellen"
  reference: 'Die Kantone haften für den Schaden, der aus der Führung des Grundbuchs ent- steht; es handelt
    sich dabei um eine verschuldensunabhängige Kausalhaftung (Art. 955 Abs. 1 ZGB; vgl. Folien Lektion
    7, S. 3; S CHMID /HÜRLIMANN -KAUP , N 552). Die Tatbestandsvoraussetzungen sind: Es ist jemandem ein
    Schaden entstanden. Darunter versteht man eine unfreiwilli- ge Verschlechterung der Vermögenssituation
    nach der Differenzhypothese (z.B. durch Verlust eines dinglichen Rechts oder durch Prozesskosten;
    vgl. KUKO ZGB-ARNET, Art. 955 N 3). Der Schaden muss aus der rechtswidrigen Führung des Grundbuchs
    entstanden sein (vgl. HÜRLIMANN -K AUP , ZGBR 93/2012, S. 17); d.h. bei der Grundbuchfüh- rung wurden
    in pflichtwidriger Weise Vorschriften des eidgenössischen oder des kantonalen Rechts verletzt, welche
    sich auf die Funktionen des Grundbuchs be- ziehen (z.B. Verletzung der Prüfungspflicht oder Nichtbefolgung
    einer generellen oder individuellen Weisung der Aufsichtsbehörde; vgl. KUKO ZGB-ARNET, Art. 955 N
    3). Zwischen der schädigenden Handlung oder Unterlassung bei der rechtswidrigen Grundbuchführung und
    dem Schaden muss ein natürlicher und adäquater Kausal- zusammenhang bestehen (vgl. KUKO ZGB-A RNET,
    Art. 955 N 3; S CHMID / HÜRLIMANN -K AUP , N 555), d.h. die rechtswidrige Grundbuchführung ist für
    den Schadenseintritt nicht wegzudenken (conditio sine qua non) und nach dem ge- wöhnlichen Lauf der
    Dinge und der allgemeinen Lebenserfahrung geeignet, den Schadenseintritt herbeizuführen. Die Haftung
    des Staates ist kausal und setzt kein Verschulden der Grundbuch- organe voraus (vgl. BGE 110 II 37
    E. 4). Die Verjährung richtet sich nach Art. 60 OR. Subsumtion des SV: 1. Gemäss SV entstanden dem
    Verein R durch den Beizug eines Rechts- anwalts Kosten in der Höhe von CHF 500.00. Es besteht eine
    Differenz zwischen dem aktuellen Vermögensstand des Vereins und dessen Vermö- gensstand ohne rechtswidrige
    Grundbuchführung (Unterlassung der Lö- schungsanzeige gemäss Art. 969 ZGB) in der Höhe von CHF 500.00;
    demnach ist ein Schaden im Rechtssinne im Umfang von CHF 500.00 ent- standen. 2. Da die Löschung der
    Personaldienstbarkeit vorliegend ohne die Mitwir- kung des Eigentümers E auf Anmeldung der dienstbarkeitsberechtigten
    Person erfolgte (Art. 964 ZGB), hätte der Grundbuchverwalter dem Eigen- tümer E die Löschung der Personaldienstbarkeit
    auf dem belasteten Grund- stück X gemäss Art. 969 Abs. 1 ZGB anzeigen müssen. Die Unterlassung der
    Anzeige stellt somit eine pflichtwidrige Verletzung der Anzeigepflicht des Grundbuchverwalters dar.
    3. Der natürliche und adäquate Kausalzusammenhang kann vorliegend bejaht werden: Hätte der Grundbuchverwalter
    dem Eigentümer E die Löschung der Personaldienstbarkeit auf Grundstück X pflichtgemäss angezeigt,
    hätte der Verein R keinen Anwalt bemühen müssen, um den Grundbuchverwal- ter zur pflichtgemässen Ausstellung
    einer Löschungsbestätigung aufzufor- dern, und der Schaden von CHF 500.00 wäre nicht entstanden. Die
    Pflicht- verletzung des Grundbuchverwalters ist nach dem gewöhnlichen Lauf der Dinge und der allgemeinen
    Lebenserfahrung geeignet, die hier entstande- nen Anwaltskosten herbeizuführen. 4. Aktivlegitimiert
    ist der aus der widerrechtlichen Grundbuchführung Ge- schädigte. Passivlegitimiert ist der Kanton,
    auf dessen Gebiet die fehlerhaf- te Grundbuchführung stattgefunden hat, und nicht der fehlbare Grund-
    buchverwalter; bei Verschulden hat der schadenersatzpflichtige Kanton ein Rückgriffsrecht gemäss Art.
    955 Abs. 2 ZGB. Ergebnis: Der Verein R kann seinen Schaden von CHF 500.00 aus Art. 955 Abs. 1 ZGB
    gegenüber dem entsprechenden Kanton geltend machen. Alternative Argumentation: Bei Dienstbarkeiten
    handelt es sich um öffentlich zugängliche Daten des Haupt- buchs (Art. 970 Abs. 3 ZGB; Art. 26 Abs.1
    lit. b GBV). Nach dem Grundsatz von Art. 970 Abs. 4 ZGB kann sich niemand auf die Unkenntnis eines
    Grund- bucheintrags berufen. Da die Unterlassung der Anzeige keine Voraussetzung zur Rechtsgültigkeit
    der betreffenden Verfügung darstellt (vgl. H ÜRLIMANN -KAUP , ZBGR 93/2012, S. 16), kann Eugen Eigenmann
    sich nicht darauf berufen, keine Kenntnis von der Löschung der Dienstbarkeit auf Grundstück X zu haben.
    Die Voraussetzungen der Staatshaftung gemäss Art. 955 Abs. 1 ZGB wären demnach – wenn die Zahlung
    von Eigenmann nicht von der Vorlage einer Löschungsbestä- tigung abhängig war – nicht gegeben und
    die Staatshaftung daher zu verneinen. (Da Eugen Eigenmann gemäss Sachverhalt jedoch nur gegen Vorlage
    eines schriftlichen Eintragungsnachweises zahlen will, wird die Haftung bejaht.)'
  rubric:
  - 'Die Kantone haften für den Schaden, der aus der Führung des Grundbuchs ent- steht; es handelt sich
    dabei um eine verschuldensunabhängige Kausalhaftung (Art. 955 Abs. 1 ZGB; vgl. Folien Lektion 7, S.
    3; S CHMID /HÜRLIMANN -KAUP , N 552). Die Tatbestandsvoraussetzungen sind: Es ist jemandem ein Schaden
    entstanden. Darunter versteht man eine unfreiwilli- ge Verschlechterung der Vermögenssituation nach
    der Differenzhypothese (z.B. durch Verlust eines dinglichen Rechts oder durch Prozesskosten; vgl.
    KUKO ZGB-ARNET, Art. 955 N 3). Der Schaden muss aus der rechtswidrigen Führung des Grundbuchs entstanden
    sein (vgl. HÜRLIMANN -K AUP , ZGBR 93/2012, S. 17); d.h. bei der Grundbuchfüh- rung wurden in pflichtwidriger
    Weise Vorschriften des eidgenössischen oder des kantonalen Rechts verletzt, welche sich auf die Funktionen
    des Grundbuchs be- ziehen (z.B. Verletzung der Prüfungspflicht oder Nichtbefolgung einer generellen
    oder individuellen Weisung der Aufsichtsbehörde; vgl. KUKO ZGB-ARNET, Art. 955 N 3). Zwischen der
    schädigenden Handlung oder Unterlassung bei der rechtswidrigen Grundbuchführung und dem Schaden muss
    ein natürlicher und adäquater Kausal- zusammenhang bestehen (vgl. KUKO ZGB-A RNET, Art. 955 N 3; S
    CHMID / HÜRLIMANN -K AUP , N 555), d.h. die rechtswidrige Grundbuchführung ist für den Schadenseintritt
    nicht wegzudenken (conditio sine qua non) und nach dem ge- wöhnlichen Lauf der Dinge und der allgemeinen
    Lebenserfahrung geeignet, den Schadenseintritt herbeizuführen. Die Haftung des Staates ist kausal
    und setzt kein Verschulden der Grundbuch- organe voraus (vgl. BGE 110 II 37 E. 4). Die Verjährung
    richtet sich nach Art. 60 OR. Subsumtion des SV:'
  - 1. Gemäss SV entstanden dem Verein R durch den Beizug eines Rechts- anwalts Kosten in der Höhe von
    CHF 500.00. Es besteht eine Differenz zwischen dem aktuellen Vermögensstand des Vereins und dessen
    Vermö- gensstand ohne rechtswidrige Grundbuchführung (Unterlassung der Lö- schungsanzeige gemäss Art.
    969 ZGB) in der Höhe von CHF 500.00; demnach ist ein Schaden im Rechtssinne im Umfang von CHF 500.00
    ent- standen.
  - 2. Da die Löschung der Personaldienstbarkeit vorliegend ohne die Mitwir- kung des Eigentümers E auf
    Anmeldung der dienstbarkeitsberechtigten Person erfolgte (Art. 964 ZGB), hätte der Grundbuchverwalter
    dem Eigen- tümer E die Löschung der Personaldienstbarkeit auf dem belasteten Grund- stück X gemäss
    Art. 969 Abs. 1 ZGB anzeigen müssen. Die Unterlassung der Anzeige stellt somit eine pflichtwidrige
    Verletzung der Anzeigepflicht des Grundbuchverwalters dar.
  - '3. Der natürliche und adäquate Kausalzusammenhang kann vorliegend bejaht werden: Hätte der Grundbuchverwalter
    dem Eigentümer E die Löschung der Personaldienstbarkeit auf Grundstück X pflichtgemäss angezeigt,
    hätte der Verein R keinen Anwalt bemühen müssen, um den Grundbuchverwal- ter zur pflichtgemässen Ausstellung
    einer Löschungsbestätigung aufzufor- dern, und der Schaden von CHF 500.00 wäre nicht entstanden. Die
    Pflicht- verletzung des Grundbuchverwalters ist nach dem gewöhnlichen Lauf der Dinge und der allgemeinen
    Lebenserfahrung geeignet, die hier entstande- nen Anwaltskosten herbeizuführen.'
  - '4. Aktivlegitimiert ist der aus der widerrechtlichen Grundbuchführung Ge- schädigte. Passivlegitimiert
    ist der Kanton, auf dessen Gebiet die fehlerhaf- te Grundbuchführung stattgefunden hat, und nicht
    der fehlbare Grund- buchverwalter; bei Verschulden hat der schadenersatzpflichtige Kanton ein Rückgriffsrecht
    gemäss Art. 955 Abs. 2 ZGB. Ergebnis: Der Verein R kann seinen Schaden von CHF 500.00 aus Art. 955
    Abs. 1 ZGB gegenüber dem entsprechenden Kanton geltend machen. Alternative Argumentation: Bei Dienstbarkeiten
    handelt es sich um öffentlich zugängliche Daten des Haupt- buchs (Art. 970 Abs. 3 ZGB; Art. 26 Abs.1
    lit. b GBV). Nach dem Grundsatz von Art. 970 Abs. 4 ZGB kann sich niemand auf die Unkenntnis eines
    Grund- bucheintrags berufen. Da die Unterlassung der Anzeige keine Voraussetzung zur Rechtsgültigkeit
    der betreffenden Verfügung darstellt (vgl. H ÜRLIMANN -KAUP , ZBGR 93/2012, S. 16), kann Eugen Eigenmann
    sich nicht darauf berufen, keine Kenntnis von der Löschung der Dienstbarkeit auf Grundstück X zu haben.
    Die Voraussetzungen der Staatshaftung gemäss Art. 955 Abs. 1 ZGB wären demnach – wenn die Zahlung
    von Eigenmann nicht von der Vorlage einer Löschungsbestä- tigung abhängig war – nicht gegeben und
    die Staatshaftung daher zu verneinen. (Da Eugen Eigenmann gemäss Sachverhalt jedoch nur gegen Vorlage
    eines schriftlichen Eintragungsnachweises zahlen will, wird die Haftung bejaht.)'
