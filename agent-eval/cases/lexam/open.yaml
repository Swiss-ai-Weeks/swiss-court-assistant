  question: Aufgrund gehäufter Hinweise auf Betäubungsmitteldelikte (öffentlicher Konsum und Handel von
    harten Drogen) in einem Wohnquartier in der Stadt Zürich möchte die Stadtpolizei aktiv werden. Welche
    konkreten polizeilichen Massnahmen im präventiven Bereich empfehlen Sie?
  reference: '- Folgende polizeiliche Massnahmen gemäss PolG/ZH kommen in Betracht, um die Entstehung
    einer Drogenszene zu verhindern: (max. 4 Punkte) − Vermehrte Vornahme von Personenkontrollen und Identitätsfeststellungen
    (§ 21 PolG/ZH): Dadurch markiert die Polizei Präsenz und kann in Erfahrung bringen, wer die Personen
    sind, die im einschlägigen Gebiet im Zusammenhang mit dem Konsum und Handel von Drogen auffallen,
    und ob diese bereits im Zusammenhang mit Verstössen gegen die Betäubungsmittelgesetzgebung aktenkundig
    geworden sind. (1) − Anordnung von Wegweisungen (§ 33 PolG/ZH): Die Polizei kann gegen bestimmte Personen
    Wegweisungen aus dem Quartier aussprechen, sofern einer der Gründe in lit. a – e erfüllt ist. Dies
    ist beim öffentlichen Konsum und Han del harter Drogen ohne weiteres zu bejahen. (1) − Durchsuchung
    von Personen, Fahrzeugen und Gegenständen (§§ 35 f. PolG/ZH): Ermöglicht der Polizei, verbotene Betäubungsmittel
    aufzuspüren und so den Konsum und Handel zu unterbinden. (1) − Polizeiliche Observation (§ 32 PolG/ZH)
    und Audio- und Videoüberwachung (§ 32a und b PolG/ZH): Dadurch können bestimmte Personen oder Brennpunkte,
    die im Zusammenhang mit der Drogenszene aufgefallen sind, zielgerichtet überwacht werden. (1)'
