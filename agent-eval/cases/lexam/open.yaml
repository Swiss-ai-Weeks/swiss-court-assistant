  question: Mit welchem Instrument kann die Stockwerkeigentümergemeinschaft ihre Beitragsforderung gegenüber
    einem Stockwerkeigentümer gegen dessen Willen vorläufig dinglich absichern? Nennen Sie die Voraussetzungen
    des Instruments und beschreiben Sie das Verfahren zur Absicherung.
  reference: '1. Anspruch auf Errichtung des Pfandrechts der Stockwerkeigentümergemein schaft   Die Stockwerkeigentümer
    haben an die Lasten des gemeinschaftlichen Eigentums und an die Kosten der gemeinschaftlichen Verwaltung
    Beiträge nach Massgabe ihrer Wertquoten zu leisten (Art. 712h Abs. 1 ZGB).  Die Gemeinschaft hat
    gegenüber jedem Stockwerkeigentümer einen Anspruch auf Errichtung eines Pfandrechts an dessen Anteil
    für die Beitragsforderungen der letzten drei Jahre (Art. 712i Abs. 1 ZGB). Das Pfandrecht besteht
    für Beitragsforderungen, welche fällig, aber nicht bezahlt sind  Aktivlegitimiert ist die Stockwerkeigentümergemeinschaft,
    d.h. die Gesamtheit der Stockwerkeigentümer. Sie wird durch den Verwalter oder, wenn ein solcher nicht
    bestellt ist, durch jeden durch Mehrheitsbeschluss oder durch das Gericht dazu ermächtigten Stockwerkeigentümer
    vertreten (Art. 712i Abs. 2, Art. 712t Abs. 2 ZGB).  Passivlegitimiert ist der gegenwärtige Stockwerkeigentümer
    des zu belastenden Stockwerkeigentumsanteils (Art. 712i Abs. 1 ZGB).  Das Pfandrecht belastet den
    Stockwerkanteil (Pfandobjekt). Bei mehreren Stockwerkanteilen werden sie im Verhältnis der Wertquoten
    belastet. 5.5 [0.5] 2. Verfahren für vorläufige dingliche Absicherung der Beitragsforderung  Auf
    das Verfahren sind die Bestimmungen über die Errichtung des Bauhandwerkerpfandrechts sinngemäss anwendbar
    (Art. 712i Abs. 3 ZGB).  Es handelt sich um ein mittelbares gesetzliches Pfandrecht,75 also um eine
    Grundpfandverschreibung. Das Pfandrecht entsteht demnach erst mit der Eintragung in das Grundbuch
    (Art. 799 Abs. 1 ZGB), nämlich in die Abteilung Grundpfandrechte. Die Eintragung kann nur erfolgen,
    wenn die Pfandsumme vom Stockwerkeigentümer anerkannt oder gerichtlich festgestellt ist (vgl. Art.
    839 Abs. 3 ZGB). Ist keine Einigung betreffend die Pfandsumme möglich und besteht im Hinblick auf
    die dreijährige Frist zeitliche Dringlichkeit, kann vorerst eine vorläufige Eintragung angestrebt
    werden.  Vorläufige Eintragungen können vorgemerkt werden zur Sicherung behaupteter dinglicher Rechte
    (Art. 961 Abs. 1 ZGB). Die vorläufige Eintragung geschieht auf Anordnung des Gerichts (Art. 961 Abs.
    2 ZGB; Art. 76 Abs. 2 lit. d GBV). Die ausstehende Beitragsforderung ist glaubhaft zu machen (Art.
    961 Abs. 3 ZGB). Bei Gutheissung der Klage weist das Gericht das zuständige Grundbuchamt zur Vormerkung
    der vorläufigen Eintragung an und setzt eine Frist zur Einleitung des ordentlichen Zivilprozesses
    (Art. 961 Abs. 3 ZGB).  Die Stockwerkeigentümergemeinschaft kann ihre Beitragsforderung gegenüber
    einem Stockwerkeigentümer mittels Vormerkung einer vorläufigen Eintragung eines Pfandrechts nach Art.
    712i ZGB gegen dessen Willen vorläufig dinglich absichern. Ergebnis zu Frage 4.1: Die Stockwerkeigentümergemeinschaft
    kann ihre Beitragsforderung gegenüber einem Stockwerkeigentümer mittels Vormerkung einer vorläufigen
    Eintragung eines Pfandrechts nach Art. 712i ZGB gegen dessen Willen vorläufig dinglich absichern.
    0 Anmerkung: Das Retentionsrecht der Stockwerkeigentümergemeinschaft (Art. 712k ZGB) an den Mobilien,
    die sich in den Räumlichkeiten der betreffenden Stockwerkeinheit befinden, entsteht bereits mit der
    Einbringung des Mobiliars in die Stockwerkeinheit. Daher kommt dabei eine vorläufige dingliche Absicherung
    der Beitragsforderung nicht in Betracht.'
