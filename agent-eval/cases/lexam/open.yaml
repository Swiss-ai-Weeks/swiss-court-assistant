- id: lexam-open-d1be253f
  suite: lexam_open
  area: Public
  language: de
  level: exam
  question: "Im Bundesgesetz über den Konsumkredit vom 23. März 2001 (KKG) ist zu lesen: Art. 36a Aggressive\
    \ Werbung 1Für Konsumkredite darf nicht in aggressiver Weise geworben werden. 2Die gewerbsmässig tätigen\
    \ Kreditgeberinnen umschreiben in einer privatrechtlichen Vereinbarung in angemessener Weise, welche\
    \ Werbung als aggressiv gilt. 3 Der Bundesrat regelt, welche Werbung als aggressiv gilt, wenn innert\
    \ angemessener Frist keine Vereinbarung zustande gekommen ist, oder wenn er diese Vereinbarung für\
    \ ungenügend erachtet. Art. 36b Strafbestimmung Wer vorsätzlich gegen das Verbot der aggressiven Werbung\
    \ verstösst, wird mit Busse bis zu 100 000 Franken bestraft. \nCharakterisieren Sie die Form der Selbstregulierung\
    \ in den beiden Bestimmungen und nehmen Sie dazu Stellung."
  reference: 'In Art. 36a Bundesgesetz über den Konsumkredit (KKG) wird "ag gressive Werbung" verboten.
    Dieses Verbot ist in Art. 36a Abs. 1 KKG festgehalten. Die Konkretisierung dieses offenen Begriffs
    er folgt in Form einer gesteuerten Selbstregulierung, dass nämlich gemäss Art. 36a Abs. 2 KKG die
    gewerbsmässig tätigen Kredit geberinnen in einer privatrechtlichen Vereinbarung in angemes sener Weise
    umschreiben, welche Werbung aggressiv gilt. Wenn diese Umschreibung dem Bundesrat als ungenügend erscheint
    oder sie gar nicht zustande kommt, so ist der Bundesrat für die Umschreibung aggressiver Werbung zuständig
    (Art. 36a Abs. 3 KKG). Klar erscheint zunächst in Absatz 3, dass der Druck auf die Kre ditgeberinnen
    in der Weise erzeugt werden, dass, wenn eine Re gelung nicht zustande kommt oder ungenügend ist, der
    Bundes rat zuständig ist. Für dieses, teilweise als "Loi Damocles" be zeichnete Regelungskonzept gibt
    es verschiedene Vorlagen und Beispiele (die auch in der Vorlesung besprochen wurden). Der Anreiz,
    eine entsprechende private Regelung zu erlassen, ergibt sich also durch die "Drohung", dass ansonsten
    staatliches Recht erlassen wird. Absatz 2 geht davon aus, dass die Aufgabe der Kreditgeberinnen im
    Wesentlichen darin besteht, einen unbestimmten Rechtsbe griff (aggressive Werbung) weiter zu konkretisieren.
    Es ist eine mögliche Form der gesteuerten Selbstregulierung, die sich etwa für Standards von Fachgesellschaften
    (z.B. Ärztinnen und Ärzte, Anwaltschaft) relativ häufig findet. Technisch ist die Form der Selbstregulierung
    somit grundsätzlich möglich und es ist mindes tens ersichtlich, weshalb sie hier nicht funktionieren
    sollte. Allerdings sollten die Studierenden auch die kritischen Punkte er kennen und diskutieren.
    So sind bei der Konkretisierung des Be griffs "aggressive Werbung" nur die Kreditgeberinnen und Kredit
    geber beteiligt; ein Gegenstück, wie Konsumentenschutzorganisationen, Betroffene etc., besteht nicht.
    Auch der Prozess zum Erlass der Selbstregulierung ist auch in keiner Weise angesprochen. Es ist nicht
    ersichtlich, dass sich Private oder Interessengruppen an diesem Prozess irgend wie beteiligen könnten.
    Die Kreditgeberinnen können damit eine Regelung treffen, die allein ihren Interessen dient. Einziges
    Kor rektiv ist die Interventionsmöglichkeit des Bundesrates.  Aufwerfen kann man auch die Frage, was
    die Rechtswirkung ei ner solchen Vereinbarung bedeutet. Während bei einer Rechts verordnung klar ist,
    dass (soweit die Verordnung rechtlich zuläs sig ist) die Gerichte gebunden werden, ist nicht klar,
    ob die glei che Bindungswirkung für eine privatrechtliche Vereinbarung gilt. Anders gewendet: Könnte
    ein Gericht eine Kreditgeberin auch dann bestrafen, wenn sie sich an die privatrechtliche Vereinba
    rung hält, das Gericht aber der Auffassung ist, dass nach dem eigenen Verständnis aggressive Werbung
    vorliegt? Mit Blick auf die durchaus substantiellen Strafbestimmungen ist die Frage von Relevanz.  Kritisch
    zu beleuchten ist auch die Frage nach der Vereinbarkeit von Art. 36a KKG mit dem Legalitätsprinzip,
    genauer gesagt, ob die Konkretisierung des Begriffs der aggressiven Werbung an Pri vate delegiert
    werden kann (im Gegensatz zu anderen Beispielen liegt hier ein relativ klarer Fall einer Delegation
    vor, wohlbemerkt einer Delegation, bei der die Betroffenen ihr eigenes, auch straf rechtlich relevantes
    Verhalten regeln müssen). Man kann sich auf den Standpunkt stellen, dass eine solche Klärung über
    eine Voll ziehungsverordnung im Sinne der bundesgerichtlichen Recht sprechung hinausgeht und dementsprechend
    eine unzulässige Delegation darstellt. Entgegenhalten kann man dieser Auffas sung, dass Art. 36 a
    Abs. 1 KKG allein genügen könnte, um die Strafbarkeit zu begründen. Auch im Strafgesetzbuch finden
    sich verschiedene, sehr offen formulierte Normen, die letztlich von den Gerichten konkretisiert werden
    müssen. Vertreten lässt sich aber auch, dass bereits der Begriff der aggressiven Werbung zu unbe stimmt
    ist, insbesondere im Hinblick darauf, dass empfindliche Bussen drohen, wer hier (zu) aggressiv wirbt.
    In jedem Fall ste hen Art. 36a Abs. 2 und 3 KKG in einem erheblichen Spannungs verhältnis zum Legalitätsprinzip
    – wozu man selbstverständlich unterschiedlicher Auffassung sein kann, aber mindestens die Be denken
    sehen und erklären können sollte.'
