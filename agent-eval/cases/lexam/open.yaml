  question: "Jorge war mit seinem Leben mehr als zufrieden: Er hatte eine unbekümmerte Kindheit genossen,\
    \ war mit seiner Jugendliebe (Sonja) verlobt und in seinem Beruf von Klienten und Kollegen gleichermassen\
    \ geschätzt. Diese Idylle zerbrach abrupt in der Nacht vom 13. Oktober 2016, als er nach langen Über\
    \ stunden auf der Rückfahrt nach Hause einen Sekundenschlaf erlitt und dadurch einen Selbstunfall\
    \ ver ursachte, bei welchem er ein Bein und einen Arm verlor. Nach der wenig erfolgreichen Rehabilitation\
    \ ging es nur noch bergab: Aus Frust kam es immer wieder zu Alkohol- und Betäubungsmittelmissbrauch.\
    \ Am 22. Januar 2019 verurteilte ihn ein Gericht wegen des Kaufs von 30g Marihuana zu einer Busse\
    \ von CHF 200. Bald darauf kam es zu einer weiteren Verurteilung wegen Beschimpfung (Art. 177 StGB)\
    \ und Nichtanzeigen eines Fundes (Art. 332 StGB) (bedingte Geldstrafe von 10 Tagessätzen und Busse\
    \ von CHF 350). Durch den wiederkehrenden Alkohol- und Betäubungsmittelmissbrauch und den damit verbundenen\
    \ Konzentrationsmangel verlor Jorge schliesslich seine Arbeit. Daraufhin folgten mehrere Ladendiebstähle\
    \ (in Lebensmittel- und Kleidergeschäften), die ihrerseits zu einer am 16. Mai 2023 aus gesprochenen\
    \ bedingten Freiheitsstrafe von 5 Monaten führten. Als Jorge von der Verhandlung nach Hause zurückkam,\
    \ traf er seine Verlobte mit gepacktem Koffer vor der Haustür: Es reiche ihr und sie verlasse ihn,\
    \ zumal sie nun mit Anton (Jorges ehemaliger Arbeitskollege und guter Freund) ein Verhält nis habe.\
    \ Es kommt zu einer körperlichen Auseinandersetzung zwischen Jorge und Sonja, sie erleidet einen Nasenbeinbruch.\
    \ Sie vertreten Jorge vor Gericht. Die Anklage lautet auf einfache Körperverletzung (Art. 123 Ziff.\
    \ 2 StGB) und die Staatsanwaltschaft beantragt eine Freiheitsstrafe von 9 Monaten. Während der Verhand\
    \ lung hat Jorge zunächst alle Vorwürfe (aus Scham über seine Taten) bestritten, angesichts der vorlie\
    \ genden erdrückenden Beweise aber schliesslich vollumfänglich gestanden. Während sich das Gericht\
    \ zur Urteilsberatung zurückgezogen hat, fragt er Sie, wie seine Chancen auf eine bedingte Strafe\
    \ stünden. Er habe seine Lektion gelernt und möchte nach Spanien auswandern (da er auch einen spanischen\
    \ Pass besässe) und dort sein Leben von Neuem beginnen. \nÄndert sich etwas, wenn die Freiheitsstrafe\
    \ 26 Monate beträgt, das Gericht ihm aber eine 90 tätige Untersuchungshaft anrechnet?"
  reference: 'Wenn die Freiheitsstrafe 26 Monate – also mehr als 2 Jahre – beträgt, kann diese nicht mehr
    vollbedingt ausgesprochen werden (vgl. Art. 42 Abs. 1 StGB). Dass das Gericht die 90 Tage ausgestandener
    Unter suchungshaft an die Strafe anrechnet, ändert nichts am Ergebnis: Entscheidend für die Frage,
    ob von der Strafdauer her eine bedingte Strafe möglich ist, ist die verhängte Strafe (hier 26 Monate),
    nicht diejenige, welche nach Anrechnung der Untersuchungshaft übrigbleibt (23 Monate).'
  rubric:
  - Wenn die Freiheitsstrafe 26 Monate – also mehr als 2 Jahre – beträgt, kann diese nicht mehr vollbedingt
    ausgesprochen werden (vgl. Art. 42 Abs. 1 StGB).
  - 'Dass das Gericht die 90 Tage ausgestandener Unter suchungshaft an die Strafe anrechnet, ändert nichts
    am Ergebnis: Entscheidend für die Frage, ob von der Strafdauer her eine bedingte Strafe möglich ist,
    ist die verhängte Strafe (hier 26 Monate), nicht diejenige, welche nach Anrechnung der Untersuchungshaft
    übrigbleibt (23 Monate).'
