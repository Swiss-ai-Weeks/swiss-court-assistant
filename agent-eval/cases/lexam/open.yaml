  question: "Die Stiftung X. umschreibt in ihren Statuten ihren Zweck wie folgt:\n\"Führung eines oder\
    \ mehreren Meditationszentren und Vornahme der dazugehöri-\ngen Massnahmen und Tätigkeiten. Die Meditationszentren\
    \ sind der buddhistischen\nMeditation und Praxis in allen Formen gewidmet. Die Stiftung ist ausschliesslich\n\
    gemeinnützig tätig.\"\nDer Stiftung X. gehört eine in einem abgelegenen Tal gelegene Liegenschaft\
    \ mit Restau-\nrant und Gästebetten, in der sie gegen Entgelt Meditationskurse durchführt. Mit den\
    \ sog.\n\"Kurspreisen\" werden die Kosten für die Unterkunft und Verpflegung der Kursteilnehmen-\n\
    den, die Spesen der Lehrpersonen sowie die Aufwendungen für Administration, Werbung\nund Betrieb des\
    \ Zentrums gedeckt. Kursleitende sind Organe der Stiftung sowie externe\nFachleute aus dem In- und\
    \ Ausland. Diesen wird jeweils am Ende der Meditationskurse\nanonym eine Spende durch die Teilnehmenden\
    \ ausgerichtet. Diese Gaben, deren Höhe\nunbekannt ist, sind – abgesehen vom Auslagenersatz – die\
    \ einzigen Einkünfte des Lehr-\nkörpers. Neben den Einnahmen aus den Kursen erzielt die Stiftung X.\
    \ auch Einnahmen\naus Spenden. Sie beschäftigt zum Betrieb des Meditationszentrums insgesamt 10 Per-\n\
    sonen, die marktüblich entlöhnt werden. Die Stiftungsratsmitglieder erhalten für ihre Tä-\ntigkeit\
    \ für die Stiftung X. hingegen keine Entschädigung. \nErklären Sie, ob nach Ihrer Meinung die Stiftung\
    \ X. diese Voraussetzungen gemäss\ndem vorstehend dargelegten Sachverhalt erfüllt."
  reference: 'Die meditative Zweckverfolgung kann grundsätzlich als im Allgemeininteresse liegend betrachtet
    werden. Zudem kann davon ausgegangen werden, dass eine ausschliessliche Widmung von Gewinn und Vermögen
    im vorliegenden Fall gegeben ist. Eine gegenteilige Argumentation ist jedoch auch möglich, da ein
    Hinweis auf eine explizite Statutenbe- stimmung in der Sachverhaltsdarstellung fehlt. Fraglich ist
    im vorliegenden Fall vor allem, ob von einer uneigennützigen Zweckverfol- gung ausgegangen werden
    kann (Bemerkung: es wurden bei der Korrektur der Prüfun- gen beide möglichen Lösungswege akzeptiert).
    1. Lösungsweg: Uneigennützigkeit gegeben Die Meditationskurse werden zwar entgeltlich durchgeführt,
    die Einnahmen aus den Kur- sen dienen aber nur dazu, die Kosten für Unterkunft und Verpflegung sowie
    weitere Auf- wendungen der Stiftung zu decken. Die Erzielung eines Gewinns wird offenbar nicht an-
    gestrebt. Die Lehrpersonen erhalten neben dem Auslagenersatz keine feste Entschädi- gung für ihre
    Tätigkeit, sondern sind auf Spenden der Kursteilnehmenden angewiesen. Diese stehen im Voraus nicht
    fest und sind nicht garantiert. Ferner arbeiten die Stiftungs- ratsmitglieder unentgeltlich für die
    Stiftung und erzielt die Stiftung auch weitere Einnah- men aus Spenden. Eine uneigennützige Tätigkeit
    kann deshalb bejaht werden. Ein Selbsthilfezweck liegt zudem nicht vor, da das Meditationszentrum
    allen offen steht und keine irgendwie geartete Mitgliedschaft verlangt wird. Weiter spricht auch der
    Grund- satz der Wettbewerbsneutralität nicht gegen eine Steuerbefreiung der Stiftung. Aufgrund der
    abgeschiedenen Lage des Meditationszentrums ist die Bereitstellung von Kost und Logis faktisch eine
    Notwendigkeit der Zweckverfolgung und eine direkte Nachbarschaft und damit Konkurrenz zu anderen Restaurationsbetrieben
    ausgeschlossen. 2. Lösungsweg: Uneigennützigkeit nicht gegeben Die Meditationskurse werden entgeltlich
    durchgeführt. Zwar werden durch die Einnahmen aus den Kursen nur die Kosten für Unterkunft und Verpflegung
    sowie weitere Aufwen- dungen gedeckt, darin kann aber noch kein altruistisches Handeln erblickt werden.
    Die Lehrpersonen erhalten neben dem Auslagenersatz zwar nur Spenden von den Kursteil- nehmenden, die
    in der Höhe im Voraus unbekannt sind, trotzdem kann davon ausgegan- gen werden, dass die Lehrpersonen
    regelmässig von den allermeisten Kursteilnehmen- den eine Spende erhalten werden. Da ihre Spesen durch
    die Stiftung gedeckt sind, kommen den Lehrpersonen diese Spenden vollumfänglich zu und sind einem
    Erwerbs- einkommen gleichzusetzen. Auch die 10 Mitarbeiter, die marktgerecht entlohnt werden, erbringen
    kein Opfer. Die Kosten für die Kurse decken zudem nicht nur Kost und Logis der Teilnehmenden sondern
    auch Aufwendungen für Administration und Werbung. Das Meditationszentrum scheint somit auf dem Markt
    als Marktteilnehmer aufzutreten. Schliesslich ist auch frag- lich, ob mit der angeschlossenen Hotellerie
    / Restauration nicht auch Erwerbszwecke verfolgt werden und sich die Stiftung damit in Konkurrenz
    zu anderen Hotels und Restau- rants befindet. Die Voraussetzungen für eine Steuerbefreiung sind deshalb
    nicht erfüllt.'
