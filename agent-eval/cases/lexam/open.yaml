  question: "C ist als Lagerist in der D AG tätig. Als C an einem Morgen verschläft und zu spät zur Arbeit\
    \ erscheint, entlässt ihn die D AG noch gleichentags fristlos. Weil C mit Klage droht, sucht die D\
    \ AG nach weiteren Vorkommnissen. Tatsächlich findet sie eine Aktennotiz im Personaldossier von C.\
    \ Danach hat C vor drei Jahren seinen Abteilungsleiter anlässlich eines Weihnachtsessens vor versammelter\
    \ Runde als «Menschenschinder» und «Terroristen» beschimpft. \nWie beurteilen Sie die Rechtmässigkeit\
    \ der fristlosen Entlassung?"
  reference: '- Voraussetzung für fristlose Entlassung: - Wichtiger Grund - Art. 337 OR - Bezüglich Verschlafen:
    einmaliges Verschlafen genügt nicht (auch richtig: «kein wichtiger Grund», «einmalige, nicht schwere
    Pflichtverletzung» oder vergleichbar; keine nähere Begründung notwendig) - Bezüglich Beschimpfung
    zentrale Fragestellung: - Nachschieben von Kündigungsgründen - Nach Bundesgericht (BGE 142 III 579,
    Angabe nicht notwendig): - Grundsätzlich möglich - Voraussetzung: Ereignis hat sich vor fristloser
    Kündigung zugetragen - Voraussetzung: Umstand zum Zeitpunkt der Kündigung weder bekannt noch konnte
    er bekannt sein - Keine Voraussetzung: Umstand muss nicht von ähnlicher oder gleicher Art sein wie
    der in der Kündigung genannte (auch richtig: wie jener, der Anlass zur Kündigung gab) In casu: - Beschimpfung
    war bekannt, da gegenüber Vorgesetztem und vor versam melter Runde erfolgt (Angabe von eins von beidem
    genügt) und im Perso naldossier vermerkt - Daher Nachschieben unzulässig - (wenn anstelle des Nachschiebens
    von Kündigungsgründen über die bun desgerichtliche Rechtsprechung zur kurzen Reaktionsfrist von 2-3
    Tagen argumentiert wird: maximal 3 Punkte [nicht kumulativ]) - (materielle Diskussion des wichtigen
    Grunds bezüglich der Beschimpfung bei diesem Ergebnis obsolet, d.h. weder notwendig noch zu Punkten
    be rechtigend) Fazit: Fristlose Entlassung ist ungerechtfertigt'
