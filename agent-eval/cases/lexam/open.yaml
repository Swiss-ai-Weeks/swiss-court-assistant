  question: Was bezeichnet man in der Bankenbranche als «Leverage Ratio»? Wie hoch muss die «Leverage
    Ratio» gemäss schweizerischer Bankenregulierung sein?
  reference: Als «Leverage Ratio», auch Verschuldensquote, bezeichnet man das Verhältnis von regulato
    rischem Kernkapital zum Gesamtengagement einer Bank. Nach Art. 46 ERV muss das Verhältnis des Kernkapitals
    einer Bank zu deren Gesamtengage ment mindestens 3 % betragen.
  rubric:
  - Als «Leverage Ratio», auch Verschuldensquote, bezeichnet man das Verhältnis von regulato rischem Kernkapital
    zum Gesamtengagement einer Bank. Nach Art. 46 ERV muss das Verhältnis des Kernkapitals einer Bank
    zu deren Gesamtengage ment mindestens 3 % betragen.
