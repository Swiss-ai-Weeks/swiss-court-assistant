  question: "In einem amtlichen Dokument des Bundes lesen Sie Folgendes:\n\"Handelt es sich um den Bereich\
    \ der Vollzeitbetreuung,\nstellt sich eine grosse Zahl der Vernehmlassungsteil-\nnehmenden auf den\
    \ Standpunkt, dass eine Befreiung\nvon der Bewilligungspflicht selbst für Verwandte nicht\nangebracht\
    \ sei, und zwar auch dann nicht, wenn die\nBetreuung, auch im weiteren Sinn, nicht mit einer Kin-\n\
    des-schutzmassnahme in Zusammenhang steht. Denn\ndie Verwandtschaft garantiere mitnichten für eine\
    \ gute\nBetreuung von Kindern.\" \nWas könnte die Kritik der Minderheit an der vorgeschlagenen\nRegelung\
    \ gewesen sein, wonach unter anderem auch die Be-\ntreuung durch Grosseltern bewilligungs- bzw. meldepflichtig\n\
    erklärt werden sollte (nur Stichwort)?"
