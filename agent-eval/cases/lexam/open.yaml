  question: "Frau B. ist leidenschaftliche Tennisspielerin und trainiert ca. drei Mal pro Woche. Bei einem\n\
    Trainingsspiel verspürt sie unmittelbar nach einem sehr kraftvoll geschlagenen Aufschlag\neinen stechenden\
    \ Schmerz in der rechten Schulter. Ihr Hausarzt rät ihr am drauffolgenden Tag,\ndieses Ereignis bei\
    \ ihrer Unfallversicherung anzumelden. \nWelche Elemente dürften bei der Qualifikation des Ereignisses\
    \ problematisch sein?"
  reference: 'Unfallbegriff Problematisch sein dürften die Elemente des äusseren Faktors und der Ungewöhnlichkeit:
    Beim Aufschlag ist auf den ersten Blick kein äusseres (von ausserhalb des Körpers stattfin- dendes)
    Ereignis ersichtlich. Zudem ist der Aufschlag eine Bewegung, die nicht per se ungewöhnlich daherkommt.  Als
    äussere Faktoren gelten aber auch eigene Bewegungen, wenn diese ungewöhnlich im unfallversicherungsrechtlichen
    Sinn sind. (Siehe Skript, Rz. 499)  Bei eigenen Körperbewegungen liegt die Ungewöhnlichkeit nach den
    Aussagen der Praxis in der Programmwidrigkeit des Bewegungsablaufs.  Subsumtion: Die Aufschlagbewegung
    wird pro Spiel dutzende Male ausgeführt. Auch kräftige Aufschlä- ge sind nicht unüblich. Dem SV ist
    nicht zu entnehmen, dass Frau B. den Ball nicht oder unsauber getroffen oder eine komische, programmwidrige
    Bewegung ausgeführt hätte. Folglich ist keine Programmwidrigkeit ersichtlich, wodurch kein Unfall
    vorliegt.'
