  question: "Die Gesundheitsinstitutionen des Kantons X beklagen sich schon seit Jahren darüber, dass\
    \ immer mehr gesundheitliche Probleme auf den hohen Alkoholkonsum der Leute zurückzuführen seien.\
    \ Schliesslich ergreift der Kantonsrat die Initiative und verabschiedet eine neue Gesetzesnorm mit\
    \ folgendem Inhalt: Abs. 1 Wer im Rahmen eines Gastgewerbes Bier ausschenkt, entrichtet eine Abgabe\
    \ von 3% der dadurch erzielten Einnahmen. Die Abgabe ist zwingend auf die Konsumenten zu überwälzen.\
    \ Abs. 2 Die Abgabe wird zur Hälfte zur Bekämpfung übermässigen Alkoholkonsums verwendet. Der Kantonsrat\
    \ begründet die neue Norm damit, dass im Kanton X hauptsächlich in Kneipen Alkohol konsumiert werde,\
    \ wobei es sich bekanntlich um Leute handle, die dort ihr Feierabendbier genössen. Da die Einnahmen\
    \ des Kantons in den letzten Jahren ziemlich mager waren, erfreute sich die Abgabe durchgehend grosser\
    \ Beliebtheit. \nWie lässt sich die Abgabe qualifizieren?"
  reference: Öffentliche Abgaben sind geldwerte Leistungen, die vom Staat zum Zwecke der Einnahmebeschaffung
    oder der Verhaltenslenkung allen Personen auferlegt werden, die den Tatbestand erfüllen, an den das
    Gesetz die Leistungspflicht knüpft. Die vorliegende Abgabe fällt klar unter diese Definition. Sie
    wird vom Kanton X erhoben und einem vom Gesetz bestimmten Personenkreis auferlegt. Die Abgabe wird
    zudem zur Hälfte zur Bekämpfung übermässigen Alkoholkonsums verwendet; es kann davon ausgegangen werden,
    dass die andere Hälfte den allgemeinen Einnahmen zugerechnet wird. Insofern dient sie dem Zweck der
    Einnahmebeschaffung. Mit der Abgabe soll zudem der übermässige Alkoholkonsum eingeschränkt werden,
    womit sie in diesem Umfang der Verhaltenslenkung dient. Es handelt sich somit um eine öffentliche
    Abgabe. Weiter werden die Abgaben anhand des Fiskalzwecks und des Äquivalenzkriteriums unterschieden.
    Aufgrund des Lenkungszwecks der Abgabe - Bekämpfung übermässigen Alkoholkonsums, insbesondere Überwälzung
    auf die Konsumenten - ist anhand des Fiskalzwecks zwischen Lenkungsabgabe und Steuer mit Lenkungszweck
    zu unterscheiden. Sobald eine Abgabe im Haupt- oder Nebenzweck einen Fiskalzweck verfolgt, ist es
    eine Steuer; ein Fiskalzweck ist bei Lenkungsabgaben ausgeschlossen. Die vorliegende Abgabe verfolgt
    zumindest in einem gewissen Umfang einen Fiskalzweck, womit es sich nicht um eine Lenkungsabgabe handeln
    kann. Anhand des Äquivalenzkriteriums ist schliesslich abzugrenzen zwischen einer Steuer und einer
    Kausalabgabe. Steuern sind Geldleistungen, die dem Gemeinwesen von Gesetzes wegen voraussetzungslos
    geschuldet sind. Kausalabgaben sind demgegenüber Geldleistungen, welche als Entgelt für bestimmte
    staatliche Leistungen dienen. In der Praxis gibt es Abgaben, welche von einer Gruppe von Abgabepflichtigen
    erhoben werden, die von den staatlichen Leistungen, die mit der Abgabe finanziert werden, besonders
    profitieren oder als hauptsächliche Verursacher bestimmter Aufwendungen des Gemeinwesens angesehen
    werden können. In der schweizerischen Praxis wird dabei zwischen Kostenanlastungssteuer und Sonderabgabe
    mit besonderem Zurechnungszusammenhang (Kostenanlastungskausalabgabe) unterschieden. Die in Frage
    stehende Abgabe will den übermässigen Alkoholkonsum und die daraus entstehenden Probleme bekämpfen.
    Man kann sich daher fragen, ob Leute, die Bier trinken, als hauptsächliche Verursacher der Aufwendungen
    ausgemacht werden können. Bei den Aufwendungen würde es sich hier überwiegend um Gesundheitskosten
    handeln. Die Abgabe erfasst aber jeglichen Ausschank von Bier im Rahmen eines Gastgewerbes. Damit
    werden nicht nur jene erfasst, die regelmässig Alkohol konsumieren, sondern auch all diejenigen, die
    gelegentlich ein Bier geniessen. Letztere machen einen so grossen Teil der Konsumenten aus, dass ein
    so enger Zurechnungszusammenhang fehlt, dass man die Abgabe als eine Sonderabgabe mit besonderem Zurechnungszusammenhang
    qualifizieren könnte. Es bleibt zu prüfen, ob der Zurechnungszusammenhang ausreichend ist, um die
    Abgabe als Kostenanlastungssteuer zu qualifizieren. Hier kann man argumentieren, dass auch Personen,
    die gelegentlich Bier konsumieren, einen gewissen Teil zu den Gesundheitskosten beitragen und in gewisser
    Weise den Konsum von Bier in der Bevölkerung normalisieren und somit zur Gesamtproblematik beitragen.
    Schlussendlich werden doch gezielt nur Personen von der Abgabe erfasst, welche Bier konsumieren. Was
    jedoch gar nicht in Betracht gezogen wird, ist, dass es enorm viele andere alkoholische Getränke gibt,
    welche bezüglich gesundheitlicher Aspekte um einiges problematischer sein können als Bier. Es kann
    somit nicht gesagt werden, dass Leute, die Bier trinken, als hauptsächliche Verursacher der Probleme
    im Gesundheitswesen betrachtet werden können. Es liegt keine Gruppenäquivalenz vor und somit handelt
    es sich nicht um eine Kostenanlastungssteuer. Was bleibt, ist, dass die Steuer einen Lenkungszweck
    verfolgt. Es handelt sich somit um eine Lenkungssteuer ohne besonderen Zurechnungszusammenhang.
  rubric:
  - Öffentliche Abgaben sind geldwerte Leistungen, die vom Staat zum Zwecke der Einnahmebeschaffung oder
    der Verhaltenslenkung allen Personen auferlegt werden, die den Tatbestand erfüllen, an den das Gesetz
    die Leistungspflicht knüpft. Die vorliegende Abgabe fällt klar unter diese Definition. Sie wird vom
    Kanton X erhoben und einem vom Gesetz bestimmten Personenkreis auferlegt. Die Abgabe wird zudem zur
    Hälfte zur Bekämpfung übermässigen Alkoholkonsums verwendet; es kann davon ausgegangen werden, dass
    die andere Hälfte den allgemeinen Einnahmen zugerechnet wird. Insofern dient sie dem Zweck der Einnahmebeschaffung.
    Mit der Abgabe soll zudem der übermässige Alkoholkonsum eingeschränkt werden, womit sie in diesem
    Umfang der Verhaltenslenkung dient. Es handelt sich somit um eine öffentliche Abgabe. Weiter werden
    die Abgaben anhand des Fiskalzwecks und des Äquivalenzkriteriums unterschieden. Aufgrund des Lenkungszwecks
    der Abgabe
  - Bekämpfung übermässigen Alkoholkonsums, insbesondere Überwälzung auf die Konsumenten
  - ist anhand des Fiskalzwecks zwischen Lenkungsabgabe und Steuer mit Lenkungszweck zu unterscheiden.
    Sobald eine Abgabe im Haupt- oder Nebenzweck einen Fiskalzweck verfolgt, ist es eine Steuer; ein Fiskalzweck
    ist bei Lenkungsabgaben ausgeschlossen. Die vorliegende Abgabe verfolgt zumindest in einem gewissen
    Umfang einen Fiskalzweck, womit es sich nicht um eine Lenkungsabgabe handeln kann. Anhand des Äquivalenzkriteriums
    ist schliesslich abzugrenzen zwischen einer Steuer und einer Kausalabgabe. Steuern sind Geldleistungen,
