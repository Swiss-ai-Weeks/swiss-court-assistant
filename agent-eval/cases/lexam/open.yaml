  question: |-
    Gemäss FZA können auch Nichterwerbstätige einen Anspruch auf eine
    Aufenthaltsbewilligung haben. Nennen Sie mögliche Konstellationen und die
    Voraussetzungen.
  reference: ' mögliche Konstellationen: Familienangehörige von Erwerbstätigen in der Schweiz, Studierende
    oder Rentner  gemäss Art. 24 Anhang I FZA haben unter bestimmten Voraussetzungen auch Nichterwerbstätige
    einen Anspruch auf eine Aufenthaltsbewilligung, die für fünf Jahre gültig ist  konkret verlangt werden
    ausreichende finanzielle Mittel und umfassender Krankenversicherungsschutz  der Betreffende muss
    nach der EuGH-Rechtsprechung nicht selbst über die finanziellen Mittel verfügen (auch das BGer entschied
    in diesem Sinne: BGE 135 II 265)'
  rubric:
