  question: |-
    Wann ist eine Bank «too big to fail»? Wer nimmt diese Einstufung gestützt auf wel-
    che Bestimmung rechtlich verbindlich vor? In welchen vier Kernbereichen muss eine
    solche Bank besondere Anforderungen erfüllen?
  reference: Systemrelevante Banken, deren Ausfall die Schweizer Volkswirtschaft und das schweizeri- sche
    Finanzsystem erheblich schädigen würde, werden gemäss Art. 7 Abs. 1 BankG als «too big to fail» eingestuft.
    Gemäss Art. 8 Abs. 3 BankG bezeichnet die Schweizerische Nationalbank nach Anhörung der FINMA durch
    Verfügung die systemrelevanten Banken und deren systemrelevante Funk- tionen. Systemrelevante Banken
    müssen höhere Eigenmittelanforderungen und erhöhte Liquiditäts- anforderungen erfüllen. Durch Risikoverteilungvorschriften
    wird die Verflechtung innerhalb des Bankensektors ver- ringert. Systemrelevante Banken müssen zudem
    so organisiert sein, dass im Insolvenzfall die systemrelevanten Funktionen von anderen Bereichen abgesondert
    und weitergeführt werden können.
  rubric:
  - Systemrelevante Banken, deren Ausfall die Schweizer Volkswirtschaft und das schweizeri- sche Finanzsystem
    erheblich schädigen würde, werden gemäss Art. 7 Abs. 1 BankG als «too big to fail» eingestuft.
  - Gemäss Art. 8 Abs. 3 BankG bezeichnet die Schweizerische Nationalbank nach Anhörung der FINMA durch
    Verfügung die systemrelevanten Banken und deren systemrelevante Funk- tionen. Systemrelevante Banken
    müssen höhere Eigenmittelanforderungen und erhöhte Liquiditäts- anforderungen erfüllen.
  - Durch Risikoverteilungvorschriften wird die Verflechtung innerhalb des Bankensektors ver- ringert.
    Systemrelevante Banken müssen zudem so organisiert sein, dass im Insolvenzfall die systemrelevanten
    Funktionen von anderen Bereichen abgesondert und weitergeführt werden können.
