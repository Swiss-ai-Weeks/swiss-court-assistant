  question: "Thomas, 21-jährig und schon sein ganzes Leben lang wohnhaft in Zürich bei den Eltern, ist\
    \ Bachelorstudent an der Rechtswissenschaftlichen Fakultät der Universität Zürich. Neben dem Studium\
    \ geht er keiner Arbeit nach. Studium etc. wird vollständig durch die Eltern finanziert, die relativ\
    \ wohlhabend sind. Nennenswertes eigenes Vermögen besitzt er keines. Am 5. Januar 2022 hat er die\
    \ Wiederholungsprüfung im Strafrecht I abgelegt. Bei Nichtbestehen droht ihm der Ausschluss vom Studium.\
    \ Um auf Nummer sicher zu gehen, dass er dieses Mal besteht, beschliesst er, sein Prüfungsergebnis\
    \ selbst festzulegen. Hierzu kauft er sich im Darknet eine Software, die ihm Zugriff auf den (durch\
    \ Zwei-Faktor-Authentifizierung geschützten) Computer des Professors geben kann. Er verschickt die\
    \ Software in einem Word Dokument (“Disposition.docx”) versteckt per E-Mail an den Professor. Im E-Mail\
    \ bittet er den Professor um die Betreuung seiner Seminararbeit. Die Disposition befinde sich im Anhang.\
    \ Der Professor öffnet das Word-Dokument, welches auch tatsächlich eine rudimentäre Disposition zu\
    \ einem Seminarthema enthält, wodurch sein Computer mit der Software infiziert wird. In der darauffolgenden\
    \ Nacht am 8. Februar um 2:00 Uhr greift Thomas auf den Computer des Professors zu, sucht nach der\
    \ Datei mit den Noten (die bereits erfasst wurden) und ändert seine Note 3 in eine Note 5.5 um. Als\
    \ der Professor am nächsten Morgen in sein Büro kommt, sieht er, dass sein Computer läuft. \nThomas\
    \ hatte nämlich vergessen, diesen über seine Software wieder auszuschalten. Da ihm \ndas verdächtig\
    \ vorkommt, prüft er seine Dateien genau. Dabei sieht er, dass die Datei mit den \nNoten um 2:10 Uhr\
    \ morgens zuletzt gespeichert wurde. Nach einer Rücksprache mit seinem \nTeam beschliesst er, bei\
    \ der Polizei Anzeige zu erstatten. \nIm Einvernehmen mit dem Professor und der Universität untersucht\
    \ die IT-Forensik noch am \nselben Tag den Computer des Professors. Schnell wird klar, dass die Schadsoftware\
    \ im \nAnhang von Thomas E-Mail verborgen war. Die inzwischen eingeschaltete Staatsanwaltschaft \n\
    sieht im E-Mail einen wichtigen Beweis für Thomas Schuld. festzunehmen und seinen Computer sowie weitere\
    \ digitale Geräte im Haus zu \nbeschlagnahmen. Die nötigen schriftlichen Befehle liegen vor. Als Thomas\
    \ die Tür öffnet, ahnt \ner bereits, um was es geht. Er schlägt die Tür daher wieder zu und rennt\
    \ zu seinem Computer, \num immerhin noch die Software und die E-Mail an den Professor zu löschen.\
    \ Die Polizisten, \ndie die Türe problemlos selbst öffnen konnten, schaffen es aber, ihn nach einem\
    \ leichten Gerangel festzunehmen, kurz nachdem er seinen Computer entsperrt hat. Thomas wird \nfestgenommen\
    \ und sein Computer sowie sein Handy werden beschlagnahmt. Aufgrund des Vorfalls am Morgen beantragt\
    \ die Staatsanwaltschaft beim \nZwangsmassnahmengericht Untersuchungshaft für Thomas.  \nPrüfen Sie,\
    \ ob Haftgründe vorliegen. Wie wird das Zwangsmassnahmengericht entscheiden?"
  reference: 'Anm.: Gefragt ist nach dem Vorliegen von Haftgründen. Die weiteren Voraussetzungen der Untersuchungshaft
    sind daher nicht zu prüfen.  Die zulässigen Haftgründe sind in Art. 221 StPO aufgeführt.  Die Haftgründe
    der Wiederholungs- (Art. 221 Abs. 1 lit. c StPO) und Ausführungsgefahr (Art. 221 Abs. 2 StPO) sind
    nicht einschlägig.  Fraglich ist, ob bei Thomas Flucht- (Art. 221 Abs. 1 lit. a StPO) oder Kollusionsgefahr
    (Art. 221 Abs. 1 lit. b StPO) besteht.  Fluchtgefahr liegt vor, wenn ernsthaft zu befürchten ist,
    dass sich die eines Verbrechens oder Vergehens beschuldigte Person durch Flucht dem Strafverfahren
    oder der zu erwartenden Sanktion entzieht (Art. 221 Abs. 1 lit. a StPO). Thomas wehrt sich zwar gegen
    die Festnahme durch das Zuschlagen der Türe und liefert sich mit der Polizei ein leichtes Gerangel.
    Dies allein weist jedoch noch nicht auf ein Fluchtmotiv hin. Aufgrund seines Alters, der Abhängigkeit
    von seinen Eltern, dem fehlenden Vermögen und der Tatsache, dass Thomas schon sein ganzes Leben in
    Zürich (bei den Eltern) wohnt, erscheint die Möglichkeit einer Flucht als unrealistisch.  Kollusionsgefahr
    liegt vor, wenn ernsthaft zu befürchten ist, dass die eines Verbrechens oder Vergehens beschuldigte
    Person andere Personen beeinflusst oder auf Beweismittel einwirkt, um so die Wahrheitsfindung zu beeinträchtigen
    (Art. 221 Abs. 1 lit. b StPO). Thomas versucht, immerhin noch die Software und die E-Mail an den Professor
    zu löschen. Beide Daten stellen vorliegend Beweismittel dar, deren Verlust sich auf die Wahrheitsfindung
    auswirken könnte. Durch sein Handeln bringt Thomas seinen Willen zum Ausdruck, Beweismittel aktiv
    zu vernichten. Allerdings sind die relevanten Beweismittel (v.a. sein Computer) inzwischen bereits
    beschlagnahmt und damit gesichert. Weitere für den Fall ausschlaggebende Beweismittel fehlen nicht.
    Die Kollusionsgefahr ist daher bereits gebannt.  Entscheid des ZMG: Da es vorliegend an Haftgründen
    fehlt, hat das ZMG den Antrag auf Untersuchungshaft abzuweisen.'
