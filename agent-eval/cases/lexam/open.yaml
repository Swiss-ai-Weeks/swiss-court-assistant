    (+) Persönlicher Anwendungsbereich: Das UWG schützt den Wettbewerb «im Interesse aller Beteiligten»
    (Art. 1 UWG) und dient somit den Interessen von Wirtschaft, Konsument/innen und der Allgemeinheit.
    Der persönliche Geltungsbereich des UWG ist deshalb weit zu ziehen und ein Wettbewerbsverhältnis ist
    nicht erforderlich. Gegen das UWG kann jedermann verstossen, also nicht nur ein Unternehmen wie im
    Kartellrecht. Die Interessen der Kapiro GmbH (K) sind vorliegend durch das Handeln einer natürlichen
    Person verletzt worden. Der persönliche Anwendungsbereich ist somit eröffnet. (+) Geografischer Anwendungsbereich:
    Für die marktrelevanten Geschehnisse in der Schweiz jedenfalls eröffnet. (+) Der Anwendungsbereich
    des UWG ist eröffnet. Verhältnis von Spezialtatbeständen und Generalklausel Gemäss der Rechtsprechung
    sind die Spezialtatbestände vor der Generalklausel zu prüfen; gemäss Lehre ist die Generalklausel
    zuerst zu prüfen. Art. 5 UWG – Verwertung fremder Leistungen Voraussetzungen: Arbeitsergebnis'
  - 'Tathandlung: unbefugtes Verwerten (lit. a und b) oder Übernehmen (lit. c).'
  - 'Art. 5 lit. b UWG: Der Anwendungsbereich von lit. a wird auf Personen ausgedehnt (idR Konkurrenzunternehmen),
    denen das fremde Ergebnis nicht unmittelbar vom Erzeuger anvertraut wurde. Subjektiv muss der Zweiterwerber
    wissen, dass ihm das Erzeugnis unbefugterweise zukam -> nicht einschlägig. Prüfung Art. 5 lit. a UWG
    Arbeitsergebnis: Arbeitsergebnisse sind «Produkte geistiger Anstrengung und materieller Aufwendungen,
    die ausserhalb des Bereichs der Spezialgesetzgebung zum Schutz von Immaterialgütern nicht geschützt
    sind». Das Arbeitsergebnis muss nicht gleichzeitig als Fabrikations- oder als Geschäftsgeheimnis qualifiziert
    werden. Keine strafbare Verwertung einer fremden Leistung liegt vor, wenn ehemalige Arbeitnehmer das
    Erfahrungswissen, das sie während ihrer Tätigkeit erworben haben, weiterverwenden. Erst die Verwertung
    eines konkret ausgearbeiteten Produktes gilt als unlauter.3 I.c. ist die Software als computerimplementierte
    Erfindung zwar patentrechtlich geschützt, was für eine gewisse geistige Anstrengung und materielle
    Aufwendung spricht. Jedoch verwendet H nicht das Arbeitsergebnis OptimaX, sondern lediglich Wissen,
    welches er sich während seiner Anstellung als Softwareprogrammierer angeeignet hat und entwickelt
    sein eigenes Produkt RoboThink. Folglich handelt es sich nicht um ein Arbeitsergebnis i.S.v. Art.
    5 UWG. (-) Anvertrauen: Gemäss der Botschaft ist ein Arbeitsergebnis anvertraut, wenn «jemand in gegenseitiger
    Übereinstimmung mit dem Erzeuger» in Besitz des Arbeitsergebnisses gelangt ist (vertragliches, vorvertragliches
    oder vertragsähnliches Vertrauensverhältnis). I.c. wurden alle Informationen resp. das Know-how die
    Software OptimaX betreffend H während seines Arbeitsverhältnisses anvertraut. Anhaltspunkte zur Gegenteiligen
    Annahme gibt der Sachverhalt nicht her. (+) Unbefugt: Unbefugt ist jede Verwertung des anvertrauten
    Arbeitsergebnisses ohne Zustimmung des Berechtigten. Unbefugt impliziert i.a.R. auch, dass es sich
    beim verwerteten Arbeitsergebnis um ein fremdes Arbeitsergebnis handelt. I.c. ist im Sachverhalt keine
    Zustimmung der Kapiro GmbH (K) ersichtlich. (+) Verwerten: Verwerten ist jede wirtschaftliche Nutzung
    eines fremden Arbeitsergebnisses. Die Verwertungshandlung muss objektiv geeignet sein, den Wettbewerb
    zu beeinflussen. In Betracht kommen alle möglichen Formen der Verwertung wie der Verkauf, die Gebrauchsüberlassung
    oder der Gebrauch im eigenen Betrieb. I.c. verwendet H das Know-how, um für sein Einzelunternehmen
    einen Algorithmus (RoboThink) zu designen. (+) Zwischenfazit Art. 5 lit. a UWG Es liegt keine unbefugte
    Verwertung fremder Arbeitsergebnisse vor, wenn ehemalige Arbeitnehmer das Erfahrungswissen, das sie
    während ihrer Tätigkeit bei einem Unternehmen erworben haben, nach dem Ende des Arbeitsverhältnisses
    weiterverwenden, sofern es sich hierbei nicht um konkrete Arbeitsergebnisse i.S.v. Art. 5 lit. a UWG
    handelt. Es besteht zudem kein Konkurrenzverbot. Prüfung Art. 5 lit. c UWG – Übernahme Art. 5 lit.
    c UWG hat einen sehr engen Anwendungsbereich. Voraussetzungen: Marktreifes Arbeitsergebnis eines anderen:
    Ein Produkt, das ohne weiteres Zutun gewerblich verwendet werden kann. I.c. wurde durch H nicht ein
    marktreifes Arbeitsergebnis übernommen, er verwendet lediglich Wissen, welches er sich während seiner
    Anstellung als Softwareprogrammierer angeeignet hat. Übernahme oder Verwertung «als solches» und ohne
    eigenen angemessenen Aufwand: Wenn es sich um eine unmittelbare Übernahme und wirtschaftliche Nutzung
    des Originals handelt. I.c. nicht gegeben, da es von einer Software, welche den Zustand von Motoren
    und anderen Komponenten einer Maschine überwacht und mögliche Ausfallursachen 3 OGer AR, sic! 2007,
    458, E. 2.2 («Explosionsschutzventil»). identifiziert bis hin zu einer KI doch einigen eigenen Aufwand
    – gemäss Sachverhalt mehrere Monate – bedarf. Technisches Reproduktionsverfahren: Gemeint sind zum
    Beispiel scannen, fotokopieren oder digitalisieren. I.c. gibt der Sachverhalt nicht her, dass ein
    solches technisches Reproduktionsverfahren genutzt wurde. Zwischenfazit Art. 5 lit. c UWG Es liegt
    keine Verletzung von Art. 5 lit. c UWG vor, weil es von einer Software, welche den Zustand von Motoren
    und anderen Komponenten einer Maschine überwacht und mögliche Ausfallursachen identifiziert bis hin
    zu einer KI doch einigen eigenen Aufwand – gemäss Sachverhalt mehrere Monate – bedarf, es kann also
    nicht von der Übernahme eines marktreifen Arbeitsergebnisses gesprochen werden. Art. 2 UWG'
  - Generalklausel Unlauter und widerrechtlich ist jedes täuschende oder in anderer Weise gegen den Grundstz
    von Treu und Glauben verstossende Verhalten oder Geschäftsgebaren, welches das Verhältnis zwischen
    Mitbewerbern oder zwischen Anbietern und Abnehmern beeinflusst (Art. 2. UWG). Bei weiteren Ausführungen
    zu den Tatbestandsmerkmalen von Art. 2 UWG max. 1 Zusatzpunkt möglich. Kenntnisse, die im Rahmen einer
    vertraglichen Arbeitstätigkeit erworben werden, können grundsätzlich frei genutzt werden. Dies ist
    üblich und erwünscht, weil der Wettbewerb durch Verbesserungsdruck auf existierende Anbieter intensiviert
    wird. Zwischenfazit Art. 2 UWG Durch das Verhalten von H wurde Art. 2 UWG nicht verletzt. Fazit Es
    sind vorliegend durch H keine Tatbestände des UWGs verletzt worden.
