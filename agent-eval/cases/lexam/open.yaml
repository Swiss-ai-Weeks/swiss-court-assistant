  question: "Eine deutsche Freundin von Ihnen ist Künstlerin. Sie verkaufte Ihnen vor einigen Jahren ein\n\
    Gemälde, welches sie extra für Ihr Wohnzimmer angefertigt hat. Mittlerweile hat die\nKünstlerin internationale\
    \ Bekanntheit erlangt und ihre Werke erzielen auf dem Kunstmarkt\nhohe Preise. \nDa Ihnen das Bild\
    \ mittlerweile nicht mehr besonders gefällt, hängen Sie\nes statt im Wohnzimmer auf Ihrem Balkon auf.\
    \ Inwiefern ist dies urheberrechtlich\nrelevant?"
  reference: '- Für einen bestimmen Ort, nämlich Wohnzimmer geschaffen - Versetzung in wesensfremde Umgebung…
    - …kann Entstellung sein - Art. 11 URG - Werkintegrität - Witterung - Künstlerin musste bei der Schaffung
    des Werkes nicht damit rechnen - Urheberpersönlichkeitsrecht - Ev. sogar Zerstörung des Werks - Art.
    15 URG - Angebot zur Rücknahme zum Materialwert'
