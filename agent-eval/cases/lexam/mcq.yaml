  question: |-
    X. hat sich im Restaurant Alpha einen Rausch angetrunken. Trotzdem fährt er mit dem Auto heimwärts, bleibt aber auf halbem Weg im Strassengraben stecken, ohne dass Drittschaden entstanden ist. Er montiert die Kontrollschilder ab geht zu Fuss zu dem nahegelegenen Haus eines Freundes, der ihn den Rausch ausschlafen lässt. Nach der Ausnüchterung geht X. zurück zum Fahrzeug, wo ihn die Polizei verhaftet. Die Blutprobe ergibt 0.0 Gewichtspromille Alkohol im Blut. Mehrere Zeugen sagen aus, X. habe im Restaurant Alpha exzessiv Alkohol konsumiert. Als ihm die Wirtin den Autoschlüssel habe abnehmen wollen, sei er sehr wütend geworden und habe das Lokal schwankend und lallend verlassen. Jemand sah, wie er einstieg, Mühe mit Anfahren hatte und schliesslich mit lautem Motorenheulen losfuhr. Welche der folgenden Aussagen sind richtig?
    i. X. hat sich der Vereitelung von Massnahmen zur Feststellung der Fahrunfähigkeit gemäss Art. 91a Abs. 1 SVG schuldig gemacht, da er aufgrund des Unfallgeschehens mit der Anordnung einer Blutprobe rechnen musste und durch das Abmontieren der Kontrollschilder Machenschaften zur Verhinderungen seiner rechtzeitigen Ermittlung vornahm.
    ii. X. hat sich der Vereitelung von Massnahmen zur Feststellung der Fahrunfähigkeit gemäss Art. 91a Abs. 1 SVG nicht schuldig gemacht, da der von ihm verursachte Unfall mangels eines Drittschadens nicht zur Polizeibeizugspflicht führte.
    iii. X. ist wegen Fahrens in fahrunfähigem Zustand gemäss SVG 91 Abs. 1 Bst. a SVG zu bestrafen, da die Zeugenaussagen die genaue Blutalkoholkonzentration nicht mit hinreichender Sicherheit beweisen und die Regel "im Zweifelsfalle für den Angeklagten" Anwendung findet.
    iv. X. kann nicht wegen Fahrens in nicht fahrfähigem Zustand gemäss Art. 91 Abs. 2 bestraft werden, da dafür der Nachweis durch eine Blutprobe oder ein Atemalkohol-Messgerät erforderlich ist.

