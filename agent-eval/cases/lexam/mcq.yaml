  question: |-
    Wählen Sie eine der Optionen A–D. Schliessen Sie Ihre Antwort mit der Zeile «Antwort: X» ab, wobei X der Buchstabe der gewählten Option ist.

    Bob fährt mit seinem Oldtimer "Citroën 2 CV" auf der Autobahn bei Tempo 120 km/h mit 109 km/h auf der Überholspur, um den mit 90 km/h fahrenden, von Salvatore gelenkten Sattelschlepper zu überholen. Don will mit seinem Sportwagen "Ferrari" auf der Autobahn mindestens 130 km/h fahren und ärgert sich über den "2 CV". Er fährt deshalb bis auf 5 Meter an den "2 CV" heran und fordert ihn durch Licht- und später auch durch Hupzeichen auf, unverzüglich die Spur zu wechseln. Unter diesem Druck schwenkt Bob nach dem Überholmanöver vorzeitig wieder nach rechts ein, so dass er zunächst nur einen Abstand von 15 Meter zum Sattelschlepper hat, welcher Abstand sich in der Folge vergrössert. Welche der folgenden Aussagen sind richtig?
    i. Don erfüllt den Tatbestand der Nötigung, da er Bob erheblich gefährdete und ihn dadurch veranlasste, die Überholspur unter Verletzung der Verkehrsregeln vorzeitig zu verlassen.
    ii. Bob erfüllt den Tatbestand der einfachen Verkehrsregelverletzung, da er zu früh vor dem Sattelschlepper eingeschwenkt ist, doch wird Bob dadurch zumindest entschuldigt, dass er dadurch die von Don verursachte Gefahr abwendete und dass die von ihm dabei verursachte andere Gefahr für ihn und für dritte bedeutend kleiner war.
    iii. Salvatore erfüllt den Tatbestand der einfachen Verkehrsregelverletzung, da er einen zu kleinen Abstand zu dem vor ihm fahrenden "2 CV" hatte, doch wird Salvatore dadurch gerechtfertigt, dass er keine Möglichkeit hatte, diese Situation zu verhindern.
    iv. Don erfüllt den Tatbestand der groben Verkehrsregelverletzung, da er bei diesen Geschwindigkeit durch den sehr kleinen Abstand Bob ernsthaft und konkret gefährdete.

    A) ii und iv
    B) i, ii, iii, und iv
    C) iv
    D) i, ii, und iv

