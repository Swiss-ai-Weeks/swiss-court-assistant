- id: lexam-mcq-b0372639
  suite: lexam_mcq
  area: Public
  language: de
  level: exam
  question: |-
    Wählen Sie eine der Optionen A–D. Schliessen Sie Ihre Antwort mit der Zeile «Antwort: X» ab, wobei X der Buchstabe der gewählten Option ist.

    Welche der folgenden Aussagen ist/sind falsch?
    i. Um vom Tourismus in der Gemeinde X (Kanton Y) zu profitieren, will Fritz Innovativ (F) auf seinem kleinen Grundstück in den Bergen vier mobile Schlafzimmer in Form eines Würfels aufstellen lassen. Dabei sollen alle Wände aus Glas sein, damit man nachts die ungestörte Alpenlandschaft und die Steinböcke in ihrem natürlichen Lebensraum bestaunen kann. Das Projekt soll in der unberührten Natur erstellt werden, fernab von Bauzonen, welche die Aussicht trüben könnten. Es soll auf einer flachen Erhöhung realisiert werden und auch aus der Ferne sichtbar sein, da das Glas das einfallende Sonnenlicht reflektiert und so für eine anmutige Stimmung sorgt. Die Glaszimmer sollen die Grösse eines Schlafzimmers haben (ca. 15 m2) und Platz für ein Doppelbett, einen kleineren Schrank, einen Tisch und zwei Stühle bieten. Dabei beabsichtigt F, dass die Besucher maximal eine Nacht dort verbringen sollen, sodass er auf weitere Annehmlichkeiten verzichten kann. Auch können die Zimmer als Ganzes jederzeit wieder abgebaut werden, da es im Winter zu gefährlich wäre, diese dort stehen zu lassen. So sollen sie denn auch nur in den Sommermonaten über einen Lufttransport aufgestellt werden. Dabei werden sie mit entfernbaren Stahlkabeln verankert, um das Ganze zu sichern. Weil die Glaszimmer jederzeit entfernt werden können, ist F der Meinung, dass er für das Projekt keiner Baubewilligung bedarf. Da er sich der Sache jedoch nicht ganz sicher ist, wendet er sich an seinen Anwalt. Die Auffassung von F, dass er für das Projekt keiner Baubewilligung bedarf, ist zutreffend.
    ii. Die Privatschule P betreibt in der Gemeinde G (Kanton Zürich) eine Primarschule. Sie möchte ihren Schulbetrieb erweitern und nebst der Primarstufe neu auch eine Oberstufe führen. Zu diesem Zweck benötigt sie weitere Räumlichkeiten. Daher will sie neben ihrem bestehenden Gebäude ein zweites Schulhaus für die Oberstufenschüler bauen. Am 1. Februar 2018 reichte sie ein entsprechendes Baugesuch ein. Das Grundstück, auf welchem der Neubau zu stehen kommen soll, liegt in einer Wohnzone und ist mit einem Wohnanteil von 90% belegt. Der Gemeindevorstand hat dem Gemeindeparlament deshalb beantragt, den Wohnanteil auf diesem Grundstück auf 0% herabzusetzen. Das Gemeindeparlament beschloss am 15. Mai 2018 eine entsprechende Teilrevision der Bau- und Zonenordnung (BZO). Am 23. Mai 2018 erteilte der Gemeindevorstand der Privatschule P die Baubewilligung für den Neubau und begründete dies in den Erwägungen mit der inzwischen beschlossenen Herabsetzung des Wohnanteils auf 0%. Die erteilte Baubewilligung ist rechtens.
    iii. Die Gemeinde Y im Kanton Zürich möchte das "Sägereiareal" (Parzellen-Nrn. 3000–3005), welches in der Gewerbezone liegt, umnutzen. Weil das Areal schon länger nicht mehr ge nutzt wird, soll es in eine Wohnzone, in welcher nur nichtstörende Betriebe gestattet sind, umgezont werden. Die entsprechende Nutzungsplanänderung wird vom Gemeindevorstand zurzeit ausgearbeitet. Um die Planung zu sichern, soll nun für die Parzellen des "Sägerei areals" eine auf zwei Jahre befristete Planungszone erlassen werden. Die Planungszone ist zulässig.

    A) i und ii
    B) i und iii
    C) ii und iii
    D) keine der Aussagen

    Wählen Sie eine der Optionen A–D. Schliessen Sie Ihre Antwort mit der Zeile «Antwort: X» ab, wobei X der Buchstabe der gewählten Option ist.
  choices:
