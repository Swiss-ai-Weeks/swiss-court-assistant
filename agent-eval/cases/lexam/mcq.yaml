  question: |-
    Wählen Sie eine der Optionen A–D. Schliessen Sie Ihre Antwort mit der Zeile «Antwort: X» ab, wobei X der Buchstabe der gewählten Option ist.

    Welche der folgenden Aussagen ist/sind falsch?
    i. Die Y AG ist an der Schweizer Börse kotiert und hat CHF 300'000 Kapitalreserven und CHF 300'000 Gewinnreserven. Sie beabsichtigt am 31. Dezember 2020 CHF 200'000 Dividenden auszuschütten. Sie entnimmt diese den Kapitalreserven, da dies keine Steuerfolgen nach sich zieht. Sie entnimmt diese den Kapitalreserven, da dies keine Steuerfolgen nach sich zieht.
    ii. A ist Alleinaktionär der E AG mit Sitz in Zürich. Sein Vater C war Inhaber von 100% der Aktien der F AG, ebenfalls mit Sitz in Zürich, deren Aktienkapital aus 5'000 voll liberierten Aktien à CHF 500 besteht. Am 1. Januar 2018 verkaufte C 2'500 Aktien (50% des Aktienkapitals) der F AG zum Preis von CHF 3 Mio. an die E AG. Dieser Preis entspricht dem Verkehrswert der Beteiligung. Der Kaufpreis wurde als unverzinsliches Darlehen von C gegenüber der E AG stehengelassen. Mit Schenkungsvertrag vom 20. Dezember 2018 trat C von seinem Darlehensguthaben gegenüber der E AG per 31. Dezember 2018 den Teilbetrag von CHF 1.5 Mio. an seinen Sohn A ab. Der Tatbestand der Transponierung ist vorliegend erfüllt.
    iii. Herr A ist Verwaltungsrat und Mitglied der Geschäftsleitung der Bank X AG. Er ist Hauptver antwortlicher des Bereichs «Anlagen und Investitionen». Er erleidet im Jahr 2019 einen Un fall, der einen Spitalaufenthalt und einen Erwerbsausfall zur Folge hat. Herr A ist durch sei nen Arbeitgeber gegen Berufs- und Nichtberufsunfälle versichert. Die Versicherung über nimmt die Spitalkosten, ein Taggeld für den Lohnausfall und bezahlt noch eine Genugtu ungssumme von CHF 5'000. Im Rahmen seiner Genesung hat er einige Zeit für sich und fängt an nebenbei CHF 250'000 in Anlagen der Y AG zu investieren. Diese schrieb ihm dafür monatsweise Erträge gut, welche er im System beliess und sogleich reinvestierte. Es hätte auch die Möglichkeit bestanden, sich die Erträge auszahlen zu lassen. Gegen Ende Jahr 2019 stellt sich heraus, dass dieses Anlagesystem betrügerisch ist (sog. Schneeballsystem), und der Konkurs über diese Gesellschaft wird eröffnet. Herr A ist der Meinung, dass er die im Jahr 2019 insgesamt gutgeschriebenen Erträge von CHF 80’000 nicht in seiner Steuererklä rung 2019 deklarieren muss. Vielmehr möchte er einen Verlust von CHF 250'000 geltend machen. Die Gutschriften aus den Anlagen der Y AG stellen Einkommen dar.
    iv. Die X AG wird mit einem Aktienkapitel von CHF 2 Mio. gegründet, dabei unterliegt der volle Betrag der Emissionsabgabe. Der volle Betrag der Emissionsabgabe unterliegt der Emissionsabgabe.

