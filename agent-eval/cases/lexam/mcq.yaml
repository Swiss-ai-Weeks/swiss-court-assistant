  question: |-
    Wählen Sie eine der Optionen A–D. Schliessen Sie Ihre Antwort mit der Zeile «Antwort: X» ab, wobei X der Buchstabe der gewählten Option ist.

    Welche der folgenden Aussagen ist/sind richtig?
    i. Bei kollektiven Kapitalanlagen kann das Teilbesteuerungsverfahren nicht angewendet werden, wenn sie steuerlich transparent behandelt werden.
    ii. Jedem Inhaber von Beteiligungsrechten können die von ihm bezahlten Einlagen, Aufgelder und Zuschüsse wieder einkommenssteuerfrei zurückgezahlt werden.
