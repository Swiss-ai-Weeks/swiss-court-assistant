  question: |-
    Wählen Sie eine der Optionen A–D. Schliessen Sie Ihre Antwort mit der Zeile «Antwort: X» ab, wobei X der Buchstabe der gewählten Option ist.

    Der Bundesrat erlässt gestützt auf Art. 106 Abs. 1 SVG die "Verordnung über die Ausstattung sämtlicher Motorfahrzeuge mit einem Restwegschreiber" und droht für die Manipulation oder Entfernung dieses Geräts Freiheitsstrafe bis zu einem Jahr an. Welche der folgenden Aussagen ist richtig?
    i. Die Verordnung ist unter der Bedingung zulässig, dass der Restwegschreiber nur bei Unfällen mit Körperverletzung oder Sachschaden über CHF 100'000 ausgewertet werden darf, denn in solchen Fällen tritt das Datenschutz-Interesse des Einzelnen hinter dem öffentlichen Interesse an der Ermittlung des Sachverhalts zurück.
    ii. Die Verordnung wurde nicht kompetenzgemäss erlassen, da die Einführung des Restwegschreiber-Obligatoriums keine Ausführungsbestimmung, sondern eine primäre Vorschrift ist, für die eine besondere Delegation in einem formellen Gesetz erforderlich ist.
    iii. Die Verordnung wurde kompetenzgemäss und damit gültig erlassen, da die Vorschrift eines Restwegschreibers eine effiziente und verhältnismässige Massnahme zum Vollzug des Strassenverkehrsgesetzes ist.
    iv. Die Strafnorm verletzt den Grundsatz "nulla poena sine lege", da eine Freiheitsstrafe nur in einem Gesetz im formellen Sinne angedroht werden darf.
    v. Die Strafnorm verletzt den Grundsatz "nulla poena sine lege", da sie zu wenig bestimmt ist.

