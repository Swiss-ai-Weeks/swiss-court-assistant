    Wählen Sie eine der Optionen A–D. Schliessen Sie Ihre Antwort mit der Zeile «Antwort: X» ab, wobei X der Buchstabe der gewählten Option ist.

    A wird verdächtigt, am 1. Mai in der Zürcher Bahnhofstrasse randaliert zu haben, und wird diesbezüglich von der Polizei befragt. Nach zehn Minuten gibt er an, seinen Anwalt B hinzuziehen zu wollen. Der einvernehmende Polizist versucht B zu erreichen, als dies ohne Erfolg bleibt setzt er die Befragung fort. A beantwortet weitere Fragen und gibt schliesslich ein Geständnis ab. Nach der Einvernahme bespricht er sich mit B und beschliesst, das Geständnis zu widerrufen. Ausserdem verfasst er eine Schrift mit überwiegend politischem Inhalt und fordert B auf, diese in der Hauptverhandlung zu verlesen. Welche Aussagen treffen zu?
    i. Eine Verurteilung des A darf sich nicht auf sein Geständnis während der polizeilichen Befragung stützen.
    ii. B ist nicht verpflichtet, As Schrift in der Hauptverhandlung zu verlesen.
    iii. Die Fortsetzung der polizeilichen Befragung war rechtmässig, da As Anwalt nicht erreicht werden konnte.
    iv. Mit der weiteren Beantwortung der Fragen während der polizeilichen Einvernahme hat A auf sein Recht auf Verteidigung verzichtet.

