  question: |-
    Wählen Sie eine der Optionen A–D. Schliessen Sie Ihre Antwort mit der Zeile «Antwort: X» ab, wobei X der Buchstabe der gewählten Option ist.

    Der Schweizer Pharmakonzern P verwaltet bzw. verwertet sein ganzes Produkte-Portfolio in den USA über die Lizenznehmerin L. Das heisst, L kümmert sich um Herstellung, Vertrieb und Marketing der (patentrechtlich geschützten) Produkte. Zu diesem Zweck hat P der L an allen relevanten Patenten eine ausschliessliche Lizenz für das Gebiet der USA erteilt (zum pauschalen Preis von 1 Mrd. CHF pro Jahr). Das eigene Portfolio von L ist in letzter Zeit stark angewachsen und L überlegt sich daher, ob sie die Herstellung und Verwertung der Produkte von P an das Unternehmen D auslagern könnte, um sich mehr auf die Vermarktung der hauseigenen Produkte konzentrieren zu können. Dies soll mittels ausschliesslicher Unterlizenzierung der Patente von P durch L an D bewerkstelligt werden (mit Ausschluss der eigenen Nutzung durch L). Der Lizenzvertrag enthält keine Bestimmungen dazu. Welche Indizien sind bei der rechtlichen Beurteilung der Zulässigkeit der Unterlizenzierung durch L zu berücksichtigen?
    i. Keine – die Unterlizenzierung ist nur mit Zustimmung des Hauptlizenzgebers erlaubt
    ii. Die Tatsache, dass es sich bei den lizenzierten Rechten um Patente handelt.
    iii. Die Tatsache, dass die (Haupt-)Lizenzgebühr pauschal geschuldet ist.
    iv. Die Tatsache, dass L im Unterlizenzverhältnis die eigene Nutzung verboten ist.

