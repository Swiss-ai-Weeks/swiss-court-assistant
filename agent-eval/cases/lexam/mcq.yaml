  question: |-
    Welche der folgenden Aussagen ist/sind richtig?
    i. Das dem Kapitalanteilsberechtigten zufliessende Liquidationsbetreffnis ist für die Berechnung des steuerbaren Ertrags um die Abschreibung der Kapitalanteilsrechte zu kürzen.
    ii. Die Gewinnberechnung durch Vermögensstandesvergleich berücksichtigt offene und verdeckte Kapitalentnahmen im betrachtenden Geschäftsjahr. Der durch den Vermögensstandesvergleich errechnete Gewinn ist um die Kapitaleinlagen zu erhöhen und um die Kapitalentnahmen zu vermindern.
    iii. Eine verdeckte Gewinnausschüttung stellt stets auch einen Steuerbetrug dar.
    iv. Natürliche Personen, die einer selbständigen Erwerbstätigkeit nachgehen, können wählen, ob sie AHV-Beiträge einzahlen wollen oder nicht.

