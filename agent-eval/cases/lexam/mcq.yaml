    Wählen Sie basierend auf dem folgenden Kontext alle Aussagen aus, die nicht zutreffen.
    Kontext: Peter ist Geschäftsführer der X. AG, die u.a. bewilligten Handel mit Morphin für den medizinischen Gebrauch betreibt. Er betraut seinen neuen Mitarbeiter Hermann mit der Aufgabe, die Gesuche um Einfuhrbewilligungen zu stellen und die Einfuhr zu organisieren. Peter hat bei der Anstellung nur die Ausbildung von Hermann überprüft, hat aber keine Referenzen und Auskünfte eingeholt und weiss deshalb nicht, dass gegen Hermann mehrere Betreibungen laufen. Auch kontrolliert Peter die Arbeit von Hermann nicht. Hermann gibt im Gesuch, das ihn als Vertretung des Gesuchstellers nennt, zu hohe Bestellmengen der legalen Abnehmer an, um die Überschüsse auf dem Schwarzmarkt zu verkaufen und mit dem Erlös seine Schulden zu bezahlen. Bei der Prüfung des Gesuchs stellt das Schweizerische Heilmittelinstitut (Institut) fest, dass die Angaben nicht stimmen. Es erteilt keine Bewillligung und es kommt nicht zur Einfuhr.
    i. Peter ist nicht strafbar gemäss Art. 20 Abs. 1 Bst. a BetmG, da er keine Absicht hatte, dass sein Betrieb falsche Angaben macht.
    ii. Hermann ist nicht strafbar gemäss Art. 20 Abs. 1 Bst. a BetmG, da er bei der X. AG keine Kaderposition bekleidet und die Sonderpflicht zu richtigen Angaben nur der X. AG obliegt.
    iii. Peter ist strafbar gemäss Art. 20 Abs. 1 Bst. a BetmG, da er als Arbeitgeber seine Sorgfaltspflichten bei der Auswahl und Überwachung von Hermann nicht erfüllt und es damit in Verletzung einer Rechtspflicht unterlassen hat, die Widerhandlung von Hermann abzuwenden.
    iv. Hermann ist strafbar gemäss Art. 20 Abs. 1 Bst. a BetmG, da er vorsätzlich und in Ausübung geschäftlicher Verrichtung für die X. AG falsche Angaben gemacht hat.

