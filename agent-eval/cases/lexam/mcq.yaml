    Welche der folgenden Aussagen ist/sind falsch?
    i. Verona arbeitet als Angestellte bei der "Sophara AG". Im Rahmen ihrer Forschungstätigkeit gelingt ihr die erstmalige Isolierung eines neuen Enzyms. Für die Sophara AG ist das neue Enzym "Rasonix" ein grosser wirtschaftlicher Erfolg. Verona erhält deshalb für ihre bahnbrechende Erfindung den mit CHF 25'000.- dotierten "Sophara 2023 Award», den (alljährlich vergebenen) firmeneigenen Preis für die Entwicklung des erfolgreichsten Produkts. Zugleich erhält sie von der ETH Zürich für ihre herausragende Entdeckung den "Alumni-Jahrespreis" im Umfang von CHF 5'000.-. Die Zahlungen des Sophara Awards und des Alumni-Jahrespreises stellen für Verona steuerbares Einkommen dar.
    ii. Herr A ist Verwaltungsrat und Mitglied der Geschäftsleitung der Bank X AG. Er ist Hauptver antwortlicher des Bereichs «Anlagen und Investitionen». Er erleidet im Jahr 2019 einen Un fall, der einen Spitalaufenthalt und einen Erwerbsausfall zur Folge hat. Herr A ist durch sei nen Arbeitgeber gegen Berufs- und Nichtberufsunfälle versichert. Die Versicherung über nimmt die Spitalkosten, ein Taggeld für den Lohnausfall und bezahlt noch eine Genugtu ungssumme von CHF 5'000. Im Rahmen seiner Genesung hat er einige Zeit für sich und fängt an nebenbei CHF 250'000 in Anlagen der Y AG zu investieren. Diese schrieb ihm dafür monatsweise Erträge gut, welche er im System beliess und sogleich reinvestierte. Es hätte auch die Möglichkeit bestanden, sich die Erträge auszahlen zu lassen. Gegen Ende Jahr 2019 stellt sich heraus, dass dieses Anlagesystem betrügerisch ist (sog. Schneeballsystem), und der Konkurs über diese Gesellschaft wird eröffnet. Herr A ist der Meinung, dass er die im Jahr 2019 insgesamt gutgeschriebenen Erträge von CHF 80’000 nicht in seiner Steuererklä rung 2019 deklarieren muss. Vielmehr möchte er einen Verlust von CHF 250'000 geltend machen. Die Gutschriften aus den Anlagen der Y AG stellen Einkommen dar.

