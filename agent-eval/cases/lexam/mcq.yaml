  question: |-
    Wählen Sie eine der Optionen A–D. Schliessen Sie Ihre Antwort mit der Zeile «Antwort: X» ab, wobei X der Buchstabe der gewählten Option ist.

    Welche der folgenden Aussagen ist/sind richtig?
    i. Nico ist 17 Jahre alt. Er ist in Bazenheid in problematischen familiären Verhältnissen aufgewaschen. Sein Vater war Alkoholiker und liess bei der Erziehung oft seine Faust sprechen. Als Nico in der dritten Klasse war, ging sein Vater eines samstagmorgens «Zigaretten kaufen», wovon er nie mehr zurückkehrte. Daraufhin begann seine Mutter ihre Schmerzen in Alkohol zu ertränken. Heute sieht Nico seine Mutter nur noch ab und an. Zwar ist er offiziell noch bei seiner Mutter angemeldet, doch wohnt er praktisch vollständig bei seinen Grosseltern in Winterthur. Nico wurde schon früh strafrechtlich auffällig, verübte mehrere Diebstähle und prügelte sich oft mit seinen Klassenkameraden. Er ist der Anführer seiner Gang «WW» (Westside Winterthur). Seinen Rang in der Gang hat er auf sicher. Niemand würde es wagen, die Stellung von Nico anzuzweifeln, hat er doch diejenigen, die es versuchten, spitalreif geprügelt. Es ist auch schon vorgekommen, dass Nico jemanden verprügelte, der ihn «schief» angeschaut hat. Nico weiss zwar, dass seine Taten nicht in Ordnung sind, doch dies ist ihm egal. Allgemein scheint Nico eine tiefe Wut auf seine Mitmenschen und die Welt zu haben. Nur mit seinen Pflanzen geht er stets sehr liebevoll um. Für das Züchten seiner seltenen Exemplare gibt er viel Geld aus. Er beschliesst, dass er dieses am einfachsten durch bewaffnete Raubüberfälle auf Tankstellen einnehmen könnte. Schon beim ersten Raubzug wird er jedoch erwischt. Der zuständige Untersuchungsbeamte lässt ein Gutachten erstellen. Dieses ergibt, dass bei Nico eine erhebliche Persönlichkeitsentwicklungsstörung vorliegt, die mit einer grossen Rückfallgefahr verbunden ist. Der zuständige Beamte will eine Unterbringung anordnen. Der geschlossene Vollzug kann angeordnet werden.
    ii. Nico ist 17 Jahre alt. Er ist in Bazenheid in problematischen familiären Verhältnissen aufge wachsen. Sein Vater war Alkoholiker und liess bei der Erziehung oft seine Faust sprechen. Als Nico in der dritten Klasse war, ging sein Vater eines samstagmorgens «Zigaretten kaufen», wovon er nie mehr zurückkehrte. Daraufhin begann seine Mutter ihre Schmerzen in Alkohol zu ertränken. Heute sieht Nico seine Mutter nur noch ab und an. Zwar ist er offiziell noch bei seiner Mutter angemeldet, doch wohnt er praktisch vollständig bei seinen Grosseltern in Winterthur. Nico wurde schon früh strafrechtlich auffällig, verübte mehrere Diebstähle und prügelte sich oft mit seinen Klassenkameraden. Er ist der Anführer seiner Gang «WW» (Westside Winterthur). Seinen Rang in der Gang hat er auf sicher. Niemand würde es wagen, die Stellung von Nico anzuzweifeln, hat er doch diejenigen, die es versuchten, spitalreif geprügelt. Es ist auch schon vorgekommen, dass Nico jemanden verprügelte, der ihn «schief» angeschaut hat. Nico weiss zwar, dass seine Taten nicht in Ordnung sind, doch dies ist ihm egal. Allgemein scheint Nico eine tiefe Wut auf seine Mitmenschen und die Welt zu haben. Nur mit seinen Pflanzen geht er stets sehr liebevoll um. Für das Züchten seiner seltenen Exemplare gibt er viel Geld aus. Er beschliesst, dass er dieses am einfachsten durch bewaffnete Raubüberfälle auf Tankstellen einnehmen könnte. Schon beim ersten Raubzug wird er jedoch erwischt. Der zuständige Untersuchungsbeamte lässt ein Gutachten erstellen. Dieses ergibt, dass bei Nico eine erhebliche Persönlichkeitsentwicklungsstörung vorliegt, die mit einer grossen Rück fallgefahr verbunden ist. Der zuständige Beamte will eine Unterbringung anordnen. Mittlerweile befindet sich Nico im Vollzug der Unterbringung im Massnahmenzentrum Uitikon (MZU). Beim Eintritt war die Leitung des MZU der Meinung, dass Nico länger im geschlossenen Vollzug verweilen muss. Da er einen grünen Daumen hat, wollte Nico schon immer eine Lehre als Gärtner machen. Ferner hat er schon früh bemerkt, dass er sich besonders gut mit seiner Vergangenheit auseinandersetzen kann, wenn er Sport macht. Diese Wünsche platziert er bei der Zentrumsleitung. Es sind ein paar Jahre vergangen. Nico ist nun 21 Jahre alt, befindet sich weiterhin im MZU und absolviert eine Berufslehre. Der 19-jährige Boris ist neu ins MZU eingetreten. Bei ihm wurde eine stationäre therapeutische Massnahme gemäss Art. 61 StGB angeordnet. Er soll in dieselbe Gruppe wie Nico eingeteilt werden. Mittlerweile ist Nico fast 24-jährig und immer noch im MZU. Er steht kurz vor dem Abschluss seiner Lehre. Mit seinen Leistungen sollte er die Abschlussprüfung knapp bestehen. Auch in der Therapie hat er Fortschritte erzielt. Er ist zwar kein Musterfall, doch gehen die zuständigen Therapeuten davon aus, dass er sich ausserhalb des MZU wahrscheinlich bewähren wird. Nico kann entlassen werden.
    iii. Timo (T) und sein älterer Bruder Simon (S), beide mit Wohnsitz in Winterthur, sind Mitglieder einer Bande, die regelmässig in den Warenhäusern der Stadt Zürich ihr Unwesen treibt und immer wieder Ladendiebstähle begeht. S und die anderen Bandenmitglieder sind alle zwischen 18 und 22 Jahre alt, während T erst 13-jährig ist. S und die anderen Bandenmitglieder nutzen das Alter des T aus, indem sie stets T die Diebstähle ausführen lassen. Wurde T erwischt, haben die Warenhäuser den «kleinen Jungen» bisher immer mit einer Verwarnung davonkommen lassen. Am 15. Januar 2022 möchte T mal wieder einen sehr teuren Pullover im Wert von CHF 850.- in seiner Tasche verschwinden lassen, als er von einem Ladendetektiv angehalten wird, der daraufhin sofort die Polizei alarmiert. Die Polizei nimmt T vorläufig fest und übergibt die Sache an die zuständige Untersuchungsbehörde. Während des Untersuchungsverfahrens stellt sich heraus, dass T aus schwierigen familiären Verhältnissen kommt. Beide Eltern sind aus beruflichen Gründen kaum zuhause und überlassen die Brüder S und T praktisch ihrem Schicksal. Weitere enge Bezugspersonen gibt es keine. Die Untersuchungsbeamtin möchte den Fall mit den Eltern besprechen. Die Eltern sind zur Teilnahme verpflichtet.

    A) ii
    B) i, ii, und iii
    C) i und iii
    D) ii und iii

    Wählen Sie eine der Optionen A–D. Schliessen Sie Ihre Antwort mit der Zeile «Antwort: X» ab, wobei X der Buchstabe der gewählten Option ist.
  choices:
