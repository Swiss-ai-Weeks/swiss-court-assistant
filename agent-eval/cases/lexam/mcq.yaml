  question: "Wählen Sie eine der Optionen A–D. Schliessen Sie Ihre Antwort mit der Zeile «Antwort: X»\
    \ ab, wobei X der Buchstabe der gewählten Option ist.\n\nWelche der folgenden Aussagen ist/sind richtig?\n\
    i. Kuno fährt in einer eisig-kalten Januarnacht um 3 Uhr alkohol- und drogenfrei nach 7 Stunden \n\
    Schlaf mit seinem Personenwagen von zu Hause über Land in Richtung seines Schichtbetriebs\nArbeitsplatzes.\
    \ Auf einer Glatteis-Fläche kommt er ins Schleudern, bringt aber das Auto fast \nunter Kontrolle,\
    \ so dass er nur leicht mit dem Pfahl eines Weidezauns kollidiert. Dieser war \nmorsch und bricht\
    \ ab. Kuno schreibt auf seine Visitenkarte Datum, Uhrzeit, seine Kontrollschild\nNummer und das Wort\
    \ \"Sorry\". Diese Visitenkarte befestigt er am Pfahl. Dann fährt er weiter, \nweil er aus betrieblichen\
    \ Gründen unbedingt pünktlich zur Schicht erscheinen muss. Da Kuno weder den Geschädigten noch die\
