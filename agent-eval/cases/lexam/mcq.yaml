  question: |-
    Welche der folgenden Aussagen ist/sind falsch?
    i. Natürliche Personen haben einen Anspruch auf Rückerstattung der Verrechnungssteuer, wenn sie die betreffenden Einkünfte ordnungsgemäss deklariert haben sowie bei Fälligkeit im Inland Wohnsitz und das Recht zur Nutzung des den steuerbaren Ertrag abwerfenden Vermögenswertes hatten.
    ii. A, Alleinaktionär der X AG entscheidet sich noch im Jahre 2019 3.5% seiner Beteiligungen in eine Holding AG einzubringen, an der er zu 60% beteiligt ist. Dies führt zu steuerbarem Ertrag.
    iii. Eine vollendete Steuerhinterziehung liegt vor, wenn der Steuerpflichtige in seiner Steuererklärung nicht alle Einkommensbestandteile deklariert.
    iv. Kantone dürfen aufgrund ihres Steuerfindungsrechts jedes Steuerobjekt besteuern, wohingegen der Bund nur neue Steuern erheben darf, wenn ihm hierfür eine explizite verfassungsrechtliche Kompetenz eingeräumt wird.

