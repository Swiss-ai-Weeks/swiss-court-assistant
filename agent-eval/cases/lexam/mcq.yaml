  question: |-
    Die Cloni GmbH, Dietlikon, besitzt eine schweizerische Ausfuhrbewilligung für Clonitazen, jedoch keine Bewilligung für den Handel in der Schweiz. Claudia hat als gewöhnliche Angestellte der Cloni GmbH ohne Entscheidungsbefugnisse den Versand abzuwickeln. Sie weiss, dass Clonitazen unter das BetmG fällt und nur ins Ausland gehen darf, meint aber, die Lieferung in die Schweiz sei nur eine Ordnungswidrigkeit. Andere Produkte liefert die Cloni GmbH auch in die Schweiz. Auf Bestellung von Thomas, der nicht bei der Cloni GmbH arbeitet, sendet Claudia Clonitazen an die Tazen AG, Zug, und verarbeitet das wie einen Inlandauftrag eines anderen Produkts, so dass eine ganz normale Rechnung der Cloni GmbH ausgelöst wird. Thomas, Geschäftsführer der Tazen AG, denkt noch: "Hoffentlich hat die Cloni GmbH die nötige Bewilligung, aber es wird schon so sein". Welche der folgenden Aussagen sind richtig?
    i. Claudia erfüllt den Tatbestand von Art. 20 Abs. 1 Bst. b BetmG, u.a. weil sie weiss, dass Clonitazen nur ins Ausland gehen darf, so dass Vorsatz zu bejahen ist.
    ii. Claudia erfüllt den Tatbestand von Art. 20 Abs. 1 Bst. b BetmG nicht, u.a. weil sie meint, die Lieferung von Clonitazen in die Schweiz sei nur eine Ordnungswidrigkeit.
    iii. Claudia erfüllt den Tatbestand von Art. 20 Abs. 1 Bst. b BetmG nicht, u.a. weil ihr mangels selbständiger Entscheidungsbefugnis die Sonderstellung der Cloni GmbH nicht zugerechnet werden kann.
    iv. Claudia erfüllt den Tatbestand von Art. 20 Abs. 1 Bst. b BetmG, u.a. weil sie die problematische Lieferung in geschäftlicher Verrichtung für die Cloni GmbH veranlasst hat.
    v. Thomas erfüllt den Tatbestand der Anstiftung zur Widerhandlung gemäss Art. 20 Abs. 1 Bst. b BetmG, u.a. da er das Risiko der fehlenden Bewilligung erkannte und trotzdem keine weiteren Abklärungen traf.

