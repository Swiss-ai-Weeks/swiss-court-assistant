[project]
name = "swiss-court-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.11",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.31.0",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "numpy>=2.5.3",
    "openai>=3.13.0",
    "polars>=1.44.2",
    "pystemmer>=3.1.0",
    "sentence-transformers>=6.0.1",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
swiss-court-assistant = "swiss_court_assistant:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
