[project]
name = "swiss-court-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.11",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.31.0",
    "langchain>=1.4.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "mlflow-tracing>=3.4",
    "numpy>=2.5.3",
    "nvidia-riva-client>=2.27.0",
    "openai>=3.13.0",
    "pillow>=12.3.0",
    "polars>=1.44.2",
    "pypdfium2>=5.13.0",
    "pystemmer>=3.1.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sentence-transformers>=6.0.1",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
# vector search on the GPU with NVIDIA cuVS (gpuvec.py); CUDA 13 driver. A default group, so a plain
# `uv sync` keeps it (as an extra, `uv sync` without --extra gpu uninstalled it and the app fell back
# to the CPU). `uv sync --no-group gpu` on a machine without one.
gpu = [
    "cuvs-cu13>=26.8.0",
    "cupy-cuda13x>=13.6",
]

[tool.uv]
default-groups = ["gpu"]

[project.scripts]
swiss-court-assistant = "swiss_court_assistant:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
