<g class="c-purple"><rect x="50" y="164" width="210" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="155" y="182" text-anchor="middle" dominant-baseline="central">Research LLM</text>
<text class="ts" x="155" y="202" text-anchor="middle" dominant-baseline="central">Nemotron NIM, reasoning</text></g>
<line x1="155" y1="252" x2="155" y2="222" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="50" y="252" width="210" height="76" rx="8" stroke-width="0.5"/>
<text class="th" x="155" y="272" text-anchor="middle" dominant-baseline="central">ResearchThenAnswer</text>
<text class="ts" x="155" y="292" text-anchor="middle" dominant-baseline="central">2–8 calls, nudge at 4</text>
<text class="ts" x="155" y="310" text-anchor="middle" dominant-baseline="central">Filters the offered tools</text></g>
<g><rect class="box" x="50" y="364" width="210" height="88" rx="8" stroke-width="0.5"/>
<text class="th" x="155" y="382" text-anchor="middle" dominant-baseline="central">Retrieval backends</text>
<text class="ts" x="155" y="402" text-anchor="middle" dominant-baseline="central">cuVS vectors · keyword FTS</text>
<text class="ts" x="155" y="418" text-anchor="middle" dominant-baseline="central">Embed + rerank NIMs</text>
<text class="ts" x="155" y="434" text-anchor="middle" dominant-baseline="central">Statutes · doc store</text></g>

<line x1="260" y1="184" x2="288" y2="184" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="204" x2="262" y2="204" class="arr" marker-end="url(#arrow)"/>
<line x1="290" y1="410" x2="262" y2="410" class="arr" marker-end="url(#arrow)"/>

<rect x="290" y="136" width="350" height="330" rx="8" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
<text class="ts" x="305" y="154">12 tools, one per research step</text>

<g class="c-teal"><rect x="305" y="164" width="320" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="321" y="182" dominant-baseline="central">Case law</text>
<text class="ts" x="321" y="200" dominant-baseline="central">semantic_search · keyword_search</text>
<text class="ts" x="321" y="216" dominant-baseline="central">list_decisions · read_decision</text>
<text class="ts" x="321" y="232" dominant-baseline="central">citing_decisions</text></g>
<g class="c-teal"><rect x="305" y="252" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="321" y="270" dominant-baseline="central">Statutes</text>
<text class="ts" x="321" y="290" dominant-baseline="central">search_laws · read_law</text></g>
<g class="c-teal"><rect x="305" y="316" width="320" height="72" rx="8" stroke-width="0.5"/>
<text class="th" x="321" y="334" dominant-baseline="central">Attached documents</text>
<text class="ts" x="321" y="354" dominant-baseline="central">read_document · search_document</text>
<text class="ts" x="321" y="370" dominant-baseline="central">search_case_file</text></g>
<g class="c-teal"><rect x="305" y="396" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="321" y="414" dominant-baseline="central">Control</text>
<text class="ts" x="321" y="434" dominant-baseline="central">ask_user · write_answer</text></g>

<path d="M465 452 L465 500 L100 500 L100 518" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="30" y="520" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="100" y="538" text-anchor="middle" dominant-baseline="central">Draft answer</text>
<text class="ts" x="100" y="558" text-anchor="middle" dominant-baseline="central">Constrained JSON</text></g>
<g class="c-purple"><rect x="190" y="520" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="260" y="538" text-anchor="middle" dominant-baseline="central">Grounding check</text>
<text class="ts" x="260" y="558" text-anchor="middle" dominant-baseline="central">3 yes/no judges</text></g>
<g class="c-purple"><rect x="350" y="520" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="420" y="538" text-anchor="middle" dominant-baseline="central">Revise</text>
<text class="ts" x="420" y="558" text-anchor="middle" dominant-baseline="central">Up to 2 rounds</text></g>
<g><rect class="box" x="510" y="520" width="140" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="580" y="538" text-anchor="middle" dominant-baseline="central">Prune</text>
<text class="ts" x="580" y="558" text-anchor="middle" dominant-baseline="central">Drop unsupported</text></g>
<line x1="170" y1="548" x2="188" y2="548" class="arr" marker-end="url(#arrow)"/>
<line x1="330" y1="540" x2="348" y2="540" class="arr" marker-end="url(#arrow)"/>
<path d="M420 576 L420 592 L260 592 L260 578" class="arr" marker-end="url(#arrow)"/>
<path d="M490 548 L508 548" class="arr" marker-end="url(#arrow)"/>

