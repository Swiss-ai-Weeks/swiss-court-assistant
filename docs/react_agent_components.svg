<svg xmlns="http://www.w3.org/2000/svg" width="680" height="830" viewBox="0 0 680 830"><style>text { font-family: 'DejaVu Sans', sans-serif; }
.th { font-size: 13px; font-weight: bold; fill: #2C2C2A; }
.t { font-size: 13px; fill: #2C2C2A; }
.ts { font-size: 11.5px; fill: #5F5E5A; }
.box { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-purple > rect, rect.c-purple { fill: #EEEDFE; stroke: #534AB7; }
.c-purple > .th { fill: #3C3489; } .c-purple > .ts { fill: #534AB7; }
.c-teal > rect, rect.c-teal { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal > .th { fill: #085041; } .c-teal > .ts { fill: #0F6E56; }
</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect x="0" y="0" width="680" height="830" fill="#FFFFFF"/>
<g><rect class="box" x="180" y="20" width="320" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">ReactAgent.answer()</text>
<text class="ts" x="340" y="58" text-anchor="middle" dominant-baseline="central">Question, history, attachments, case file</text></g>
<line x1="340" y1="76" x2="340" y2="102" class="arr" marker-end="url(#arrow)"/>

<rect x="30" y="104" width="620" height="378" rx="12" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
