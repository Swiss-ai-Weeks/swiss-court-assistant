<path d="M340 606 L340 628" class="arr" marker-end="url(#arrow)"/>

<g><rect class="box" x="30" y="630" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="125" y="648" text-anchor="middle" dominant-baseline="central">Research again</text>
<text class="ts" x="125" y="668" text-anchor="middle" dominant-baseline="central">Most rejected, up to 2×</text></g>
<g><rect class="box" x="240" y="630" width="200" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="648" text-anchor="middle" dominant-baseline="central">Give up politely</text>
<text class="ts" x="340" y="668" text-anchor="middle" dominant-baseline="central">Brief + see a specialist</text></g>
<g><rect class="box" x="460" y="630" width="190" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="555" y="648" text-anchor="middle" dominant-baseline="central">Checked answer</text>
<text class="ts" x="555" y="668" text-anchor="middle" dominant-baseline="central">Only what passed</text></g>
<path d="M30 658 L14 658 L14 192 L48 192" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

<path d="M340 686 L340 718" class="arr" marker-end="url(#arrow)"/>
<path d="M555 686 L555 718" class="arr" marker-end="url(#arrow)"/>
<g><rect class="box" x="120" y="720" width="480" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="360" y="738" text-anchor="middle" dominant-baseline="central">Streamed to the UI (SSE)</text>
<text class="ts" x="360" y="758" text-anchor="middle" dominant-baseline="central">Thought · ToolStart/End · Status · Delta · Cite · Clarify</text></g>

<rect class="c-purple" x="160" y="800" width="12" height="12" rx="2" stroke-width="0.5"/>
